name: 'LLxprt PR Review'

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_call:
    inputs:
      pull_request_number:
        description: 'PR to review as data using this trusted workflow revision'
        required: false
        type: string
      expected_head_sha:
        description: 'Expected immutable PR head SHA'
        required: false
        type: string

concurrency:
  group: 'llxprt-pr-review-${{ inputs.pull_request_number || github.event.pull_request.number }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

defaults:
  run:
    shell: bash

env:
  REPO: '${{ github.repository }}'

jobs:
  mergeability-gate:
    name: 'Mergeability gate'
    uses: './.github/workflows/_pr-mergeability-gate.yml'
    with:
      check-mergeability: true
      pull-request-number: "${{ inputs.pull_request_number || format('{0}', github.event.pull_request.number) }}"
      expected-head-sha: '${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}'

  review:
    name: 'Run LLxprt review'
    needs:
      - 'mergeability-gate'
    if: ${{ needs.mergeability-gate.outputs.should-run == 'true' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    env:
      PR_NUMBER: '${{ inputs.pull_request_number || github.event.pull_request.number }}'
      GH_TOKEN: '${{ github.token }}'
      GITHUB_TOKEN: '${{ github.token }}'
      DEBUG_OUTPUT: 'stderr'
    steps:
      - name: 'Checkout base revision'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install review-script dependencies'
        # The walkthrough orchestrator (`bun scripts/pr-review-walkthrough.ts`)
        # imports zod and other npm dependencies. Without this step, Bun cannot
        # resolve those modules at runtime.
        run: bun install

      - name: 'Prepare review workspace'
        run: |
          set -euo pipefail
          mkdir -p review/issues
          : > review/comment.md

      - name: 'Resolve validation metadata'
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: '${{ inputs.expected_head_sha }}'
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$REPO/pulls/$PR_NUMBER" > review/validation-pr.json
          current_head="$(jq -r '.head.sha' review/validation-pr.json)"
          [[ "$current_head" == "$EXPECTED_HEAD_SHA" ]] || { echo 'Validation head changed' >&2; exit 1; }
          base_revision="$(jq -r '.base.sha' review/validation-pr.json)"
          [[ "$base_revision" =~ ^[a-f0-9]{40}$ ]]
          {
            echo "VALIDATION_BASE_SHA=$base_revision"
            echo "VALIDATION_HEAD_REF=$(jq -r '.head.ref' review/validation-pr.json)"
            echo "VALIDATION_HEAD_REPO=$(jq -r '.head.repo.full_name' review/validation-pr.json)"
          } >> "$GITHUB_ENV"

      - name: 'Fetch pull request head'
        id: 'fetch_head'
        env:
          HEAD_REF_VALUE: '${{ env.VALIDATION_HEAD_REF || github.event.pull_request.head.ref }}'
          HEAD_REPO_VALUE: '${{ env.VALIDATION_HEAD_REPO || github.event.pull_request.head.repo.full_name }}'
          EXPECTED_HEAD_SHA: '${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}'
          BASE_REVISION: '${{ env.VALIDATION_BASE_SHA || github.event.pull_request.base.sha }}'
        run: |
          set -euo pipefail
          pr_ref="refs/pr/${PR_NUMBER}"
          head_ref="${HEAD_REF_VALUE:-}"
          if [[ -z "$head_ref" ]]; then
            echo "Head ref is unavailable for PR ${PR_NUMBER}; aborting." >&2
            exit 1
          fi

          git fetch --no-tags origin "pull/${PR_NUMBER}/head:${pr_ref}"

          base_sha="$BASE_REVISION"
          git fetch --no-tags origin "$base_sha"
          head_sha="$(git rev-parse "${pr_ref}")"
          if [[ "${head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Fetched PR head changed from event SHA ${EXPECTED_HEAD_SHA} to ${head_sha}; aborting." >&2
            exit 1
          fi

          # Compute the merge-base so diffs only contain changes the PR
          # actually introduced, not unrelated main-branch activity.
          merge_base="$(git merge-base "${base_sha}" "${head_sha}")"

          {
            echo "PR_HEAD_REF=${pr_ref}"
            echo "PR_HEAD_SHA=${head_sha}"
            echo "BASE_SHA=${base_sha}"
            echo "MERGE_BASE=${merge_base}"
          } >> "$GITHUB_ENV"
          {
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
            echo "merge_base=${merge_base}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Collect PR metadata and ensure linked issue'
        id: 'issue_gate'
        run: |
          set -euo pipefail
          pr_json='review/pr.json'
          gh pr view "${PR_NUMBER}" \
            --json number,title,url,body,isDraft,closingIssuesReferences,additions,deletions,changedFiles,commits,author,headRefName,baseRefName,labels \
            > "${pr_json}"

          jq -r '
            [
              (.closingIssuesReferences // [] | map(.number | tostring)),
              ((.body // "") | [match("#([0-9]+)"; "g") | .captures[0].string] // [])
            ]
            | add
            | unique
            | .[]
          ' "${pr_json}" > review/issue_numbers.txt

          issues_file='review/issue_numbers.txt'
          if [[ ! -s "${issues_file}" ]]; then
            {
              echo "<!-- llxprt-walkthrough -->"
              echo "## LLxprt PR Review blocked"
              echo
              echo "- No linked issues were detected in this PR's description."
              echo "- Please reference an existing issue with text such as \`Fixes #123\` so the automated walkthrough knows what problem to evaluate."
              echo "- The PR has been returned to draft to prevent accidental merges without an issue."
            } > review/comment.md
            if [[ "$(jq -r '.isDraft' "${pr_json}")" != "true" ]]; then
              gh pr ready "${PR_NUMBER}" --undo >/dev/null 2>&1 || true
            fi
            echo "should_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t issue_numbers < "${issues_file}"
          if [[ "${#issue_numbers[@]}" -eq 0 ]]; then
            echo "should_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for issue in "${issue_numbers[@]}"; do
            gh issue view "${issue}" \
              --json number,title,url,body,state,labels \
              > "review/issues/${issue}.json"
          done

          issues_csv="$(IFS=, ; echo "${issue_numbers[*]}")"
          echo "ISSUE_NUMBERS=${issues_csv}" >> "$GITHUB_ENV"
          echo "should_review=true" >> "$GITHUB_OUTPUT"

      - name: 'Detect documentation-only change'
        if: steps.issue_gate.outputs.should_review == 'true'
        run: |
          set -euo pipefail
          diff_list="review/changed-list.txt"
          git diff --name-only "${MERGE_BASE}" "${PR_HEAD_SHA}" > "${diff_list}"
          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|README.md|README.*|*.md|*.mdx|*.rst|*.txt|*.adoc)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < "${diff_list}"
          echo "DOCS_ONLY=${docs_only}" >> "$GITHUB_ENV"

      - name: 'Capture LLxprt Code CI status'
        if: steps.issue_gate.outputs.should_review == 'true'
        id: 'ci_wait'
        run: |
          set -euo pipefail
          ci_status="pending"
          ci_conclusion="pending"
          ci_url="N/A"
          runs_json="$(gh api -X GET "/repos/${REPO}/actions/workflows/ci.yml/runs" \
            -F event="pull_request" \
            -F head_sha="${PR_HEAD_SHA}" \
            -F per_page=50)"
          run_record="$(jq -c '.workflow_runs | sort_by(.run_number) | last // {}' <<<"${runs_json}")"
          ci_id="$(jq -r '.id // ""' <<<"${run_record}")"
          if [[ -n "${ci_id}" && "${ci_id}" != "null" ]]; then
            ci_status="$(jq -r '.status // "unknown"' <<<"${run_record}")"
            ci_conclusion="$(jq -r '.conclusion // "pending"' <<<"${run_record}")"
            ci_url="$(jq -r '.html_url // "N/A"' <<<"${run_record}")"
            echo "LLxprt Code CI run ${ci_id} status=${ci_status}, conclusion=${ci_conclusion}."
            if [[ "${ci_status}" != "completed" ]]; then
              echo "CI run is still ${ci_status}; continuing review without waiting for completion."
            fi
          else
            echo "No LLxprt Code CI run has started yet for head SHA ${PR_HEAD_SHA}; continuing review with status pending."
          fi
          {
            echo "CI_STATUS=${ci_status}"
            echo "CI_CONCLUSION=${ci_conclusion:-unknown}"
            echo "CI_RUN_URL=${ci_url:-N/A}"
          } >> "$GITHUB_ENV"
          {
            echo "ci_status=${ci_status}"
            echo "ci_conclusion=${ci_conclusion:-unknown}"
            echo "ci_url=${ci_url:-N/A}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Capture coverage summary comment'
        if: steps.issue_gate.outputs.should_review == 'true'
        run: |
          set -euo pipefail
          coverage_file='review/coverage-comment.txt'
          gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- code-coverage-summary -->")) | .body' \
            > "${coverage_file}" || true
          if [[ -s "${coverage_file}" ]]; then
            tail -n 1 "${coverage_file}" > review/coverage-latest.txt
          else
            : > review/coverage-latest.txt
          fi

      - name: 'Generate diff artifacts'
        if: steps.issue_gate.outputs.should_review == 'true'
        run: |
          set -euo pipefail
          git diff --stat "${MERGE_BASE}" "${PR_HEAD_SHA}" > review/diffstat.txt
          git diff --name-status --no-renames "${MERGE_BASE}" "${PR_HEAD_SHA}" > review/changed-files.txt
          git diff --numstat "${MERGE_BASE}" "${PR_HEAD_SHA}" > review/numstat.txt
          # Keep full diff for agent exploration - agent can selectively read what it needs
          git diff -U3 "${MERGE_BASE}" "${PR_HEAD_SHA}" > review/diff.patch
          grep -Ei '(/tests?/|__tests__|\\.spec\\.|\\.test\\.)' review/changed-files.txt > review/test-files.txt || true

          # Generate per-file diffs and an authoritative path manifest.
          # The manifest preserves paths containing legitimate double underscores.
          mkdir -p review/diffs
          : > review/diff-manifest.txt
          while IFS=$'\t' read -r _ filename; do
            [[ -z "$filename" ]] && continue
            safe_name="${filename//\//__}"
            printf '%s.diff\t%s\n' "${safe_name}" "${filename}" >> review/diff-manifest.txt
            git diff "${MERGE_BASE}" "${PR_HEAD_SHA}" -- "$filename" > "review/diffs/${safe_name}.diff" 2>/dev/null || true
          done < review/changed-files.txt

      - name: 'Build review context'
        if: steps.issue_gate.outputs.should_review == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016,SC2026
          node --eval '
          const fs = require("fs");
          const path = require("path");

          const pr = JSON.parse(fs.readFileSync("review/pr.json", "utf8"));
          const issuesDir = "review/issues";
          let issues = [];
          if (fs.existsSync(issuesDir)) {
            issues = fs
              .readdirSync(issuesDir)
              .filter((file) => file.endsWith(".json"))
              .map((file) =>
                JSON.parse(fs.readFileSync(path.join(issuesDir, file), "utf8")),
              )
              .sort((a, b) => Number(a.number) - Number(b.number));
          }

          const clean = (text, limit) => {
            if (!text) return "";
            const trimmed = text.trim();
            return trimmed.length > limit ? `${trimmed.slice(0, limit)}…` : trimmed;
          };

          const readIfExists = (filePath, fallback) =>
            fs.existsSync(filePath) && fs.statSync(filePath).size
              ? fs.readFileSync(filePath, "utf8")
              : fallback;

          const coverageSection = readIfExists(
            "review/coverage-latest.txt",
            "No coverage summary comment was found on this PR yet.",
          );

          const issueSection = issues.length
            ? issues
                .map((issue) => {
                  const maxIssueBody = 8000;
                  const rawBody = (issue.body || "").trim() || "(no body)";
                  const fullBody = rawBody.length > maxIssueBody ? rawBody.slice(0, maxIssueBody) + "..." : rawBody;
                  return `### Issue #${issue.number}: ${issue.title}\n**State**: ${issue.state}\n\n${fullBody}`;
                })
                .join("\n\n")
            : "No issues were expanded (this should not happen).";

          const prBody =
            clean(pr.body || "", 1000) || "No PR description provided.";

          // Create context.md - PR metadata and issue information for agent orientation
          const context = [
            "# PR Review Context",
            "",
            "## Pull Request Metadata",
            "- **Repository**: " + process.env.REPO,
            "- **PR Number**: #" + pr.number,
            "- **Title**: " + pr.title,
            "- **Author**: " + ((pr.author && pr.author.login) || "unknown"),
            "- **Branch**: " + pr.baseRefName + " ← " + pr.headRefName,
            "- **Changes**: +" + pr.additions + " -" + pr.deletions + " across " + pr.changedFiles + " files (" + (Array.isArray(pr.commits) ? pr.commits.length : pr.commits) + " commits)",
            "- **CI Status**: " + (process.env.CI_STATUS || "unknown") + " / " + (process.env.CI_CONCLUSION || "unknown"),
            "- **CI Run**: " + (process.env.CI_RUN_URL || "N/A"),
            "- **Documentation-only**: " + (process.env.DOCS_ONLY || "unknown"),
            "",
            "## PR Description",
            prBody,
            "",
            "## Linked Issues",
            issueSection,
            "",
            "## Coverage Information",
            coverageSection,
            "",
            "## Available Artifacts",
            "The following files are available in the `review/` directory for your exploration:",
            "- `review/diffstat.txt` - High-level summary of changes per file",
            "- `review/changed-files.txt` - List of changed files with status (A/M/D)",
            "- `review/numstat.txt` - Lines added/removed per file",
            "- `review/test-files.txt` - Test files that were modified",
            "- `review/diff.patch` - Full unified diff of all changes",
            "- `review/diffs/` - Per-file diffs (filename with / replaced by __)",
            "- `review/issues/` - Full JSON data for each linked issue",
            "- `review/pr.json` - Full PR metadata",
            "",
            "You can also use `read_file` to examine any source file in the repository when you need more context.",
          ].join("\\n");

          fs.writeFileSync("review/context.md", context);
          '

      - name: 'Install Ollama CPU runtime'
        id: 'install'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' }}
        continue-on-error: true
        shell: 'bash'
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'x86_64'
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --show-error --location --retry 3 \
            'https://ollama.com/download/ollama-linux-amd64.tar.zst?version=0.31.1' \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          printf '%s  %s\n' 'd297381efc136451f6fabb9dd644a67f70fe51c16815a0c4a95ff0e327a3afb4' "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum --check -
          tar --zstd \
            --exclude='lib/ollama/cuda_v12/*' \
            --exclude='lib/ollama/cuda_v13/*' \
            --exclude='lib/ollama/vulkan/*' \
            -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "$RUNNER_TEMP/ollama/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/ollama/bin/ollama" --version

      - name: 'Select CPU backend on Intel'
        id: 'backend'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: 'bash'
        run: |
          set -euo pipefail
          echo "Host architecture: $(uname -m)"
          echo "Host CPU vendor: $(awk -F: '/^vendor_id[[:space:]]*:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' /proc/cpuinfo)"
          if ! grep -qm1 '^vendor_id[[:space:]]*: GenuineIntel$' /proc/cpuinfo; then
            echo 'Host is not Intel; leaving Ollama CPU variants untouched'
            exit 0
          fi
          libdir="$RUNNER_TEMP/ollama/lib/ollama"
          test -f "$libdir/libggml-cpu-haswell.so"
          shopt -s nullglob
          variants=("$libdir"/libggml-cpu-*.so)
          (( ${#variants[@]} > 1 )) || { echo 'Expected multiple CPU variants in pinned Ollama runtime' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ollama-disabled-cpu-backends"
          for library in "${variants[@]}"; do
            if [[ "$library" != "$libdir/libggml-cpu-haswell.so" ]]; then
              mv "$library" "$RUNNER_TEMP/ollama-disabled-cpu-backends/"
            fi
          done
          echo 'Intel Haswell pin: CPU variants visible to llama-server:'
          printf '%s\n' "$libdir"/libggml-cpu-*.so
          test "$(find "$libdir" -maxdepth 1 -name 'libggml-cpu-*.so' | wc -l)" -eq 1

      - name: 'Start pinned local Qwen model'
        id: 'model'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: 'bash'
        env:
          OLLAMA_HOST: '127.0.0.1:12644'
          OLLAMA_CONTEXT_LENGTH: '32768'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_NO_CLOUD: '1'
          CUDA_VISIBLE_DEVICES: '-1'
          ROCR_VISIBLE_DEVICES: '-1'
          LLAMA_ARG_CACHE_RAM: '1024'
          OLLAMA_MODELS: '${{ runner.temp }}/ollama-models'
        run: |
          set -euo pipefail
          if ss -ltn | grep -q ":12644 "; then echo "Local model port already occupied" >&2; exit 1; fi
          mkdir -p "$OLLAMA_MODELS"
          nohup env -u GH_TOKEN -u GITHUB_TOKEN ollama serve >"$RUNNER_TEMP/ollama-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ollama-server.pid"
          for _ in {1..60}; do
            if curl --fail --silent "http://$OLLAMA_HOST/api/version"; then
              break
            fi
            sleep 2
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/version" | jq -e '.version == "0.31.1"'
          ollama pull qwen3.5:4b
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" |
            jq -e '.models[] | select(.name == "qwen3.5:4b" and .digest == "2a654d98e6fba55d452b7043684e9b57a947e393bbffa62485a7aac05ee4eefd")'
          df -h "$RUNNER_TEMP"

      - name: 'Verify CPU backend warm-up'
        id: 'warmup'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        continue-on-error: true
        shell: 'bash'
        env:
          OLLAMA_HOST: '127.0.0.1:12644'
        run: |
          set -euo pipefail
          proc_root="${LLXPRT_PROC_ROOT:-/proc}"
          vendor="$(awk -F: '/^vendor_id[[:space:]]*:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' "$proc_root/cpuinfo")"
          echo "Host CPU vendor: $vendor"
          [[ "$vendor" == GenuineIntel || "$vendor" == AuthenticAMD ]] || { echo "Unsupported CPU vendor: $vendor" >&2; exit 1; }
          curl --fail --show-error --silent --max-time 300 \
            "http://127.0.0.1:12644/api/generate" \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3.5:4b","prompt":"Hello","stream":false,"think":false,"options":{"num_ctx":32768,"num_predict":16}}' \
            | jq -e '.done == true and .error == null and (.response | length > 0)'
          grep 'system_info:.*CPU :' "$RUNNER_TEMP/ollama-server.log" | tail -1 || true
          process="$RUNNER_TEMP/ollama/lib/ollama/llama-server"
          pid="$(pgrep -f "^$process --model " | head -1)" || true
          [[ -n "$pid" ]] || { echo 'Live llama-server process not found' >&2; exit 1; }
          maps="$proc_root/$pid/maps"
          [[ -r "$maps" ]] || { echo "Live llama-server maps are unavailable: $maps" >&2; exit 1; }
          cmdline="$proc_root/$pid/cmdline"
          status="$proc_root/$pid/status"
          [[ -r "$cmdline" && -r "$status" ]] || { echo 'Live llama-server process evidence disappeared' >&2; exit 1; }
          printf 'llama-server cmdline: '
          tr '\0' ' ' <"$cmdline"
          echo
          command_line="$(tr '\0' ' ' <"$cmdline")"
          [[ "$command_line" == "$process --model "* ]] || { echo 'Matched PID is not the expected llama-server process' >&2; exit 1; }
          ppid="$(awk '$1 == "PPid:" { print $2 }' "$status")"
          [[ "$ppid" =~ ^[0-9]+$ && "$ppid" != 0 ]] || { echo 'llama-server parent PID is missing' >&2; exit 1; }
          parent_cmdline="$proc_root/$ppid/cmdline"
          [[ -r "$parent_cmdline" ]] || { echo 'llama-server parent process disappeared' >&2; exit 1; }
          printf 'llama-server PPid: %s; parent cmdline: ' "$ppid"
          tr '\0' ' ' <"$parent_cmdline"
          echo
          expected="$RUNNER_TEMP/ollama/lib/ollama/libggml-cpu-haswell.so"
          maps_snapshot="$RUNNER_TEMP/llama-server-$pid.maps"
          cat "$maps" >"$maps_snapshot" || { echo 'llama-server maps disappeared while being read' >&2; exit 1; }
          cat "$maps_snapshot"
          backends="$(grep -Eo '/[^ ]+/libggml-cpu(-[^ ]+)?\.so( \(deleted\))?' "$maps_snapshot" | sort -u || true)"
          echo "Loaded CPU backends: ${backends:-none}"
          [[ -n "$backends" ]] || { echo 'No mapped llama-server CPU backend' >&2; exit 1; }
          if [[ "$vendor" == AuthenticAMD ]]; then
            echo 'AMD: native Ollama CPU backend (variants untouched)'
            exit 0
          fi
          while IFS= read -r backend; do
            [[ "$backend" == "$expected" ]] || {
              echo "Unexpected mapped llama-server CPU library: $backend" >&2
              exit 1
            }
          done <<< "$backends"
          grep -Fxq "$expected" <<< "$backends" || {
            echo 'Expected haswell CPU library is not mapped' >&2
            exit 1
          }

      - name: 'Verify CPU-only model inference'
        id: 'quota'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        continue-on-error: true
        shell: 'bash'
        env:
          OLLAMA_HOST: '127.0.0.1:12644'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 300 \
            "http://$OLLAMA_HOST/api/generate" \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3.5:4b","prompt":"Reply with one word.","stream":false,"think":false,"options":{"num_ctx":32768,"num_predict":16}}' \
            -o "$RUNNER_TEMP/ollama-inference.json"
          jq -e '.done == true and .error == null and (.response | length > 0)' "$RUNNER_TEMP/ollama-inference.json" || {
            cat "$RUNNER_TEMP/ollama-inference.json" >&2
            exit 1
          }
          curl --fail --show-error --silent "http://$OLLAMA_HOST/api/ps" | \
            jq -e '.models[] | select(.name == "qwen3.5:4b" and .size_vram == 0 and .context_length == 32768)'

      - name: 'Discover verified related issues and PRs'
        if: steps.issue_gate.outputs.should_review == 'true'
        continue-on-error: true
        run: bun scripts/pr-review-related.ts

      - name: 'Collect static source context'
        if: steps.issue_gate.outputs.should_review == 'true'
        run: bun scripts/pr-review-source-context.ts

      - name: 'Run walkthrough pipeline'
        if: ${{ steps.issue_gate.outputs.should_review == 'true' && steps.install.outcome == 'success' && steps.backend.outcome == 'success' && steps.model.outcome == 'success' && steps.warmup.outcome == 'success' && steps.quota.outcome == 'success' }}
        id: 'walkthrough'
        continue-on-error: true
        run: |
          set -euo pipefail
          # The orchestrator writes its own generic fallback comment to
          # review/comment.md on failure. Redirect stderr to a log artifact
          # only — never into the comment (would leak sanitized secrets or
          # internal diagnostics to the public PR).
          env -u GH_TOKEN -u GITHUB_TOKEN bun scripts/pr-review-walkthrough.ts 2> >(tee review/walkthrough-error.log >&2)

      - name: 'Capture local run resources'
        if: always() && steps.model.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --max-time 15 'http://127.0.0.1:12644/api/ps' > review/local-resources.json
          cat review/local-resources.json
          worker="$RUNNER_TEMP/ollama/lib/ollama/llama-server"
          pid="$(pgrep -f "^$worker --model " | head -1)" || true
          if [[ -n "$pid" && -r "/proc/$pid/status" ]]; then
            grep -E '^(VmRSS|VmHWM):' "/proc/$pid/status" | tee review/local-memory.txt
          fi
          if compgen -G 'review/inference/*.json' > /dev/null; then
            jq --slurp '[.[] | {phase, elapsedMs, inputBytes, httpStatus}]' review/inference/*.json > review/local-timings.json
            cat review/local-timings.json
          fi

      - name: 'Upload walkthrough diagnostics'
        if: always()
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'walkthrough-diagnostics-${{ github.run_attempt }}'
          path: |
            review/walkthrough-error.log
            review/result.json
            review/related.json
            review/local-resources.json
            review/local-memory.txt
            review/local-timings.json
            review/summaries/
            review/inference/
            ${{ runner.temp }}/ollama-server.log
            ${{ runner.temp }}/ollama-inference.json
            review/parse-failure-raw-*.txt
            review/parse-failure-info-*.json
          if-no-files-found: 'ignore'
          retention-days: 3

      - name: 'Stop owned local model server'
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/ollama-server.pid" ]]; then
            OLLAMA_HOST=127.0.0.1:12644 timeout 30 ollama stop qwen3.5:4b || true
            read -r server_pid < "$RUNNER_TEMP/ollama-server.pid"
            [[ "$server_pid" =~ ^[1-9][0-9]*$ ]]
            kill "$server_pid" || true
            for _ in {1..30}; do
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$server_pid" 2>/dev/null; then echo 'Owned server still running' >&2; exit 1; fi
            if ss -ltn | grep -q ':12644 '; then echo 'Local inference port still listening' >&2; exit 1; fi
            echo 'Local inference port is closed'
          fi
          rm -rf -- "$RUNNER_TEMP/ollama-models" "$RUNNER_TEMP/ollama" "$RUNNER_TEMP/ollama-disabled-cpu-backends"
          test ! -d "$RUNNER_TEMP/ollama-models"
          echo 'Owned server and model store cleaned up'

      - name: 'Ensure fallback comment'
        if: always()
        continue-on-error: true
        run: |
          if [[ ! -s review/comment.md ]]; then
            {
              echo "<!-- llxprt-walkthrough -->"
              echo "## LLxprt PR Review unavailable"
              echo "The walkthrough pipeline could not complete. Please inspect the workflow logs."
            } > review/comment.md
          fi

      - name: 'Post walkthrough comment'
        if: always()
        continue-on-error: true
        # Find-or-update the walkthrough comment by its HTML marker so re-runs
        # edit the existing comment instead of posting duplicates. Replaces the
        # abandoned node20 thollander action (issue #2648).
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9
        env:
          COMMENT_FILE: 'review/comment.md'
          COMMENT_MARKER: '<!-- llxprt-walkthrough -->'
          EXPECTED_HEAD_SHA: '${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}'
        with:
          github-token: '${{ github.token }}'
          script: |
            const fs = require('fs');
            const commentFile = process.env.COMMENT_FILE;
            if (!fs.existsSync(commentFile)) {
              core.info(`${commentFile} not found; skipping comment post.`);
              return;
            }
            const body = fs.readFileSync(commentFile, 'utf8');
            const marker = process.env.COMMENT_MARKER;
            if (!marker) {
              core.info('No comment marker set; skipping comment post.');
              return;
            }
            const number = context.issue.number || Number(process.env.PR_NUMBER);
            if (!number) {
              core.info('No issue/PR number in context; skipping comment post.');
              return;
            }
            try {
              const expectedHead = process.env.EXPECTED_HEAD_SHA;
              if (!expectedHead) {
                core.info('Expected head SHA unavailable; skipping comment post.');
                return;
              }
              const { data: currentPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              if (currentPr.head.sha !== expectedHead) {
                core.info('PR head changed; suppressing stale walkthrough.');
                return;
              }
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  per_page: 100,
                },
              );
              const { data: beforePost } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
              if (beforePost.head.sha !== expectedHead) { core.info('PR head changed before publication; suppressing stale walkthrough.'); return; }
              const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body && c.body.includes(marker));
              if (existing) {
                try {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body,
                  });
                  core.info(`Updated comment ${existing.id}.`);
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                  const { data: recreated } = await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: number,
                    body,
                  });
                  core.info(`Comment ${existing.id} disappeared (404); recreated as ${recreated.id}.`);
                }
              } else {
                const { data: created } = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body,
                });
                core.info(`Created comment ${created.id}.`);
              }
            } catch (error) {
              core.setFailed(`Failed to post walkthrough comment: ${error.message || error}`);
            }
