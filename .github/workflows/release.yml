name: Release

on:
  schedule:
    # Runs every day at midnight UTC for the nightly release.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v0.1.11). Required for manual patch releases.'
        required: false # Not required for scheduled runs
        type: string
      dry_run:
        description: >-
          Run a dry-run of the release process; no branches, npm packages or GitHub
          releases will be created.
        required: true
        type: boolean
        default: true
      create_nightly_release:
        description: >-
          Create a nightly release. For scheduled runs the version is derived
          from package.json. For manual dispatch the version input is used as
          the nightly base version when provided, otherwise package.json is
          used.
        required: false
        type: boolean
        default: false
      create_preview_release:
        description: 'Create a beta release with current version (e.g., 0.1.21-beta.0).'
        required: false
        type: boolean
        default: false
      force_skip_tests:
        description: >-
          Select to skip the "Run Tests" step in testing. Prod releases should run tests
        required: false
        type: boolean
        default: false
      publish_vscode_only:
        description: >-
          Only build and publish the VS Code extension (skips npm packages, container images,
          and GitHub release).
        required: false
        type: boolean
        default: false
      skip_vscode_publish:
        description: >-
          Skip building and publishing the VS Code extension.
        required: false
        type: boolean
        default:
          false
          # Remove API provider inputs - these will come from repository secrets/variables

# All releases serialize globally regardless of the dispatched ref because a
# release mutates global npm, registry, and release state. Cancellation stays
# disabled so an in-flight publish is never killed part-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify_preflight:
    name: Release static verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository == 'vybestack/llxprt-code' && inputs.force_skip_tests != true
    steps:
      - name: Checkout code
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Bun
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link Bun runtime and apply dependency patches
        run: |
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs
      - name: Fix rollup platform dependency
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save --ignore-scripts
      - name: Run static preflight checks
        run: |
          npm run format
          npm run build
          npm run lint:ci
          npm run typecheck
          npm run lint:agents-api-surface

  verify_shards:
    name: Release tests (${{ matrix.shard }} ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'vybestack/llxprt-code' && inputs.force_skip_tests != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            partition: 1of3
          - shard: cli
            partition: 2of3
          - shard: cli
            partition: 3of3
          - shard: agents
            partition: 1of1
          - shard: providers
            partition: 1of1
          - shard: core
            partition: 1of1
          - shard: rest
            partition: 1of1
          - shard: scripts
            partition: 1of1
    steps:
      - name: Checkout code
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Bun
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link Bun runtime and apply dependency patches
        run: |
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs
      - name: Fix rollup platform dependency
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save --ignore-scripts
      - name: Install runtime plugin dependencies
        if: matrix.shard == 'cli' || matrix.shard == 'providers' || matrix.shard == 'scripts'
        run: |
          for plugin in plugins/google-gemini plugins/google-mcp-auth; do
            (cd "$plugin" && bun install --omit=peer)
          done
      - name: Build project (agents and scripts shards)
        if: matrix.shard == 'agents' || matrix.shard == 'scripts'
        run: npm run build
      - name: Verify test shard completeness
        run: npm run lint:test-shards
      - name: Prepare agents API surface for test shard
        if: matrix.shard == 'agents'
        run: npm run lint:agents-api-surface
      - name: Run shard tests
        env:
          NO_COLOR: true
          CI: true
          LLXPRT_CLI_TEST_PARTITION: ${{ matrix.partition }}
          LLXPRT_SKIP_IMAGE_HARNESS: 'true'
        run: bun scripts/test.ts --shard "${{ matrix.shard }}"
      - name: Smoke test CLI entry
        if: matrix.shard == 'cli'
        run: ./packages/cli/bin/llxprt --version

  integration:
    name: Release integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'vybestack/llxprt-code' && inputs.force_skip_tests != true
    steps:
      - name: Checkout code
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Bun
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link Bun runtime and apply dependency patches
        run: |
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs
      - name: Install runtime plugin dependencies
        run: |
          for plugin in plugins/google-gemini plugins/google-mcp-auth; do
            (cd "$plugin" && bun install --omit=peer)
          done
      - name: Set up local Gemma model
        uses: './.github/actions/setup-local-gemma'
      - name: Run Integration Tests
        run: npm run test:integration:sandbox:none
        env:
          GIT_CEILING_DIRECTORIES: '${{ github.workspace }}/.integration-tests'
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/release-model-ledger.jsonl'
      - name: Capture release model diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/release-diagnostics"
          mkdir -p "$diagnostics"
          date --utc --iso-8601=seconds > "$diagnostics/captured-at.txt"
          for source in /proc/cpuinfo /proc/loadavg /proc/meminfo /proc/stat; do
            if [[ -r "$source" ]]; then
              cp "$source" "$diagnostics/$(basename "$source").txt"
            fi
          done
          if [[ -r /sys/fs/cgroup/cpu.stat ]]; then
            cp /sys/fs/cgroup/cpu.stat "$diagnostics/cgroup-cpu-stat.txt"
          fi
          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            cp /sys/fs/cgroup/cpu.max "$diagnostics/cgroup-cpu-max.txt"
          fi
          for source in \
            "$RUNNER_TEMP/ollama-server.log" \
            "$RUNNER_TEMP/release-model-ledger.jsonl"; do
            if [[ -f "$source" ]]; then
              cp "$source" "$diagnostics/"
            fi
          done
      - name: Upload release model diagnostics
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-model-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/release-diagnostics/
          if-no-files-found: error
          retention-days: 14

  prepare_artifact:
    name: Prepare versioned sandbox input artifact
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository == 'vybestack/llxprt-code'
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      image_labels: ${{ steps.image_metadata.outputs.labels }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout code
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Bun
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link Bun runtime and apply dependency patches
        run: |
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs
      - name: Determine artifact version
        id: metadata
        env:
          IS_NIGHTLY: ${{ github.event_name == 'schedule' || inputs.create_nightly_release }}
          IS_PREVIEW: ${{ inputs.create_preview_release }}
          MANUAL_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          VERSION_JSON=$(bun scripts/get-release-version.ts)
          {
            echo "source_sha=$SOURCE_SHA"
            echo "release_version=$(echo "$VERSION_JSON" | jq -r .releaseVersion)"
            echo "release_tag=$(echo "$VERSION_JSON" | jq -r .releaseTag)"
            echo "npm_tag=$(echo "$VERSION_JSON" | jq -r .npmTag)"
          } >> "$GITHUB_OUTPUT"
      - name: Extract shared sandbox image labels
        id: image_metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}/sandbox
          tags: |
            type=raw,value=${{ steps.metadata.outputs.release_version }}
            type=raw,value=latest,enable=${{ github.event_name != 'schedule' && inputs.create_nightly_release != true }}
      - name: Version and bind release packages
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          npm run release:version "$RELEASE_VERSION"
          bun scripts/bind-release-deps.ts
      - name: Build and pack versioned sandbox inputs
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          npm run build:packages
          npm run prepare:package
          mkdir -p packages/tools/dist packages/cli/dist packages/storage/dist packages/auth/dist packages/settings/dist packages/telemetry/dist packages/ide-integration/dist packages/policy/dist packages/mcp/dist packages/core/dist packages/providers/dist packages/agents/dist packages/zed-acp/dist
          npm pack -w @vybestack/llxprt-code-tools --pack-destination ./packages/tools/dist
          npm pack -w @vybestack/llxprt-code-storage --pack-destination ./packages/storage/dist
          npm pack -w @vybestack/llxprt-code-auth --pack-destination ./packages/auth/dist
          npm pack -w @vybestack/llxprt-code-settings --pack-destination ./packages/settings/dist
          npm pack -w @vybestack/llxprt-code-telemetry --pack-destination ./packages/telemetry/dist
          npm pack -w @vybestack/llxprt-code-ide-integration --pack-destination ./packages/ide-integration/dist
          npm pack -w @vybestack/llxprt-code-policy --pack-destination ./packages/policy/dist
          npm pack -w @vybestack/llxprt-code-mcp --pack-destination ./packages/mcp/dist
          npm pack -w @vybestack/llxprt-code-core --pack-destination ./packages/core/dist
          npm pack -w @vybestack/llxprt-code-providers --pack-destination ./packages/providers/dist
          npm pack -w @vybestack/llxprt-code-agents --pack-destination ./packages/agents/dist
          npm pack -w @vybestack/llxprt-code-zed-acp --pack-destination ./packages/zed-acp/dist
          npm pack -w @vybestack/llxprt-code --pack-destination ./packages/cli/dist
          tar -czf "$RUNNER_TEMP/sandbox-release-inputs.tgz" packages/*/dist/*.tgz
      - name: Upload versioned sandbox input artifact
        id: upload
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: sandbox-release-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/sandbox-release-inputs.tgz
          if-no-files-found: error

  candidate_amd64:
    name: Build and smoke linux/amd64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: prepare_artifact
    if: github.repository == 'vybestack/llxprt-code' && inputs.publish_vscode_only != true && inputs.dry_run != true
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      image_sha256: ${{ steps.image.outputs.sha256 }}
      input_artifact_digest: ${{ needs.prepare_artifact.outputs.artifact_digest }}
      source_sha: ${{ needs.prepare_artifact.outputs.source_sha }}
      release_version: ${{ needs.prepare_artifact.outputs.release_version }}
    steps:
      - name: Checkout source SHA
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ needs.prepare_artifact.outputs.source_sha }}
      - name: Download shared versioned sandbox inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sandbox-release-inputs-${{ github.run_id }}
      - name: Restore sandbox input tarballs
        run: tar -xzf sandbox-release-inputs.tgz -C .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build amd64 candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: llxprt-sandbox:candidate-amd64
          labels: ${{ needs.prepare_artifact.outputs.image_labels }}
          build-args: CLI_VERSION_ARG=${{ needs.prepare_artifact.outputs.release_version }}
      - name: Setup Bun for image smoke
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Smoke test amd64 candidate
        run: bun scripts/sandbox-image-probe.ts --engine docker --image llxprt-sandbox:candidate-amd64 --platform linux/amd64
      - name: Export candidate image and calculate digest
        id: image
        run: |
          docker save llxprt-sandbox:candidate-amd64 -o "$RUNNER_TEMP/candidate-amd64.tar"
          sha256sum "$RUNNER_TEMP/candidate-amd64.tar" | tee "$RUNNER_TEMP/candidate-amd64.tar.sha256"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/candidate-amd64.tar.sha256")" >> "$GITHUB_OUTPUT"
      - name: Upload amd64 candidate image
        id: upload
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: sandbox-candidate-amd64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-amd64.tar
            ${{ runner.temp }}/candidate-amd64.tar.sha256
          if-no-files-found: error

  candidate_arm64:
    name: Build and smoke linux/arm64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: prepare_artifact
    if: github.repository == 'vybestack/llxprt-code' && inputs.publish_vscode_only != true && inputs.dry_run != true
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      image_sha256: ${{ steps.image.outputs.sha256 }}
      input_artifact_digest: ${{ needs.prepare_artifact.outputs.artifact_digest }}
      source_sha: ${{ needs.prepare_artifact.outputs.source_sha }}
      release_version: ${{ needs.prepare_artifact.outputs.release_version }}
    steps:
      - name: Checkout source SHA
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          ref: ${{ needs.prepare_artifact.outputs.source_sha }}
      - name: Download shared versioned sandbox inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sandbox-release-inputs-${{ github.run_id }}
      - name: Restore sandbox input tarballs
        run: tar -xzf sandbox-release-inputs.tgz -C .
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build arm64 candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: llxprt-sandbox:candidate-arm64
          labels: ${{ needs.prepare_artifact.outputs.image_labels }}
          build-args: CLI_VERSION_ARG=${{ needs.prepare_artifact.outputs.release_version }}
      - name: Setup Bun for image smoke
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version-file: '.bun-version'
      - name: Smoke test arm64 candidate
        run: bun scripts/sandbox-image-probe.ts --engine docker --image llxprt-sandbox:candidate-arm64 --platform linux/arm64
      - name: Export candidate image and calculate digest
        id: image
        run: |
          docker save llxprt-sandbox:candidate-arm64 -o "$RUNNER_TEMP/candidate-arm64.tar"
          sha256sum "$RUNNER_TEMP/candidate-arm64.tar" | tee "$RUNNER_TEMP/candidate-arm64.tar.sha256"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/candidate-arm64.tar.sha256")" >> "$GITHUB_OUTPUT"
      - name: Upload arm64 candidate image
        id: upload
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: sandbox-candidate-arm64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-arm64.tar
            ${{ runner.temp }}/candidate-arm64.tar.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - verify_preflight
      - verify_shards
      - integration
      - prepare_artifact
      - candidate_amd64
      - candidate_arm64
    if: >-
      always() && github.repository == 'vybestack/llxprt-code' &&
      needs.prepare_artifact.result == 'success' &&
      (inputs.force_skip_tests == true ||
       (needs.verify_preflight.result == 'success' && needs.verify_shards.result == 'success' && needs.integration.result == 'success')) &&
      (inputs.publish_vscode_only == true || inputs.dry_run == true ||
       (needs.candidate_amd64.result == 'success' && needs.candidate_arm64.result == 'success'))
    environment:
      name: production-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.RELEASE_TAG }}
    env:
      REGISTRY: ghcr.io
      SANDBOX_IMAGE_NAME: ${{ github.repository }}/sandbox
      SOURCE_SHA: ${{ needs.prepare_artifact.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.prepare_artifact.outputs.release_version }}
      INPUT_ARTIFACT_DIGEST: ${{ needs.prepare_artifact.outputs.artifact_digest }}
      AMD64_ARTIFACT_DIGEST: ${{ needs.candidate_amd64.outputs.artifact_digest }}
      ARM64_ARTIFACT_DIGEST: ${{ needs.candidate_arm64.outputs.artifact_digest }}
      AMD64_INPUT_ARTIFACT_DIGEST: ${{ needs.candidate_amd64.outputs.input_artifact_digest }}
      ARM64_INPUT_ARTIFACT_DIGEST: ${{ needs.candidate_arm64.outputs.input_artifact_digest }}
      AMD64_SOURCE_SHA: ${{ needs.candidate_amd64.outputs.source_sha }}
      ARM64_SOURCE_SHA: ${{ needs.candidate_arm64.outputs.source_sha }}
      AMD64_RELEASE_VERSION: ${{ needs.candidate_amd64.outputs.release_version }}
      ARM64_RELEASE_VERSION: ${{ needs.candidate_arm64.outputs.release_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write # For creating issues on failure
      pull-requests: read # For enrichment (gh api GraphQL on PR metadata)
    outputs:
      RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}

    steps:
      - name: Checkout code
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set booleans for simplified logic
        id: vars
        run: |
          is_nightly="false"
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.create_nightly_release }}" == "true" ]]; then
            is_nightly="true"
          fi
          echo "is_nightly=${is_nightly}" >> "$GITHUB_OUTPUT"

          is_preview="false"
          if [[ "${{ github.event.inputs.create_preview_release }}" == "true" ]]; then
            is_preview="true"
          fi
          echo "is_preview=${is_preview}" >> "$GITHUB_OUTPUT"

          is_dry_run="false"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            is_dry_run="true"
          fi
          echo "is_dry_run=${is_dry_run}" >> "$GITHUB_OUTPUT"

          publish_vscode_only="false"
          if [[ "${{ github.event.inputs.publish_vscode_only }}" == "true" ]]; then
            publish_vscode_only="true"
          fi
          echo "publish_vscode_only=${publish_vscode_only}" >> "$GITHUB_OUTPUT"

          skip_vscode="false"
          if [[ "${{ github.event.inputs.skip_vscode_publish }}" == "true" ]]; then
            skip_vscode="true"
          fi
          echo "skip_vscode=${skip_vscode}" >> "$GITHUB_OUTPUT"

          if [[ "$publish_vscode_only" == "true" && "$skip_vscode" == "true" ]]; then
            echo "publish_vscode_only and skip_vscode_publish cannot both be true." >&2
            exit 1
          fi

          should_publish_vscode="true"
          if [[ "$skip_vscode" == "true" ]]; then
            should_publish_vscode="false"
          elif [[ "$is_nightly" == "true" ]]; then
            echo "Nightly run detected; skipping VS Code Marketplace publication."
            should_publish_vscode="false"
          fi
          echo "should_publish_vscode=${should_publish_vscode}" >> "$GITHUB_OUTPUT"

          should_run_standard_release="true"
          if [[ "$publish_vscode_only" == "true" ]]; then
            should_run_standard_release="false"
          fi
          echo "should_run_standard_release=${should_run_standard_release}" >> "$GITHUB_OUTPUT"

          # Determine if we should create a release branch
          # Only major/minor releases (vX.Y.0) get branches, not patch releases or nightlies
          # This will be finalized after we know the version in a later step
          echo "should_create_branch=pending" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Bun
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          # Pin to the single source of truth shared with CI and Docker.
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: 'Link lockfile-installed Bun and apply dependency patches'
        run: |-
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs

      - name: Fix rollup platform dependency
        run: |
          npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save --ignore-scripts || true

      - name: Reuse versioned artifact metadata
        id: version
        env:
          RELEASE_TAG: ${{ needs.prepare_artifact.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare_artifact.outputs.release_version }}
          NPM_TAG: ${{ needs.prepare_artifact.outputs.npm_tag }}
        run: |
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "NPM_TAG=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      # Scheduled nightlies can collide with a manual nightly that already
      # published the same commit + UTC-date version. npm versions are
      # immutable, so detect an already-published canonical package and skip
      # the rest of the pipeline instead of failing at publish time. Manual
      # releases remain strict because this step only runs for the schedule
      # event.
      - name: Check for duplicate scheduled nightly
        id: duplicate_check
        if: github.event_name == 'schedule'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: bun scripts/check-nightly-release.ts

      - name: Determine if release branch should be created
        id: branch_decision
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.RELEASE_VERSION }}"
          IS_NIGHTLY="${{ steps.vars.outputs.is_nightly }}"

          # Only create branches for major/minor releases (vX.Y.0), not for:
          # - Nightly releases (v0.8.0-nightly.250129.abc1234)
          # - Patch releases (v0.8.1, v0.8.2)
          # - Preview/beta releases (v0.8.0-beta.0)
          should_create_branch="false"
          if [[ "$IS_NIGHTLY" == "false" && "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            should_create_branch="true"
            echo "Major/minor release detected (${RELEASE_VERSION}), will create release branch."
          else
            echo "Patch/nightly/preview release detected (${RELEASE_VERSION}), skipping branch creation."
          fi
          echo "should_create_branch=${should_create_branch}" >> "$GITHUB_OUTPUT"

      - name: Configure Git User
        if: ${{ steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and switch to a release branch
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.branch_decision.outputs.should_create_branch == 'true' }}
        id: release_branch
        run: |
          BRANCH_NAME="release/${{ steps.version.outputs.RELEASE_TAG }}"
          git switch -c "$BRANCH_NAME"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update package versions
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: |
          npm run release:version ${{ steps.version.outputs.RELEASE_VERSION }}

      - name: Bind release dependencies
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: bun scripts/bind-release-deps.ts

      - name: Commit and Conditionally Push package versions
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.branch_decision.outputs.should_create_branch == 'true' }}
        run: |
          git add package.json package-lock.json packages/*/package.json || true
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No version changes detected - packages already at version ${{ steps.version.outputs.RELEASE_VERSION }}"
            # Still create an empty commit to maintain workflow consistency
            git commit --allow-empty -m "chore(release): ${{ steps.version.outputs.RELEASE_TAG }} (no version changes)"
          else
            git commit -m "chore(release): ${{ steps.version.outputs.RELEASE_TAG }}"
          fi
          if [[ "${{ steps.vars.outputs.is_dry_run }}" == "false" ]]; then
            echo "Pushing release branch to remote..."
            git push --set-upstream origin ${{ steps.release_branch.outputs.BRANCH_NAME }} --follow-tags --force
          else
            echo "Dry run enabled. Skipping push."
          fi

      - name: Build and Prepare Packages
        if: ${{ steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: |
          rm -rf packages/*/dist
          npm run build:packages
          npm run prepare:package

      - name: Prove scripts-disabled release consumers
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
          LLXPRT_RELEASE_PROOF_DIR: ${{ runner.temp }}/release-proof
        run: |
          npm run bundle:cli
          bun scripts/tests/release-bound-artifact-helpers.ts

      - name: Upload release consumer proof
        if: ${{ always() && steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # ratchet:actions/upload-artifact@v4
        with:
          name: scripts-disabled-release-proof
          path: |
            ${{ runner.temp }}/release-proof/*.json
            ${{ runner.temp }}/release-proof/*.log
            ${{ runner.temp }}/release-proof/local/*.log
            ${{ runner.temp }}/release-proof/global/*.log
          if-no-files-found: error

      - name: Sync VS Code extension version
        if: ${{ steps.vars.outputs.should_publish_vscode == 'true' && steps.vars.outputs.should_run_standard_release == 'false' }}
        run: |
          npm version ${{ steps.version.outputs.RELEASE_VERSION }} \
            --workspace=llxprt-code-vscode-ide-companion \
            --no-git-tag-version \
            --allow-same-version

      - name: Package VS Code extension
        id: vscode_package
        if: ${{ steps.vars.outputs.should_publish_vscode == 'true' }}
        run: |
          rm -f packages/vscode-ide-companion/*.vsix
          npm run build:vscode
          VSIX_FILE=$(find packages/vscode-ide-companion -maxdepth 1 -type f -name '*.vsix' | head -n 1)
          if [[ -z "$VSIX_FILE" ]]; then
            echo "VSIX build did not produce a package." >&2
            exit 1
          fi
          echo "VSIX_PATH=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Set up local Gemma for release notes
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        uses: './.github/actions/setup-local-gemma'

      - name: Generate Release Notes
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}
          IS_NIGHTLY: ${{ steps.vars.outputs.is_nightly }}
          LLXPRT_DEFAULT_PROVIDER: openai
          LLXPRT_DEFAULT_MODEL: gemma4:e2b-it-qat
          OPENAI_BASE_URL: http://127.0.0.1:12644/v1
          OPENAI_API_KEY: ollama-local-only
          LLXPRT_CONTEXT_LIMIT: '32768'
          LLXPRT_MAX_OUTPUT_TOKENS: '8192'
        run: bun scripts/generate-release-notes.ts

      # Marketplace publishing authenticates via Microsoft Entra ID using GitHub
      # OIDC workload identity federation rather than a Personal Access Token.
      # Azure DevOps retires global PATs on 2026-12-01. The federated credential
      # is scoped to this repository and the "production-release" environment, so
      # no long-lived secret is stored. `allow-no-subscriptions` is required
      # because publishing is not an ARM operation and the tenant has none.
      - name: Azure login for VS Code Marketplace
        if: ${{ steps.vars.outputs.should_publish_vscode == 'true' && steps.vars.outputs.is_dry_run == 'false' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # ratchet:azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish VS Code extension
        if: ${{ steps.vars.outputs.should_publish_vscode == 'true' && steps.vars.outputs.is_dry_run == 'false' }}
        env:
          VSIX_PATH: ${{ steps.vscode_package.outputs.VSIX_PATH }}
        run: |
          if [[ -z "${VSIX_PATH}" || ! -f "${VSIX_PATH}" ]]; then
            echo "VSIX package not found at ${VSIX_PATH}." >&2
            exit 1
          fi
          bun scripts/run_vsce.ts publish --packagePath "${VSIX_PATH}" --azure-credential --skip-duplicate

      - name: Publish @vybestack/llxprt-code-tools
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-tools-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-storage
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-storage-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-auth
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-auth-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-settings
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-settings-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-telemetry
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-telemetry-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-ide-integration
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-ide-integration-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-policy
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-policy-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-mcp
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-mcp-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-core
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-core-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-lsp
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-lsp-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-providers
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-providers-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-agents
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-agents-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code-zed-acp
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-zed-acp-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-code
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: npm publish "${{ runner.temp }}/release-proof/vybestack-llxprt-code-${{ steps.version.outputs.RELEASE_VERSION }}.tgz" --ignore-scripts --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      # Runtime plugins (issue #2759) live OUTSIDE the root workspaces, so
      # they cannot be published with --workspace. They publish from their own
      # directories, driven by the explicit first-party list in
      # scripts/utils/release-packages.ts (FIRST_PARTY_RUNTIME_PLUGIN_RELEASES):
      # base packages first, then plugins, in list order, never by scanning
      # the plugins/ directory. Plugins peer-depend on host packages, so they
      # publish only after the CLI step above.
      - name: Version runtime plugin packages
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: |
          for plugin in plugins/google-gemini plugins/google-mcp-auth; do
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --prefix "$plugin"
          done
          # The version loop above stamps each plugin manifest; this keeps the
          # host peer ranges (@vybestack/llxprt-code-core,
          # @vybestack/llxprt-code-providers) at the same release version so a
          # published plugin cannot ship with a trailing ^X.Y.0 range that npm
          # treats as excluding the matching host release.
          bun scripts/bind-plugin-peers.ts "$RELEASE_VERSION"

      - name: Set up Bun for plugin builds
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          # Plugin lockfiles are lockfileVersion 2 (bun >= 1.4.2) because
          # plugin-local installs need bun 1.4.2's handling of unresolved
          # root peers (see plugins/README.md). The repo-wide .bun-version
          # pin satisfies that floor, so it stays the single source of truth.
          bun-version-file: '.bun-version'

      - name: Build runtime plugin packages
        if: ${{ steps.duplicate_check.outputs.is_duplicate != 'true' }}
        run: |
          for plugin in plugins/google-gemini plugins/google-mcp-auth; do
            (cd "$plugin" && bun install --omit=peer && bun run build)
          done

      - name: Publish @vybestack/llxprt-plugin-google-gemini
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        working-directory: plugins/google-gemini
        run: npm publish --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Publish @vybestack/llxprt-plugin-google-mcp-auth
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        working-directory: plugins/google-mcp-auth
        run: npm publish --access public --provenance --tag=${{ steps.version.outputs.NPM_TAG }} ${{ steps.vars.outputs.is_dry_run == 'true' && '--dry-run' || '' }}

      - name: Wait for npm propagation
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.vars.outputs.is_nightly == 'false' }}
        run: |
          echo "Waiting 120 seconds for npm to propagate..."
          sleep 120

      - name: Update Homebrew formula
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.vars.outputs.is_nightly == 'false' }}
        continue-on-error: true
        run: bun scripts/update-homebrew-formula.ts ${{ steps.version.outputs.RELEASE_VERSION }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.GH_SECRET }}

      - name: Log in to Container Registry
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract sandbox image metadata
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        id: sandbox_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.RELEASE_VERSION }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_nightly != 'true' }}

      - name: Download amd64 candidate image
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sandbox-candidate-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-amd64

      - name: Download arm64 candidate image
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sandbox-candidate-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-arm64

      - name: Verify and load candidate images
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        env:
          SOURCE_SHA: ${{ needs.prepare_artifact.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.prepare_artifact.outputs.release_version }}
          INPUT_ARTIFACT_DIGEST: ${{ needs.prepare_artifact.outputs.artifact_digest }}
          AMD64_ARTIFACT_DIGEST: ${{ needs.candidate_amd64.outputs.artifact_digest }}
          ARM64_ARTIFACT_DIGEST: ${{ needs.candidate_arm64.outputs.artifact_digest }}
          AMD64_IMAGE_SHA256: ${{ needs.candidate_amd64.outputs.image_sha256 }}
          ARM64_IMAGE_SHA256: ${{ needs.candidate_arm64.outputs.image_sha256 }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "${GITHUB_SHA}"
          test "$AMD64_SOURCE_SHA" = "$SOURCE_SHA"
          test "$ARM64_SOURCE_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = "${{ steps.version.outputs.RELEASE_VERSION }}"
          test "$AMD64_RELEASE_VERSION" = "$RELEASE_VERSION"
          test "$ARM64_RELEASE_VERSION" = "$RELEASE_VERSION"
          test -n "$INPUT_ARTIFACT_DIGEST"
          test "$AMD64_INPUT_ARTIFACT_DIGEST" = "$INPUT_ARTIFACT_DIGEST"
          test "$ARM64_INPUT_ARTIFACT_DIGEST" = "$INPUT_ARTIFACT_DIGEST"
          test -n "$AMD64_ARTIFACT_DIGEST"
          test -n "$ARM64_ARTIFACT_DIGEST"
          test -n "$AMD64_IMAGE_SHA256"
          test -n "$ARM64_IMAGE_SHA256"
          cd "$RUNNER_TEMP/candidate-amd64"
          sha256sum --check candidate-amd64.tar.sha256
          printf '%s  %s\n' "$AMD64_IMAGE_SHA256" candidate-amd64.tar | sha256sum --check -
          docker load --input candidate-amd64.tar
          cd "$RUNNER_TEMP/candidate-arm64"
          sha256sum --check candidate-arm64.tar.sha256
          printf '%s  %s\n' "$ARM64_IMAGE_SHA256" candidate-arm64.tar | sha256sum --check -
          docker load --input candidate-arm64.tar

      - name: Publish tested sandbox candidates
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        env:
          SANDBOX_IMAGE: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
          SANDBOX_TAGS: ${{ steps.sandbox_meta.outputs.tags }}
        run: |
          set -euo pipefail
          amd64_tag="${SANDBOX_IMAGE}:${RELEASE_VERSION}-amd64"
          arm64_tag="${SANDBOX_IMAGE}:${RELEASE_VERSION}-arm64"
          docker tag llxprt-sandbox:candidate-amd64 "$amd64_tag"
          docker tag llxprt-sandbox:candidate-arm64 "$arm64_tag"
          docker push "$amd64_tag"
          docker push "$arm64_tag"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker manifest create "$tag" "$amd64_tag" "$arm64_tag"
            docker manifest push "$tag"
          done <<< "$SANDBOX_TAGS"

      - name: Create GitHub Release and Tag
        if: ${{ steps.vars.outputs.should_run_standard_release == 'true' && steps.vars.outputs.is_dry_run == 'false' && steps.duplicate_check.outputs.is_duplicate != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release_branch.outputs.BRANCH_NAME }}
          VSIX_PATH: ${{ steps.vscode_package.outputs.VSIX_PATH }}
          SHOULD_CREATE_BRANCH: ${{ steps.branch_decision.outputs.should_create_branch }}
          # Thread version values through env (not inline expansion) to avoid shell
          # injection if a release version ever carries metacharacters.
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: |
          # Determine target for the release: branch if created, otherwise current commit
          if [[ "$SHOULD_CREATE_BRANCH" == "true" && -n "$RELEASE_BRANCH" ]]; then
            TARGET_REF="$RELEASE_BRANCH"
          else
            TARGET_REF="$(git rev-parse HEAD)"
          fi
          TARGET_SHA="$(git rev-parse "${TARGET_REF}^{commit}")"

          # Attach the same CLI tarball that passed scripts-disabled consumer proof.
          CLI_TARBALL="${RUNNER_TEMP}/release-proof/vybestack-llxprt-code-${RELEASE_VERSION}.tgz"
          if [[ ! -f "$CLI_TARBALL" ]]; then
            echo "CLI tarball not found at $CLI_TARBALL; cannot create release" >&2
            exit 1
          fi

          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" \
            --jq '.[] | select(.ref == "refs/tags/" + $ENV.RELEASE_TAG) | .object.type + " " + .object.sha')"

          if [[ -n "$TAG_OBJECT" ]]; then
            EXISTING_TYPE="${TAG_OBJECT%% *}"
            EXISTING_SHA="${TAG_OBJECT##* }"
            if [[ "$EXISTING_TYPE" == "tag" ]]; then
              EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${EXISTING_SHA}" --jq '.object.sha')"
            fi
            if [[ "$EXISTING_SHA" != "$TARGET_SHA" ]]; then
              echo "Tag refs/tags/$RELEASE_TAG already exists at $EXISTING_SHA and does not match target commit $TARGET_SHA" >&2
              exit 1
            fi
            echo "Reusing existing tag refs/tags/$RELEASE_TAG at $TARGET_SHA"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${TARGET_SHA}" \
              --silent
          fi

          if [[ -n "${VSIX_PATH}" && -f "${VSIX_PATH}" ]]; then
            gh release create "$RELEASE_TAG" \
              "$CLI_TARBALL" \
              "${VSIX_PATH}" \
              --title "Release $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "$CLI_TARBALL" \
              --title "Release $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Create Issue on Failure
        if: failure()
        run: |
          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            local existing=""
            local create_err=""
            # Capture stderr in create_err while discarding stdout; redirect order matters.
            if create_err="$(gh label create "${name}" --repo "${GH_REPO}" --color "${color}" --description "${description}" 2>&1 >/dev/null)"; then
              return
            fi
            if ! existing="$(gh label list --repo "${GH_REPO}" --search "${name}" --json name --jq ".[] | select(.name == \"${name}\") | .name" 2>&1)"; then
              echo "Failed to check for label: ${name}" >&2
              echo "  create error: ${create_err}" >&2
              echo "  list error: ${existing}" >&2
              return 1
            fi
            if [[ "${existing}" != "${name}" ]]; then
              echo "Failed to create or find label: ${name}" >&2
              return 1
            fi
          }

          # Resolve the milestone for the version currently being worked on in
          # main, so the auto-created failure issue surfaces in the release
          # view (issue #3064). Source of truth is the root package.json
          # `version` on main -- not the released ref, which may have bumped
          # it. Resolved by exact title match against open milestones (not
          # nearest due date). Fails soft: an unresolvable milestone logs a
          # warning and returns empty, so the notification still goes out.
          resolve_milestone() {
            local package_json
            if ! package_json="$(gh api "repos/${GH_REPO}/contents/package.json?ref=main" -H 'Accept: application/vnd.github.raw' 2>/dev/null)"; then
              echo "Warning: could not read package.json from main; skipping milestone resolution" >&2
              return
            fi
            local current_version
            current_version="$(printf '%s' "${package_json}" | jq -r '.version // empty' 2>/dev/null)"
            if [[ -z "${current_version}" ]]; then
              echo "Warning: package.json on main has no version field; skipping milestone resolution" >&2
              return
            fi
            # gh issue --milestone accepts a milestone TITLE, not a number.
            # Resolve the title by exact match across ALL open milestone pages,
            # then return it for assignment.
            local milestone_title=""
            if ! milestone_title="$(gh api --paginate --slurp "repos/${GH_REPO}/milestones?state=open&per_page=100" 2>/dev/null | jq -r --arg version "${current_version}" '[.[][] | select(.title == $version)] | .[0].title // empty' 2>/dev/null)"; then
              echo "Warning: could not list open milestones; skipping milestone assignment" >&2
              return
            fi
            if [[ -z "${milestone_title}" ]]; then
              echo "Warning: no open milestone titled '${current_version}'; skipping milestone assignment" >&2
              return
            fi
            printf '%s' "${milestone_title}"
          }

          # Stamp the Bug issue type on the auto-created failure issue (issue
          # #3064) so it lands in the same triage view as hand-filed bugs.
          # `gh issue create` has no --type flag, so the type is applied over
          # REST afterwards. Accepts the issue URL that create prints, or a
          # bare number. Always returns 0: metadata must never sink the
          # notification.
          #
          # This function is duplicated verbatim across the workflows that
          # auto-create failure issues rather than sourced from a shared
          # script, because the other notifier jobs have no checkout step --
          # the same reason resolve_milestone reads package.json over the API
          # instead of from disk.
          apply_issue_type() {
            local reference="$1"
            local number="${reference##*/}"
            if [[ ! "${number}" =~ ^[0-9]+$ ]]; then
              echo "Warning: could not parse issue reference '${reference}'; skipping issue type assignment" >&2
              return 0
            fi
            if ! gh api -X PATCH "repos/${GH_REPO}/issues/${number}" -f type=Bug >/dev/null 2>&1; then
              echo "Warning: failed to set issue type Bug on issue #${number}" >&2
              return 0
            fi
          }

          MILESTONE_TITLE="$(resolve_milestone)"
          MILESTONE_ARGS=()
          if [[ -n "${MILESTONE_TITLE}" ]]; then
            MILESTONE_ARGS+=(--milestone "${MILESTONE_TITLE}")
          fi

          CREATE_ARGS=(--repo "${GH_REPO}")
          CREATE_ARGS+=(--title "Release Failed for ${RELEASE_TAG} on $(date +'%Y-%m-%d')")
          CREATE_ARGS+=(--body "The release workflow failed. See the full run for details: ${RUN_URL}")
          LABEL_ARGS=()
          if ensure_label "ci/cd" "e33539" "Issues with github and the workflow scripts and CI CD environment."; then
            LABEL_ARGS+=(--label "ci/cd")
          else
            echo "Warning: continuing without ci/cd label" >&2
          fi

          CREATE_ARGS+=(${LABEL_ARGS[@]+"${LABEL_ARGS[@]}"})
          # Empty arrays expand to an unbound variable under `set -u` on bash
          # 3.2, so guard every expansion with the `+` alternate form.
          CREATE_ARGS+=(${MILESTONE_ARGS[@]+"${MILESTONE_ARGS[@]}"})

          CREATED_ISSUE_FILE=created_issue.txt
          gh issue create "${CREATE_ARGS[@]}" > "${CREATED_ISSUE_FILE}"
          cat "${CREATED_ISSUE_FILE}"
          apply_issue_type "$(tail -n 1 "${CREATED_ISSUE_FILE}")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Interpolated through env rather than straight into the run body, so
          # a value carrying shell metacharacters cannot alter the script.
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG || 'N/A' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  report_gate_failure:
    name: Report release gate failure
    runs-on: ubuntu-latest
    needs:
      - verify_preflight
      - verify_shards
      - integration
      - prepare_artifact
      - candidate_amd64
      - candidate_arm64
    if: >-
      always() && github.repository == 'vybestack/llxprt-code' &&
      (needs.verify_preflight.result == 'failure' ||
       needs.verify_shards.result == 'failure' ||
       needs.integration.result == 'failure' ||
       needs.prepare_artifact.result == 'failure' ||
       needs.candidate_amd64.result == 'failure' ||
       needs.candidate_arm64.result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Create issue for failed release gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare_artifact.outputs.release_tag || 'N/A' }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GH_REPO" \
            --title "Release verification failed for ${RELEASE_TAG}" \
            --body "A release verification or candidate smoke gate failed for source ${SOURCE_SHA}. See ${RUN_URL} for details."
