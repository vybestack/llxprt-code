name: Evals Nightly

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: 'evals-nightly-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  evals:
    name: Run Evals
    uses: ./.github/workflows/_evals-run.yml
    secrets:
      provider-api-key: ${{ secrets[vars.KEY_VAR_NAME] }}

  aggregate-results:
    name: Aggregate Results
    needs: [evals]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aggregate and output results
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: bun scripts/aggregate_evals.ts artifacts >> "$GITHUB_STEP_SUMMARY"
