name: 'Interactive UI Tests'

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
      - 'dev/**'
    paths:
      # Harness infrastructure — direct inputs consumed by the test
      - 'scripts/tmux-harness.ts'
      - 'scripts/tmux-harness-helpers.ts'
      - 'scripts/tmux-harness-io.ts'
      - 'scripts/tmux-harness-scenarios.ts'
      - 'scripts/tmux-harness-steps.ts'
      # The interactive UI test and its Bun test preload
      - 'scripts/tests/test-setup.ts'
      - 'scripts/tests/interactive-ui.test.ts'
      - 'scripts/tmux-script.slash-autocomplete.json'
      - 'scripts/tmux-script.approval-ui.json'
      - 'scripts/tmux-script.issue2208-newlines.fake.json'
      - 'scripts/tmux-script.issue2016-composer.fake.json'
      - 'scripts/tmux-script.issue3386-memory-retention.fake.json'
      - 'scripts/tests/memory/retention-checkpoints.ts'
      - 'scripts/memory/**'
      - 'patches/ink+6.4.8.patch'
      - 'scripts/tmux-script.onboarding.json'
      - 'scripts/tmux-script.provider-model.json'
      - 'scripts/tmux-script.welcome.json'
      - 'scripts/tmux-script.session-browser-resize.json'
      - 'scripts/tmux-script.unicode-composer.json'
      - 'scripts/seed-session-browser-resize.ts'
      - 'packages/core/package.json'
      - 'packages/core/index.ts'
      - 'packages/core/src/index.ts'
      - 'packages/core/src/recording/index.ts'
      - 'packages/core/src/recording/SessionRecordingService.ts'
      - 'packages/core/src/recording/SessionLockManager.ts'
      - 'packages/core/src/recording/SessionLockManager.internals.ts'
      - 'packages/core/src/utils/paths.ts'
      - 'packages/storage/package.json'
      - 'packages/storage/index.ts'
      - 'packages/storage/src/index.ts'
      - 'packages/storage/src/config/storage.ts'
      - 'scripts/tmux-script.session-browser.json'
      # The eight scenario JSON files executed by the test
      # Deterministic session seed executed by the resize scenario
      # Scenario config referenced by the executed scenarios (welcome banner,
      # plus system settings env path set in each scenario)
      - 'scripts/fixtures/welcome-completed.json'
      - 'scripts/system-settings.interactive-ui.json'
      # Fixtures referenced by the executed scenarios
      - 'scripts/fixtures/approval-ui.responses.jsonl'
      - 'scripts/fixtures/issue2208-newlines.responses.jsonl'
      - 'scripts/fixtures/session-browser.responses.jsonl'
      - 'scripts/fixtures/session-browser-settings.json'
      # CLI UI layer (dialogs, autocomplete, input handling)
      - 'packages/cli/src/ui/**'
      - 'packages/cli/src/commands/**'
      # First-run welcome detection/persistence driven by the onboarding scenario
      - 'packages/cli/src/config/welcomeConfig.ts'
      # Core tool approval, skills, fake provider, and policy logic
      - 'packages/agents/src/scheduler/**'
      - 'packages/cli/src/providers/providerManagerInstance.ts'
      - 'packages/core/src/policy/**'
      - 'packages/core/src/skills/**'
      - 'packages/core/src/tools/**'
      - 'packages/providers/src/fake/**'
      - 'packages/tools/src/tools/**'
      - '.llxprt/skills/**'
      # Setup/install inputs consumed by the job (node-version-file, bun-version-file, npm ci config)
      - '.nvmrc'
      - '.bun-version'
      - '.npmrc'
      # Workflow and package scripts (the job runs npm ci + npm run build)
      - '.github/workflows/interactive-ui.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/tmux-harness.ts'
      - 'scripts/tmux-harness-helpers.ts'
      - 'scripts/tmux-harness-io.ts'
      - 'scripts/tmux-harness-scenarios.ts'
      - 'scripts/tmux-harness-steps.ts'
      - 'scripts/tests/test-setup.ts'
      - 'scripts/tests/interactive-ui.test.ts'
      - 'scripts/tmux-script.slash-autocomplete.json'
      - 'scripts/tmux-script.approval-ui.json'
      - 'scripts/tmux-script.issue2208-newlines.fake.json'
      - 'scripts/tmux-script.issue2016-composer.fake.json'
      - 'scripts/tmux-script.issue3386-memory-retention.fake.json'
      - 'scripts/tests/memory/retention-checkpoints.ts'
      - 'scripts/memory/**'
      - 'patches/ink+6.4.8.patch'
      - 'scripts/tmux-script.onboarding.json'
      - 'scripts/tmux-script.provider-model.json'
      - 'scripts/tmux-script.welcome.json'
      - 'scripts/tmux-script.session-browser-resize.json'
      - 'scripts/tmux-script.unicode-composer.json'
      - 'scripts/seed-session-browser-resize.ts'
      - 'packages/core/package.json'
      - 'packages/core/index.ts'
      - 'packages/core/src/index.ts'
      - 'packages/core/src/recording/index.ts'
      - 'packages/core/src/recording/SessionRecordingService.ts'
      - 'packages/core/src/recording/SessionLockManager.ts'
      - 'packages/core/src/recording/SessionLockManager.internals.ts'
      - 'packages/core/src/utils/paths.ts'
      - 'packages/storage/package.json'
      - 'packages/storage/index.ts'
      - 'packages/storage/src/index.ts'
      - 'packages/storage/src/config/storage.ts'
      - 'scripts/tmux-script.session-browser.json'
      - 'scripts/fixtures/welcome-completed.json'
      - 'scripts/system-settings.interactive-ui.json'
      - 'scripts/fixtures/approval-ui.responses.jsonl'
      - 'scripts/fixtures/issue2208-newlines.responses.jsonl'
      - 'scripts/fixtures/session-browser.responses.jsonl'
      - 'scripts/fixtures/session-browser-settings.json'
      - 'packages/cli/src/ui/**'
      - 'packages/cli/src/commands/**'
      - 'packages/cli/src/config/welcomeConfig.ts'
      - 'packages/agents/src/scheduler/**'
      - 'packages/cli/src/providers/providerManagerInstance.ts'
      - 'packages/core/src/policy/**'
      - 'packages/core/src/skills/**'
      - 'packages/core/src/tools/**'
      - 'packages/providers/src/fake/**'
      - 'packages/tools/src/tools/**'
      - '.llxprt/skills/**'
      - '.nvmrc'
      - '.bun-version'
      - '.npmrc'
      - '.github/workflows/interactive-ui.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# PR-or-ref grouping safely cancels superseded runs because this workflow has
# no pull_request_target trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  interactive_ui:
    name: 'Interactive UI (tmux)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Setup Bun'
        # npm run build and npm run bundle below are backed by
        # bun scripts/*.ts and require the Bun runtime to be on PATH.
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install tmux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Fix rollup platform dependency'
        run: 'npm install @rollup/rollup-linux-x64-gnu --no-save || true'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Validate interactive UI runtime'
        env:
          NODE_OPTIONS: ''
        run: |
          set -euo pipefail
          node --version
          tmux -V
          test -x packages/cli/bin/llxprt
          ./packages/cli/bin/llxprt --help >/tmp/llxprt-cli-help.txt
          head -n 5 /tmp/llxprt-cli-help.txt

      - name: 'Run interactive UI tests'
        # Keep the runner and harness in CI mode. Each tmux scenario disables
        # CI detection only for its child CLI process so Ink takes the same
        # interactive rendering path used in a developer terminal.
        env:
          CI: 'true'
          NO_COLOR: 'true'
          FORCE_COLOR: '0'
          NODE_OPTIONS: ''
          TERM: 'xterm-256color'
          TERM_PROGRAM: 'tmux'
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          LLXPRT_AUTH_TYPE: 'provider'
          LLXPRT_E2E_TMUX: '1'
          LLXPRT_TMUX_ARTIFACT_DIR: '${{ runner.temp }}/interactive-ui-artifacts'
        run: 'npm run test:interactive-ui'

      - name: 'Upload test artifacts'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'interactive-ui-artifacts'
          path: '${{ runner.temp }}/interactive-ui-artifacts'
          retention-days: 14
