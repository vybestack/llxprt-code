name: 'Windows Installed Command (issue #2603)'

on:
  pull_request:
    paths:
      - 'packages/cli/bin/**'
      - 'packages/cli/package.json'
      - 'packages/cli/scripts/install-native-launchers.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.bun-version'
      - '.npmrc'
      - 'README.md'
      - 'LICENSE'
      - 'packages/*/package.json'
      # Publishable package runtime source/index/bundle inputs — the
      # release-pack smoke copies and packs these workspaces. The semantic
      # classifier excludes test/spec/__tests__/__snapshots__ content so a
      # package test-only change allocates only the cheap relevance job.
      - 'packages/*/src/**'
      - 'packages/*/index.ts'
      - 'packages/cli/bundle/**'
      - 'scripts/preinstall.cjs'
      - 'scripts/postinstall.cjs'
      - 'scripts/bind-release-deps.ts'
      - 'scripts/prepare-package.ts'
      - 'scripts/lib/non-npm-release-packages.cjs'
      - 'scripts/lib/npm-command.cjs'
      - 'scripts/lib/tar-command.cjs'
      - 'scripts/utils/release-packages.ts'
      - 'scripts/utils/error-guards.ts'
      - 'scripts/tests/issue-2603-release-pack.cjs'
      - 'scripts/tests/issue-2603-windows-probe.ts'
      - 'scripts/tests/issue-2603-startup-benchmark.cjs'
      - 'scripts/windows-installed-command-smoke.cjs'
      - 'scripts/windows-installed-command-smoke/**'
      - 'scripts/windows-installed-command-relevance.ts'
      - '.github/workflows/windows-installed-command.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'packages/cli/bin/**'
      - 'packages/cli/package.json'
      - 'packages/cli/scripts/install-native-launchers.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.bun-version'
      - '.npmrc'
      - 'README.md'
      - 'LICENSE'
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'packages/*/index.ts'
      - 'packages/cli/bundle/**'
      - 'scripts/preinstall.cjs'
      - 'scripts/postinstall.cjs'
      - 'scripts/bind-release-deps.ts'
      - 'scripts/prepare-package.ts'
      - 'scripts/lib/non-npm-release-packages.cjs'
      - 'scripts/lib/npm-command.cjs'
      - 'scripts/lib/tar-command.cjs'
      - 'scripts/utils/release-packages.ts'
      - 'scripts/utils/error-guards.ts'
      - 'scripts/tests/issue-2603-release-pack.cjs'
      - 'scripts/tests/issue-2603-windows-probe.ts'
      - 'scripts/tests/issue-2603-startup-benchmark.cjs'
      - 'scripts/windows-installed-command-smoke.cjs'
      - 'scripts/windows-installed-command-smoke/**'
      - 'scripts/windows-installed-command-relevance.ts'
      - '.github/workflows/windows-installed-command.yml'
  workflow_dispatch:

# Cancel superseded runs of this workflow for the same ref so that repeated
# pushes to a PR do not queue redundant Windows install smokes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Ubuntu-hosted semantic relevance gate (issue #2693). GitHub path
  # filters cannot distinguish fields within a single JSON file, so root
  # package.json stays a coarse candidate in paths:. This job runs the
  # committed classifier (scripts/windows-installed-command-relevance.ts)
  # which prevents an unrelated ordinary root manifest script (e.g.
  # lint:doc-links) from allocating a windows-latest runner while preserving
  # every real release/install/package input. Fail-closed: any uncertainty
  # selects running the Windows smoke.
  windows_relevance:
    name: 'Windows installed-command relevance'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      pull-requests: 'read'
    outputs:
      windows_relevant: '${{ steps.classify.outputs.windows_relevant }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: 'Classify Windows relevance'
        id: 'classify'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: "${{ github.event.pull_request.number || '' }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha || '' }}"
        run: 'node scripts/windows-installed-command-relevance.ts --output github-actions'

  windows-installed-command:
    needs: ['windows_relevance']
    # Fail-closed gate (issue #2693): the expensive windows-latest runner
    # skips ONLY when the relevance job SUCCEEDED and produced an explicit
    # windows_relevant=false. Any other outcome — relevance-job failure,
    # missing output, invalid output, or a crash before the output was
    # written — selects RUN so a gate blip never silently skips Windows.
    # The condition references needs.windows_relevance.result so it is
    # evaluated even when the relevance job fails (overriding the implicit
    # success() default). !cancelled() keeps cancellation behaviour normal.
    if: "${{ !cancelled() && !(needs.windows_relevance.result == 'success' && needs.windows_relevance.outputs.windows_relevant == 'false') }}"
    runs-on: 'windows-latest'
    # 60 min (root cause D): the smoke does real global/local/npm-exec
    # installs plus a benchmark. 30 min was too tight when multiple installs
    # ran back-to-back. All install timeouts are env-configurable and stay
    # well under this job budget.
    timeout-minutes: 60
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      # Publish the absolute path to PowerShell 7 (pwsh.exe) so the smoke
      # resolves it robustly under a constrained PATH. windows-latest ships
      # pwsh but NOT legacy `powershell` on PATH, which previously caused
      # every PowerShell-gated step to fail with ENOENT (run 29850614559).
      - name: 'Export PowerShell 7 path'
        shell: 'pwsh'
        run: |
          "PWSH_PATH=$((Get-Command pwsh).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 'Install dependencies (npm ci)'
        run: 'npm ci'

      # The smoke runs the behavioral checks AND the startup benchmark (as a
      # child process using the already-installed launcher + platform bun), so
      # no separate benchmark step is needed. The benchmark is invoked with
      # LLXPRT_BENCH_LAUNCHER/LLXPRT_BENCH_BUN so it never repacks or
      # reinstalls — it reuses the install the smoke already proved.
      - name: 'Run Windows installed-command behavioral smoke + benchmark'
        run: 'node scripts/windows-installed-command-smoke.cjs'

      # Upload the small diagnostic JSON written on failure (root cause I).
      # Hosted runner temp vanishes post-job, so this small artifact (no
      # node_modules) is how failures are debugged offline. Kept tiny.
      - name: 'Upload diagnostic artifact on failure'
        if: ${{ failure() }}
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'llxprt-win-smoke-diagnostic'
          path: '${{ runner.temp }}/llxprt-win-smoke-diagnostic-*.json'
          if-no-files-found: 'ignore'
          retention-days: 7
