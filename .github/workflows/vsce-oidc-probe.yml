name: VSCE OIDC Probe (temporary)

# Temporary diagnostic workflow used to bootstrap Entra ID publishing for the
# VS Code Marketplace.
#
#   identity  - resolves the service principal's Team Foundation Identity ID,
#               which must be added as a member of the "vybestack" publisher.
#   verify    - confirms the identity actually has publish rights, without
#               publishing anything.
#
# DELETE THIS FILE once Marketplace publishing has been verified.

on:
  push:
    branches:
      - vsce-oidc-probe
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Azure login (OIDC, no subscription required)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # ratchet:azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve Azure DevOps identity
        run: |
          # 499b84ac-1321-427f-aa17-267ca6975798 is the well-known Azure DevOps
          # resource ID; the token must be scoped to it for the profile API.
          az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            > profile.json

          echo "===== TEAM FOUNDATION IDENTITY ID ====="
          jq -r '.id' profile.json
          echo "======================================="

      - name: Verify publish rights for the vybestack publisher
        run: |
          # verify-pat checks publish rights without publishing anything, so it
          # is safe to run before the publisher membership is confirmed.
          if npx @vscode/vsce verify-pat vybestack --azure-credential; then
            echo "PUBLISH RIGHTS CONFIRMED for publisher 'vybestack'."
          else
            echo "::error::Identity cannot publish as 'vybestack'. Add the Team Foundation Identity ID above as a Creator member of the publisher."
            exit 1
          fi
