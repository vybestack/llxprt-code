name: 'Nightly Tests'

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: 'nightly-${{ github.ref }}'
  # cancel-in-progress ensures that a superseded run (manual dispatch on the
  # same ref, or a new nightly cron trigger) does not hold runner capacity.
  # With it off those runs serialize in the group and contend for the runner
  # pool, which produced multi-hour queue-wait outliers (issue #3149).
  cancel-in-progress: true

permissions:
  checks: 'write'
  contents: 'read'
  statuses: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  # Run the canonical test shards independently so the nightly wall clock is
  # bounded by its slowest shard instead of the sum of every workspace.
  windows_ci:
    name: 'Windows CI (Nightly) [${{ matrix.shard }}]'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 'cli'
          - 'agents'
          - 'providers'
          - 'core'
          - 'rest'
          - 'scripts'
        os:
          - 'windows-latest'
        node-version:
          - '24.x'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Configure Windows Defender exclusions'
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -Force
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules" -Force
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\packages" -Force
          Add-MpPreference -ExclusionPath "$env:TEMP" -Force
        shell: 'pwsh'

      - name: 'Configure npm for Windows performance'
        run: |
          npm config set progress false
          npm config set audit false
          npm config set fund false
          npm config set loglevel error
          npm config set maxsockets 32
          npm config set registry https://registry.npmjs.org/
        shell: 'pwsh'

      - name: 'Install dependencies for testing'
        run: |-
          npm ci

      - name: 'Fix rollup platform dependency'
        run: |-
          npm install @rollup/rollup-win32-x64-msvc --no-save || true
        shell: 'bash'

      - name: 'Build project (agents and scripts shards)'
        if: matrix.shard == 'agents' || matrix.shard == 'scripts'
        run: |-
          npm run build

      - name: 'Verify test shard completeness'
        run: 'npm run lint:test-shards'

      - name: 'Run shard tests (issue #3153)'
        env:
          OPENAI_API_KEY: ${{ secrets[vars.KEY_VAR_NAME] }}
          OPENAI_API_KEY_2: ${{ secrets[vars.KEY_VAR_NAME_2] }}
          KEY_VAR_NAME: ${{ vars.KEY_VAR_NAME }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LLXPRT_DEFAULT_MODEL: ${{ vars.LLXPRT_DEFAULT_MODEL }}
          LLXPRT_DEFAULT_PROVIDER: ${{ vars.LLXPRT_DEFAULT_PROVIDER }}
          LLXPRT_AUTH_TYPE: provider
          NO_COLOR: true
          CI: true
        run: 'bun scripts/test.ts --shard "${{ matrix.shard }}"'

      - name: 'Smoke test CLI entry (launcher -> Bun, no Node in chain)'
        if: matrix.shard == 'cli'
        run: './packages/cli/bin/llxprt --version'

      - name: 'Wait for file system sync'
        run: 'sleep 2'

      - name: 'Publish Test Report (for non-forks)'
        if: |-
          ${{ always() && matrix.shard != 'scripts' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # ratchet:dorny/test-reporter@v3
        with:
          name: 'Windows Test Results [${{ matrix.shard }}] (Node ${{ matrix.node-version }})'
          path: 'packages/*/junit.xml'
          reporter: 'java-junit'
          fail-on-error: 'false'

      - name: 'Upload Test Results Artifact (for forks)'
        if: |-
          ${{ always() && matrix.shard != 'scripts' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'test-results-fork-windows-${{ matrix.shard }}-${{ matrix.node-version }}'
          path: 'packages/*/junit.xml'

  #
  # macOS CI (Nightly) — issue #2876
  #
  macos_ci:
    name: 'macOS CI (Nightly) [${{ matrix.shard }}]'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 'cli'
          - 'agents'
          - 'providers'
          - 'core'
          - 'rest'
          - 'scripts'
        os:
          - 'macos-latest'
        node-version:
          - '24.x'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install dependencies for testing'
        run: |-
          npm ci

      - name: 'Fix rollup platform dependency'
        run: |-
          if [ "$(uname -m)" == "arm64" ]; then
            npm install @rollup/rollup-darwin-arm64 --no-save || true
          else
            npm install @rollup/rollup-darwin-x64 --no-save || true
          fi
        shell: 'bash'

      - name: 'Build project (agents and scripts shards)'
        if: matrix.shard == 'agents' || matrix.shard == 'scripts'
        run: |-
          npm run build

      - name: 'Verify test shard completeness'
        run: 'npm run lint:test-shards'

      - name: 'Run shard tests (issue #3153)'
        env:
          OPENAI_API_KEY: ${{ secrets[vars.KEY_VAR_NAME] }}
          OPENAI_API_KEY_2: ${{ secrets[vars.KEY_VAR_NAME_2] }}
          KEY_VAR_NAME: ${{ vars.KEY_VAR_NAME }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LLXPRT_DEFAULT_MODEL: ${{ vars.LLXPRT_DEFAULT_MODEL }}
          LLXPRT_DEFAULT_PROVIDER: ${{ vars.LLXPRT_DEFAULT_PROVIDER }}
          LLXPRT_AUTH_TYPE: provider
          NO_COLOR: true
          CI: true
        run: 'bun scripts/test.ts --shard "${{ matrix.shard }}"'

      - name: 'Run shell-script behavioral tests (#2606)'
        if: matrix.shard == 'scripts'
        env:
          CI: true
        run: 'npm run test:shell'

      - name: 'Smoke test CLI entry (launcher -> Bun, no Node in chain)'
        if: matrix.shard == 'cli'
        run: './packages/cli/bin/llxprt --version'

      - name: 'Wait for file system sync'
        run: 'sleep 2'

      - name: 'Publish Test Report (for non-forks)'
        if: |-
          ${{ always() && matrix.shard != 'scripts' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # ratchet:dorny/test-reporter@v3
        with:
          name: 'macOS Test Results [${{ matrix.shard }}] (Node ${{ matrix.node-version }})'
          path: 'packages/*/junit.xml'
          reporter: 'java-junit'
          fail-on-error: 'false'

      - name: 'Upload Test Results Artifact (for forks)'
        if: |-
          ${{ always() && matrix.shard != 'scripts' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'test-results-fork-macos-${{ matrix.shard }}-${{ matrix.node-version }}'
          path: 'packages/*/junit.xml'

  #
  # macOS SecureStore backend (Nightly) — issue #2876
  #
  # The macOS keyring SecureStore leg moved out of PR CI (ci.yml) into this
  # nightly job. The ubuntu keyring and fallback legs remain in PR CI
  # (ci.yml secure_store_backend). This job runs the native-keyring test
  # config on macOS, which tests the macOS native keychain integration.
  macos_secure_store:
    name: 'macOS SecureStore Backend (Nightly)'
    runs-on: 'macos-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Set up Node.js 24.x'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Cache Bun dependencies'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # ratchet:actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: 'Install dependencies for SecureStore tests'
        run: |-
          bun install
          git checkout -- bun.lock

      - name: 'Run SecureStore backend tests'
        env:
          CI: true
          NO_COLOR: true
          SECURE_STORE_MODE: 'keyring'
          KEYRING_PASSWORD: 'llxprt-ci-keyring'
        run: |-
          npm run test:secure-store:keyring --workspace @vybestack/llxprt-code-storage

  e2e_full:
    name: 'E2E Full - ${{ matrix.os }} - ${{ matrix.sandbox }}'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            sandbox: 'sandbox:none'
            node-version: '24.x'
          - os: 'ubuntu-latest'
            sandbox: 'sandbox:docker'
            node-version: '24.x'
          - os: 'macos-latest'
            sandbox: 'sandbox:none'
            node-version: '24.x'
          - os: 'windows-latest'
            sandbox: 'sandbox:none'
            node-version: '24.x'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'

      - name: 'Setup Bun'
        # `npm run build` invokes bun scripts/build.ts and requires the Bun
        # runtime on PATH.
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Configure Windows Defender exclusions'
        if: runner.os == 'Windows'
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -Force
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\node_modules" -Force
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\packages" -Force
          Add-MpPreference -ExclusionPath "$env:TEMP" -Force
        shell: 'pwsh'

      - name: 'Configure npm for Windows performance'
        if: runner.os == 'Windows'
        run: |
          npm config set progress false
          npm config set audit false
          npm config set fund false
          npm config set loglevel error
          npm config set maxsockets 32
          npm config set registry https://registry.npmjs.org/
        shell: 'pwsh'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Fix rollup optional dependencies on macOS'
        if: runner.os == 'macOS'
        run: |
          npm cache clean --force

      - name: 'Set up Docker'
        if: "matrix.sandbox == 'sandbox:docker'"
        uses: 'docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c' # ratchet:docker/setup-buildx-action@v4

      - name: 'Run E2E tests'
        if: runner.os != 'Windows'
        env:
          # Provider configuration from repository secrets/variables
          OPENAI_API_KEY: '${{ secrets[vars.KEY_VAR_NAME] }}'
          OPENAI_API_KEY_2: '${{ secrets[vars.KEY_VAR_NAME_2] }}'
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
          # Set auth type to provider for API key authentication
          LLXPRT_AUTH_TYPE: 'provider'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          # Force file storage to avoid keytar/libsecret dependency in CI
          LLXPRT_FORCE_FILE_STORAGE: 'true'
        shell: 'bash'
        run: |
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker
          else
            npm run test:integration:sandbox:none
          fi

      - name: 'Run E2E tests (Windows)'
        if: runner.os == 'Windows'
        env:
          # Provider configuration from repository secrets/variables
          OPENAI_API_KEY: '${{ secrets[vars.KEY_VAR_NAME] }}'
          OPENAI_API_KEY_2: '${{ secrets[vars.KEY_VAR_NAME_2] }}'
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
          # Set auth type to provider for API key authentication
          LLXPRT_AUTH_TYPE: 'provider'
          # Force file storage to avoid keytar/libsecret dependency in CI
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          SANDBOX: '${{ matrix.sandbox }}'
          NODE_OPTIONS: '--max-old-space-size=32768 --max-semi-space-size=256'
          UV_THREADPOOL_SIZE: '32'
          NODE_ENV: 'test'
        shell: 'pwsh'
        run: |
          if ($env:SANDBOX -eq 'sandbox:docker') {
            npm run test:integration:sandbox:docker
          } else {
            npm run test:integration:sandbox:none
          }

  behavioral_evals:
    name: 'Behavioral Evals (Nightly)'
    uses: './.github/workflows/_evals-run.yml'
    permissions:
      contents: 'read'
    secrets:
      provider-api-key: ${{ secrets[vars.KEY_VAR_NAME] }}
    with:
      # The broad nightly only needs a single behavioral signal; the dedicated
      # evals-nightly.yml gathers the 3-sample statistical matrix.
      run-attempts: '[1]'

  windows_bun_native_smoke:
    name: 'Windows Bun native-modules smoke (Nightly)'
    runs-on: 'windows-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
    outputs:
      smoke_output: '${{ steps.capture_smoke.outputs.smoke_output }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Run Bun native-modules smoke'
        shell: 'bash'
        run: |
          SMOKE_OUTPUT_FILE=smoke_output.txt
          set +e
          bun scripts/bun-native-modules-smoke.ts > "${SMOKE_OUTPUT_FILE}" 2>&1
          SMOKE_EXIT=$?
          set -e
          cat "${SMOKE_OUTPUT_FILE}"
          exit "${SMOKE_EXIT}"

      - name: 'Capture smoke output'
        if: always()
        shell: 'bash'
        id: capture_smoke
        run: |
          set -euo pipefail
          SMOKE_OUTPUT_FILE=smoke_output.txt
          TRIMMED_OUTPUT_FILE=smoke_output_trimmed.txt
          # Reserve space below GitHub's 65,536-character issue-body limit for
          # the affected-job summary, run URL, and Markdown wrapper.
          MAX_OUTPUT_BYTES=60000
          HEAD_BYTES=29000
          TAIL_BYTES=29000

          if [[ ! -f "${SMOKE_OUTPUT_FILE}" ]]; then
            printf 'smoke_output=\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          BYTE_COUNT="$(wc -c < "${SMOKE_OUTPUT_FILE}" | tr -d '[:space:]')"
          if [[ "${BYTE_COUNT}" -gt "${MAX_OUTPUT_BYTES}" ]]; then
            node -e "const fs=require('fs');const b=fs.readFileSync(process.argv[1]);const hn=Number(process.argv[3]);const tn=Number(process.argv[4]);const h=b.subarray(0,hn).toString('utf8');const t=b.subarray(-tn).toString('utf8');fs.writeFileSync(process.argv[2],h+'\\n[output truncated: original output was '+b.length+' bytes; showing first '+hn+' and final '+tn+' bytes]\\n'+t)" \
              "${SMOKE_OUTPUT_FILE}" "${TRIMMED_OUTPUT_FILE}" "${HEAD_BYTES}" "${TAIL_BYTES}"
          else
            cp "${SMOKE_OUTPUT_FILE}" "${TRIMMED_OUTPUT_FILE}"
          fi

          ENCODED="$(base64 < "${TRIMMED_OUTPUT_FILE}" | tr -d '\r\n')"
          printf 'smoke_output=%s\n' "${ENCODED}" >> "${GITHUB_OUTPUT}"

  # Issue #3249: the Windows installed-command smoke + benchmark moved off
  # the per-PR critical path. Nightly calls the reusable workflow so the
  # smoke steps are defined once; it can also be dispatched manually for
  # debugging Windows-specific install failures.
  windows_installed_command:
    name: 'Windows Installed Command (Nightly)'
    uses: './.github/workflows/windows-installed-command.yml'
    permissions:
      contents: 'read'

  # Issue #2999: the published package prefers the prebuilt bundle over
  # index.ts, so a bundle that builds but cannot launch would shadow the
  # working TypeScript source and break startup for every user. The test is
  # gated off the PR path because the build costs ~16s; running it here is what
  # actually catches externals drift (a new native dependency added without an
  # EXTERNALS entry) before it reaches a release.
  cli_bundle_launch:
    name: 'CLI bundle builds and launches (Nightly)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build and launch the prebuilt CLI bundle'
        env:
          CI: true
          LLXPRT_RUN_BUNDLE_BUILD_TEST: '1'
        run: 'bun test scripts/tests/issue-2999-cli-bundle.bun.test.ts'

  notify_failure:
    name: 'Create Issue on Failure'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'windows_ci'
      - 'macos_ci'
      - 'macos_secure_store'
      - 'e2e_full'
      - 'behavioral_evals'
      - 'windows_bun_native_smoke'
      - 'windows_installed_command'
      - 'cli_bundle_launch'
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      issues: 'write'
      contents: 'read'
    steps:
      - name: 'Create Issue on Failure'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          WINDOWS_CI_RESULT: '${{ needs.windows_ci.result }}'
          MACOS_CI_RESULT: '${{ needs.macos_ci.result }}'
          MACOS_SECURE_STORE_RESULT: '${{ needs.macos_secure_store.result }}'
          E2E_FULL_RESULT: '${{ needs.e2e_full.result }}'
          BEHAVIORAL_EVALS_RESULT: '${{ needs.behavioral_evals.result }}'
          WINDOWS_BUN_NATIVE_SMOKE_RESULT: '${{ needs.windows_bun_native_smoke.result }}'
          WINDOWS_INSTALLED_COMMAND_RESULT: '${{ needs.windows_installed_command.result }}'
          CLI_BUNDLE_LAUNCH_RESULT: '${{ needs.cli_bundle_launch.result }}'
          SMOKE_OUTPUT_B64: '${{ needs.windows_bun_native_smoke.outputs.smoke_output }}'
        shell: 'bash'
        run: |
          set -euo pipefail
          ISSUE_TITLE="Nightly workflow failed"

          FAILED_JOBS=()
          [[ "${WINDOWS_CI_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("windows_ci=${WINDOWS_CI_RESULT}")
          [[ "${MACOS_CI_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("macos_ci=${MACOS_CI_RESULT}")
          [[ "${MACOS_SECURE_STORE_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("macos_secure_store=${MACOS_SECURE_STORE_RESULT}")
          [[ "${E2E_FULL_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("e2e_full=${E2E_FULL_RESULT}")
          [[ "${BEHAVIORAL_EVALS_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("behavioral_evals=${BEHAVIORAL_EVALS_RESULT}")
          [[ "${CLI_BUNDLE_LAUNCH_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("cli_bundle_launch=${CLI_BUNDLE_LAUNCH_RESULT}")

          INCLUDE_SMOKE_OUTPUT=false
          SMOKE_OUTPUT_FILE=smoke_output_decoded.txt
          : > "${SMOKE_OUTPUT_FILE}"
          if [[ "${WINDOWS_BUN_NATIVE_SMOKE_RESULT}" =~ ^(failure|cancelled)$ ]]; then
            FAILED_JOBS+=("windows_bun_native_smoke=${WINDOWS_BUN_NATIVE_SMOKE_RESULT}")
            INCLUDE_SMOKE_OUTPUT=true
          fi
          [[ "${WINDOWS_INSTALLED_COMMAND_RESULT}" =~ ^(failure|cancelled)$ ]] && FAILED_JOBS+=("windows_installed_command=${WINDOWS_INSTALLED_COMMAND_RESULT}")
          if [[ "${INCLUDE_SMOKE_OUTPUT}" == true && -n "${SMOKE_OUTPUT_B64}" ]] && \
            ! printf '%s' "${SMOKE_OUTPUT_B64}" | base64 --decode > "${SMOKE_OUTPUT_FILE}"; then
            echo "ERROR: Failed to decode Windows Bun smoke output; the transferred job output is malformed." >&2
            exit 1
          fi

          if [[ ${#FAILED_JOBS[@]} -eq 0 ]]; then
            echo "No failed or cancelled jobs detected; nothing to report."
            exit 0
          fi
          FAILED_JOBS_TEXT="${FAILED_JOBS[*]}"

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            local existing=""
            local create_err=""
            # Capture stderr in create_err while discarding stdout; redirect order matters.
            if create_err="$(gh label create "${name}" --repo "${GH_REPO}" --color "${color}" --description "${description}" 2>&1 >/dev/null)"; then
              return
            fi
            if ! existing="$(gh label list --repo "${GH_REPO}" --search "${name}" --json name --jq ".[] | select(.name == \"${name}\") | .name" 2>&1)"; then
              echo "Failed to check for label: ${name}" >&2
              echo "  create error: ${create_err}" >&2
              echo "  list error: ${existing}" >&2
              return 1
            fi
            if [[ "${existing}" != "${name}" ]]; then
              echo "Failed to create or find label: ${name}" >&2
              echo "  create error: ${create_err}" >&2
              return 1
            fi
          }

          # Resolve the milestone for the version currently being worked on in
          # main, so the auto-created nightly failure issue surfaces in the
          # release view (issue #3149). Source of truth is the root package.json
          # `version` on main — not the dispatched ref, which may have bumped
          # it. Resolved by exact title match against open milestones (not
          # nearest due date). Fails soft: an unresolvable milestone logs a
          # warning and returns empty, so the notification still goes out.
          resolve_milestone() {
            local package_json
            if ! package_json="$(gh api "repos/${GH_REPO}/contents/package.json?ref=main" -H 'Accept: application/vnd.github.raw' 2>/dev/null)"; then
              echo "Warning: could not read package.json from main; skipping milestone resolution" >&2
              return
            fi
            local current_version
            current_version="$(printf '%s' "${package_json}" | jq -r '.version // empty' 2>/dev/null)"
            if [[ -z "${current_version}" ]]; then
              echo "Warning: package.json on main has no version field; skipping milestone resolution" >&2
              return
            fi
            # gh issue --milestone accepts a milestone TITLE, not a number.
            # Resolve the title by exact match across ALL open milestone
            # pages (issue #3149), then return it for assignment.
            local milestone_title=""
            if ! milestone_title="$(gh api --paginate --slurp "repos/${GH_REPO}/milestones?state=open&per_page=100" 2>/dev/null | jq -r --arg version "${current_version}" '[.[][] | select(.title == $version)] | .[0].title // empty' 2>/dev/null)"; then
              echo "Warning: could not list open milestones; skipping milestone assignment" >&2
              return
            fi
            if [[ -z "${milestone_title}" ]]; then
              echo "Warning: no open milestone titled '${current_version}'; skipping milestone assignment" >&2
              return
            fi
            printf '%s' "${milestone_title}"
          }

          # Stamp the Bug issue type on the auto-created failure issue (issue
          # #3064) so it lands in the same triage view as hand-filed bugs.
          # `gh issue create` has no --type flag, so the type is applied over
          # REST afterwards. Accepts the issue URL that create prints, or a
          # bare number. Always returns 0: metadata must never sink the
          # notification.
          #
          # This function is duplicated verbatim across the workflows that
          # auto-create failure issues rather than sourced from a shared
          # script, because this job (like the other notifiers) has no checkout
          # step -- the same reason resolve_milestone reads package.json over
          # the API instead of from disk.
          apply_issue_type() {
            local reference="$1"
            local number="${reference##*/}"
            if [[ ! "${number}" =~ ^[0-9]+$ ]]; then
              echo "Warning: could not parse issue reference '${reference}'; skipping issue type assignment" >&2
              return 0
            fi
            if ! gh api -X PATCH "repos/${GH_REPO}/issues/${number}" -f type=Bug >/dev/null 2>&1; then
              echo "Warning: failed to set issue type Bug on issue #${number}" >&2
              return 0
            fi
          }

          LABEL_ARGS=()
          if ensure_label "ci/cd" "e33539" "Issues with github and the workflow scripts and CI CD environment."; then
            LABEL_ARGS+=(--label "ci/cd")
          else
            echo "Warning: continuing without ci/cd label" >&2
          fi

          MILESTONE_TITLE="$(resolve_milestone)"
          MILESTONE_ARGS=()
          if [[ -n "${MILESTONE_TITLE}" ]]; then
            MILESTONE_ARGS+=(--milestone "${MILESTONE_TITLE}")
          fi

          retry_gh() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if [[ "${attempt}" -lt 4 ]]; then
                echo "Attempt ${attempt} failed, retrying issue notification" >&2
                sleep 5
              fi
            done
            echo "All retries exhausted for: $*" >&2
            return 1
          }

          build_body_file() {
            local body_file="$1"
            local introduction="$2"
            {
              printf '%s\n\n' "${introduction}"
              printf 'Full run: %s\n' "${RUN_URL}"
              if [[ "${INCLUDE_SMOKE_OUTPUT}" == true ]]; then
                printf '\n<details><summary>Windows Bun native-modules smoke output</summary>\n\n```text\n'
                if [[ -s "${SMOKE_OUTPUT_FILE}" ]]; then
                  cat "${SMOKE_OUTPUT_FILE}"
                else
                  printf '(No smoke output was captured.)'
                fi
                printf '\n```\n\n</details>\n'
              fi
            } > "${body_file}"
          }

          if ! EXISTING_ISSUE="$(
            retry_gh gh issue list \
              --repo "${GH_REPO}" \
              --search "\"${ISSUE_TITLE}\" in:title is:issue state:open sort:created-desc" \
              --limit 30 \
              --json number,title \
              --jq "[.[] | select(.title == \"${ISSUE_TITLE}\") | .number] | .[0] // empty"
          )"; then
            echo "ERROR: Failed to search for existing issues; aborting to avoid duplicates." >&2
            exit 1
          fi

          BODY_FILE=issue_body.md
          if [[ -n "${EXISTING_ISSUE}" ]]; then
            INTRODUCTION="Nightly workflow failed again on $(date +'%Y-%m-%d'). Affected jobs: ${FAILED_JOBS_TEXT}."
            build_body_file "${BODY_FILE}" "${INTRODUCTION}"
            retry_gh gh issue comment "${EXISTING_ISSUE}" \
              --repo "${GH_REPO}" \
              --body-file "${BODY_FILE}" || {
              echo "ERROR: Failed to comment on existing issue #${EXISTING_ISSUE}" >&2
              exit 1
            }
            # Keep a long-lived failure issue on the current release milestone
            # and issue type too, not just on first creation (issues #3149,
            # #3064).
            if [[ -n "${MILESTONE_TITLE}" ]]; then
              retry_gh gh issue edit "${EXISTING_ISSUE}" \
                --repo "${GH_REPO}" \
                --milestone "${MILESTONE_TITLE}" || \
                echo "Warning: failed to set milestone '${MILESTONE_TITLE}' on existing issue #${EXISTING_ISSUE}" >&2
            fi
            apply_issue_type "${EXISTING_ISSUE}"
          else
            INTRODUCTION="The nightly test workflow failed. Affected jobs: ${FAILED_JOBS_TEXT}."
            build_body_file "${BODY_FILE}" "${INTRODUCTION}"
            CREATE_ARGS=(--repo "${GH_REPO}" --title "${ISSUE_TITLE}" --body-file "${BODY_FILE}")
            # Empty arrays expand to an unbound variable under `set -u` on bash
            # 3.2, so guard every expansion with the `+` alternate form.
            CREATE_ARGS+=(${LABEL_ARGS[@]+"${LABEL_ARGS[@]}"})
            CREATE_ARGS+=(${MILESTONE_ARGS[@]+"${MILESTONE_ARGS[@]}"})
            CREATED_ISSUE_FILE=created_issue.txt
            retry_gh gh issue create "${CREATE_ARGS[@]}" > "${CREATED_ISSUE_FILE}" || {
              echo "ERROR: Failed to create nightly failure issue" >&2
              exit 1
            }
            cat "${CREATED_ISSUE_FILE}"
            apply_issue_type "$(tail -n 1 "${CREATED_ISSUE_FILE}")"
          fi
