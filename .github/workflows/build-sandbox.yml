name: Build and Push Sandbox Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'

# The ref plus requested tag identify the image being produced, so only a
# genuinely superseding rebuild of the same tag is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sandbox

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # ratchet:docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: '24'
          # This job publishes a Docker image with packages:write; disable the
          # implicit package-manager cache that setup-node v6 auto-enables when
          # package.json declares packageManager, to avoid a cache-poisoning path.
          package-manager-cache: false

      - name: Setup Bun
        # npm run build below is backed by bun scripts/build.ts and requires
        # the Bun runtime to be on PATH.
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
          # Disable Bun binary caching in this packages:write job to close
          # the cache-poisoning path, mirroring package-manager-cache: false
          # on the Node setup step above.
          no-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Pack npm packages
        run: |
          bun scripts/bind-release-deps.ts --backup
          trap 'bun scripts/bind-release-deps.ts --restore' EXIT
          npm pack -w @vybestack/llxprt-code-tools --pack-destination ./packages/tools/dist
          npm pack -w @vybestack/llxprt-code-storage --pack-destination ./packages/storage/dist
          npm pack -w @vybestack/llxprt-code-auth --pack-destination ./packages/auth/dist
          npm pack -w @vybestack/llxprt-code-settings --pack-destination ./packages/settings/dist
          npm pack -w @vybestack/llxprt-code-telemetry --pack-destination ./packages/telemetry/dist
          npm pack -w @vybestack/llxprt-code-ide-integration --pack-destination ./packages/ide-integration/dist
          npm pack -w @vybestack/llxprt-code-policy --pack-destination ./packages/policy/dist
          npm pack -w @vybestack/llxprt-code-mcp --pack-destination ./packages/mcp/dist
          npm pack -w @vybestack/llxprt-code-core --pack-destination ./packages/core/dist
          npm pack -w @vybestack/llxprt-code-providers --pack-destination ./packages/providers/dist
          npm pack -w @vybestack/llxprt-code-agents --pack-destination ./packages/agents/dist
          npm pack -w @vybestack/llxprt-code --pack-destination ./packages/cli/dist
          bun scripts/bind-release-deps.ts --restore
          trap - EXIT

      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          context: .
          # Loaded locally (not pushed) so the smoke gate can validate the
          # candidate before any tag becomes pullable in the registry.
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Execute the bundled CLI inside the built image: the image's npm
      # tree layout can differ from host installs (nested vs hoisted deps),
      # so a broken module resolution only reproduces here.
      - name: Smoke test image
        env:
          # Thread through env (not inline expansion) so tag values are
          # never interpolated into the shell command.
          SANDBOX_SMOKE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(echo "$SANDBOX_SMOKE_TAGS" | head -n 1)"
          echo "Smoke testing $IMAGE"
          bun scripts/sandbox-image-probe.ts --engine docker --image "$IMAGE"

      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
