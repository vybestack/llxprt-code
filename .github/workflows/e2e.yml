name: 'Testing: E2E'

on:
  push:
    branches:
      - 'main'
  # Regular PR E2E uses a local model and does not receive provider secrets.
  pull_request:
    branches:
      - 'main'
      - 'release/**'
      - 'dev/**'
  # This supports explicit labeled reruns for internal PRs. Fork target events
  # never execute their head under the privileged target event.
  pull_request_target:
    types:
      - 'labeled'
  merge_group:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: 'string'

# Event-type isolation prevents pull_request_target from cancelling pull_request
# work and keeps merge_group out of PR-keyed groups. Label isolation prevents an
# unrelated label from cancelling valid maintainer:e2e:ok E2E work.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number ||
    github.event.inputs.branch_ref || github.ref }}-${{
    github.event.label.name }}
  cancel-in-progress: true

# An explicit top-level block is required because the mergeability-gate job
# calls the reusable ./.github/workflows/_pr-mergeability-gate.yml, which
# declares `pull-requests: read`. A called workflow cannot grant itself a
# scope the caller lacks; without `pull-requests` here the run is rejected at
# graph-construction time (startup_failure, zero jobs). `actions: read` is
# required by fkirc/skip-duplicate-actions, and `contents: read` by the
# checkouts and the doc-change filter.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  skip_check:
    name: 'Skip Duplicate Check'
    runs-on: 'ubuntu-latest'
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        # ratchet:fkirc/skip-duplicate-actions@v5.3.2
        uses: 'fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578'
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "merge_group"]'
  mergeability-gate:
    name: 'Mergeability gate'
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    uses: './.github/workflows/_pr-mergeability-gate.yml'
    with:
      check-mergeability: true
      pull-request-number: "${{ format('{0}', github.event.pull_request.number) }}"
      expected-head-sha: '${{ github.event.pull_request.head.sha }}'
  e2e_doc_change_filter:
    name: 'Detect doc-only changes for E2E'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          (github.event_name != 'pull_request_target' ||
           (github.event.action == 'labeled' &&
            github.event.label.name == 'maintainer:e2e:ok' &&
            github.event.pull_request.head.repo.full_name == github.repository)) }}
    outputs:
      docs_only: '${{ steps.detect.outputs.docs_only }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: 'Determine documentation-only PR'
        id: 'detect'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: >-
            ${{
              (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
              github.event.pull_request.number || ''
            }}
        run: |
          set -euo pipefail

          # For non-PR events (push, merge_group, workflow_dispatch), always run tests
          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "docs_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the full structured PR file list as NDJSON (one entry per line
          # across all pages, including status/previous_filename/patch so renames
          # and the .gitignore carve-out are handled) and the authoritative
          # changed_files count. || true keeps an API blip from failing this
          # job: the shared classifier then resolves to docs_only=false (run
          # full CI) rather than skipping E2E and wedging the PR.
          files_json="${RUNNER_TEMP}/pr-files.ndjson"
          : >"$files_json"
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[]' >"$files_json" || true

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.changed_files' || true)"

          # The shared classifier (scripts/docs-only-filter.ts) is the
          # authoritative docs-only policy (issue #342, reused for E2E by
          # issue #2693): runtime .md/.txt under packages/ are CODE, renames
          # require both sides to be docs, scripts/, .github/, integration-tests/
          # are CODE, and the changed_files count guards against the 3000-file
          # API ceiling. It writes docs_only to GITHUB_OUTPUT and a summary to
          # GITHUB_STEP_SUMMARY, always exiting 0.
          node scripts/docs-only-filter.ts \
            --files-json "$files_json" \
            --changed-files "$changed_files" \
            --output github-actions || true

  e2e_linux:
    name: 'E2E Test (Linux) - ${{ matrix.sandbox }}'
    needs:
      - e2e_doc_change_filter
      - skip_check
      - mergeability-gate
    timeout-minutes: 90
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name }}-${{
        github.event.pull_request.number || inputs.branch_ref || github.ref
        }}-${{ github.event.label.name }}-${{ matrix.sandbox }}
      cancel-in-progress: true
    if: |
      !cancelled() &&
      needs.skip_check.result == 'success' &&
      !(needs.e2e_doc_change_filter.result == 'success' && needs.e2e_doc_change_filter.outputs.docs_only == 'true') &&
      needs.skip_check.outputs.should_skip != 'true' &&
      (
        (
          (
            github.event_name == 'push' ||
            github.event_name == 'merge_group' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          needs.mergeability-gate.result == 'skipped'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true'
        )
      )
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        sandbox: ${{ fromJSON(github.event_name == 'push' && '["sandbox:none"]' || '["sandbox:none","sandbox:docker"]') }}
        node-version:
          - '24.x'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        if: "github.event_name != 'pull_request_target' && github.event_name != 'pull_request'"
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch_ref || github.ref }}
          persist-credentials: false

      - name: 'Checkout PR head (internal target)'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        if: "github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository"
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          repository: '${{ github.repository }}'
          persist-credentials: false

      - name: 'Checkout PR merge ref (internal)'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        if: "github.event_name == 'pull_request'"
        with:
          ref: '${{ github.ref }}'
          persist-credentials: false
          clean: false

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          check-latest: true

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts'

      - name: 'Link lockfile-installed Bun and apply dependency patches'
        run: |-
          node scripts/link-bun-runtime.ts
          node scripts/postinstall.cjs

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Set up Docker'
        if: "matrix.sandbox == 'sandbox:docker'"
        uses: 'docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c' # ratchet:docker/setup-buildx-action@v4

      - name: 'Set up local Gemma 4 E2B model'
        uses: './.github/actions/setup-local-gemma'

      - name: 'Run E2E tests'
        # Provider variables (OPENAI_*, LLXPRT_DEFAULT_*, LLXPRT_LOCAL_MODEL_E2E,
        # context and output limits) come from the setup-local-gemma action.
        env:
          GIT_CEILING_DIRECTORIES: '${{ github.workspace }}/.integration-tests'
          SANDBOX_FLAGS: "${{ matrix.sandbox == 'sandbox:docker' && '--network host' || '' }}"
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
          # Sends reasoning_effort=none so the CPU model skips its thinking
          # pass; with it on, gemma sometimes writes the tool call as text.
          LLXPRT_LOCAL_MODEL_THINKING: 'none'
        shell: 'bash'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts" \
              --exclude="**/run_shell_command.full.*.test.ts"
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          else
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts" \
              --exclude="**/run_shell_command.full.*.test.ts"
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          fi

      - name: 'Check E2E real-model budget (issue #2278)'
        if: success()
        env:
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
        shell: 'bash'
        run: |-
          bun scripts/check-e2e-model-budget.ts --ledger "$LLXPRT_E2E_MODEL_LEDGER"

      - name: 'Report local model resources'
        if: always()
        shell: 'bash'
        run: |
          if curl --fail --silent http://127.0.0.1:12644/api/ps; then
            echo
          else
            echo 'Local Ollama server is unavailable'
          fi
          free -h
          df -h "$RUNNER_TEMP"
          du -sh "$RUNNER_TEMP/ollama-models" "$RUNNER_TEMP/ollama" 2>/dev/null || true
          if [[ "${{ matrix.sandbox }}" == 'sandbox:docker' ]]; then
            docker info --format 'Docker server: {{.ServerVersion}}'
          fi

      - name: 'Upload local model diagnostics'
        if: always()
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: "local-gemma4-e2e-${{ matrix.sandbox == 'sandbox:docker' && 'docker' || 'none' }}"
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ollama-server.log
            ${{ runner.temp }}/ollama-inference.json
            ${{ runner.temp }}/e2e-model-ledger.jsonl
            ${{ github.workspace }}/.integration-tests/*/*/telemetry.log
            ${{ github.workspace }}/.integration-tests/*/*/harness-diagnostics.log
