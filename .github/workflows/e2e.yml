name: 'Testing: E2E'

on:
  push:
    branches:
      - 'main'
  # This will run for PRs from the base repository, providing secrets.
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  # This supports explicit labeled reruns for internal PRs. Fork target events
  # never reach the secret-bearing E2E jobs.
  pull_request_target:
    types:
      - 'labeled'
  merge_group:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: 'string'

# An explicit top-level block is required because the mergeability-gate job
# calls the reusable ./.github/workflows/_pr-mergeability-gate.yml, which
# declares `pull-requests: read`. A called workflow cannot grant itself a
# scope the caller lacks; without `pull-requests` here the run is rejected at
# graph-construction time (startup_failure, zero jobs). `actions: read` is
# required by fkirc/skip-duplicate-actions, and `contents: read` by the
# checkouts and the doc-change filter.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  skip_check:
    name: 'Skip Duplicate Check'
    runs-on: 'ubuntu-latest'
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        # ratchet:fkirc/skip-duplicate-actions@v5.3.1
        uses: 'fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf'
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "merge_group"]'
  mergeability-gate:
    name: 'Mergeability gate'
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    uses: './.github/workflows/_pr-mergeability-gate.yml'
    with:
      check-mergeability: true
      pull-request-number: "${{ format('{0}', github.event.pull_request.number) }}"
      expected-head-sha: '${{ github.event.pull_request.head.sha }}'
  e2e_doc_change_filter:
    name: 'Detect doc-only changes for E2E'
    runs-on: 'ubuntu-latest'
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          (github.event_name != 'pull_request_target' ||
           (github.event.action == 'labeled' &&
            github.event.label.name == 'maintainer:e2e:ok' &&
            github.event.pull_request.head.repo.full_name == github.repository)) }}
    outputs:
      docs_only: '${{ steps.detect.outputs.docs_only }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 'Determine documentation-only PR'
        id: 'detect'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: >-
            ${{
              (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
              github.event.pull_request.number || ''
            }}
        run: |
          set -euo pipefail

          # For non-PR events (push, merge_group, workflow_dispatch), always run tests
          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "docs_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' || true)"

          if [[ -z "$files" ]]; then
            echo "docs_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          gitignore_patch=''
          if grep -Fxq '.gitignore' <<<"$files"; then
            gitignore_patch="$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | select(.filename == ".gitignore") | .patch' || true)"
          fi

          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|README.md|README.*|CHANGELOG.md|CHANGELOG.*)
                ;;
              CONTRIBUTING.md|CONTRIBUTING.*|CODE_OF_CONDUCT.md|SECURITY.md)
                ;;
              *.md|*.mdx|*.rst|*.txt|*.adoc)
                ;;
              .gitignore)
                if [[ -z "$gitignore_patch" ]]; then
                  docs_only=false
                  break
                fi
                if printf '%s\n' "$gitignore_patch" \
                  | grep -E '^[+-][^+-]' \
                  | grep -Ev '^[+-](!docs/reference/|#.*docs/reference)' >/dev/null; then
                  docs_only=false
                  break
                fi
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<<"$files"

          echo "docs_only=${docs_only}" >>"$GITHUB_OUTPUT"

  e2e_linux:
    name: 'E2E Test (Linux) - ${{ matrix.sandbox }}'
    needs:
      - e2e_doc_change_filter
      - skip_check
      - mergeability-gate
    timeout-minutes: 60
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.branch_ref || github.ref }}-${{ matrix.sandbox }}
      cancel-in-progress: true
    if: |
      !cancelled() &&
      needs.skip_check.result == 'success' &&
      needs.e2e_doc_change_filter.result == 'success' &&
      needs.e2e_doc_change_filter.outputs.docs_only != 'true' &&
      needs.skip_check.outputs.should_skip != 'true' &&
      (
        (
          (
            github.event_name == 'push' ||
            github.event_name == 'merge_group' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          needs.mergeability-gate.result == 'skipped'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true'
        )
      )
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        sandbox:
          - 'sandbox:none'
          - 'sandbox:docker'
        node-version:
          - '24.x'
        exclude:
          # On push to main, only run sandbox:none (skip docker)
          - sandbox: ${{ github.event_name == 'push' && 'sandbox:docker' || 'NEVER_MATCH' }}

    steps:
      - name: 'Checkout trusted quota selector'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || github.event.inputs.branch_ref || github.ref }}

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # ratchet:actions/setup-node@v6
        with:
          node-version: '${{ matrix.node-version }}'

      - name: 'Setup Bun'
        # The trusted quota selector runs under Bun before PR code is checked
        # out, so Bun must be on PATH before that step. npm run build below is
        # also backed by bun scripts/build.ts.
        uses: 'oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Check API quota and select optimal key'
        id: 'quota'
        shell: 'bash'
        run: |
          set -euo pipefail
          quota_selectors=(scripts/ci-quota-check.*)
          if (( ${#quota_selectors[@]} != 1 )) || [[ ! -f "${quota_selectors[0]}" ]]; then
            echo 'Trusted checkout must contain exactly one quota selector' >&2
            exit 1
          fi
          bun "${quota_selectors[0]}"

          # The trusted legacy selector writes the secret to GITHUB_ENV. Remove
          # it before checking out PR code; downstream steps resolve one secret.
          if [[ -f "$GITHUB_ENV" ]]; then
            awk '!/^OPENAI_API_KEY=/' "$GITHUB_ENV" >"${GITHUB_ENV}.quota"
            mv "${GITHUB_ENV}.quota" "$GITHUB_ENV"
          fi

          if ! grep -Eq '^selected_key=(primary|secondary)$' "$GITHUB_OUTPUT"; then
            if grep -q '^selected_key=' "$GITHUB_OUTPUT"; then
              echo 'Trusted quota selector emitted an invalid selected_key' >&2
              exit 1
            fi
            if [[ "${KEY_VAR_NAME:-}" == *SYNTHETIC* ]]; then
              echo 'Trusted Synthetic quota selector did not emit selected_key' >&2
              exit 1
            fi
            echo 'selected_key=primary' >>"$GITHUB_OUTPUT"
          fi
        env:
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_API_KEY: '${{ secrets[vars.KEY_VAR_NAME] }}'
          OPENAI_API_KEY_2: '${{ secrets[vars.KEY_VAR_NAME_2] }}'

      - name: 'Checkout PR head (internal target)'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        if: "github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository"
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          repository: '${{ github.repository }}'
          persist-credentials: false

      - name: 'Checkout PR merge ref (internal)'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        if: "github.event_name == 'pull_request'"
        with:
          ref: '${{ github.ref }}'
          persist-credentials: false
          clean: false

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Set up Docker'
        if: "matrix.sandbox == 'sandbox:docker'"
        uses: 'docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435' # ratchet:docker/setup-buildx-action@v3

      - name: 'Validate E2E provider environment (Linux)'
        shell: 'bash'
        env:
          OPENAI_API_KEY: ${{ steps.quota.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY missing after quota selection"; exit 1; }
          [[ -n "${OPENAI_BASE_URL:-}" ]] || { echo "OPENAI_BASE_URL is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_PROVIDER:-}" ]] || { echo "LLXPRT_DEFAULT_PROVIDER is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_MODEL:-}" ]] || { echo "LLXPRT_DEFAULT_MODEL is required"; exit 1; }
          echo "E2E env summary: provider=${LLXPRT_DEFAULT_PROVIDER}, model=${LLXPRT_DEFAULT_MODEL}, baseurl=${OPENAI_BASE_URL}"

      - name: 'Run E2E tests'
        env:
          # Provider configuration from repository secrets/variables
          OPENAI_API_KEY: ${{ steps.quota.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
          # Set auth type to provider for API key authentication
          LLXPRT_AUTH_TYPE: 'provider'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          # Force file storage to avoid keytar/libsecret dependency in CI
          LLXPRT_FORCE_FILE_STORAGE: 'true'
        shell: 'bash'
        run: |
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts"
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          else
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts"
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          fi

  e2e_mac:
    name: 'E2E Test (macOS)'
    needs:
      - e2e_doc_change_filter
      - skip_check
      - mergeability-gate
    timeout-minutes: 60
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.branch_ref || github.ref }}-macos
      cancel-in-progress: true
    if: |
      !cancelled() &&
      needs.skip_check.result == 'success' &&
      needs.e2e_doc_change_filter.result == 'success' &&
      needs.e2e_doc_change_filter.outputs.docs_only != 'true' &&
      needs.skip_check.outputs.should_skip != 'true' &&
      (
        (
          (
            github.event_name == 'merge_group' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          needs.mergeability-gate.result == 'skipped'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true'
        )
      )
    runs-on: 'macos-latest'
    continue-on-error: true
    steps:
      - name: 'Checkout trusted quota selector'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || github.event.inputs.branch_ref || github.ref }}

      - name: 'Set up Node.js 24.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # ratchet:actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: 'Setup Bun'
        # The trusted quota selector runs under Bun before PR code is checked
        # out, so Bun must be on PATH before that step. npm run build below is
        # also backed by bun scripts/build.ts.
        uses: 'oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Check API quota and select optimal key (macOS)'
        id: 'quota_macos'
        shell: 'bash'
        run: |
          set -euo pipefail
          quota_selectors=(scripts/ci-quota-check.*)
          if (( ${#quota_selectors[@]} != 1 )) || [[ ! -f "${quota_selectors[0]}" ]]; then
            echo 'Trusted checkout must contain exactly one quota selector' >&2
            exit 1
          fi
          bun "${quota_selectors[0]}"

          # The trusted legacy selector writes the secret to GITHUB_ENV. Remove
          # it before checking out PR code; downstream steps resolve one secret.
          if [[ -f "$GITHUB_ENV" ]]; then
            awk '!/^OPENAI_API_KEY=/' "$GITHUB_ENV" >"${GITHUB_ENV}.quota"
            mv "${GITHUB_ENV}.quota" "$GITHUB_ENV"
          fi

          if ! grep -Eq '^selected_key=(primary|secondary)$' "$GITHUB_OUTPUT"; then
            if grep -q '^selected_key=' "$GITHUB_OUTPUT"; then
              echo 'Trusted quota selector emitted an invalid selected_key' >&2
              exit 1
            fi
            if [[ "${KEY_VAR_NAME:-}" == *SYNTHETIC* ]]; then
              echo 'Trusted Synthetic quota selector did not emit selected_key' >&2
              exit 1
            fi
            echo 'selected_key=primary' >>"$GITHUB_OUTPUT"
          fi
        env:
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_API_KEY: '${{ secrets[vars.KEY_VAR_NAME] }}'
          OPENAI_API_KEY_2: '${{ secrets[vars.KEY_VAR_NAME_2] }}'

      - name: 'Checkout PR head (internal target)'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        if: "github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository"
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          repository: '${{ github.repository }}'
          persist-credentials: false

      - name: 'Checkout PR merge ref (internal)'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955' # ratchet:actions/checkout@v5
        if: "github.event_name == 'pull_request'"
        with:
          ref: '${{ github.ref }}'
          persist-credentials: false
          clean: false

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Fix rollup optional dependencies on macOS'
        if: "runner.os == 'macOS'"
        run: |
          npm cache clean --force

      - name: 'Validate E2E provider environment (macOS)'
        shell: 'bash'
        env:
          OPENAI_API_KEY: ${{ steps.quota_macos.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota_macos.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY missing after quota selection"; exit 1; }
          [[ -n "${OPENAI_BASE_URL:-}" ]] || { echo "OPENAI_BASE_URL is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_PROVIDER:-}" ]] || { echo "LLXPRT_DEFAULT_PROVIDER is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_MODEL:-}" ]] || { echo "LLXPRT_DEFAULT_MODEL is required"; exit 1; }
          echo "E2E env summary: provider=${LLXPRT_DEFAULT_PROVIDER}, model=${LLXPRT_DEFAULT_MODEL}, baseurl=${OPENAI_BASE_URL}"

      - name: 'Run E2E tests (non-Windows)'
        if: "runner.os != 'Windows'"
        env:
          # Provider configuration from repository secrets/variables
          OPENAI_API_KEY: ${{ steps.quota_macos.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota_macos.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
          # Set auth type to provider for API key authentication
          LLXPRT_AUTH_TYPE: 'provider'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          # Force file storage to avoid keytar/libsecret dependency in CI
          LLXPRT_FORCE_FILE_STORAGE: 'true'
        shell: 'bash'
        run: |
          npm run test:integration:sandbox:none -- \
            --exclude="**/todo-continuation.e2e.test.ts" \
            --exclude="**/run_shell_command.test.ts"
          npm run test:integration:sandbox:none -- \
            --exclude="**/todo-continuation.e2e.test.ts" \
            integration-tests/run_shell_command.test.ts \
            --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
