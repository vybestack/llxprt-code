name: 'Testing: E2E'

on:
  push:
    branches:
      - 'main'
  # This will run for PRs from the base repository, providing secrets.
  pull_request:
    branches:
      - 'main'
      - 'release/**'
      - 'dev/**'
  # This supports explicit labeled reruns for internal PRs. Fork target events
  # never reach the secret-bearing E2E jobs.
  pull_request_target:
    types:
      - 'labeled'
  merge_group:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: 'string'
      pilot_local_model:
        description: 'Run local Qwen3.5 canaries instead of credentialed E2E'
        required: false
        default: false
        type: 'boolean'

# Event-type isolation prevents pull_request_target from cancelling pull_request
# work and keeps merge_group out of PR-keyed groups. Label isolation prevents an
# unrelated label from cancelling valid maintainer:e2e:ok E2E work.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number ||
    github.event.inputs.branch_ref || github.ref }}-${{
    github.event.label.name }}
  cancel-in-progress: true

# An explicit top-level block is required because the mergeability-gate job
# calls the reusable ./.github/workflows/_pr-mergeability-gate.yml, which
# declares `pull-requests: read`. A called workflow cannot grant itself a
# scope the caller lacks; without `pull-requests` here the run is rejected at
# graph-construction time (startup_failure, zero jobs). `actions: read` is
# required by fkirc/skip-duplicate-actions, and `contents: read` by the
# checkouts and the doc-change filter.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  skip_check:
    name: 'Skip Duplicate Check'
    runs-on: 'ubuntu-latest'
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        # ratchet:fkirc/skip-duplicate-actions@v5.3.2
        uses: 'fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578'
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "merge_group"]'
  mergeability-gate:
    name: 'Mergeability gate'
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    uses: './.github/workflows/_pr-mergeability-gate.yml'
    with:
      check-mergeability: true
      pull-request-number: "${{ format('{0}', github.event.pull_request.number) }}"
      expected-head-sha: '${{ github.event.pull_request.head.sha }}'
  e2e_doc_change_filter:
    name: 'Detect doc-only changes for E2E'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'skip_check'
    if: >-
      ${{ needs.skip_check.result == 'success' &&
          needs.skip_check.outputs.should_skip != 'true' &&
          (github.event_name != 'pull_request_target' ||
           (github.event.action == 'labeled' &&
            github.event.label.name == 'maintainer:e2e:ok' &&
            github.event.pull_request.head.repo.full_name == github.repository)) }}
    outputs:
      docs_only: '${{ steps.detect.outputs.docs_only }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: 'Determine documentation-only PR'
        id: 'detect'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_NUMBER: >-
            ${{
              (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
              github.event.pull_request.number || ''
            }}
        run: |
          set -euo pipefail

          # For non-PR events (push, merge_group, workflow_dispatch), always run tests
          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "docs_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the full structured PR file list as NDJSON (one entry per line
          # across all pages, including status/previous_filename/patch so renames
          # and the .gitignore carve-out are handled) and the authoritative
          # changed_files count. || true keeps an API blip from failing this
          # job: the shared classifier then resolves to docs_only=false (run
          # full CI) rather than skipping E2E and wedging the PR.
          files_json="${RUNNER_TEMP}/pr-files.ndjson"
          : >"$files_json"
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[]' >"$files_json" || true

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.changed_files' || true)"

          # The shared classifier (scripts/docs-only-filter.ts) is the
          # authoritative docs-only policy (issue #342, reused for E2E by
          # issue #2693): runtime .md/.txt under packages/ are CODE, renames
          # require both sides to be docs, scripts/, .github/, integration-tests/
          # are CODE, and the changed_files count guards against the 3000-file
          # API ceiling. It writes docs_only to GITHUB_OUTPUT and a summary to
          # GITHUB_STEP_SUMMARY, always exiting 0.
          node scripts/docs-only-filter.ts \
            --files-json "$files_json" \
            --changed-files "$changed_files" \
            --output github-actions || true

  e2e_linux:
    name: 'E2E Test (Linux) - ${{ matrix.sandbox }}'
    needs:
      - e2e_doc_change_filter
      - skip_check
      - mergeability-gate
    timeout-minutes: 60
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name }}-${{
        github.event.pull_request.number || inputs.branch_ref || github.ref
        }}-${{ github.event.label.name }}-${{ matrix.sandbox }}
      cancel-in-progress: true
    if: |
      !cancelled() &&
      needs.skip_check.result == 'success' &&
      !(needs.e2e_doc_change_filter.result == 'success' && needs.e2e_doc_change_filter.outputs.docs_only == 'true') &&
      needs.skip_check.outputs.should_skip != 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.pilot_local_model == true) &&
      (
        (
          (
            github.event_name == 'push' ||
            github.event_name == 'merge_group' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          needs.mergeability-gate.result == 'skipped'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'maintainer:e2e:ok' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true'
        )
      )
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        sandbox:
          - 'sandbox:none'
          - 'sandbox:docker'
        node-version:
          - '24.x'
        exclude:
          # On push to main, only run sandbox:none (skip docker)
          - sandbox: ${{ github.event_name == 'push' && 'sandbox:docker' || 'NEVER_MATCH' }}

    steps:
      - name: 'Checkout trusted quota selector'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.base.sha || github.event.inputs.branch_ref || github.ref }}

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'

      - name: 'Setup Bun'
        # The trusted quota selector runs under Bun before PR code is checked
        # out, so Bun must be on PATH before that step. npm run build below is
        # also backed by bun scripts/build.ts.
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Check API quota and select optimal key'
        id: 'quota'
        shell: 'bash'
        run: |
          set -euo pipefail
          quota_selectors=(scripts/ci-quota-check.*)
          if (( ${#quota_selectors[@]} != 1 )) || [[ ! -f "${quota_selectors[0]}" ]]; then
            echo 'Trusted checkout must contain exactly one quota selector' >&2
            exit 1
          fi
          bun "${quota_selectors[0]}"

          # The trusted legacy selector writes the secret to GITHUB_ENV. Remove
          # it before checking out PR code; downstream steps resolve one secret.
          if [[ -f "$GITHUB_ENV" ]]; then
            awk '!/^OPENAI_API_KEY=/' "$GITHUB_ENV" >"${GITHUB_ENV}.quota"
            mv "${GITHUB_ENV}.quota" "$GITHUB_ENV"
          fi

          if ! grep -Eq '^selected_key=(primary|secondary)$' "$GITHUB_OUTPUT"; then
            if grep -q '^selected_key=' "$GITHUB_OUTPUT"; then
              echo 'Trusted quota selector emitted an invalid selected_key' >&2
              exit 1
            fi
            if [[ "${KEY_VAR_NAME:-}" == *SYNTHETIC* ]]; then
              echo 'Trusted Synthetic quota selector did not emit selected_key' >&2
              exit 1
            fi
            echo 'selected_key=primary' >>"$GITHUB_OUTPUT"
          fi
        env:
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_API_KEY: '${{ secrets[vars.KEY_VAR_NAME] }}'
          OPENAI_API_KEY_2: '${{ secrets[vars.KEY_VAR_NAME_2] }}'

      - name: 'Checkout PR head (internal target)'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        if: "github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository"
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          repository: '${{ github.repository }}'
          persist-credentials: false

      - name: 'Checkout PR merge ref (internal)'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        if: "github.event_name == 'pull_request'"
        with:
          ref: '${{ github.ref }}'
          persist-credentials: false
          clean: false

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Set up Docker'
        if: "matrix.sandbox == 'sandbox:docker'"
        uses: 'docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c' # ratchet:docker/setup-buildx-action@v4

      - name: 'Validate E2E provider environment (Linux)'
        shell: 'bash'
        env:
          OPENAI_API_KEY: ${{ steps.quota.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY missing after quota selection"; exit 1; }
          [[ -n "${OPENAI_BASE_URL:-}" ]] || { echo "OPENAI_BASE_URL is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_PROVIDER:-}" ]] || { echo "LLXPRT_DEFAULT_PROVIDER is required"; exit 1; }
          [[ -n "${LLXPRT_DEFAULT_MODEL:-}" ]] || { echo "LLXPRT_DEFAULT_MODEL is required"; exit 1; }
          echo "E2E env summary: provider=${LLXPRT_DEFAULT_PROVIDER}, model=${LLXPRT_DEFAULT_MODEL}, baseurl=${OPENAI_BASE_URL}"

      - name: 'Run E2E tests'
        env:
          # Provider configuration from repository secrets/variables
          OPENAI_API_KEY: ${{ steps.quota.outputs.selected_key == 'primary' && secrets[vars.KEY_VAR_NAME] || steps.quota.outputs.selected_key == 'secondary' && secrets[vars.KEY_VAR_NAME_2] || '' }}
          KEY_VAR_NAME: '${{ vars.KEY_VAR_NAME }}'
          OPENAI_BASE_URL: '${{ vars.OPENAI_BASE_URL }}'
          LLXPRT_DEFAULT_MODEL: '${{ vars.LLXPRT_DEFAULT_MODEL }}'
          LLXPRT_DEFAULT_PROVIDER: '${{ vars.LLXPRT_DEFAULT_PROVIDER }}'
          # Set auth type to provider for API key authentication
          LLXPRT_AUTH_TYPE: 'provider'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          # Force file storage to avoid keytar/libsecret dependency in CI
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          # Record real-provider runs for budget enforcement (issue #2278)
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
        shell: 'bash'
        run: |
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts"
            npm run test:integration:sandbox:docker -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          else
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              --exclude="**/run_shell_command.test.ts"
            npm run test:integration:sandbox:none -- \
              --exclude="**/todo-continuation.e2e.test.ts" \
              integration-tests/run_shell_command.test.ts \
              --testNamePattern="should be able to run a shell command|should be able to run a shell command via stdin|should run a platform-specific file listing command"
          fi

      - name: 'Check E2E real-model budget (issue #2278)'
        if: success()
        env:
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
        shell: 'bash'
        run: |-
          bun scripts/check-e2e-model-budget.ts --ledger "$LLXPRT_E2E_MODEL_LEDGER"

  local_model_canaries:
    name: 'Local Qwen3.5 pilot - ${{ matrix.sandbox }}'
    if: github.event_name == 'workflow_dispatch' && inputs.pilot_local_model == true
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sandbox:
          - 'sandbox:none'
          - 'sandbox:docker'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # ratchet:actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Set up Docker'
        if: "matrix.sandbox == 'sandbox:docker'"
        uses: 'docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c' # ratchet:docker/setup-buildx-action@v4

      - name: 'Install Ollama CPU runtime'
        shell: 'bash'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --show-error --location --retry 3 \
            'https://ollama.com/download/ollama-linux-amd64.tar.zst?version=0.31.1' \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          printf '%s  %s\n' 'd297381efc136451f6fabb9dd644a67f70fe51c16815a0c4a95ff0e327a3afb4' "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum --check -
          tar --zstd \
            --exclude='lib/ollama/cuda_v12/*' \
            --exclude='lib/ollama/cuda_v13/*' \
            --exclude='lib/ollama/vulkan/*' \
            -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama"
          rm "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "$RUNNER_TEMP/ollama/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/ollama/bin/ollama" --version

      - name: 'Start local Qwen3.5 model'
        shell: 'bash'
        env:
          OLLAMA_HOST: '127.0.0.1:12644'
          OLLAMA_CONTEXT_LENGTH: '262144'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: '${{ runner.temp }}/ollama-models'
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >"$RUNNER_TEMP/ollama-server.log" 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent "http://$OLLAMA_HOST/api/version"; then
              break
            fi
            sleep 2
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/version" | jq -e '.version == "0.31.1"'
          ollama pull qwen3.5:2b
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" |
            jq -e '.models[] | select(.name == "qwen3.5:2b" and .digest == "324d162be6ca5629ae4517c8710434d0bd2d665bc94dbad46e9af8fbf8a2f0df")'
          df -h "$RUNNER_TEMP"

      - name: 'Run local-model canaries'
        env:
          OPENAI_API_KEY: 'ollama-local-only'
          OPENAI_BASE_URL: 'http://127.0.0.1:12644/v1'
          LLXPRT_DEFAULT_MODEL: 'qwen3.5:2b'
          LLXPRT_DEFAULT_PROVIDER: 'openai'
          LLXPRT_AUTH_TYPE: 'provider'
          GIT_CEILING_DIRECTORIES: '${{ github.workspace }}/.integration-tests'
          SANDBOX_FLAGS: "${{ matrix.sandbox == 'sandbox:docker' && '--network host' || '' }}"
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
          LLXPRT_FORCE_FILE_STORAGE: 'true'
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
        shell: 'bash'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker -- \
              integration-tests/run_shell_command.test.ts \
              integration-tests/replace.test.ts \
              --testNamePattern="should be able to run a shell command$|should be able to replace content in a file$"
          else
            npm run test:integration:sandbox:none -- \
              integration-tests/run_shell_command.test.ts \
              integration-tests/replace.test.ts \
              --testNamePattern="should be able to run a shell command$|should be able to replace content in a file$"
          fi

      - name: 'Check E2E real-model budget (issue #2278)'
        if: success()
        env:
          LLXPRT_E2E_MODEL_LEDGER: '${{ runner.temp }}/e2e-model-ledger.jsonl'
        shell: 'bash'
        run: |-
          bun scripts/check-e2e-model-budget.ts --ledger "$LLXPRT_E2E_MODEL_LEDGER"

      - name: 'Report local model resources'
        if: always()
        shell: 'bash'
        run: |
          if curl --fail --silent http://127.0.0.1:12644/api/ps; then
            echo
          else
            echo 'Local Ollama server is unavailable'
          fi
          free -h
          df -h "$RUNNER_TEMP"
          du -sh "$RUNNER_TEMP/ollama-models" "$RUNNER_TEMP/ollama" 2>/dev/null || true
          if [[ "${{ matrix.sandbox }}" == 'sandbox:docker' ]]; then
            docker info --format 'Docker server: {{.ServerVersion}}'
          fi

      - name: 'Upload local model diagnostics'
        if: always()
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # ratchet:actions/upload-artifact@v7
        with:
          name: 'local-qwen35-pilot-${{ matrix.sandbox }}'
          path: |
            ${{ runner.temp }}/ollama-server.log
            ${{ runner.temp }}/e2e-model-ledger.jsonl
