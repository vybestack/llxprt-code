name: OCR Review

# Runs OpenCodeReview (OCR) on pull requests alongside the existing review
# bot. OCR is an observational, non-required review signal while it is being
# proven out. The existing review bot (pr-review.yml) remains enabled and
# untouched.
#
# Fork-safety model: this workflow uses `pull_request_target` so repository
# secrets are available for fork PRs, but it NEVER checks out or executes
# PR-supplied code/config while secrets are in scope. The trusted base
# branch is checked out first; the PR head is fetched into an explicit local
# ref and read for diff computation only. No make/cargo/npm-repo-scripts are
# invoked. OCR rules/config are configured from variables+secret only; no
# PR-supplied OCR rules are loaded.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        (github.event.comment.body == '/ocr' ||
         startsWith(github.event.comment.body, '/ocr ') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\n') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\t') ||
         github.event.comment.body == '/open-code-review' ||
         startsWith(github.event.comment.body, '/open-code-review ') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\n') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\t') ||
         github.event.comment.body == '/review' ||
         startsWith(github.event.comment.body, '/review ') ||
         startsWith(toJSON(github.event.comment.body), '"/review\n') ||
         startsWith(toJSON(github.event.comment.body), '"/review\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/review\t'))) ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'edited' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type == 'Bot' &&
        contains(github.event.comment.body, '<!-- llxprt-code-ocr-review -->'))) &&
      format('{0}-pr-{1}', github.workflow,
        github.event.pull_request.number || github.event.issue.number || inputs.pr_number) ||
      format('{0}-run-{1}', github.workflow, github.run_id)
    }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Keep CI reviews deterministic by disabling OCR self-update checks.
  OCR_NO_UPDATE: '1'
  # Disable colorized CLI output so text parsers (e.g. the changed-test
  # scope guard) always see plain text.
  NO_COLOR: '1'
  OCR_VERSION: '1.7.16'
  OCR_CONCURRENCY: '2'

jobs:
  mergeability-gate:
    name: Mergeability gate
    uses: ./.github/workflows/_pr-mergeability-gate.yml
    # The gate caller owns the exact authorized event/comment predicate so
    # unauthorized and non-PR comments cannot enter the concurrency group.
    # workflow_dispatch bypasses mergeability checking intentionally.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '/ocr' ||
        startsWith(github.event.comment.body, '/ocr ') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\n') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\t') ||
        github.event.comment.body == '/open-code-review' ||
        startsWith(github.event.comment.body, '/open-code-review ') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\n') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\t') ||
        github.event.comment.body == '/review' ||
        startsWith(github.event.comment.body, '/review ') ||
        startsWith(toJSON(github.event.comment.body), '"/review\n') ||
        startsWith(toJSON(github.event.comment.body), '"/review\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/review\t'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'edited' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type == 'Bot' &&
       contains(github.event.comment.body, '<!-- llxprt-code-ocr-review -->'))
    with:
      check-mergeability: ${{ github.event_name != 'workflow_dispatch' }}
      pull-request-number: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
      expected-head-sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

  auto-review-gate:
    name: Auto-review limit gate
    needs:
      - mergeability-gate
    # Runs only when the mergeability gate permits work. This gate owns the
    # OCR auto-review suspension logic (issue #2666) so the shared reusable
    # gate stays a pure mergeability oracle.
    if: |
      needs.mergeability-gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      auto-should-run: ${{ steps.auto-decide.outputs.auto-should-run }}
      suspended: ${{ steps.auto-decide.outputs.suspended }}
      is-manual: ${{ steps.auto-decide.outputs.is-manual }}
      current-count: ${{ steps.auto-decide.outputs.current-count }}
    steps:
      - name: Decide auto-review limit
        id: auto-decide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # ratchet:actions/github-script@v7
        env:
          PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
          OCR_AUTO_REVIEW_LIMIT: ${{ vars.OCR_AUTO_REVIEW_LIMIT }}
          OCR_AUTO_REVIEW_LIMIT_DEFAULT: '2'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          CHANGES_FROM: ${{ github.event.changes.body.from }}
        with:
          script: |
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved for auto-review gate.');
              return;
            }
            const eventName = process.env.EVENT_NAME || '';
            const eventAction = process.env.EVENT_ACTION || '';
            const commentBody = process.env.COMMENT_BODY || '';
            const commentUserType = process.env.COMMENT_USER_TYPE || '';
            const changesFrom = process.env.CHANGES_FROM || '';
            const limitRaw = process.env.OCR_AUTO_REVIEW_LIMIT ||
              process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2';
            const parsedLimit = Number(limitRaw);
            const limit = (Number.isInteger(parsedLimit) && parsedLimit >= 0)
              ? parsedLimit
              : Number(process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2');
            const isManualTrigger =
              eventName === 'workflow_dispatch' ||
              (eventName === 'issue_comment' && eventAction === 'created');
            const isEditedComment =
              eventName === 'issue_comment' && eventAction === 'edited';

            // ----- Helpers -----

            function parseHiddenCount(body) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(body || '');
              return match ? Number(match[1]) : 0;
            }

            async function fetchMarkerComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              });
              return comments.find((c) =>
                typeof c.body === 'string' && c.body.includes(MARKER)) || null;
            }

            function replaceHiddenState(body, count) {
              let updated = body
                .replace(/<!--\s*ocr-auto-count:\s*\d+\s*-->/g, '')
                .replace(/<!--\s*ocr-suspended:\s*(?:true|false)\s*-->/g, '');
              updated += '\n<!-- ocr-auto-count:' + count + ' -->';
              return updated;
            }

            // ----- Checkbox-reset detection (issue_comment.edited) -----

            if (isEditedComment) {
              // Only act on edits to a bot-authored OCR marker comment.
              const containsMarker =
                typeof commentBody === 'string' && commentBody.includes(MARKER);
              const wasBot = commentUserType === 'Bot';
              if (!containsMarker || !wasBot) {
                core.setOutput('auto-should-run', 'false');
                core.setOutput('suspended', 'false');
                core.setOutput('is-manual', 'false');
                core.setOutput('current-count', '0');
                return;
              }
              const wasUnchecked = /-\s*\[\s\]\s*Re-enable automatic reviews/.test(changesFrom);
              const nowChecked = /-\s*\[[xX]\]\s*Re-enable automatic reviews/.test(commentBody);
              if (wasUnchecked && nowChecked) {
                // Reset the counter to 0 in the hidden state of the comment
                // and immediately allow a review on the current head.
                // If the reset write fails, do NOT proceed — otherwise the
                // stale count in the comment would cause a premature
                // suspension on the next automatic trigger.
                let resetSucceeded = false;
                try {
                  let marker = null;
                  try {
                    marker = await fetchMarkerComment();
                  } catch (fetchErr) {
                    core.warning(`Failed to fetch marker comment for checkbox reset: ${fetchErr.message || fetchErr}`);
                  }
                  if (marker) {
                    const resetBody = replaceHiddenState(marker.body, 0);
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: marker.id,
                      body: resetBody,
                    });
                    resetSucceeded = true;
                  }
                } catch (writeErr) {
                  core.warning(`Failed to write reset counter to comment: ${writeErr.message || writeErr}`);
                }
                core.setOutput('auto-should-run', String(resetSucceeded));
                core.setOutput('suspended', 'false');
                core.setOutput('is-manual', String(resetSucceeded));
                core.setOutput('current-count', '0');
                return;
              }
              core.setOutput('auto-should-run', 'false');
              core.setOutput('suspended', 'false');
              core.setOutput('is-manual', 'false');
              core.setOutput('current-count', '0');
              return;
            }

            // ----- Read current state -----

            let currentCount = 0;
            try {
              const marker = await fetchMarkerComment();
              if (marker && typeof marker.body === 'string') {
                currentCount = parseHiddenCount(marker.body);
              }
            } catch (fetchErr) {
              core.warning(`Failed to read OCR sticky comment for auto-review state: ${fetchErr.message || fetchErr}`);
            }

            // ----- Decision -----

            if (isManualTrigger) {
              core.setOutput('auto-should-run', 'true');
              core.setOutput('suspended', 'false');
              core.setOutput('is-manual', 'true');
              core.setOutput('current-count', String(currentCount));
              return;
            }

            const suspended = currentCount >= limit;
            core.setOutput('auto-should-run', suspended ? 'false' : 'true');
            core.setOutput('suspended', suspended ? 'true' : 'false');
            core.setOutput('is-manual', 'false');
            core.setOutput('current-count', String(currentCount));

  post-suspension:
    name: Post OCR suspension message
    needs:
      - mergeability-gate
      - auto-review-gate
    # Runs only when the auto-review gate determined that reviews should be
    # suspended on an automatic trigger. This posts a sticky suspension
    # message with a re-enable checkbox and /review instructions.
    if: |
      needs.mergeability-gate.outputs.should-run == 'true' &&
      needs.auto-review-gate.outputs.suspended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post OCR suspension message
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # ratchet:actions/github-script@v7
        env:
          PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
          CURRENT_COUNT: ${{ needs.auto-review-gate.outputs.current-count }}
          OCR_AUTO_REVIEW_LIMIT: ${{ vars.OCR_AUTO_REVIEW_LIMIT }}
          OCR_AUTO_REVIEW_LIMIT_DEFAULT: '2'
        with:
          script: |
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved for suspension message.');
              return;
            }
            const currentCount = Number(process.env.CURRENT_COUNT || '0');
            const limitRaw = process.env.OCR_AUTO_REVIEW_LIMIT ||
              process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2';
            const parsedLimit = Number(limitRaw);
            const limit = (Number.isInteger(parsedLimit) && parsedLimit >= 0)
              ? parsedLimit
              : Number(process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const NEWLINE = String.fromCharCode(10);
            const suspensionBlock = [
              MARKER,
              '## OpenCodeReview — automatic reviews suspended',
              '',
              'Automatic OCR reviews are **suspended** for this PR after ' + currentCount + ' of ' + limit + ' automatic reviews.',
              '',
              'To get more reviews you can:',
              '',
              '- Check the box below to re-enable automatic reviews (resets the counter), or',
              '- Comment `/review`, `/ocr`, or `/open-code-review` to request a single review on demand.',
              '',
              '- [ ] Re-enable automatic reviews',
              '',
              '<!-- ocr-auto-count:' + currentCount + ' -->',
            ].join(NEWLINE);

            async function reconcileMarkerComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              const markerComments = comments.filter((comment) =>
                comment.body && comment.body.includes(MARKER));
              const existing = markerComments[0];
              for (const duplicate of markerComments.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: duplicate.id,
                  });
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                } catch (duplicateError) {
                  core.warning(`Failed to delete duplicate OCR marker comment ${duplicate.id}: ${duplicateError.message || duplicateError}`);
                }
              }
              return existing || null;
            }

            try {
              let existing = null;
              try {
                existing = await reconcileMarkerComment();
              } catch (reconcileErr) {
                core.warning(`Reconciliation failed before suspension posting; attempting create: ${reconcileErr.message || reconcileErr}`);
              }
              // Preserve the previous review summary by appending the
              // suspension notice to the existing body (minus old markers).
              let finalBody = suspensionBlock;
              if (existing && typeof existing.body === 'string') {
                const preserved = existing.body
                  .replace(MARKER, '')
                  .replace(/<!--\s*ocr-auto-count:\s*\d+\s*-->/g, '')
                  .replace(/<!--\s*ocr-suspended:\s*(?:true|false)\s*-->/g, '')
                  .replace(/## OpenCodeReview — automatic reviews suspended[\s\S]*$/, '')
                  .trim();
                if (preserved) {
                  finalBody = suspensionBlock + NEWLINE + NEWLINE + '---' + NEWLINE + NEWLINE + preserved;
                }
              }
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: finalBody,
                });
              } else {
                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number, body: finalBody,
                  });
                } catch (createErr) {
                  const reconciled = await reconcileMarkerComment();
                  if (reconciled) {
                    await github.rest.issues.updateComment({
                      owner, repo, comment_id: reconciled.id, body: finalBody,
                    });
                  } else {
                    throw createErr;
                  }
                }
              }
            } catch (summaryError) {
              core.warning(`Failed to post OCR suspension message; continuing without failing the workflow: ${summaryError.message || summaryError}`);
            }

  code-review:
    name: OpenCodeReview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Infrastructure failures are intentionally non-blocking for PR checks, but
    # this output lets downstream jobs distinguish a completed OCR review from a
    # review that could not run because of provider, install, or script issues.
    outputs:
      infrastructure_failure: ${{ steps.ocr-classification.outputs.infrastructure_failure }}
      policy_failure: ${{ steps.ocr-classification.outputs.policy_failure }}
      # Feature 5 (issue #2670): structured comment-count outputs.
      comments_total: ${{ steps.post-ocr-results.outputs.comments_total }}
      comments_inline: ${{ steps.post-ocr-results.outputs.comments_inline }}
      comments_skipped: ${{ steps.post-ocr-results.outputs.comments_skipped }}
      comments_failed: ${{ steps.post-ocr-results.outputs.comments_failed }}
      comments_routed_summary: ${{ steps.post-ocr-results.outputs.comments_routed_summary }}
      summary_comment_url: ${{ steps.post-ocr-results.outputs.summary_comment_url }}
      completeness: ${{ steps.ocr-classification.outputs.completeness }}
    # The code-review job runs only when the mergeability gate and the
    # auto-review gate both permit it.
    needs:
      - mergeability-gate
      - auto-review-gate
    if: |
      needs.mergeability-gate.outputs.should-run == 'true' &&
      needs.auto-review-gate.outputs.auto-should-run == 'true'
    steps:
      - name: Resolve PR context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # ratchet:actions/github-script@v7
        id: pr-context
        with:
          script: |
            const number = (context.payload.pull_request && context.payload.pull_request.number)
              || (context.issue && context.issue.number)
              || Number(context.payload.inputs && context.payload.inputs.pr_number);
            if (!number) {
              core.setFailed('Could not resolve a pull request number from the event.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            // Business context for the LLM (Feature 1, issue #2670). The body
            // is truncated to keep the command-line length bounded.
            core.setOutput('pr_title', pr.title || '');
            const rawBody = typeof pr.body === 'string' ? pr.body : '';
            core.setOutput('pr_body', rawBody.slice(0, 2000));

      - name: Checkout trusted base
        # Fork-safety keystone: check out the trusted base branch (never the
        # PR head) so the working tree never reflects PR-supplied files.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v5
        with:
          ref: ${{ steps.pr-context.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head and compute merge-base
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr-context.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          { set +x; } 2>/dev/null
          cleanup_git_auth() {
            set +e
            git config --global --unset-all safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset AUTH_B64
          }
          trap cleanup_git_auth EXIT
          trap 'cleanup_git_auth; exit 130' INT TERM
          trap 'cleanup_git_auth; exit 129' HUP
          umask 077
          GH_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
          GH_SERVER_URL="${GH_SERVER_URL%/}/"
          # Scope safe.directory to this trusted workspace only (never '*').
          # Persist one entry for later steps, then also add it to the global
          # config while the fetch-step auth header is passed only to git fetch.
          git config --file "${HOME}/.gitconfig" --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Fetch the PR head into an explicit local ref WITHOUT making it the
          # working copy, so no PR-supplied scripts become executable.
          # The one-command env config makes auth explicit for this fetch even
          # when the runner's Git ignores the temp global config for HTTP auth.
          # Use basic auth with the x-access-token username, matching the
          # header format actions/checkout persists. GitHub's smart HTTP
          # endpoint rejects "bearer" for this token type, and git then
          # falls back to an interactive username prompt, which fails.
          AUTH_B64="$(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GH_SERVER_URL}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          if ! git fetch origin "pull/${PR_NUMBER}/head:pr-head"; then
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AUTH_B64
            echo "::error::Failed to fetch PR head ref."
            exit 1
          fi
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AUTH_B64
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "::error::Base SHA ${BASE_SHA} is missing after trusted checkout. It may no longer be reachable from origin."
            exit 1
          fi

          BASE_SHA="$(git merge-base "${BASE_SHA}" pr-head)"
          FETCHED_HEAD="$(git rev-parse pr-head)"
          if [ "${FETCHED_HEAD}" != "${HEAD_SHA}" ]; then
            echo "::error::PR head changed between API resolution and fetch (expected ${HEAD_SHA}, got ${FETCHED_HEAD}). Re-run to review the latest push."
            exit 1
          fi
          cleanup_git_auth
          trap - EXIT INT TERM HUP
          {
            echo "BASE_SHA=${BASE_SHA}"
            echo "HEAD_SHA=${HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Initialize OCR artifact files
        shell: bash
        run: |
          set -euo pipefail
          : > ocr-result.json
          : > ocr-stdout.raw
          : > ocr-stderr.log
          : > ocr-preflight.txt
          : > ocr-version.txt
          : > ocr-preview.txt
          : > ocr-preview-stderr.log
          : > ocr-exit-code.txt
          : > ocr-phase.txt
          : > ocr-infrastructure-failure.txt
          : > ocr-policy-failure.txt
          : > ocr-selected-files.txt
          : > ocr-status.txt
          : > ocr-reviewed-range-manifest.json
          : > ocr-manifest-hashes.json
          : > ocr-manifest-sha256.txt
          : > ocr-routing-decisions.json
          cat > ocr-workflow-helpers.sh <<'EOF'
          mark_infrastructure_failure() {
            echo "phase=$1; reason=$2" > ocr-infrastructure-failure.txt
          }
          mark_policy_failure() {
            echo "$1" > ocr-policy-failure.txt
          }
          EOF

      - name: Install OpenCodeReview
        shell: bash
        run: |
          set -euo pipefail
          echo "install" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=install; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          OCR_PREFIX="${RUNNER_TEMP}/ocr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! npm install --prefix "$OCR_PREFIX" --ignore-scripts "@alibaba-group/open-code-review@${OCR_VERSION}" 2>> ocr-stderr.log; then
            echo "::warning::OpenCodeReview installation failed."
            echo "70" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview installation failed"
            exit 0
          fi
          OCR_BIN="${OCR_PREFIX}/node_modules/.bin"
          echo "$OCR_BIN" >> "$GITHUB_PATH"
          export PATH="${OCR_BIN}:${PATH}"
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command was not found after install."
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview command was not found after install"
            exit 0
          fi
          if ! ocr version > ocr-version.txt 2>> ocr-stderr.log; then
            echo "::warning::OpenCodeReview version check failed."
            echo "70" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview version check failed"
            exit 0
          fi
          cat ocr-version.txt

      - name: Configure OCR review rules
        shell: bash
        # Project policy: changed test files must be reviewed. OCR's default
        # rules exclude test/spec files, so re-include them here. This config
        # is written from this trusted workflow only (env-provided JSON); no
        # PR-supplied OCR rules are ever loaded.
        #
        # Include patterns cover this TypeScript monorepo's test layout:
        # *.test.ts(x), *.spec.ts(x), *.test.js(x), *.spec.js(x),
        # *.test.mjs/cjs, *.spec.mjs/cjs, __tests__/**, tests/**, test/**.
        env:
          OCR_RULES_JSON: |
            {
              "include": [
                "**/*.test.{js,jsx,mjs,cjs,ts,tsx}",
                "**/*.spec.{js,jsx,mjs,cjs,ts,tsx}",
                "**/__tests__/**",
                "**/tests/**",
                "**/test/**"
              ],
              "exclude": [
                "**/node_modules/**",
                "**/dist/**",
                "**/build/**",
                "**/*.min.js",
                "**/generated/**",
                "**/vendor/**"
              ]
            }
        run: |
          mkdir -p "${HOME}/.opencodereview"
          printf '%s' "$OCR_RULES_JSON" > "${HOME}/.opencodereview/rule.json"

      - name: Configure OCR LLM settings
        shell: bash
        # Feature 2 & 7 (issue #2670): disable LLM "thinking" by default via
        # llm.extra_body, and set the review language. Both are overridable
        # through repository variables. Fork-safe: only trusted `ocr config
        # set` commands run here; no PR-supplied config is loaded.
        env:
          OCR_LLM_EXTRA_BODY: ${{ vars.OCR_LLM_EXTRA_BODY }}
          OCR_REVIEW_LANGUAGE: ${{ vars.OCR_REVIEW_LANGUAGE }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR LLM settings configuration because an earlier OCR setup failure was recorded."
            exit 0
          fi
          echo "config" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=config; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before LLM settings configuration."
            echo "OpenCodeReview command is unavailable before LLM settings configuration." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OpenCodeReview command is unavailable before LLM settings configuration"
            exit 0
          fi
          mkdir -p "${HOME}/.opencodereview"
          # Feature 2: disable thinking by default; allow override via the
          # OCR_LLM_EXTRA_BODY repository variable.
          EXTRA_BODY="${OCR_LLM_EXTRA_BODY:-}"
          if [ -z "$EXTRA_BODY" ]; then
            EXTRA_BODY='{"thinking": {"type": "disabled"}}'
          fi
          if ! ocr config set llm.extra_body "$EXTRA_BODY" >> ocr-stderr.log 2>&1; then
            echo "::warning::Failed to set OCR llm.extra_body."
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OCR llm.extra_body configuration failed"
            exit 0
          fi
          # Feature 7: set review language, defaulting to English.
          LANGUAGE="${OCR_REVIEW_LANGUAGE:-}"
          if [ -z "$LANGUAGE" ]; then
            LANGUAGE="English"
          fi
          if ! ocr config set language "$LANGUAGE" >> ocr-stderr.log 2>&1; then
            echo "::warning::Failed to set OCR review language."
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OCR review language configuration failed"
            exit 0
          fi

      - name: Validate OCR configuration
        shell: bash
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR configuration validation because an earlier OCR setup failure was recorded."
            exit 0
          fi
          echo "validate" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=validate; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          missing=0
          if [ -z "${OCR_LLM_URL:-}" ]; then
            echo "::warning::Required variable OCR_LLM_URL is not set"
            echo "Required variable OCR_LLM_URL is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ -z "${OCR_LLM_TOKEN:-}" ]; then
            echo "::warning::Required secret OCR_LLM_AUTH_TOKEN is not set"
            echo "Required secret OCR_LLM_AUTH_TOKEN is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ -z "${OCR_LLM_MODEL:-}" ]; then
            echo "::warning::Required variable OCR_LLM_MODEL is not set"
            echo "Required variable OCR_LLM_MODEL is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "78" > ocr-exit-code.txt
            mark_infrastructure_failure "validate" "OCR configuration is missing required variables or secrets"
            exit 0
          fi

      - name: Validate OCR LLM connectivity
        shell: bash
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR LLM connectivity check because an earlier OCR setup/configuration failure was recorded."
            exit 0
          fi
          echo "llm-preflight" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=llm-preflight; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before LLM connectivity check."
            echo "OpenCodeReview command is unavailable before LLM connectivity check." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "llm-preflight" "OpenCodeReview command is unavailable before LLM connectivity check"
            exit 0
          fi
          {
            echo "model=${OCR_LLM_MODEL:-unknown}"
            echo "provider-url=${OCR_LLM_URL:+configured}"
          } > ocr-preflight.txt
          set +e
          timeout 120s ocr llm test >> ocr-preflight.txt 2>&1
          preflight_status=$?
          set -e
          cat ocr-preflight.txt >> ocr-stderr.log
          if [ "$preflight_status" -ne 0 ]; then
            if [ "$preflight_status" -eq 124 ]; then
              echo "::warning::OCR LLM connectivity check timed out after 120s for model ${OCR_LLM_MODEL:-unknown}. Verify provider availability and network latency."
              mark_infrastructure_failure "llm-preflight" "OCR LLM connectivity check timed out (model=${OCR_LLM_MODEL:-unknown})"
            else
              echo "::warning::OCR LLM connectivity check failed for model ${OCR_LLM_MODEL:-unknown}. Verify OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, OCR_LLM_MODEL, and provider availability."
              mark_infrastructure_failure "llm-preflight" "OCR LLM connectivity check failed (model=${OCR_LLM_MODEL:-unknown})"
            fi
            echo "$preflight_status" > ocr-exit-code.txt
            exit 0
          fi

      - name: Verify review scope includes changed tests
        shell: bash
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR preview because an earlier OCR setup/configuration failure was recorded."
            exit 0
          fi
          echo "preview" > ocr-phase.txt
          : > ocr-preview.txt
          : > ocr-preview-stderr.log
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=preview; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          changed_tests="$(
            git diff --name-only --diff-filter=d "${BASE_SHA}..${HEAD_SHA}" \
              | grep -Ei '(^|/)(__tests__|tests?)/.*\.(ts|tsx|js|jsx|mjs|cjs)$|\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$' \
              || true
          )"
          if [ -n "$changed_tests" ]; then
            echo "Changed test/spec files detected that must be reviewed:"
            echo "$changed_tests"
            if ! command -v ocr >/dev/null 2>&1; then
              echo "::warning::OpenCodeReview command is unavailable before preview."
              echo "OpenCodeReview command is unavailable before preview." >> ocr-preview-stderr.log
              echo "127" > ocr-exit-code.txt
              mark_infrastructure_failure "preview" "OpenCodeReview command is unavailable before preview"
              exit 0
            fi
            set +e
            ocr review --preview --from "$BASE_SHA" --to "$HEAD_SHA" \
              > ocr-preview.txt 2> ocr-preview-stderr.log
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::warning::Could not verify OCR preview scope for changed test files."
              echo "$status" > ocr-exit-code.txt
              mark_infrastructure_failure "preview" "OCR preview command failed"
              exit 0
            fi
            if ! sed -i 's/\x1b\[[0-9;?<>=]*[A-Za-z]//g; s/\x1b\][^\x07\x1b]*\(\x07\|\x1b\\\)//g' ocr-preview.txt; then
              echo "::warning::Could not normalize OCR preview output."
              echo "1" > ocr-exit-code.txt
              mark_infrastructure_failure "preview" "OCR preview normalization failed"
              exit 0
            fi
            reviewed="$(awk '
              BEGIN { IGNORECASE = 1; in_section = 0 }
              /^Will review[[:space:]]*\(/ { in_section = 1; next }
              /^[[:alpha:] ]+[[:space:]]*\([0-9]+\):/ { in_section = 0 }
              in_section { print }
            ' ocr-preview.txt || true)"
            # Issue #2575: persist the selected (Will review) file list for
            # the reviewed-range manifest. Extract one path per line,
            # stripping bullet markers, checkboxes, and surrounding quotes.
            printf '%s\n' "$reviewed" | sed -e 's/^[[:space:]]*//' \
              -e 's/^[-*][[:space:]]*//' \
              -e 's/^\[[^]]*\][[:space:]]*//' \
              -e 's/^"\(.*\)"$/\1/' \
              -e "s/^'\(.*\)'$/\1/" \
              | grep -v '^[[:space:]]*$' > ocr-selected-files.txt || true
            excluded="$(awk '
              BEGIN { IGNORECASE = 1; in_section = 0 }
              /^Excluded[[:space:]]*\(/ { in_section = 1; next }
              /^[[:alpha:] ]+[[:space:]]*\([0-9]+\):/ { if (in_section) in_section = 0 }
              in_section { print }
            ' ocr-preview.txt || true)"
            missing=""
            excluded_tests=""
            path_in_section() {
              awk -v target="$1" '
                {
                  line = $0
                  sub(/^[[:space:]]*/, "", line)
                  sub(/^[-*][[:space:]]*/, "", line)
                  sub(/^\[[^]]+\][[:space:]]*/, "", line)
                  sub(/^[[:space:]]*/, "", line)
                  split(line, fields, /[[:space:]]+/)
                  candidate = fields[1]
                  quote = sprintf("%c", 39)
                  if ((substr(candidate, 1, 1) == "\"" && substr(candidate, length(candidate), 1) == "\"") ||
                      (substr(candidate, 1, 1) == quote && substr(candidate, length(candidate), 1) == quote)) {
                    candidate = substr(candidate, 2, length(candidate) - 2)
                  }
                  if (candidate == target) found = 1
                }
                END { exit found ? 0 : 1 }
              '
            }
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              if ! echo "$reviewed" | path_in_section "$t"; then
                missing="${missing}${t}"$'\n'
              fi
              if echo "$excluded" | path_in_section "$t"; then
                excluded_tests="${excluded_tests}${t}"$'\n'
              fi
            done <<< "$changed_tests"
            if [ -n "$missing" ]; then
              echo "::error::OCR preview did not list changed test files in the reviewed set:"
              echo "$missing"
              echo "changed-test-missing" > ocr-phase.txt
              echo "1" > ocr-exit-code.txt
              mark_policy_failure "changed test files were missing from OCR reviewed set"
              exit 1
            fi
            if [ -n "$excluded_tests" ]; then
              echo "::error::OCR would exclude changed test files that must be reviewed:"
              echo "$excluded_tests"
              echo "changed-test-excluded" > ocr-phase.txt
              echo "1" > ocr-exit-code.txt
              mark_policy_failure "changed test files were excluded from OCR reviewed set"
              exit 1
            fi
          fi

      - name: Run OpenCodeReview
        shell: bash
        # Full merge-base..head diff. Parse failures are handled distinctly
        # in the posting step (OCR failed vs. no findings).
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Feature 1 (issue #2670): business context for the LLM.
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
          PR_BODY: ${{ steps.pr-context.outputs.pr_body }}
          OCR_BACKGROUND: ${{ vars.OCR_BACKGROUND }}
          # Feature 4 (issue #2670): configurable LLM review timeout.
          OCR_REVIEW_TIMEOUT: ${{ vars.OCR_REVIEW_TIMEOUT }}
        run: |
          set +e
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR review because an earlier OCR setup/configuration/preview failure was recorded."
            exit 0
          fi
          echo "review" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=review; reason=OCR workflow helper script could not be loaded" > ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before review."
            echo "OpenCodeReview command is unavailable before review." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "review" "OpenCodeReview command is unavailable before review"
            exit 0
          fi
          REVIEW_TIMEOUT="${OCR_REVIEW_TIMEOUT:-30}"
          case "$REVIEW_TIMEOUT" in
              ''|*[!0-9]*|0)
              echo "::warning::OCR_REVIEW_TIMEOUT is not a positive integer; falling back to 30."
              REVIEW_TIMEOUT=30
              ;;
          esac
          # Feature 1 (issue #2670): conditionally append business context
          # for the LLM. Gated behind OCR_BACKGROUND so existing behavior is
          # unchanged unless the repository variable opts in.
          REVIEW_ARGS=()
          if [ "${OCR_BACKGROUND:-}" = 'true' ]; then
            BACKGROUND_TEXT=$(printf '---BEGIN BUSINESS CONTEXT---\nPR %s: %s\n\n%s\n---END BUSINESS CONTEXT---' "${PR_NUMBER}" "${PR_TITLE}" "${PR_BODY}")
            if [ -n "${PR_TITLE}" ] || [ -n "${PR_BODY}" ]; then
              REVIEW_ARGS+=(--background "$BACKGROUND_TEXT")
            fi
          fi
          ocr review \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --format json \
            --audience agent \
            --timeout "$REVIEW_TIMEOUT" \
            --concurrency "$OCR_CONCURRENCY" \
            "${REVIEW_ARGS[@]}" \
            > ocr-stdout.raw 2> ocr-stderr.log
          status=$?
          if ! cp ocr-stdout.raw ocr-result.json; then
            : > ocr-result.json
          fi
          # Issue #2575: capture the upstream OCR JSON status field (e.g.
          # "success" vs "completed_with_errors") so the manifest can
          # classify partial coverage correctly.
          ocr_status=""
          if [ -s ocr-result.json ]; then
            ocr_status="$(node -e '
              try {
                const data = JSON.parse(require("fs").readFileSync("ocr-result.json", "utf8"));
                if (data && typeof data === "object" && typeof data.status === "string") {
                  process.stdout.write(data.status);
                }
              } catch (_) { /* best-effort; empty status means unknown */ }
            ' 2>/dev/null || true)"
          fi
          printf '%s' "$ocr_status" > ocr-status.txt
          echo "$status" > ocr-exit-code.txt
          if [ "$status" -ne 0 ]; then
            if grep -Eqi "429|rate limit" ocr-stderr.log; then
              mark_infrastructure_failure "review" "OCR review failed: HTTP 429 rate limit"
            elif grep -Eqi "529|overloaded" ocr-stderr.log; then
              mark_infrastructure_failure "review" "OCR review failed: HTTP 529 provider overloaded"
            elif grep -Eqi "401|403|auth|unauthorized|forbidden|invalid api key|invalid_api_key|api key" ocr-stderr.log; then
              mark_infrastructure_failure "review" "OCR review failed: authentication or configuration error"
            elif grep -Eqi "timeout|timed out" ocr-stderr.log; then
              mark_infrastructure_failure "review" "OCR review failed: timeout"
            elif grep -Eqi "all [0-9]+ file review(\(s\)|s)? failed" ocr-stderr.log; then
              mark_infrastructure_failure "review" "all OCR per-file reviews failed; likely LLM provider/config/auth failure"
            else
              mark_infrastructure_failure "review" "OCR review command failed"
            fi
          fi
          exit 0

      - name: Post OCR results
        id: post-ocr-results
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # ratchet:actions/github-script@v7
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          # Whether this run is an automatic (pull_request_target) trigger.
          # Automatic runs increment the auto-review counter; manual runs do not.
          IS_AUTOMATIC: ${{ needs.auto-review-gate.outputs.is-manual == 'false' }}
          # Exact OCR endpoint/credential values are provided only for redaction;
          # do not log process.env from this step.
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          # Feature 3 (issue #2670): incremental IoU overlap dedup mode.
          OCR_INCREMENTAL: ${{ vars.OCR_INCREMENTAL }}
          OCR_INCREMENTAL_OVERLAP_THRESHOLD: ${{ vars.OCR_INCREMENTAL_OVERLAP_THRESHOLD }}
          # Issue #2672: severity-based publication routing.
          # Shadow mode (default 'true') posts all findings inline but logs
          # routing decisions. Set to 'false' to go live (route low-severity
          # findings to the sticky summary).
          OCR_ROUTING_SHADOW_MODE: ${{ vars.OCR_ROUTING_SHADOW_MODE }}
          # Fallback bot login for dedup when getAuthenticated() fails.
          OCR_BOT_LOGIN: ${{ vars.OCR_BOT_LOGIN }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const INLINE_MARKER = '<!-- llxprt-code-ocr-inline -->';
            const INFRA_FAILURE_FILE = 'ocr-infrastructure-failure.txt';
            const POLICY_FAILURE_FILE = 'ocr-policy-failure.txt';
            const REDACTION = '[REDACTED]';
            const KNOWN_CATEGORIES = new Set(['bug', 'maintainability', 'test', 'security', 'style']);
            const KNOWN_SEVERITIES = new Set(['high', 'medium', 'low']);
            const ocrTokenForRedaction = process.env.OCR_LLM_TOKEN;
            const ocrUrlForRedaction = process.env.OCR_LLM_URL;
            delete process.env.OCR_LLM_TOKEN;
            delete process.env.OCR_LLM_URL;
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved from pr-context step.');
              return;
            }
            const headSha = process.env.HEAD_SHA;
            if (!headSha) {
              core.setFailed('No valid HEAD_SHA resolved from environment.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Issue 1 (#2670): resolve the authenticated bot login ONCE so
            // historical review-comment dedup can be scoped to this bot.
            // Without this, a fork contributor could post an inline review
            // comment containing the INLINE_MARKER and suppress real findings.
            let botLogin = '';
            try {
              const { data: botUser } = await github.rest.users.getAuthenticated();
              botLogin = botUser.login || '';
            } catch (e) {
              core.warning(`Could not resolve authenticated bot login: ${e.message || e}`);
              // Fall back to a configurable bot login so dedup remains
              // functional when the authenticated-user API is unavailable.
              botLogin = process.env.OCR_BOT_LOGIN || '';
              if (botLogin) {
                core.info(`Using fallback bot login from OCR_BOT_LOGIN: ${botLogin}`);
              }
            }

            function readTrimmed(fileName, fallback = '') {
              try {
                return fs.readFileSync(fileName, 'utf8').trim();
              } catch (_) {
                return fallback;
              }
            }

            function escapeRegExp(value) {
              return String(value).replace(/[\\^$.*+?()[\]{}|]/g, '\\$&');
            }

            function redactSecretDiagnostics(value) {
              let sanitized = String(value ?? '');
              const exactSecrets = [ocrTokenForRedaction, ocrUrlForRedaction]
                .filter((secret) => typeof secret === 'string' && secret.length > 0);
              for (const secret of exactSecrets) {
                try {
                  sanitized = sanitized.replace(new RegExp(escapeRegExp(secret), 'g'), REDACTION);
                } catch (_) {
                  sanitized = sanitized.split(secret).join(REDACTION);
                }
              }
              sanitized = sanitized
                .replace(/\b(Authorization\s*:\s*(?:(?:Bearer|Basic|token|ApiKey)\s+)?)([^\s,;]+)/gi, '$1[REDACTED]')
                .replace(/\b(x-api-key\s*:\s*)([^\s,;]+)/gi, '$1[REDACTED]')
                .replace(/\b(api[_-]?key\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/([?&](?:key|api[_-]?key|token)=)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(access[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(refresh[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(id[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(token\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, '$1[REDACTED]')
                .replace(/\b(secret\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, '$1[REDACTED]');
              return sanitized;
            }

            function sanitizeExcerpt(value) {
              return redactSecretDiagnostics(value)
                .split('\n')
                .slice(0, 40)
                .join('\n') || '(empty)';
            }

            let ocrVersion = readTrimmed('ocr-version.txt', 'unknown');
            if (!ocrVersion) {
              ocrVersion = 'unknown';
            }
            const phase = readTrimmed('ocr-phase.txt', 'unknown') || 'unknown';
            let diagnosticPhase = phase;

            function markInfrastructureFailure(markerPhase, reason) {
              const message = redactSecretDiagnostics(`phase=${markerPhase}; reason=${reason}`);
              fs.writeFileSync(INFRA_FAILURE_FILE, `${message}\n`);
              diagnosticPhase = markerPhase;
              fs.writeFileSync('ocr-phase.txt', `${markerPhase}\n`);
              core.warning(`OCR infrastructure diagnostic recorded: ${message}`);
            }

            function stderrSection(title, fileName) {
              const excerpt = sanitizeExcerpt(readTrimmed(fileName, ''));
              return [
                `### ${title}`,
                '',
                '```text',
                excerpt.slice(0, 4000),
                '```',
              ];
            }

            function readExitCode(fileName) {
              const raw = readTrimmed(fileName, '');
              if (!raw) {
                return 1;
              }
              const parsed = Number(raw);
              return Number.isInteger(parsed) ? parsed : 1;
            }

            let ran = true;
            let findings = [];
            let ocrResultEnvelope = null;
            const policyFailure = readTrimmed(POLICY_FAILURE_FILE, '');
            const exitCode = readExitCode('ocr-exit-code.txt');
            if (exitCode !== 0) {
              ran = false;
            }
            function findingsFromParsed(parsed) {
              if (Array.isArray(parsed)) return parsed;
              // ocr --format json emits an object envelope with a comments
              // array (e.g. { "status": "success", "comments": [...] }).
              if (parsed && typeof parsed === 'object' && Array.isArray(parsed.comments)) {
                return parsed.comments;
              }
              return null;
            }

            function parseFindings(raw) {
              const trimmed = raw.trim();
              if (!trimmed) {
                markInfrastructureFailure('parse', 'OCR output was empty or unusable');
                return null;
              }
              try {
                const parsed = findingsFromParsed(JSON.parse(trimmed));
                if (!parsed) {
                  markInfrastructureFailure('parse', 'OCR output did not contain a supported findings array');
                }
                return parsed;
              } catch (parseErr) {
                const start = trimmed.indexOf('[');
                const end = trimmed.lastIndexOf(']');
                if (start < 0 || end <= start) {
                  markInfrastructureFailure('parse', `OCR output could not be parsed: ${parseErr.message || parseErr}`);
                  core.warning(redactSecretDiagnostics(`OCR result was not valid JSON and no JSON array could be extracted: ${parseErr.message || parseErr}`));
                  return null;
                }
                try {
                  const parsed = findingsFromParsed(JSON.parse(trimmed.slice(start, end + 1)));
                  if (!parsed) {
                    markInfrastructureFailure('parse', 'OCR output did not contain a supported findings array');
                  }
                  return parsed;
                } catch (innerErr) {
                  markInfrastructureFailure('parse', `OCR output could not be parsed: ${innerErr.message || innerErr}`);
                  core.warning(redactSecretDiagnostics(`OCR result was not valid JSON and extracted array substring could not be parsed: ${innerErr.message || innerErr}`));
                  return null;
                }
              }
            }

            function validateFindingMetadata(finding) {
              // Non-object findings (e.g. a bare string) cannot carry metadata;
              // pass them through untouched so downstream rendering handles
              // them. Arrays report typeof 'object', so guard explicitly to
              // avoid silently spreading an array into a plain object.
              if (!finding || typeof finding !== 'object' || Array.isArray(finding)) {
                return finding;
              }
              const warnings = [];
              const normalized = { ...finding };

              const rawCategory = finding.category;
              if (!('originalCategory' in finding)) {
                normalized.originalCategory = rawCategory;
              }
              if (typeof rawCategory !== 'string' || !KNOWN_CATEGORIES.has(rawCategory)) {
                if (rawCategory !== undefined) {
                  warnings.push(`undocumented category '${redactSecretDiagnostics(String(rawCategory))}'`);
                }
                normalized.category = 'unknown';
              } else {
                normalized.category = rawCategory;
              }

              const rawSeverity = finding.severity;
              if (!('originalSeverity' in finding)) {
                normalized.originalSeverity = rawSeverity;
              }
              if (typeof rawSeverity !== 'string' || !KNOWN_SEVERITIES.has(rawSeverity)) {
                if (rawSeverity !== undefined) {
                  warnings.push(`undocumented severity '${redactSecretDiagnostics(String(rawSeverity))}'`);
                }
                normalized.severity = 'unknown';
              } else {
                normalized.severity = rawSeverity;
              }

              if (warnings.length > 0) {
                // Diagnostic emission is best-effort: a redaction or I/O
                // failure must never abort validation and suppress findings.
                try {
                  const location = finding.path
                    ? ` in ${finding.path}${Number.isInteger(finding.start_line) && finding.start_line > 0 ? `:${finding.start_line}` : ''}`
                    : '';
                  // Compose the full message before redacting so the path and
                  // any credential-like substrings spanning fields are sanitized.
                  const driftMessage = redactSecretDiagnostics(
                    `OCR schema drift${location}: ${warnings.join(', ')}.`,
                  );
                  core.warning(driftMessage);
                  // Mirror to stderr so schema drift is visible in the raw
                  // step log stream (ocr-stderr.log captures the OCR CLI
                  // process only; workflow warnings land in the step log).
                  process.stderr.write(driftMessage + String.fromCharCode(10));
                } catch (diagnosticErr) {
                  // The diagnostic channel itself may have failed, so avoid
                  // re-invoking it. Emit a minimal marker to stderr instead;
                  // if even that fails, swallow — findings must still flow.
                  try {
                    const NEWLINE = String.fromCharCode(10);
                    process.stderr.write('OCR schema-drift diagnostic emission failed.' + NEWLINE);
                  } catch (_) { /* best-effort; never suppress findings */ }
                }
              }

              return normalized;
            }

            function effectiveCategory(finding) {
              if (!finding || typeof finding !== 'object') return 'unknown';
              if (typeof finding.category === 'string' && finding.category && finding.category !== 'unknown') {
                return finding.category;
              }
              if (typeof finding.originalCategory === 'string' && finding.originalCategory && finding.originalCategory !== 'unknown') {
                return finding.originalCategory;
              }
              return 'unknown';
            }

            function effectiveSeverity(finding) {
              if (!finding || typeof finding !== 'object') return 'unknown';
              if (typeof finding.severity === 'string' && finding.severity && finding.severity !== 'unknown') {
                return finding.severity;
              }
              if (typeof finding.originalSeverity === 'string' && finding.originalSeverity && finding.originalSeverity !== 'unknown') {
                return finding.originalSeverity;
              }
              return 'unknown';
            }

            function routeFinding(finding) {
              if (!finding || typeof finding !== 'object' || Array.isArray(finding)) {
                return { destination: 'inline', reason: 'non-object finding: fail-safe inline' };
              }
              const category = effectiveCategory(finding);
              const severity = effectiveSeverity(finding);

              // Protected categories are always inline regardless of severity.
              if (category === 'bug' || category === 'security' || category === 'correctness') {
                return { destination: 'inline', reason: `category '${category}': always inline` };
              }

              // High/medium severity is always inline regardless of category.
              if (severity === 'high' || severity === 'medium') {
                return { destination: 'inline', reason: `severity '${severity}': inline` };
              }

              // Unknown category defaults to inline (fail-safe).
              const isKnownCategory = category === 'maintainability' || category === 'test' || category === 'style';
              if (!isKnownCategory && category !== 'other') {
                return { destination: 'inline', reason: `category '${category}': fail-safe inline` };
              }

              // Info severity is routed to summary.
              if (severity === 'info') {
                return { destination: 'summary', reason: `severity 'info': routed to summary` };
              }

              // Known or 'other' category with low severity → summary.
              if (severity === 'low') {
                return { destination: 'summary', reason: `category '${category}' severity 'low': routed to summary` };
              }

              // Remaining unknown severities default to inline (fail-safe).
              return { destination: 'inline', reason: `category '${category}' severity '${severity}': fail-safe inline` };
            }

            function categorySeverityLabel(finding) {
              if (!finding || typeof finding !== 'object') {
                return '';
              }
              const category = effectiveCategory(finding);
              const severity = effectiveSeverity(finding);
              return `**[${category}/${severity}]** `;
            }

            function escapeMarkdownHtml(value) {
              return value
                .replace(new RegExp('&', 'g'), '&amp;')
                .replace(new RegExp('<', 'g'), '&lt;')
                .replace(new RegExp('>', 'g'), '&gt;');
            }

            function renderFindingText(value) {
              const sanitized = redactSecretDiagnostics(typeof value === 'string' && value ? value : 'OCR finding');
              const text = escapeMarkdownHtml(sanitized
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1'))
                .replace(/@/g, '@\u200b')
                .replace(/^(\s*[-*]\s*)\[[ xX]\]/gm, '$1\\[ \\]');
              return `> ${text.replace(/\n/g, '\n> ')}`;
            }

            function unrenderFindingText(value) {
              return redactSecretDiagnostics(String(value || 'OCR finding')
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/^> ?/gm, '')
                .trim());
            }

            function inlineCommentKey(comment) {
              const startLine = comment.start_line || '';
              return `${comment.path}\u0000${comment.line}\u0000${startLine}\u0000${unrenderFindingText(comment.body)}`;
            }

            function deduplicationKey(finding) {
              if (!finding || typeof finding !== 'object') return String(finding || '');
              const path = finding.path || '';
              const startLine = finding.start_line || '';
              const endLine = finding.end_line || '';
              const body = finding.content || finding.comment || finding.message || finding.body || '';
              return `${path}\u0000${startLine}\u0000${endLine}\u0000${redactSecretDiagnostics(String(body))}`;
            }

            function deduplicateFindings(findings) {
              const seen = new Map();
              const deduped = [];
              let suppressed = 0;
              for (const finding of findings) {
                const key = deduplicationKey(finding);
                if (seen.has(key)) {
                  suppressed += 1;
                } else {
                  seen.set(key, true);
                  deduped.push(finding);
                }
              }
              return { deduped, suppressed };
            }

            // Feature 3 (issue #2670): IoU (intersection-over-union) overlap
            // dedup for incremental comment posting. Ported from the upstream
            // post-review-comments.js module. These complement — and do not
            // replace — the content-based dedup above (deduplicateFindings).

            function resolveThreshold(raw) {
              const parsed = Number(raw);
              if (!Number.isFinite(parsed) || parsed <= 0 || parsed > 1) {
                return 0.6;
              }
              return parsed;
            }

            function lineSpan(c) {
              const start = Number(c.start_line || c.line || 0);
              const end = Number(c.line || c.start_line || 0);
              if (start <= 0 || end <= 0) {
                return { start: -1, end: -1, multiline: false, lineless: true };
              }
              const lo = Math.min(start, end);
              const hi = Math.max(start, end);
              return { start: lo, end: hi, multiline: lo !== hi, lineless: false };
            }

            function sameCommentSpan(cur, other, threshold) {
              // Lineless comments (no resolvable line numbers) never match.
              if (cur.lineless || other.lineless) {
                return false;
              }
              // Single-line vs single-line: match on the same line.
              // Multi-line vs multi-line: IoU > threshold.
              // Single vs multi: never match.
              if (cur.multiline !== other.multiline) {
                return false;
              }
              if (!cur.multiline) {
                return cur.start === other.start;
              }
              const overlap = Math.max(0, Math.min(cur.end, other.end) - Math.max(cur.start, other.start) + 1);
              const union = Math.max(cur.end, other.end) - Math.min(cur.start, other.start) + 1;
              return overlap / union > threshold;
            }

            async function existingReviewCommentSpans() {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return comments
                .filter((comment) => comment.user && comment.user.type === 'Bot'
                  && botLogin !== '' && comment.user.login === botLogin
                  && (comment.side === undefined || comment.side === 'RIGHT')
                  && typeof comment.body === 'string'
                  && comment.body.includes(INLINE_MARKER))
                .map((comment) => ({
                  path: comment.path,
                  span: lineSpan({
                    line: comment.line || comment.original_line,
                    start_line: comment.start_line || comment.original_start_line,
                  }),
                }));
            }

            function overlapsHistory(reviewComment, history, threshold) {
              for (const existing of history) {
                if (reviewComment.path !== existing.path) {
                  continue;
                }
                if (sameCommentSpan(reviewComment.span, existing.span, threshold)) {
                  return true;
                }
              }
              return false;
            }

            async function existingInlineCommentKeys() {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return new Set(comments
                .filter((comment) => comment.user && comment.user.type === 'Bot'
                  && botLogin !== '' && comment.user.login === botLogin
                  && (comment.side === undefined || comment.side === 'RIGHT')
                  && typeof comment.body === 'string'
                  && comment.body.includes(INLINE_MARKER))
                .map((comment) => inlineCommentKey({
                  path: comment.path,
                  line: comment.line || comment.original_line,
                  start_line: comment.start_line || comment.original_start_line,
                  body: comment.body,
                })));
            }

            // Issue #2575: reviewed-range manifest for completeness tracking.
            // A partial OCR run must never be mistaken for complete coverage.

            function resolveCompleteness(params) {
              const skipped = params.skipped === true;
              if (skipped) {
                return 'skipped';
              }
              // C1: exitCode must be a valid non-negative integer. NaN/missing
              // or negative values mean we cannot trust the OCR result, so
              // treat them as failures rather than silently coercing to 0.
              const rawExitCode = params.ocrExitCode;
              if (!Number.isInteger(rawExitCode) || rawExitCode < 0) {
                return 'failed';
              }
              if (rawExitCode !== 0) {
                return 'failed';
              }
              // C1: fail-closed. Only recognized success statuses ("success"
              // or "completed") can ever yield "complete". Every other value
              // (including empty/null/unknown) yields "partial" because we
              // lack positive proof of completeness.
              const status = typeof params.ocrStatus === 'string' ? params.ocrStatus : '';
              if (status !== 'success' && status !== 'completed') {
                return 'partial';
              }
              // C3: set-based completeness. Normalize (trim), deduplicate,
              // then verify that every selected file is covered.
              const normalize = (arr) =>
                Array.isArray(arr)
                  ? [...new Set(arr.map((p) => String(p || '').trim()).filter((p) => p.length > 0))]
                  : [];
              const selectedSet = normalize(params.selectedFiles);
              const completedSet = normalize(params.completedFiles);
              const failedSet = normalize(params.failedFiles);
              const reusedSet = normalize(params.reusedFiles);
              // C10: a waiver only counts if it has a non-empty trimmed
              // reason AND its path is in the failed set (C3: a waiver for
              // a file that didn't fail is irrelevant).
              const rawWaived = Array.isArray(params.waivedFiles) ? params.waivedFiles : [];
              const failedLookup = new Set(failedSet);
              const validWaiverPaths = new Set();
              for (const entry of rawWaived) {
                let pathStr = '';
                let reasonStr = '';
                if (typeof entry === 'string') {
                  pathStr = entry.trim();
                } else if (entry && typeof entry === 'object') {
                  pathStr = String(entry.path || '').trim();
                  reasonStr = String(entry.reason || '').trim();
                } else {
                  pathStr = String(entry || '').trim();
                }
                if (pathStr.length > 0 && reasonStr.length > 0 && failedLookup.has(pathStr)) {
                  validWaiverPaths.add(pathStr);
                }
              }
              const resolvedSet = new Set([
                ...completedSet,
                ...reusedSet,
                ...validWaiverPaths,
              ]);
              // Every selected file must be resolved.
              for (const sel of selectedSet) {
                if (!resolvedSet.has(sel)) {
                  return 'partial';
                }
              }
              // C3: no unresolved failed files (a failed file not covered by
              // a valid waiver). A file in both completed and failed is
              // considered resolved (completed wins).
              for (const failedPath of failedSet) {
                if (!resolvedSet.has(failedPath) && !validWaiverPaths.has(failedPath)) {
                  return 'partial';
                }
              }
              // C3: no completed files outside the selected set (prevents
              // an inflated completed set from masking a missing selected
              // file).
              const selectedLookup = new Set(selectedSet);
              for (const completedPath of completedSet) {
                if (!selectedLookup.has(completedPath)) {
                  return 'partial';
                }
              }
              return 'complete';
            }

            function computeCoverage(params) {
              const selected = Number(params.selected) || 0;
              const completed = Number(params.completed) || 0;
              const ratio = selected === 0 ? 1 : completed / selected;
              return { completed, selected, ratio: String(ratio) };
            }

            // Issue #2575: computeArtifactHashes is retained for testability
            // and local CLI parity. The production hash computation runs in
            // the dedicated "Compute reviewed-range manifest hashes" step
            // (post-redaction), but this function is exercised by tests and
            // serves as the canonical implementation.
            function computeArtifactHashes(fileNames) {
              const hashModule = typeof require === 'function' ? require('crypto') : crypto;
              const fileSystem = typeof require === 'function' ? require('fs') : fs;
              const hashes = {};
              for (const fileName of fileNames) {
                try {
                  const content = fileSystem.readFileSync(fileName, 'utf8');
                  const hash = hashModule.createHash('sha256').update(content).digest('hex');
                  hashes[fileName] = `sha256:${hash}`;
                } catch (_) {
                  hashes[fileName] = null;
                }
              }
              return hashes;
            }

            function buildReviewedRangeManifest(params) {
              const selectedFiles = Array.isArray(params.selectedFiles) ? params.selectedFiles : [];
              const rawCompletedFiles = Array.isArray(params.completedFiles) ? params.completedFiles : [];
              const failedFiles = Array.isArray(params.failedFiles) ? params.failedFiles : [];
              const reusedFiles = Array.isArray(params.reusedFiles) ? params.reusedFiles : [];
              const rawWaivedFiles = Array.isArray(params.waivedFiles) ? params.waivedFiles : [];
              const waivedFiles = rawWaivedFiles.map((entry) => {
                if (typeof entry === 'string') {
                  return { path: entry, reason: '' };
                }
                if (entry && typeof entry === 'object') {
                  return { path: String(entry.path || ''), reason: String(entry.reason || '') };
                }
                return { path: String(entry), reason: '' };
              });
              const validWaivers = waivedFiles.filter((w) => w.path && w.reason.trim().length > 0);
              // C2: completed_with_errors must not mark all selected files as
              // completed. When the upstream OCR status indicates partial
              // failure, we cannot trust that any specific file completed.
              const ocrStatus = params.ocrStatus || '';
              const isPartialStatus = ocrStatus === 'completed_with_errors';
              const completedFiles = isPartialStatus ? [] : rawCompletedFiles;
              const completeness = resolveCompleteness({
                ocrExitCode: Number(params.ocrExitCode) || 0,
                ocrStatus: params.ocrStatus || null,
                selectedFiles,
                completedFiles,
                failedFiles,
                reusedFiles,
                waivedFiles,
                skipped: params.skipped === true,
              });
              const coverage = computeCoverage({
                completed: completedFiles.length,
                selected: selectedFiles.length,
              });
              return {
                schema_version: '1.0.0',
                repository: params.repository || '',
                pr_number: Number(params.prNumber) || 0,
                head_sha: params.headSha || '',
                merge_base_sha: params.mergeBaseSha || '',
                trigger: params.trigger || '',
                run_id: params.runId || '',
                run_attempt: params.runAttempt || '',
                ocr_version: params.ocrVersion || 'unknown',
                ocr_session_id: params.ocrSessionId || '',
                ocr_parent_session_id: params.ocrParentSessionId || '',
                provider_model: params.providerModel || '',
                concurrency: Number(params.concurrency) || 0,
                rule_config_hash: params.ruleConfigHash || '',
                selected_files: selectedFiles,
                completed_files: completedFiles,
                failed_files: failedFiles,
                reused_files: reusedFiles,
                waived_files: waivedFiles,
                completeness,
                coverage,
                ocr_status: params.ocrStatus || '',
                artifact_hashes: params.artifactHashes || {},
              };
            }

            function serializeManifest(manifest) {
              const json = JSON.stringify(manifest, null, 2);
              return redactSecretDiagnostics(json);
            }

            function resultEnvelopeFromRaw(raw) {
              try {
                const parsed = JSON.parse(String(raw || '').trim());
                return parsed && typeof parsed === 'object' && !Array.isArray(parsed)
                  ? parsed
                  : null;
              } catch (_) {
                return null;
              }
            }

            function failedFilesFromResult(envelope) {
              const warnings = envelope && Array.isArray(envelope.warnings)
                ? envelope.warnings
                : [];
              const failedFiles = [];
              const seen = new Set();
              for (const warning of warnings) {
                if (!warning || warning.type !== 'subtask_error') {
                  continue;
                }
                const filePath = typeof warning.file === 'string'
                  ? warning.file.trim()
                  : '';
                if (filePath && !seen.has(filePath)) {
                  seen.add(filePath);
                  failedFiles.push(filePath);
                }
              }
              return failedFiles;
            }

            function buildStatusLine(params) {
              if (!params.ran) {
                if (params.policyFailure) {
                  return `OCR policy failure: ${params.policyFailure}`;
                }
                return 'OCR failed to run or parse output.';
              }
              if (params.completeness !== 'complete') {
                const coverage = params.coverage || { completed: 0, selected: 0 };
                const failedCount = Array.isArray(params.failedFiles)
                  ? params.failedFiles.length
                  : 0;
                const findingNote = params.findingsCount > 0
                  ? `; ${params.findingsCount} finding(s) (${params.postedInline} posted inline).`
                  : '.';
                return `Partial review: ${coverage.completed} of ${coverage.selected} files completed (${failedCount} failed)${findingNote}`;
              }
              if (params.findingsCount === 0) {
                return 'No findings.';
              }
              return `${params.findingsCount} finding(s) (${params.postedInline} posted inline).`;
            }
            if (policyFailure) {
              ran = false;
              core.warning('Skipping OCR output parsing because OCR policy failure was recorded.');
            } else if (exitCode === 0) {
              try {
                const raw = fs.readFileSync('ocr-result.json', 'utf8');
                ocrResultEnvelope = resultEnvelopeFromRaw(raw);
                const parsed = parseFindings(raw);
                if (parsed) {
                  findings = parsed;
                } else {
                  ran = false;
                }
              } catch (parseErr) {
                markInfrastructureFailure('parse', `OCR output could not be parsed: ${parseErr.message || parseErr}`);
                core.warning(redactSecretDiagnostics(`Failed to parse OCR JSON output: ${parseErr.message || parseErr}`));
                ran = false;
              }
            } else {
              core.warning(`Skipping OCR output parsing because phase ${phase} already recorded exit code ${exitCode}.`);
            }

            // Validate category/severity metadata (fail-open) before dedup so
            // schema drift on findings that share a dedup key (path/lines/body)
            // is still observed. Undocumented or missing values map to 'unknown'
            // with a stderr warning, without suppressing any finding.
            findings = findings.map(validateFindingMetadata);

            // Issue #2672: compute routing decisions for EVERY finding before
            // dedup so suppressed duplicates still get artifact records, and a
            // protected finding (e.g. security/high) that shares a dedup key
            // with a low-severity finding is still accounted for.
            const routingShadowMode = process.env.OCR_ROUTING_SHADOW_MODE !== 'false';
            const allRoutingDecisions = findings.map((f) => {
              const decision = routeFinding(f);
              const meta = (f && typeof f === 'object') ? f : {};
              return {
                path: typeof meta.path === 'string' ? meta.path : '',
                start_line: Number.isInteger(meta.start_line) ? meta.start_line : null,
                end_line: Number.isInteger(meta.end_line) ? meta.end_line : null,
                category: effectiveCategory(meta),
                severity: effectiveSeverity(meta),
                destination: decision.destination,
                reason: decision.reason,
              };
            });

            const dedupedFindings = deduplicateFindings(findings);
            let suppressedDuplicateCount = 0;
            suppressedDuplicateCount = dedupedFindings.suppressed;
            findings = dedupedFindings.deduped;

            // Issue #2672: routing decisions for the deduped set. Recomputed
            // (not sliced from allRoutingDecisions) because dedup may remove
            // findings from anywhere in the array.
            const routingDecisions = findings.map((f, i) => {
              const decision = routeFinding(f);
              const meta = (f && typeof f === 'object') ? f : {};
              const hasPosition = meta.path && Number.isInteger(meta.start_line) &&
                Number.isInteger(meta.end_line) && meta.start_line > 0 && meta.end_line > 0;
              return {
                category: effectiveCategory(meta),
                severity: effectiveSeverity(meta),
                destination: decision.destination,
                reason: decision.reason,
                hasPosition,
              };
            });
            // Only count findings that would actually be held back from
            // inline posting (line-addressable). Lineless findings always
            // go to the summary regardless of routing, so including them
            // would inflate the shadow-mode preview count.
            const wouldRouteToSummary = routingDecisions.filter(
              (d) => d.hasPosition && d.destination === 'summary',
            ).length;

            // Split findings into inline (resolvable file/line), summary-routed,
            // and lineless. In shadow mode all line-addressable findings go
            // inline (issue #2672). In go-live mode, findings routed to
            // 'summary' are held back from inline posting.
            const inline = [];
            const summaryRouted = [];
            const lineless = [];
            for (const f of findings) {
              const decision = routeFinding(f);
              if (f && f.path && Number.isInteger(f.start_line) &&
                  Number.isInteger(f.end_line) && f.start_line > 0 && f.end_line > 0) {
                if (!routingShadowMode && decision.destination === 'summary') {
                  summaryRouted.push(f);
                } else {
                  let startLine = Number(f.start_line);
                  let endLine = Number(f.end_line);
                  if (startLine > endLine) {
                    [startLine, endLine] = [endLine, startLine];
                  }
                  const rawText = f.content || f.comment || f.message || f.body;
                  const label = categorySeverityLabel(f);
                  const rendered = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                  // Insert the label inside the blockquote (after the first
                  // '> ' prefix) so the first line stays '> **[cat/sev]** text'.
                  const labeledText = label ? rendered.replace(/^> /, `> ${label}`) : rendered;
                  const comment = {
                    path: String(f.path),
                    line: endLine,
                    side: 'RIGHT',
                    body: `${INLINE_MARKER}\n${labeledText}`,
                  };
                  if (startLine < endLine) {
                    comment.start_line = startLine;
                    comment.start_side = 'RIGHT';
                  }
                  inline.push(comment);
                }
              } else {
                lineless.push(f && typeof f === 'object' ? f : { body: f || 'Malformed OCR finding' });
              }
            }

            // Post inline comments via a COMMENT review on the head SHA.
            let postedInline = 0;
            let failedInline = 0;
            let skippedOverlapCount = 0;
            let skippedExactHistoryCount = 0;
            // Feature 3 (issue #2670): incremental IoU overlap dedup mode.
            const incrementalEnabled = process.env.OCR_INCREMENTAL === 'true';
            const overlapThreshold = resolveThreshold(process.env.OCR_INCREMENTAL_OVERLAP_THRESHOLD);
            if (ran && inline.length > 0) {
              let existingInlineKeys = new Set();
              try {
                existingInlineKeys = await existingInlineCommentKeys();
              } catch (listErr) {
                core.warning(redactSecretDiagnostics(`Could not list existing OCR inline comments before posting: ${listErr.message || listErr}`));
              }
              const beforeExactFilter = inline.length;
              let inlineToPost = inline.filter((c) => !existingInlineKeys.has(inlineCommentKey(c)));
              skippedExactHistoryCount = beforeExactFilter - inlineToPost.length;
              // Feature 3: when incremental mode is enabled, additionally
              // filter out comments whose (path, line range) overlaps an
              // existing bot review comment (IoU > threshold).
              if (incrementalEnabled && inlineToPost.length > 0) {
                let historySpans = [];
                try {
                  historySpans = await existingReviewCommentSpans();
                } catch (listErr) {
                  core.warning(redactSecretDiagnostics(`Could not list existing OCR review comments for incremental dedup: ${listErr.message || listErr}`));
                }
                if (historySpans.length > 0) {
                  const candidates = inlineToPost.map((c) => ({
                    comment: c,
                    span: lineSpan(c),
                  }));
                  const kept = [];
                  for (const candidate of candidates) {
                    if (overlapsHistory(
                      { path: candidate.comment.path, span: candidate.span },
                      historySpans,
                      overlapThreshold,
                    )) {
                      skippedOverlapCount += 1;
                    } else {
                      kept.push(candidate.comment);
                    }
                  }
                  inlineToPost = kept;
                }
              }
              if (inlineToPost.length === 0) {
                core.info('All OCR inline comments already exist on this head SHA; skipping inline posting.');
              } else {
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: number,
                  event: 'COMMENT', commit_id: headSha, comments: inlineToPost,
                });
                postedInline = inlineToPost.length;
              } catch (batchErr) {
                core.warning(redactSecretDiagnostics(`Batch review post failed (${inlineToPost.length} comments), falling back to individual posting: ${batchErr.message || batchErr}`));
                // Fallback: post each inline comment individually, with a cap to avoid secondary rate limits.
                try {
                  existingInlineKeys = await existingInlineCommentKeys();
                } catch (listErr) {
                  core.warning(redactSecretDiagnostics(`Could not list existing OCR inline comments before fallback posting: ${listErr.message || listErr}`));
                }
                const MAX_INLINE_FALLBACK = 50;
                for (const [index, c] of inlineToPost.entries()) {
                  if (index >= MAX_INLINE_FALLBACK) {
                    const lineRange = c.start_line && c.start_line !== c.line
                      ? `${c.start_line}-${c.line}`
                      : String(c.line);
                    const overflowBody = `${unrenderFindingText(c.body)} (line ${lineRange})`;
                    lineless.push({
                      path: c.path,
                      comment: overflowBody,
                      message: overflowBody,
                      body: overflowBody,
                    });
                    continue;
                  }
                  if (existingInlineKeys.has(inlineCommentKey(c))) {
                    core.warning(`Skipping duplicate OCR inline comment on ${c.path}:${c.line} after batch post uncertainty.`);
                    skippedExactHistoryCount += 1;
                    continue;
                  }
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner,
                      repo,
                      pull_number: number,
                      commit_id: headSha,
                      path: c.path,
                      line: c.line,
                      side: c.side,
                      body: c.body,
                      ...(c.start_line ? { start_line: c.start_line, start_side: c.start_side } : {}),
                    });
                    postedInline += 1;
                    await new Promise((resolve) => setTimeout(resolve, 1000));
                  } catch (commentErr) {
                    core.warning(redactSecretDiagnostics(`Failed to post inline comment on ${c.path}:${c.line}: ${commentErr.message || commentErr}`));
                    failedInline += 1;
                    const lineRange = c.start_line && c.start_line !== c.line
                      ? `${c.start_line}-${c.line}`
                      : String(c.line);
                    const fallbackBody = `${unrenderFindingText(c.body)} (line ${lineRange})`;
                    lineless.push({
                      path: c.path,
                      comment: fallbackBody,
                      message: fallbackBody,
                      body: fallbackBody,
                    });
                  }
                }
              }
              }
            }

            // Build the sticky summary, including lineless findings.
            const artifactLine =
              'Artifacts: `ocr-review-output` contains raw JSON, stdout, stderr, preview, phase, and exit-code diagnostics.';
            // Issue #2575: build the reviewed-range manifest for completeness
            // tracking. The manifest records selected/completed/failed/waived
            // file sets and a terminal completeness state.
            const ocrStatusValue = readTrimmed('ocr-status.txt', '') || '';
            const selectedFilesContent = readTrimmed('ocr-selected-files.txt', '');
            const selectedFilesList = selectedFilesContent
              ? selectedFilesContent.split(String.fromCharCode(10)).filter((l) => l.trim().length > 0)
              : [];
            // C2: completedFiles must only be set to all selected files when
            // the OCR status is a recognized success AND exit code is 0.
            // For completed_with_errors we do not know which files actually
            // completed, so leave completedFiles empty (conservative).
            const manifestCompletedFiles =
              ran && (ocrStatusValue === 'success' || ocrStatusValue === 'completed') && exitCode === 0
                ? selectedFilesList
                : [];
            const manifestFailedFiles = failedFilesFromResult(ocrResultEnvelope);
            // C7: isSkipped heuristic removed. When the post step runs, the
            // review was NOT skipped (the gate let it through). Missing
            // evidence is "failed"/"partial", never inferred as "skipped".
            const manifestCompleteness = resolveCompleteness({
              ocrExitCode: exitCode,
              ocrStatus: ocrStatusValue || null,
              selectedFiles: selectedFilesList,
              completedFiles: manifestCompletedFiles,
              failedFiles: manifestFailedFiles,
              reusedFiles: [],
              waivedFiles: [],
              skipped: false,
            });
            const manifestCoverage = computeCoverage({
              completed: manifestCompletedFiles.length,
              selected: selectedFilesList.length,
            });
            const statusLine = buildStatusLine({
              ran,
              findingsCount: findings.length,
              postedInline,
              completeness: manifestCompleteness,
              coverage: manifestCoverage,
              failedFiles: manifestFailedFiles,
              policyFailure,
            });
            const infrastructureFailure = readTrimmed(INFRA_FAILURE_FILE, '');
            let body = [
              MARKER,
              `## OpenCodeReview — PR #${number}`,
              '',
              `- Reviewed head SHA: \`${headSha}\``,
              `- Merge base: \`${process.env.BASE_SHA}\``,
              `- OCR version: \`${ocrVersion}\``,
              `- Phase: \`${diagnosticPhase}\``,
              `- Exit code: \`${exitCode}\``,
              `- Run: ${runUrl}`,
              `- ${statusLine}`,
              `- ${artifactLine}`,
            ];
            if (suppressedDuplicateCount > 0) {
              body.push(`- Suppressed ${suppressedDuplicateCount} exact duplicate finding(s).`);
            }
            if (!ran || infrastructureFailure) {
              body.push(
                '',
                ...stderrSection('OCR stderr excerpt', 'ocr-stderr.log'),
                '',
                ...stderrSection('OCR preflight excerpt', 'ocr-preflight.txt'),
                '',
                ...stderrSection('OCR preview stderr excerpt', 'ocr-preview-stderr.log'),
              );
            }
            if (infrastructureFailure) {
              const sanitizedInfrastructureFailure = redactSecretDiagnostics(infrastructureFailure);
              const infrastructureDiagnosticLine = `- Infrastructure diagnostic: \`${sanitizedInfrastructureFailure.replace(/`/g, "\\`")}\``;
              const artifactLineIndex = body.indexOf(`- ${artifactLine}`);
              if (artifactLineIndex >= 0) {
                body.splice(artifactLineIndex + 1, 0, infrastructureDiagnosticLine);
              } else {
                body.push(infrastructureDiagnosticLine);
              }
            }
            if (lineless.length > 0) {
              body.push('', '### Findings without a resolvable position', '');
              for (const f of lineless) {
                const item = f && typeof f === 'object' ? f : {};
                const where = item.path ? `\`${item.path}\`: ` : '';
                const label = categorySeverityLabel(f);
                const rawText = item.content || item.comment || item.message || item.body;
                const text = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                body.push(`- ${where}${label}${text}`);
              }
            }
            if (summaryRouted.length > 0) {
              body.push('', '### Findings routed to summary', '');
              for (const f of summaryRouted) {
                const where = f.path ? `\`${f.path}\`: ` : '';
                const label = categorySeverityLabel(f);
                const rawText = f.content || f.comment || f.message || f.body;
                const text = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                body.push(`- ${where}${label}${text}`);
              }
            }
            if (routingShadowMode && wouldRouteToSummary > 0) {
              body.push('', '### Shadow-mode routing preview (issue #2672)', '');
              body.push(`- ${wouldRouteToSummary} finding(s) would be routed to this summary instead of inline comments.`);
              const summaryByCategory = {};
              for (const d of routingDecisions) {
                if (d.destination === 'summary') {
                  const key = `${d.category}/${d.severity}`;
                  summaryByCategory[key] = (summaryByCategory[key] || 0) + 1;
                }
              }
              for (const [key, count] of Object.entries(summaryByCategory)) {
                body.push(`  - \`${key}\`: ${count}`);
              }
              body.push('- Set repository variable `OCR_ROUTING_SHADOW_MODE=false` to enable live routing.');
            }
            // Issue #2672: persist ALL routing decisions (pre-dedup) so every
            // finding gets an artifact record with its routing reason, even
            // duplicates that dedup later suppresses.
            try {
              const routingJson = JSON.stringify(allRoutingDecisions, null, 2);
              fs.writeFileSync('ocr-routing-decisions.json', routingJson);
            } catch (routingWriteErr) {
              core.warning(`Failed to write ocr-routing-decisions.json: ${routingWriteErr.message || routingWriteErr}`);
            }
            const isAutomatic = process.env.IS_AUTOMATIC === 'true';

            // Read the current auto-review count from the existing sticky
            // comment so it can be incremented (issue #2666). Manual triggers
            // do not increment the counter. Fetch the comment list once and
            // reuse it for both count parsing and reconciliation below.
            let markerComments = [];
            try {
              const allComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              markerComments = allComments.filter((c) =>
                typeof c.body === 'string' && c.body.includes(MARKER));
            } catch (preFetchErr) {
              core.warning(redactSecretDiagnostics(`Could not list OCR comments for auto-review count: ${preFetchErr.message || preFetchErr}`));
            }
            let autoReviewCount = 0;
            const preMarker = markerComments[0];
            if (preMarker) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(preMarker.body);
              if (match) {
                autoReviewCount = Number(match[1]);
              }
            }
            if (isAutomatic) {
              autoReviewCount += 1;
            }
            body.push(`\n<!-- ocr-auto-count:${autoReviewCount} -->`);
            const summary = body.join('\n');

            async function fetchMarkerComments() {
              const allComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              return allComments.filter((c) =>
                typeof c.body === 'string' && c.body.includes(MARKER));
            }

            async function reconcileMarkerComment(existingComments) {
              let comments;
              if (existingComments) {
                comments = existingComments;
              } else {
                try {
                  comments = await fetchMarkerComments();
                } catch (fetchErr) {
                  core.warning(redactSecretDiagnostics(`Could not re-fetch OCR marker comments: ${fetchErr.message || fetchErr}`));
                  comments = [];
                }
              }
              const existing = comments[0];
              for (const duplicate of comments.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: duplicate.id,
                  });
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                } catch (duplicateError) {
                  core.warning(redactSecretDiagnostics(`Failed to delete duplicate OCR marker comment ${duplicate.id}: ${duplicateError.message || duplicateError}`));
                }
              }
              return existing || null;
            }

            async function createOrUpdateMarkerComment(summary) {
              let existing = null;
              try {
                existing = await reconcileMarkerComment();
              } catch (reconcileErr) {
                core.warning(redactSecretDiagnostics(`Reconciliation failed before summary posting; attempting create: ${reconcileErr.message || reconcileErr}`));
              }
              if (existing) {
                const updated = await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: summary,
                });
                return updated?.data || existing;
              }
              try {
                const created = await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body: summary,
                });
                // Re-fetch to reconcile any concurrent duplicate marker
                // comments that may have been posted between the initial
                // pre-fetch and this create.
                try {
                  await reconcileMarkerComment(null);
                } catch (reconcileErr) {
                  core.warning(redactSecretDiagnostics(`Post-create reconciliation failed; duplicate marker comments may remain: ${reconcileErr.message || reconcileErr}`));
                }
                return created?.data || null;
              } catch (createErr) {
                // After a failed create (e.g. a race where a marker was just
                // posted), re-list comments fresh to reconcile, since the
                // pre-fetched list is stale at this point.
                const reconciled = await reconcileMarkerComment(null);
                if (reconciled) {
                  const updated = await github.rest.issues.updateComment({
                    owner, repo, comment_id: reconciled.id, body: summary,
                  });
                  return updated?.data || reconciled;
                } else {
                  throw createErr;
                }
              }
            }

            let summaryCommentUrl = '';
            try {
              const summaryComment = await createOrUpdateMarkerComment(summary);
              summaryCommentUrl = (summaryComment && summaryComment.html_url) || '';
            } catch (summaryError) {
              core.warning(redactSecretDiagnostics(`Failed to post OCR sticky summary; continuing without failing the workflow: ${summaryError.message || summaryError}`));
            }

            // Issue #2575: persist the reviewed-range manifest.
            // Artifact hashes are computed AFTER redaction in the dedicated
            // "Compute reviewed-range manifest hashes" step; here we just
            // write the manifest with placeholder empty hashes.
            const manifest = buildReviewedRangeManifest({
              repository: `${owner}/${repo}`,
              prNumber: number,
              headSha,
              mergeBaseSha: process.env.BASE_SHA || '',
              trigger: process.env.GITHUB_EVENT_NAME || '',
              runId: String(context.runId || ''),
              runAttempt: String(process.env.GITHUB_RUN_ATTEMPT || '1'),
              ocrVersion,
              ocrSessionId: process.env.OCR_SESSION_ID || '',
              ocrParentSessionId: process.env.OCR_PARENT_SESSION_ID || '',
              providerModel: readTrimmed('ocr-preflight.txt', '').split(String.fromCharCode(10))[0] || '',
              concurrency: Number(process.env.OCR_CONCURRENCY) || 0,
              ruleConfigHash: process.env.OCR_RULE_CONFIG_HASH || '',
              selectedFiles: selectedFilesList,
              completedFiles: manifestCompletedFiles,
              failedFiles: manifestFailedFiles,
              reusedFiles: [],
              waivedFiles: [],
              ocrExitCode: exitCode,
              ocrStatus: ocrStatusValue,
              skipped: false,
              artifactHashes: {},
            });
            try {
              const serialized = serializeManifest(manifest);
              fs.writeFileSync('ocr-reviewed-range-manifest.json', serialized);
            } catch (manifestErr) {
              // C9: a manifest persistence failure must not be silently
              // swallowed. Record it as an infrastructure failure so the
              // downstream classification and notifier pick it up.
              core.warning(redactSecretDiagnostics(`Failed to write reviewed-range manifest: ${manifestErr.message || manifestErr}`));
              const infraMessage = 'phase=manifest; reason=reviewed-range manifest persistence failed: '
                + redactSecretDiagnostics(String(manifestErr.message || manifestErr))
                + String.fromCharCode(10);
              fs.writeFileSync(INFRA_FAILURE_FILE, infraMessage);
              fs.writeFileSync('ocr-phase.txt', 'manifest\n');
            }

            // Feature 5 (issue #2670): structured step outputs.
            const commentsTotal = findings.length + suppressedDuplicateCount;
            // comments_skipped counts ONLY inline comments skipped by
            // incremental overlap dedup and exact-key history dedup. Exact
            // duplicate suppression (suppressedDuplicateCount) is reported
            // separately in the summary text since it covers all findings,
            // including lineless ones.
            const commentsSkipped = skippedOverlapCount + skippedExactHistoryCount;
            core.setOutput('comments_total', String(commentsTotal));
            core.setOutput('comments_inline', String(postedInline));
            core.setOutput('comments_skipped', String(commentsSkipped));
            core.setOutput('comments_failed', String(failedInline));
            core.setOutput('comments_routed_summary', String(routingShadowMode ? wouldRouteToSummary : summaryRouted.length));
            core.setOutput('summary_comment_url', summaryCommentUrl);

            if (!ran) {
              if (policyFailure) {
                core.setFailed(`OCR policy failure: ${policyFailure}`);
              } else {
                core.warning(`OpenCodeReview failed or produced unparsable output (exit code ${exitCode}).`);
              }
            }

      - name: Resolve OCR failure classification
        shell: bash
        id: ocr-classification
        if: always()
        run: |
          set -euo pipefail
          if [ -s ocr-policy-failure.txt ]; then
            echo "policy_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "policy_failure=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -s ocr-infrastructure-failure.txt ]; then
            echo "infrastructure_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure_failure=false" >> "$GITHUB_OUTPUT"
          fi
          # C8: extract completeness from the reviewed-range manifest so the
          # record-ocr-outcome job can distinguish partial/failed reviews
          # from complete successes.
          completeness="unknown"
          if [ -s ocr-reviewed-range-manifest.json ]; then
            completeness="$(node -e '
              try {
                const data = JSON.parse(require("fs").readFileSync("ocr-reviewed-range-manifest.json", "utf8"));
                if (data && typeof data === "object" && typeof data.completeness === "string") {
                  process.stdout.write(data.completeness);
                }
              } catch (_) { /* best-effort */ }
            ' 2>/dev/null || true)"
          fi
          echo "completeness=${completeness}" >> "$GITHUB_OUTPUT"

      - name: Redact OCR diagnostic artifacts
        shell: bash
        if: always()
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const REDACTION = '[REDACTED]';
          const escapeRegExp = (value) => String(value).replace(/[\\^$.*+?()[\]{}|]/g, '\\$&');
          const redact = (value) => {
            let sanitized = String(value ?? '');
            for (const secret of [process.env.OCR_LLM_TOKEN, process.env.OCR_LLM_URL]) {
              if (typeof secret === 'string' && secret.length > 0) {
                sanitized = sanitized.replace(new RegExp(escapeRegExp(secret), 'g'), REDACTION);
              }
            }
            return sanitized
              .replace(/\b(Authorization\s*:\s*(?:(?:Bearer|Basic|token|ApiKey)\s+)?)([^\s,;]+)/gi, `$1${REDACTION}`)
              .replace(/\b(x-api-key\s*:\s*)([^\s,;]+)/gi, `$1${REDACTION}`)
              .replace(/\b(api[_-]?key\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/([?&](?:key|api[_-]?key|token)=)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(access[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(refresh[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(id[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(token\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, `$1${REDACTION}`)
              .replace(/\b(secret\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, `$1${REDACTION}`);
          };
          const diagnosticArtifacts = [
            'ocr-result.json',
            'ocr-stdout.raw',
            'ocr-stderr.log',
            'ocr-preflight.txt',
            'ocr-version.txt',
            'ocr-preview.txt',
            'ocr-preview-stderr.log',
            'ocr-exit-code.txt',
            'ocr-phase.txt',
            'ocr-infrastructure-failure.txt',
            'ocr-policy-failure.txt',
            'ocr-selected-files.txt',
            'ocr-status.txt',
            'ocr-reviewed-range-manifest.json',
            'ocr-manifest-hashes.json',
            'ocr-manifest-sha256.txt',
            'ocr-routing-decisions.json',
          ];
          const replaceWithRedactionFailure = (fileName, error) => {
            const code = error && error.code ? error.code : 'unknown';
            const diagnostic = `redaction failed for ${fileName}: ${code}\n`;
            try {
              fs.writeFileSync(fileName, diagnostic);
            } catch (_) {
              try {
                fs.rmSync(fileName, { force: true });
              } catch (_) {
                process.exitCode = 1;
              }
            }
          };
          const REDACTED_PENDING = '[REDACTED-PENDING]';
          for (const fileName of diagnosticArtifacts) {
            try {
              const originalContent = fs.readFileSync(fileName, 'utf8');
              fs.writeFileSync(fileName, REDACTED_PENDING);
              const redactedContent = redact(originalContent);
              const tempFile = `${fileName}.redacting`;
              fs.writeFileSync(tempFile, redactedContent);
              fs.renameSync(tempFile, fileName);
            } catch (error) {
              if (error && error.code !== 'ENOENT') {
                replaceWithRedactionFailure(fileName, error);
              }
            }
          }
          NODE
      - name: Compute reviewed-range manifest hashes
        # C4/C5/C6: compute SHA-256 hashes of post-redaction artifacts.
        # This runs AFTER "Redact OCR diagnostic artifacts" so the hashes
        # describe the actual (redacted) bytes that are uploaded. The
        # manifest itself is hashed last (after its artifact_hashes field
        # is filled) and written to a detached ocr-manifest-sha256.txt.
        shell: bash
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          // C5/C6: all diagnostic artifacts are hashed, including status
          // and failure markers.
          const hashableArtifacts = [
            'ocr-result.json',
            'ocr-stdout.raw',
            'ocr-stderr.log',
            'ocr-preflight.txt',
            'ocr-version.txt',
            'ocr-preview.txt',
            'ocr-preview-stderr.log',
            'ocr-exit-code.txt',
            'ocr-phase.txt',
            'ocr-selected-files.txt',
            'ocr-status.txt',
            'ocr-infrastructure-failure.txt',
            'ocr-policy-failure.txt',
          ];
          const hashes = {};
          for (const name of hashableArtifacts) {
            try {
              const content = fs.readFileSync(name, 'utf8');
              const hash = crypto.createHash('sha256').update(content).digest('hex');
              hashes[name] = `sha256:${hash}`;
            } catch (_) {
              hashes[name] = null;
            }
          }
          // Write the per-artifact hashes.
          fs.writeFileSync('ocr-manifest-hashes.json', JSON.stringify(hashes, null, 2));
          // Re-read the manifest, inject the post-redaction hashes, and
          // re-serialize so the manifest itself carries verified hashes.
          try {
            const manifestRaw = fs.readFileSync('ocr-reviewed-range-manifest.json', 'utf8');
            const manifest = JSON.parse(manifestRaw);
            manifest.artifact_hashes = hashes;
            fs.writeFileSync('ocr-reviewed-range-manifest.json', JSON.stringify(manifest, null, 2));
          } catch (manifestErr) {
            process.stderr.write('Could not update manifest artifact_hashes: ' + (manifestErr.message || manifestErr) + String.fromCharCode(10));
          }
          // Hash the manifest LAST (after its own hashes are filled in) and
          // write the detached manifest hash.
          try {
            const manifestContent = fs.readFileSync('ocr-reviewed-range-manifest.json', 'utf8');
            const manifestHash = crypto.createHash('sha256').update(manifestContent).digest('hex');
            fs.writeFileSync('ocr-manifest-sha256.txt', 'sha256:' + manifestHash + String.fromCharCode(10));
          } catch (manifestErr) {
            process.stderr.write('Could not compute manifest hash: ' + (manifestErr.message || manifestErr) + String.fromCharCode(10));
          }
          NODE
      - name: Ensure OCR artifact placeholders exist
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          missing=""
          for file_name in \
            ocr-result.json \
            ocr-stdout.raw \
            ocr-stderr.log \
            ocr-preflight.txt \
            ocr-version.txt \
            ocr-preview.txt \
            ocr-preview-stderr.log \
            ocr-exit-code.txt \
            ocr-phase.txt \
            ocr-infrastructure-failure.txt \
            ocr-policy-failure.txt \
            ocr-selected-files.txt \
            ocr-status.txt \
            ocr-reviewed-range-manifest.json \
            ocr-manifest-hashes.json \
            ocr-manifest-sha256.txt \
            ocr-routing-decisions.json; do
            if [ ! -e "$file_name" ]; then
              : > "$file_name"
              missing="${missing}${file_name}"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::OCR artifact placeholders were missing before upload:"
            echo "$missing"
            if [ ! -s ocr-exit-code.txt ]; then
              echo "127" > ocr-exit-code.txt
            fi
            if [ ! -s ocr-phase.txt ]; then
              echo "artifact" > ocr-phase.txt
            fi
            if [ ! -s ocr-infrastructure-failure.txt ]; then
              echo "phase=artifact; reason=OCR artifact placeholders were missing before upload" > ocr-infrastructure-failure.txt
            fi
          fi
          for critical_artifact in ocr-exit-code.txt ocr-phase.txt; do
            if [ ! -s "$critical_artifact" ]; then
              echo "::warning::Critical OCR artifact $critical_artifact is empty before upload."
            fi
          done

      - name: Upload OCR artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: ocr-review-output
          path: |
            ocr-result.json
            ocr-stdout.raw
            ocr-stderr.log
            ocr-preflight.txt
            ocr-version.txt
            ocr-preview.txt
            ocr-preview-stderr.log
            ocr-exit-code.txt
            ocr-phase.txt
            ocr-infrastructure-failure.txt
            ocr-policy-failure.txt
            ocr-selected-files.txt
            ocr-status.txt
            ocr-reviewed-range-manifest.json
            ocr-manifest-hashes.json
            ocr-manifest-sha256.txt
            ocr-routing-decisions.json
          if-no-files-found: warn

      - name: Clean up scoped safe.directory
        shell: bash
        if: always()
        run: |
          set +e
          git config --file "${HOME}/.gitconfig" --unset-all safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

  record-ocr-outcome:
    name: Record OCR outcome
    needs:
      - mergeability-gate
      - code-review
    if: >-
      ${{ !cancelled() &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true' &&
          (needs.code-review.result == 'success' ||
           needs.code-review.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 'Record OCR outcome: policy-failure'
        if: ${{ needs.code-review.outputs.policy_failure == 'true' }}
        shell: bash
        run: echo 'OCR policy failure recorded.'

      - name: 'Record OCR outcome: infrastructure-failure'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure == 'true' }}
        shell: bash
        run: echo 'Non-blocking OCR infrastructure failure recorded.'

      - name: 'Record OCR outcome: partial'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure != 'true' &&
              (needs.code-review.outputs.completeness == 'partial' ||
               needs.code-review.outputs.completeness == 'failed') }}
        shell: bash
        run: echo 'Partial/incomplete OCR review recorded — not all selected files completed.'

      - name: 'Record OCR outcome: success'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure != 'true' &&
              needs.code-review.outputs.completeness != 'partial' &&
              needs.code-review.outputs.completeness != 'failed' }}
        shell: bash
        run: echo 'Successful OCR review recorded.'

      - name: 'Record OCR outcome: unexpected-failure'
        if: >-
          ${{ needs.code-review.result == 'failure' &&
              needs.code-review.outputs.policy_failure != 'true' }}
        shell: bash
        run: echo 'Unexpected OCR job failure recorded.'

  record-skipped-ocr-outcome:
    name: Record skipped OCR outcome
    needs:
      - mergeability-gate
      - auto-review-gate
    if: >-
      ${{ !cancelled() &&
          needs.mergeability-gate.result == 'success' &&
          needs.auto-review-gate.result == 'success' &&
          (needs.mergeability-gate.outputs.should-run != 'true' ||
           needs.auto-review-gate.outputs.auto-should-run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 'Record OCR outcome: review-skipped'
        if: ${{ needs.mergeability-gate.outputs.should-run != 'true' }}
        shell: bash
        run: echo 'OCR review skipped by the mergeability gate.'

      - name: 'Record OCR outcome: auto-review-suspended'
        if: ${{ needs.mergeability-gate.outputs.should-run == 'true' && needs.auto-review-gate.outputs.auto-should-run != 'true' }}
        shell: bash
        run: echo 'OCR review skipped — automatic review limit reached.'
