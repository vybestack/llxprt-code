name: OCR Review

# Runs OpenCodeReview (OCR) on pull requests alongside the existing review
# bot. OCR is an observational, non-required review signal while it is being
# proven out. The existing review bot (pr-review.yml) remains enabled and
# untouched.
#
# Fork-safety model: this workflow uses `pull_request_target` so repository
# secrets are available for fork PRs, but it NEVER checks out or executes
# PR-supplied code/config while secrets are in scope. The trusted base
# branch is checked out first; the PR head is fetched into an explicit local
# ref and read for diff computation only. No make/cargo/npm-repo-scripts are
# invoked. OCR rules/config are configured from variables+secret only; no
# PR-supplied OCR rules are loaded.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      concurrency:
        description: 'OCR concurrency (canary experiment, issue #2673)'
        required: true
        type: choice
        default: '3'
        options:
          - '2'
          - '3'
          - '4'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        (github.event.comment.body == '/ocr' ||
         startsWith(github.event.comment.body, '/ocr ') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\n') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/ocr\t') ||
         github.event.comment.body == '/open-code-review' ||
         startsWith(github.event.comment.body, '/open-code-review ') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\n') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/open-code-review\t') ||
         github.event.comment.body == '/review' ||
         startsWith(github.event.comment.body, '/review ') ||
         startsWith(toJSON(github.event.comment.body), '"/review\n') ||
         startsWith(toJSON(github.event.comment.body), '"/review\r\n') ||
         startsWith(toJSON(github.event.comment.body), '"/review\t'))) ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'edited' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type == 'Bot' &&
        contains(github.event.comment.body, '<!-- llxprt-code-ocr-review -->'))) &&
      format('{0}-pr-{1}', github.workflow,
        github.event.pull_request.number || github.event.issue.number || inputs.pr_number) ||
      format('{0}-run-{1}', github.workflow, github.run_id)
    }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Keep CI reviews deterministic by disabling OCR self-update checks.
  OCR_NO_UPDATE: '1'
  # Disable colorized CLI output so text parsers (e.g. the changed-test
  # scope guard) always see plain text.
  NO_COLOR: '1'
  OCR_VERSION: '1.8.4'
  # Issue #2673: workflow_dispatch canaries select OCR concurrency (2, 3, or
  # 4). All other (automatic/comment) triggers resolve to the evidence-backed
  # default of 3 (canary 3 showed 43% speedup over 2 with zero 429s/retries).
  OCR_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '3' }}

jobs:
  mergeability-gate:
    name: Mergeability gate
    uses: ./.github/workflows/_pr-mergeability-gate.yml
    # The gate caller owns the exact authorized event/comment predicate so
    # unauthorized and non-PR comments cannot enter the concurrency group.
    # workflow_dispatch bypasses mergeability checking intentionally.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '/ocr' ||
        startsWith(github.event.comment.body, '/ocr ') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\n') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/ocr\t') ||
        github.event.comment.body == '/open-code-review' ||
        startsWith(github.event.comment.body, '/open-code-review ') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\n') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/open-code-review\t') ||
        github.event.comment.body == '/review' ||
        startsWith(github.event.comment.body, '/review ') ||
        startsWith(toJSON(github.event.comment.body), '"/review\n') ||
        startsWith(toJSON(github.event.comment.body), '"/review\r\n') ||
        startsWith(toJSON(github.event.comment.body), '"/review\t'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'edited' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type == 'Bot' &&
       contains(github.event.comment.body, '<!-- llxprt-code-ocr-review -->'))
    with:
      check-mergeability: ${{ github.event_name != 'workflow_dispatch' }}
      pull-request-number: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
      expected-head-sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

  auto-review-gate:
    name: Auto-review limit gate
    needs:
      - mergeability-gate
    # Runs only when the mergeability gate permits work. This gate owns the
    # OCR auto-review suspension logic (issue #2666) so the shared reusable
    # gate stays a pure mergeability oracle.
    if: |
      needs.mergeability-gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      auto-should-run: ${{ steps.auto-decide.outputs.auto-should-run }}
      suspended: ${{ steps.auto-decide.outputs.suspended }}
      is-manual: ${{ steps.auto-decide.outputs.is-manual }}
      current-count: ${{ steps.auto-decide.outputs.current-count }}
    steps:
      - name: Decide auto-review limit
        id: auto-decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
          OCR_AUTO_REVIEW_LIMIT: ${{ vars.OCR_AUTO_REVIEW_LIMIT }}
          OCR_AUTO_REVIEW_LIMIT_DEFAULT: '2'
          OCR_BOT_LOGIN: ${{ vars.OCR_BOT_LOGIN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          CHANGES_FROM: ${{ github.event.changes.body.from }}
        with:
          script: |
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved for auto-review gate.');
              return;
            }
            const eventName = process.env.EVENT_NAME || '';
            const eventAction = process.env.EVENT_ACTION || '';
            const commentBody = process.env.COMMENT_BODY || '';
            const commentUserType = process.env.COMMENT_USER_TYPE || '';
            const commentUserLogin = process.env.COMMENT_USER_LOGIN || '';
            const commentIdRaw = process.env.COMMENT_ID || '';
            const changesFrom = process.env.CHANGES_FROM || '';
            const limitRaw = process.env.OCR_AUTO_REVIEW_LIMIT ||
              process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2';
            const parsedLimit = Number(limitRaw);
            const limit = (Number.isInteger(parsedLimit) && parsedLimit >= 0)
              ? parsedLimit
              : Number(process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2');
            const isManualTrigger =
              eventName === 'workflow_dispatch' ||
              (eventName === 'issue_comment' && eventAction === 'created');
            const isEditedComment =
              eventName === 'issue_comment' && eventAction === 'edited';
            // --- BEGIN OCR TRUSTED MARKER SNIPPET ---
            const OCR_DEFAULT_TRUSTED_MARKER_LOGINS = ['github-actions[bot]'];
            function normalizeTrustedMarkerLogin(value) {
              return typeof value === 'string' ? value.trim().toLowerCase() : '';
            }
            function resolveTrustedMarkerLogins(...sources) {
              const logins = new Set();
              for (const login of OCR_DEFAULT_TRUSTED_MARKER_LOGINS) {
                logins.add(login);
              }
              for (const source of sources) {
                if (typeof source === 'string') {
                  const tokens = source.split(/[\s,;]+/);
                  for (const token of tokens) {
                    const normalized = normalizeTrustedMarkerLogin(token);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                } else if (Array.isArray(source)) {
                  for (const element of source) {
                    const normalized = normalizeTrustedMarkerLogin(element);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                }
              }
              return logins;
            }
            function isTrustedMarkerAuthor(user, trustedLogins) {
              if (user === null || typeof user !== 'object' || Array.isArray(user)) {
                return false;
              }
              if (user.type !== 'Bot') {
                return false;
              }
              const login = normalizeTrustedMarkerLogin(user.login);
              if (!login) {
                return false;
              }
              if (!(trustedLogins instanceof Set)) {
                return false;
              }
              return trustedLogins.has(login);
            }
            function isTrustedMarkerComment(comment, trustedLogins, marker) {
              if (
                comment === null ||
                typeof comment !== 'object' ||
                Array.isArray(comment)
              ) {
                return false;
              }
              if (typeof comment.body !== 'string') {
                return false;
              }
              if (typeof marker !== 'string' || marker.length === 0) {
                return false;
              }
              if (!comment.body.includes(marker)) {
                return false;
              }
              return isTrustedMarkerAuthor(comment.user, trustedLogins);
            }
            // Duplicate-id deduplication rule: if two trusted markers share the same
            // id (concurrent/reattempted API payloads), only the first encountered is
            // retained. This guarantees deleteDuplicateMarkerComments never receives an
            // id list containing the canonical comment's own id.
            function trustedMarkerComments(comments, trustedLogins, marker) {
              if (!Array.isArray(comments)) {
                return [];
              }
              const trusted = comments.filter(function (c) {
                return isTrustedMarkerComment(c, trustedLogins, marker);
              });
              const seenIds = new Set();
              const deduped = [];
              for (const comment of trusted) {
                if (!Number.isSafeInteger(comment.id) || comment.id <= 0) {
                  continue;
                }
                if (!seenIds.has(comment.id)) {
                  seenIds.add(comment.id);
                  deduped.push(comment);
                }
              }
              return deduped.sort(function (a, b) {
                return a.id - b.id;
              });
            }
            function canonicalMarkerComment(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              return trusted.length > 0 ? trusted[0] : null;
            }
            function newestTrustedMarkerMatching(
              comments,
              trustedLogins,
              marker,
              predicate,
            ) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              const pred =
                typeof predicate === 'function'
                  ? predicate
                  : function () {
                      return true;
                    };
              let result = null;
              for (const comment of trusted) {
                if (pred(comment)) {
                  result = comment;
                }
              }
              return result;
            }
            function parseHiddenAutoCount(body) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(
                String(body === null || body === undefined ? '' : body),
              );
              if (!match) {
                return 0;
              }
              const parsed = Number(match[1]);
              return Number.isSafeInteger(parsed) && parsed >= 0 ? parsed : 0;
            }
            function resolveHiddenAutoCount(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              let max = 0;
              for (const comment of trusted) {
                const count = parseHiddenAutoCount(comment.body);
                if (count > max) {
                  max = count;
                }
              }
              return max;
            }
            // --- END OCR TRUSTED MARKER SNIPPET ---
            // Issue #2860 Q1: the authenticated-user endpoint is only an
            // ADDITIONAL trust source. It returns 403 for the production
            // workflow token, so failure must never narrow trust below the
            // built-in github-actions[bot] default.
            let apiLogin = '';
            try {
              const { data: botUser } = await github.rest.users.getAuthenticated();
              apiLogin = botUser.login || '';
            } catch (e) {
              core.warning(`Could not resolve authenticated bot login: ${e.message || e}`);
            }
            const trustedLogins = resolveTrustedMarkerLogins(apiLogin, process.env.OCR_BOT_LOGIN);

            // ----- Helpers -----

            async function fetchCommentsOnce() {
              return github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              });
            }

            function replaceHiddenState(body, count) {
              let updated = body
                .replace(/<!--\s*ocr-auto-count:\s*\d+\s*-->/g, '')
                .replace(/<!--\s*ocr-suspended:\s*(?:true|false)\s*-->/g, '');
              updated += '\n<!-- ocr-auto-count:' + count + ' -->';
              return updated;
            }

            // ----- Checkbox-reset detection (issue_comment.edited) -----

            if (isEditedComment) {
              const commentIdNum = Number(commentIdRaw);
              const eventComment = {
                id: commentIdNum,
                body: commentBody,
                user: { type: commentUserType, login: commentUserLogin },
              };
              if (!isTrustedMarkerComment(eventComment, trustedLogins, MARKER)) {
                core.setOutput('auto-should-run', 'false');
                core.setOutput('suspended', 'false');
                core.setOutput('is-manual', 'false');
                core.setOutput('current-count', '0');
                return;
              }
              const wasUnchecked = /-\s*\[\s\]\s*Re-enable automatic reviews/.test(changesFrom);
              const nowChecked = /-\s*\[[xX]\]\s*Re-enable automatic reviews/.test(commentBody);
              if (wasUnchecked && nowChecked) {
                let resetSucceeded = false;
                try {
                  let marker = null;
                  let editedIsTrustedMarker = false;
                  try {
                    const resetComments = await fetchCommentsOnce();
                    marker = canonicalMarkerComment(resetComments, trustedLogins, MARKER);
                    // The edit must land on a trusted marker, but it need not
                    // be the canonical one: duplicates can exist transiently
                    // and the user checks whichever box they can see. Requiring
                    // identity with the canonical comment would silently ignore
                    // a legitimate re-enable. Trust still comes from
                    // isTrustedMarkerComment above, so an unrelated bot editing
                    // its own marker cannot reach here.
                    editedIsTrustedMarker = trustedMarkerComments(resetComments, trustedLogins, MARKER)
                      .some((candidate) => candidate.id === commentIdNum);
                  } catch (fetchErr) {
                    core.warning(`Failed to fetch marker comment for checkbox reset: ${fetchErr.message || fetchErr}`);
                  }
                  if (marker && editedIsTrustedMarker) {
                    const resetBody = replaceHiddenState(marker.body, 0);
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: marker.id,
                      body: resetBody,
                    });
                    resetSucceeded = true;
                  }
                } catch (writeErr) {
                  core.warning(`Failed to write reset counter to comment: ${writeErr.message || writeErr}`);
                }
                core.setOutput('auto-should-run', String(resetSucceeded));
                core.setOutput('suspended', 'false');
                core.setOutput('is-manual', String(resetSucceeded));
                core.setOutput('current-count', '0');
                return;
              }
              core.setOutput('auto-should-run', 'false');
              core.setOutput('suspended', 'false');
              core.setOutput('is-manual', 'false');
              core.setOutput('current-count', '0');
              return;
            }

            // ----- Read current state -----

            let currentCount = 0;
            try {
              const countComments = await fetchCommentsOnce();
              currentCount = resolveHiddenAutoCount(countComments, trustedLogins, MARKER);
            } catch (fetchErr) {
              core.warning(`Failed to read OCR sticky comment for auto-review state: ${fetchErr.message || fetchErr}`);
            }

            // ----- Decision -----

            if (isManualTrigger) {
              core.setOutput('auto-should-run', 'true');
              core.setOutput('suspended', 'false');
              core.setOutput('is-manual', 'true');
              core.setOutput('current-count', String(currentCount));
              return;
            }

            const suspended = currentCount >= limit;
            core.setOutput('auto-should-run', suspended ? 'false' : 'true');
            core.setOutput('suspended', suspended ? 'true' : 'false');
            core.setOutput('is-manual', 'false');
            core.setOutput('current-count', String(currentCount));

  post-suspension:
    name: Post OCR suspension message
    needs:
      - mergeability-gate
      - auto-review-gate
    # Runs only when the auto-review gate determined that reviews should be
    # suspended on an automatic trigger. This posts a sticky suspension
    # message with a re-enable checkbox and /review instructions.
    if: |
      needs.mergeability-gate.outputs.should-run == 'true' &&
      needs.auto-review-gate.outputs.suspended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post OCR suspension message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          PR_NUMBER: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number) }}
          CURRENT_COUNT: ${{ needs.auto-review-gate.outputs.current-count }}
          OCR_AUTO_REVIEW_LIMIT: ${{ vars.OCR_AUTO_REVIEW_LIMIT }}
          OCR_AUTO_REVIEW_LIMIT_DEFAULT: '2'
          OCR_BOT_LOGIN: ${{ vars.OCR_BOT_LOGIN }}
        with:
          script: |
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved for suspension message.');
              return;
            }
            const currentCount = Number(process.env.CURRENT_COUNT || '0');
            const limitRaw = process.env.OCR_AUTO_REVIEW_LIMIT ||
              process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2';
            const parsedLimit = Number(limitRaw);
            const limit = (Number.isInteger(parsedLimit) && parsedLimit >= 0)
              ? parsedLimit
              : Number(process.env.OCR_AUTO_REVIEW_LIMIT_DEFAULT || '2');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // --- BEGIN OCR TRUSTED MARKER SNIPPET ---
            const OCR_DEFAULT_TRUSTED_MARKER_LOGINS = ['github-actions[bot]'];
            function normalizeTrustedMarkerLogin(value) {
              return typeof value === 'string' ? value.trim().toLowerCase() : '';
            }
            function resolveTrustedMarkerLogins(...sources) {
              const logins = new Set();
              for (const login of OCR_DEFAULT_TRUSTED_MARKER_LOGINS) {
                logins.add(login);
              }
              for (const source of sources) {
                if (typeof source === 'string') {
                  const tokens = source.split(/[\s,;]+/);
                  for (const token of tokens) {
                    const normalized = normalizeTrustedMarkerLogin(token);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                } else if (Array.isArray(source)) {
                  for (const element of source) {
                    const normalized = normalizeTrustedMarkerLogin(element);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                }
              }
              return logins;
            }
            function isTrustedMarkerAuthor(user, trustedLogins) {
              if (user === null || typeof user !== 'object' || Array.isArray(user)) {
                return false;
              }
              if (user.type !== 'Bot') {
                return false;
              }
              const login = normalizeTrustedMarkerLogin(user.login);
              if (!login) {
                return false;
              }
              if (!(trustedLogins instanceof Set)) {
                return false;
              }
              return trustedLogins.has(login);
            }
            function isTrustedMarkerComment(comment, trustedLogins, marker) {
              if (
                comment === null ||
                typeof comment !== 'object' ||
                Array.isArray(comment)
              ) {
                return false;
              }
              if (typeof comment.body !== 'string') {
                return false;
              }
              if (typeof marker !== 'string' || marker.length === 0) {
                return false;
              }
              if (!comment.body.includes(marker)) {
                return false;
              }
              return isTrustedMarkerAuthor(comment.user, trustedLogins);
            }
            // Duplicate-id deduplication rule: if two trusted markers share the same
            // id (concurrent/reattempted API payloads), only the first encountered is
            // retained. This guarantees deleteDuplicateMarkerComments never receives an
            // id list containing the canonical comment's own id.
            function trustedMarkerComments(comments, trustedLogins, marker) {
              if (!Array.isArray(comments)) {
                return [];
              }
              const trusted = comments.filter(function (c) {
                return isTrustedMarkerComment(c, trustedLogins, marker);
              });
              const seenIds = new Set();
              const deduped = [];
              for (const comment of trusted) {
                if (!Number.isSafeInteger(comment.id) || comment.id <= 0) {
                  continue;
                }
                if (!seenIds.has(comment.id)) {
                  seenIds.add(comment.id);
                  deduped.push(comment);
                }
              }
              return deduped.sort(function (a, b) {
                return a.id - b.id;
              });
            }
            function canonicalMarkerComment(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              return trusted.length > 0 ? trusted[0] : null;
            }
            function newestTrustedMarkerMatching(
              comments,
              trustedLogins,
              marker,
              predicate,
            ) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              const pred =
                typeof predicate === 'function'
                  ? predicate
                  : function () {
                      return true;
                    };
              let result = null;
              for (const comment of trusted) {
                if (pred(comment)) {
                  result = comment;
                }
              }
              return result;
            }
            function parseHiddenAutoCount(body) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(
                String(body === null || body === undefined ? '' : body),
              );
              if (!match) {
                return 0;
              }
              const parsed = Number(match[1]);
              return Number.isSafeInteger(parsed) && parsed >= 0 ? parsed : 0;
            }
            function resolveHiddenAutoCount(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              let max = 0;
              for (const comment of trusted) {
                const count = parseHiddenAutoCount(comment.body);
                if (count > max) {
                  max = count;
                }
              }
              return max;
            }
            // --- END OCR TRUSTED MARKER SNIPPET ---
            // Issue #2860 Q1: the authenticated-user endpoint is only an
            // ADDITIONAL trust source. It returns 403 for the production
            // workflow token, so failure must never narrow trust below the
            // built-in github-actions[bot] default.
            let apiLogin = '';
            try {
              const { data: botUser } = await github.rest.users.getAuthenticated();
              apiLogin = botUser.login || '';
            } catch (e) {
              core.warning(`Could not resolve authenticated bot login: ${e.message || e}`);
            }
            const trustedLogins = resolveTrustedMarkerLogins(apiLogin, process.env.OCR_BOT_LOGIN);

            const NEWLINE = String.fromCharCode(10);
            const suspensionBlock = [
              MARKER,
              '## OpenCodeReview — automatic reviews suspended',
              '',
              'Automatic OCR reviews are **suspended** for this PR after ' + currentCount + ' of ' + limit + ' automatic reviews.',
              '',
              'To get more reviews you can:',
              '',
              '- Check the box below to re-enable automatic reviews (resets the counter), or',
              '- Comment `/review`, `/ocr`, or `/open-code-review` to request a single review on demand.',
              '',
              '- [ ] Re-enable automatic reviews',
              '',
              '<!-- ocr-auto-count:' + currentCount + ' -->',
            ].join(NEWLINE);

            async function fetchMarkerComments() {
              const allComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              return trustedMarkerComments(allComments, trustedLogins, MARKER);
            }

            function selectCanonicalMarker(markerComments) {
              return markerComments.length > 0 ? markerComments[0] : null;
            }

            function newestCheckpointFromMarkers(markerComments) {
              const checkpointPattern = /<!--\s*ocr-checkpoint:\s*([\s\S]*?)\s*-->/;
              let result = null;
              for (const comment of markerComments) {
                const match = checkpointPattern.exec(String(comment.body || ''));
                if (match && match[1].trim()) {
                  result = match[0];
                }
              }
              return result;
            }

            function resolveMergedMaxCount(markerComments) {
              let max = 0;
              for (const comment of markerComments) {
                const count = parseHiddenAutoCount(comment.body);
                if (count > max) {
                  max = count;
                }
              }
              return max;
            }

            async function deleteDuplicateMarkerComments(markerComments, keepId) {
              for (const duplicate of markerComments) {
                if (duplicate.id === keepId) {
                  continue;
                }
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: duplicate.id,
                  });
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                } catch (duplicateError) {
                  core.warning(`Failed to delete duplicate OCR marker comment ${duplicate.id}: ${duplicateError.message || duplicateError}`);
                }
              }
            }

            // Build the suspension body from a specific snapshot of marker
            // comments. Recomputed on the retry path so a marker posted
            // concurrently between the two fetches cannot have its higher
            // count or newer checkpoint overwritten by stale state.
            function buildSuspensionBody(markerSnapshot) {
              const snapshotCanonical = selectCanonicalMarker(markerSnapshot);
              const mergedMaxCount = resolveMergedMaxCount(markerSnapshot);
              const mergedCheckpoint = newestCheckpointFromMarkers(markerSnapshot);
              let body = suspensionBlock;
              if (snapshotCanonical && typeof snapshotCanonical.body === 'string') {
                const preserved = snapshotCanonical.body
                  .replace(MARKER, '')
                  .replace(/<!--\s*ocr-auto-count:\s*\d+\s*-->/g, '')
                  .replace(/<!--\s*ocr-suspended:\s*(?:true|false)\s*-->/g, '')
                  .replace(/<!--\s*ocr-checkpoint:[\s\S]*?-->/g, '')
                  .replace(/## OpenCodeReview — automatic reviews suspended[\s\S]*$/, '')
                  .trim();
                if (preserved) {
                  body = suspensionBlock + NEWLINE + NEWLINE + '---' + NEWLINE + NEWLINE + preserved;
                }
              }
              if (mergedMaxCount > currentCount) {
                body = body.replace(
                  /<!--\s*ocr-auto-count:\s*\d+\s*-->/g,
                  '',
                );
                body += NEWLINE + '<!-- ocr-auto-count:' + mergedMaxCount + ' -->';
              }
              if (mergedCheckpoint) {
                body += NEWLINE + mergedCheckpoint;
              }
              return body;
            }

            try {
              let markerComments = [];
              try {
                markerComments = await fetchMarkerComments();
              } catch (fetchErr) {
                core.warning(`Failed to fetch marker comments for suspension: ${fetchErr.message || fetchErr}`);
              }
              const canonical = selectCanonicalMarker(markerComments);
              const finalBody = buildSuspensionBody(markerComments);
              if (canonical) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: canonical.id, body: finalBody,
                });
                await deleteDuplicateMarkerComments(markerComments, canonical.id);
              } else {
                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number, body: finalBody,
                  });
                } catch (createErr) {
                  let retryMarkers = [];
                  try {
                    retryMarkers = await fetchMarkerComments();
                  } catch (retryErr) {
                    core.warning(`Post-create re-fetch failed: ${retryErr.message || retryErr}`);
                  }
                  const retryCanonical = selectCanonicalMarker(retryMarkers);
                  if (retryCanonical) {
                    // Recompute from the fresh snapshot: a concurrent marker
                    // may carry a higher count or newer checkpoint than the
                    // body built before the create attempt.
                    await github.rest.issues.updateComment({
                      owner, repo, comment_id: retryCanonical.id, body: buildSuspensionBody(retryMarkers),
                    });
                    await deleteDuplicateMarkerComments(retryMarkers, retryCanonical.id);
                  } else {
                    throw createErr;
                  }
                }
              }
            } catch (summaryError) {
              core.warning(`Failed to post OCR suspension message; continuing without failing the workflow: ${summaryError.message || summaryError}`);
            }

  code-review:
    name: OpenCodeReview
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Infrastructure failures are intentionally non-blocking for PR checks, but
    # this output lets downstream jobs distinguish a completed OCR review from a
    # review that could not run because of provider, install, or script issues.
    outputs:
      infrastructure_failure: ${{ steps.ocr-final-classification.outputs.infrastructure_failure }}
      policy_failure: ${{ steps.ocr-final-classification.outputs.policy_failure }}
      # Feature 5 (issue #2670): structured comment-count outputs.
      comments_total: ${{ steps.post-ocr-results.outputs.comments_total }}
      comments_inline: ${{ steps.post-ocr-results.outputs.comments_inline }}
      already_resolved: ${{ steps.post-ocr-results.outputs.already_resolved }}
      comments_skipped: ${{ steps.post-ocr-results.outputs.comments_skipped }}
      comments_failed: ${{ steps.post-ocr-results.outputs.comments_failed }}
      comments_routed_summary: ${{ steps.post-ocr-results.outputs.comments_routed_summary }}
      summary_comment_url: ${{ steps.post-ocr-results.outputs.summary_comment_url }}
      completeness: ${{ steps.ocr-final-classification.outputs.completeness }}
    # The code-review job runs only when the mergeability gate and the
    # auto-review gate both permit it.
    needs:
      - mergeability-gate
      - auto-review-gate
    if: |
      needs.mergeability-gate.outputs.should-run == 'true' &&
      needs.auto-review-gate.outputs.auto-should-run == 'true'
    steps:
      - name: Resolve PR context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        id: pr-context
        with:
          script: |
            const number = (context.payload.pull_request && context.payload.pull_request.number)
              || (context.issue && context.issue.number)
              || Number(context.payload.inputs && context.payload.inputs.pr_number);
            if (!number) {
              core.setFailed('Could not resolve a pull request number from the event.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('trusted_base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            // Business context for the LLM (Feature 1, issue #2670). The body
            // is truncated to keep the command-line length bounded.
            core.setOutput('pr_title', pr.title || '');
            const rawBody = typeof pr.body === 'string' ? pr.body : '';
            core.setOutput('pr_body', rawBody.slice(0, 2000));

      - name: Checkout trusted base
        # Fork-safety keystone: check out the trusted base branch (never the
        # PR head) so the working tree never reflects PR-supplied files.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ steps.pr-context.outputs.trusted_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Fetch PR head and compute merge-base
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          TRUSTED_BASE_SHA: ${{ steps.pr-context.outputs.trusted_base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          { set +x; } 2>/dev/null
          cleanup_git_auth() {
            set +e
            git config --global --unset-all safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset AUTH_B64
          }
          trap cleanup_git_auth EXIT
          trap 'cleanup_git_auth; exit 130' INT TERM
          trap 'cleanup_git_auth; exit 129' HUP
          umask 077
          GH_SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
          GH_SERVER_URL="${GH_SERVER_URL%/}/"
          # Scope safe.directory to this trusted workspace only (never '*').
          # Persist one entry for later steps, then also add it to the global
          # config while the fetch-step auth header is passed only to git fetch.
          git config --file "${HOME}/.gitconfig" --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Fetch the PR head into an explicit local ref WITHOUT making it the
          # working copy, so no PR-supplied scripts become executable.
          # The one-command env config makes auth explicit for this fetch even
          # when the runner's Git ignores the temp global config for HTTP auth.
          # Use basic auth with the x-access-token username, matching the
          # header format actions/checkout persists. GitHub's smart HTTP
          # endpoint rejects "bearer" for this token type, and git then
          # falls back to an interactive username prompt, which fails.
          AUTH_B64="$(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GH_SERVER_URL}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          if ! git fetch origin "pull/${PR_NUMBER}/head:pr-head"; then
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AUTH_B64
            echo "::error::Failed to fetch PR head ref."
            exit 1
          fi
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AUTH_B64
          if ! git cat-file -e "${TRUSTED_BASE_SHA}^{commit}"; then
            echo "::error::Trusted base SHA ${TRUSTED_BASE_SHA} is missing after trusted checkout. It may no longer be reachable from origin."
            exit 1
          fi

          MERGE_BASE_SHA="$(git merge-base "${TRUSTED_BASE_SHA}" pr-head)"
          FETCHED_HEAD="$(git rev-parse pr-head)"
          if [ "${FETCHED_HEAD}" != "${HEAD_SHA}" ]; then
            echo "::error::PR head changed between API resolution and fetch (expected ${HEAD_SHA}, got ${FETCHED_HEAD}). Re-run to review the latest push."
            exit 1
          fi
          cleanup_git_auth
          trap - EXIT INT TERM HUP
          {
            echo "TRUSTED_BASE_SHA=${TRUSTED_BASE_SHA}"
            echo "MERGE_BASE_SHA=${MERGE_BASE_SHA}"
            echo "HEAD_SHA=${HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Read OCR checkpoint
        id: read-checkpoint
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          OCR_BOT_LOGIN: ${{ vars.OCR_BOT_LOGIN }}
        with:
          script: |
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const checkpointPattern = /<!--\s*ocr-checkpoint:\s*([\s\S]*?)\s*-->/;
            const number = Number(process.env.PR_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // --- BEGIN OCR TRUSTED MARKER SNIPPET ---
            const OCR_DEFAULT_TRUSTED_MARKER_LOGINS = ['github-actions[bot]'];
            function normalizeTrustedMarkerLogin(value) {
              return typeof value === 'string' ? value.trim().toLowerCase() : '';
            }
            function resolveTrustedMarkerLogins(...sources) {
              const logins = new Set();
              for (const login of OCR_DEFAULT_TRUSTED_MARKER_LOGINS) {
                logins.add(login);
              }
              for (const source of sources) {
                if (typeof source === 'string') {
                  const tokens = source.split(/[\s,;]+/);
                  for (const token of tokens) {
                    const normalized = normalizeTrustedMarkerLogin(token);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                } else if (Array.isArray(source)) {
                  for (const element of source) {
                    const normalized = normalizeTrustedMarkerLogin(element);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                }
              }
              return logins;
            }
            function isTrustedMarkerAuthor(user, trustedLogins) {
              if (user === null || typeof user !== 'object' || Array.isArray(user)) {
                return false;
              }
              if (user.type !== 'Bot') {
                return false;
              }
              const login = normalizeTrustedMarkerLogin(user.login);
              if (!login) {
                return false;
              }
              if (!(trustedLogins instanceof Set)) {
                return false;
              }
              return trustedLogins.has(login);
            }
            function isTrustedMarkerComment(comment, trustedLogins, marker) {
              if (
                comment === null ||
                typeof comment !== 'object' ||
                Array.isArray(comment)
              ) {
                return false;
              }
              if (typeof comment.body !== 'string') {
                return false;
              }
              if (typeof marker !== 'string' || marker.length === 0) {
                return false;
              }
              if (!comment.body.includes(marker)) {
                return false;
              }
              return isTrustedMarkerAuthor(comment.user, trustedLogins);
            }
            // Duplicate-id deduplication rule: if two trusted markers share the same
            // id (concurrent/reattempted API payloads), only the first encountered is
            // retained. This guarantees deleteDuplicateMarkerComments never receives an
            // id list containing the canonical comment's own id.
            function trustedMarkerComments(comments, trustedLogins, marker) {
              if (!Array.isArray(comments)) {
                return [];
              }
              const trusted = comments.filter(function (c) {
                return isTrustedMarkerComment(c, trustedLogins, marker);
              });
              const seenIds = new Set();
              const deduped = [];
              for (const comment of trusted) {
                if (!Number.isSafeInteger(comment.id) || comment.id <= 0) {
                  continue;
                }
                if (!seenIds.has(comment.id)) {
                  seenIds.add(comment.id);
                  deduped.push(comment);
                }
              }
              return deduped.sort(function (a, b) {
                return a.id - b.id;
              });
            }
            function canonicalMarkerComment(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              return trusted.length > 0 ? trusted[0] : null;
            }
            function newestTrustedMarkerMatching(
              comments,
              trustedLogins,
              marker,
              predicate,
            ) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              const pred =
                typeof predicate === 'function'
                  ? predicate
                  : function () {
                      return true;
                    };
              let result = null;
              for (const comment of trusted) {
                if (pred(comment)) {
                  result = comment;
                }
              }
              return result;
            }
            function parseHiddenAutoCount(body) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(
                String(body === null || body === undefined ? '' : body),
              );
              if (!match) {
                return 0;
              }
              const parsed = Number(match[1]);
              return Number.isSafeInteger(parsed) && parsed >= 0 ? parsed : 0;
            }
            function resolveHiddenAutoCount(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              let max = 0;
              for (const comment of trusted) {
                const count = parseHiddenAutoCount(comment.body);
                if (count > max) {
                  max = count;
                }
              }
              return max;
            }
            // --- END OCR TRUSTED MARKER SNIPPET ---

            function deserializeCheckpoint(base64) {
              const normalized = typeof base64 === 'string' ? base64.trim() : '';
              if (!normalized || normalized.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) {
                return null;
              }
              try {
                const decoded = Buffer.from(normalized, 'base64').toString('utf8');
                const canonical = Buffer.from(decoded, 'utf8').toString('base64');
                if (canonical !== normalized) {
                  return null;
                }
                const checkpoint = JSON.parse(decoded);
                return checkpoint && typeof checkpoint === 'object' && !Array.isArray(checkpoint)
                  ? checkpoint
                  : null;
              } catch (_) {
                return null;
              }
            }

            function extractCheckpointFromComment(commentBody) {
              const match = checkpointPattern.exec(String(commentBody || ''));
              return match ? deserializeCheckpoint(match[1]) : null;
            }

            // Issue #2860 I2: a checkpoint is "usable" only if it is
            // structurally complete (schema 1, complete, 40-hex head/base).
            // This is checkpoint-specific, so it is kept OUT of the canonical
            // trusted-marker snippet.
            const SHA_PATTERN = /^[0-9a-f]{40}$/i;
            function isUsableCheckpoint(checkpoint) {
              return Boolean(
                checkpoint
                  && typeof checkpoint === 'object'
                  && checkpoint.schema === 1
                  && checkpoint.completion_state === 'complete'
                  && typeof checkpoint.head_sha === 'string'
                  && SHA_PATTERN.test(checkpoint.head_sha)
                  && typeof checkpoint.base_sha === 'string'
                  && SHA_PATTERN.test(checkpoint.base_sha),
              );
            }

            // Issue #2860: the authenticated-user endpoint is only an
            // ADDITIONAL trust source. It returns 403 for the production
            // workflow token, so failure must never narrow trust below the
            // built-in github-actions[bot] default.
            let apiLogin = '';
            try {
              const { data: botUser } = await github.rest.users.getAuthenticated();
              apiLogin = botUser.login || '';
            } catch (e) {
              core.warning(`Could not resolve authenticated bot login: ${e.message || e}`);
            }
            const trustedLogins = resolveTrustedMarkerLogins(apiLogin, process.env.OCR_BOT_LOGIN);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            // Issue #2860 I2: three-tier selection — prefer the newest trusted
            // marker carrying a structurally usable checkpoint; else the newest
            // trusted marker carrying any ocr-checkpoint comment; else the
            // canonical (oldest) trusted marker.
            const markerComment =
              newestTrustedMarkerMatching(comments, trustedLogins, MARKER, (c) => isUsableCheckpoint(extractCheckpointFromComment(c.body))) ||
              newestTrustedMarkerMatching(comments, trustedLogins, MARKER, (c) => checkpointPattern.test(String(c.body || ''))) ||
              canonicalMarkerComment(comments, trustedLogins, MARKER);
            const encodedMatch = markerComment
              ? checkpointPattern.exec(markerComment.body)
              : null;
            const checkpoint = markerComment
              ? extractCheckpointFromComment(markerComment.body)
              : null;
            const shaPattern = SHA_PATTERN;
            core.setOutput('CHECKPOINT_FOUND', String(Boolean(encodedMatch)));
            core.setOutput('CHECKPOINT_VALID', String(Boolean(checkpoint)));
            core.setOutput('CHECKPOINT_SCHEMA', String(checkpoint?.schema ?? ''));
            core.setOutput('CHECKPOINT_HEAD', shaPattern.test(checkpoint?.head_sha || '') ? checkpoint.head_sha : '');
            core.setOutput('CHECKPOINT_BASE_SHA', shaPattern.test(checkpoint?.base_sha || '') ? checkpoint.base_sha : '');
            core.setOutput('CHECKPOINT_COMPLETION', String(checkpoint?.completion_state || ''));
            core.setOutput('CHECKPOINT_VERSION', String(checkpoint?.ocr_version || ''));
            core.setOutput('CHECKPOINT_MODEL', String(checkpoint?.ocr_model || ''));
            core.setOutput('CHECKPOINT_RULES_HASH', String(checkpoint?.rules_hash || ''));
            core.setOutput('CHECKPOINT_POLICY_HASH', String(checkpoint?.policy_hash || ''));
            core.setOutput('CHECKPOINT_WORKFLOW_SCHEMA_HASH', String(checkpoint?.workflow_schema_hash || ''));
            core.setOutput('CHECKPOINT_ENCODED', checkpoint && encodedMatch ? encodedMatch[1].trim() : '');

      - name: Resolve review range
        id: resolve-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MERGE_BASE: ${{ env.MERGE_BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          API_BASE_SHA: ${{ steps.pr-context.outputs.trusted_base_sha }}
          OCR_VERSION: ${{ env.OCR_VERSION }}
          CHECKPOINT_FOUND: ${{ steps.read-checkpoint.outputs.CHECKPOINT_FOUND }}
          CHECKPOINT_VALID: ${{ steps.read-checkpoint.outputs.CHECKPOINT_VALID }}
          CHECKPOINT_SCHEMA: ${{ steps.read-checkpoint.outputs.CHECKPOINT_SCHEMA }}
          CHECKPOINT_HEAD: ${{ steps.read-checkpoint.outputs.CHECKPOINT_HEAD }}
          CHECKPOINT_BASE_SHA: ${{ steps.read-checkpoint.outputs.CHECKPOINT_BASE_SHA }}
          CHECKPOINT_COMPLETION: ${{ steps.read-checkpoint.outputs.CHECKPOINT_COMPLETION }}
          CHECKPOINT_VERSION: ${{ steps.read-checkpoint.outputs.CHECKPOINT_VERSION }}
          CHECKPOINT_MODEL: ${{ steps.read-checkpoint.outputs.CHECKPOINT_MODEL }}
          CHECKPOINT_RULES_HASH: ${{ steps.read-checkpoint.outputs.CHECKPOINT_RULES_HASH }}
          CHECKPOINT_POLICY_HASH: ${{ steps.read-checkpoint.outputs.CHECKPOINT_POLICY_HASH }}
          CHECKPOINT_WORKFLOW_SCHEMA_HASH: ${{ steps.read-checkpoint.outputs.CHECKPOINT_WORKFLOW_SCHEMA_HASH }}
          OCR_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_RULES_HASH: ${{ vars.OCR_RULES_HASH }}
          OCR_POLICY_HASH: ${{ vars.OCR_POLICY_HASH }}
          OCR_WORKFLOW_SCHEMA_HASH: ${{ vars.OCR_WORKFLOW_SCHEMA_HASH }}
        run: |
          set -euo pipefail
          IS_ANCESTOR=false
          if [ "$EVENT_NAME" = "pull_request_target" ] \
             && [ "$EVENT_ACTION" = "synchronize" ] \
             && [ "$CHECKPOINT_VALID" = "true" ] \
             && [ -n "$CHECKPOINT_HEAD" ]; then
            if git merge-base --is-ancestor "$CHECKPOINT_HEAD" "$HEAD_SHA"; then
              IS_ANCESTOR=true
            fi
          fi
          export IS_ANCESTOR

          mapfile -t RANGE_OUTPUT < <(node <<'NODE'
          function isAncestralCheckpoint(checkpoint, currentHeadSha, baseSha) {
            return Boolean(
              checkpoint
                && typeof checkpoint === 'object'
                && checkpoint.schema === 1
                && checkpoint.completion_state === 'complete'
                && typeof checkpoint.head_sha === 'string'
                && checkpoint.head_sha.length > 0
                && typeof currentHeadSha === 'string'
                && currentHeadSha.length > 0
                && checkpoint.base_sha === baseSha,
            );
          }

          function resolveReviewRange(input) {
            const checkpoint = input.checkpoint;
            const checkpointHead = checkpoint?.head_sha || '';
            const full = (reason = '') => ({
              FROM_SHA: input.mergeBase,
              RANGE_MODE: 'full',
              CHECKPOINT_HEAD: checkpointHead,
              FALLBACK_REASON: reason,
              CHECKPOINT_FOUND: Boolean(input.checkpointFound),
              SAME_HEAD: false,
            });
            if (input.eventName !== 'pull_request_target' || input.eventAction !== 'synchronize') {
              return full();
            }
            if (!input.checkpointFound) {
              return full('checkpoint-missing');
            }
            if (!checkpoint) {
              return full('checkpoint-corrupt');
            }
            if (checkpoint.schema !== 1) {
              return full('checkpoint-schema-mismatch');
            }
            if (checkpoint.completion_state !== 'complete') {
              return full('checkpoint-incomplete');
            }
            if (!checkpoint.head_sha) {
              return full('checkpoint-head-missing');
            }
            if (checkpoint.base_sha !== input.baseSha) {
              return full('base-sha-changed');
            }
            if (checkpoint.ocr_version !== input.ocrVersion) {
              return full('ocr-version-changed');
            }
            if (input.ocrModel && checkpoint.ocr_model && checkpoint.ocr_model !== input.ocrModel) {
              return full('ocr-model-changed');
            }
            if (input.rulesHash && checkpoint.rules_hash && checkpoint.rules_hash !== input.rulesHash) {
              return full('rules-hash-changed');
            }
            if (input.policyHash && checkpoint.policy_hash && checkpoint.policy_hash !== input.policyHash) {
              return full('policy-hash-changed');
            }
            if (input.workflowSchemaHash && checkpoint.workflow_schema_hash && checkpoint.workflow_schema_hash !== input.workflowSchemaHash) {
              return full('workflow-schema-changed');
            }
            if (!isAncestralCheckpoint(checkpoint, input.headSha, input.baseSha)) {
              return full('checkpoint-invalid');
            }
            if (checkpoint.head_sha === input.headSha) {
              return {
                FROM_SHA: checkpoint.head_sha,
                RANGE_MODE: 'noop',
                CHECKPOINT_HEAD: checkpoint.head_sha,
                FALLBACK_REASON: '',
                CHECKPOINT_FOUND: true,
                SAME_HEAD: true,
              };
            }
            if (!input.isAncestor) {
              return full('checkpoint-not-ancestor');
            }
            return {
              FROM_SHA: checkpoint.head_sha,
              RANGE_MODE: 'incremental',
              CHECKPOINT_HEAD: checkpoint.head_sha,
              FALLBACK_REASON: '',
              CHECKPOINT_FOUND: true,
              SAME_HEAD: false,
            };
          }

          const checkpoint = process.env.CHECKPOINT_VALID === 'true'
            ? {
                schema: Number(process.env.CHECKPOINT_SCHEMA),
                head_sha: process.env.CHECKPOINT_HEAD,
                base_sha: process.env.CHECKPOINT_BASE_SHA,
                completion_state: process.env.CHECKPOINT_COMPLETION,
                ocr_version: process.env.CHECKPOINT_VERSION,
                ocr_model: process.env.CHECKPOINT_MODEL || '',
                rules_hash: process.env.CHECKPOINT_RULES_HASH || '',
                policy_hash: process.env.CHECKPOINT_POLICY_HASH || '',
                workflow_schema_hash: process.env.CHECKPOINT_WORKFLOW_SCHEMA_HASH || '',
              }
            : null;
          const result = resolveReviewRange({
            eventName: process.env.EVENT_NAME,
            eventAction: process.env.EVENT_ACTION,
            mergeBase: process.env.MERGE_BASE,
            headSha: process.env.HEAD_SHA,
            baseSha: process.env.API_BASE_SHA,
            ocrVersion: process.env.OCR_VERSION,
            ocrModel: process.env.OCR_MODEL || '',
            rulesHash: process.env.OCR_RULES_HASH || '',
            policyHash: process.env.OCR_POLICY_HASH || '',
            workflowSchemaHash: process.env.OCR_WORKFLOW_SCHEMA_HASH || '',
            checkpointFound: process.env.CHECKPOINT_FOUND === 'true',
            checkpoint,
            isAncestor: process.env.IS_ANCESTOR === 'true',
          });
          for (const key of ['FROM_SHA', 'RANGE_MODE', 'CHECKPOINT_HEAD', 'FALLBACK_REASON', 'CHECKPOINT_FOUND', 'SAME_HEAD']) {
            console.log(String(result[key]));
          }
          NODE
          )
          FROM_SHA="${RANGE_OUTPUT[0]}"
          RANGE_MODE="${RANGE_OUTPUT[1]}"
          RESOLVED_CHECKPOINT_HEAD="${RANGE_OUTPUT[2]}"
          FALLBACK_REASON="${RANGE_OUTPUT[3]}"
          RESOLVED_CHECKPOINT_FOUND="${RANGE_OUTPUT[4]}"
          SAME_HEAD="${RANGE_OUTPUT[5]}"

          range_stats() {
            local from_sha="$1"
            local to_sha="$2"
            local files additions deletions
            files="$(git diff --name-only --diff-filter=d "${from_sha}..${to_sha}" | awk 'NF { count += 1 } END { print count + 0 }')"
            read -r additions deletions < <(git diff --numstat --diff-filter=d "${from_sha}..${to_sha}" | awk '$1 ~ /^[0-9]+$/ { additions += $1 } $2 ~ /^[0-9]+$/ { deletions += $2 } END { print additions + 0, deletions + 0 }')
            printf '%s %s %s\n' "$files" "$additions" "$deletions"
          }
          read -r CUMULATIVE_FILES CUMULATIVE_ADDITIONS CUMULATIVE_DELETIONS < <(range_stats "$MERGE_BASE" "$HEAD_SHA")
          read -r SELECTED_FILES SELECTED_ADDITIONS SELECTED_DELETIONS < <(range_stats "$FROM_SHA" "$HEAD_SHA")
          cat > ocr-range-metadata.json <<EOF
          {
            "cumulative": {
              "base_sha": "${MERGE_BASE}",
              "head_sha": "${HEAD_SHA}",
              "files": ${CUMULATIVE_FILES},
              "lines": { "additions": ${CUMULATIVE_ADDITIONS}, "deletions": ${CUMULATIVE_DELETIONS}, "total": $((CUMULATIVE_ADDITIONS + CUMULATIVE_DELETIONS)) }
            },
            "selected": {
              "base_sha": "${FROM_SHA}",
              "head_sha": "${HEAD_SHA}",
              "files": ${SELECTED_FILES},
              "lines": { "additions": ${SELECTED_ADDITIONS}, "deletions": ${SELECTED_DELETIONS}, "total": $((SELECTED_ADDITIONS + SELECTED_DELETIONS)) }
            }
          }
          EOF
          {
            echo "FROM_SHA=${FROM_SHA}"
            echo "RANGE_MODE=${RANGE_MODE}"
            echo "CHECKPOINT_HEAD=${RESOLVED_CHECKPOINT_HEAD}"
            echo "FALLBACK_REASON=${FALLBACK_REASON}"
            echo "CHECKPOINT_FOUND=${RESOLVED_CHECKPOINT_FOUND}"
            echo "SAME_HEAD=${SAME_HEAD}"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize OCR artifact files
        shell: bash
        run: |
          set -euo pipefail
          : > ocr-result.json
          : > ocr-stdout.raw
          : > ocr-stderr.log
          : > ocr-preflight.txt
          : > ocr-version.txt
          : > ocr-preview.txt
          : > ocr-preview-stderr.log
          : > ocr-exit-code.txt
          : > ocr-phase.txt
          : > ocr-infrastructure-failure.txt
          : > ocr-policy-failure.txt
          : > ocr-selected-files.txt
          : > ocr-status.txt
          : > ocr-preview-attempted.txt
          : > ocr-preview-succeeded.txt
          : > ocr-no-reviewable-files.txt
          : > ocr-reviewed-range-manifest.json
          : > ocr-manifest-hashes.json
          : > ocr-manifest-sha256.txt
          : > ocr-routing-decisions.json
          cat > ocr-workflow-helpers.sh <<'EOF'
          mark_infrastructure_failure() {
            echo "phase=$1; reason=$2" >> ocr-infrastructure-failure.txt
          }
          mark_policy_failure() {
            echo "$1" > ocr-policy-failure.txt
          }
          write_unavailable_coverage_report() {
            cat > ocr-coverage-report.json <<'JSON'
          {"schema_version":"1.0.0","counts":{"preview":0,"evidenced":0,"covered":0,"preview_only":0,"unexpected":0,"read_failures":0,"failed_preview":0},"coverage":{"ratio":1,"percentage":100},"preview_files":[],"evidenced_files":[],"covered_files":[],"preview_only_files":[],"unexpected_files":[],"failed_preview_files":[],"read_failure_files":[],"threshold_percentage":90,"ratio_below_threshold":false,"has_review_failures":false,"below_threshold":false,"evidence_available":false}
          JSON
          }
          EOF
          . ./ocr-workflow-helpers.sh
          write_unavailable_coverage_report

      - name: Install OpenCodeReview
        shell: bash
        run: |
          set -euo pipefail
          echo "install" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=install; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          OCR_PREFIX="${RUNNER_TEMP}/ocr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! npm install --prefix "$OCR_PREFIX" --ignore-scripts "@alibaba-group/open-code-review@${OCR_VERSION}" 2>> ocr-stderr.log; then
            echo "::warning::OpenCodeReview installation failed."
            echo "70" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview installation failed"
            exit 0
          fi
          OCR_BIN="${OCR_PREFIX}/node_modules/.bin"
          echo "$OCR_BIN" >> "$GITHUB_PATH"
          export PATH="${OCR_BIN}:${PATH}"
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command was not found after install."
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview command was not found after install"
            exit 0
          fi
          if ! ocr version > ocr-version.txt 2>> ocr-stderr.log; then
            echo "::warning::OpenCodeReview version check failed."
            echo "70" > ocr-exit-code.txt
            mark_infrastructure_failure "install" "OpenCodeReview version check failed"
            exit 0
          fi
          cat ocr-version.txt

      - name: Configure OCR review rules
        shell: bash
        # Project policy: changed test files must be reviewed. OCR's default
        # rules exclude test/spec files, so re-include them here. This config
        # is written from this trusted workflow only (env-provided JSON); no
        # PR-supplied OCR rules are ever loaded.
        #
        # The "rules" array carries generation-time prompt calibration (issue
        # #2678): senior-engineer review priorities, severity calibration,
        # JSDoc/documentation suppression, resource-leak emphasis, and the
        # maintainability-nit / test-suggestion suppressions that reduce
        # low-value noise. It explicitly protects bug/correctness/security
        # findings from suppression. When this calibration text changes, bump
        # the OCR_RULES_HASH repo variable so incremental-review checkpoints
        # invalidate and the updated rules take effect.
        #
        # Include patterns cover this TypeScript monorepo's test layout:
        # *.test.ts(x), *.spec.ts(x), *.test.js(x), *.spec.js(x),
        # *.test.mjs/cjs, *.spec.mjs/cjs, __tests__/**, tests/**, test/**.
        env:
          OCR_RULES_JSON: |
            {
              "rules": [
                {
                  "path": "**/*",
                  "merge_system_rule": true,
                  "rule": "Perform a thorough, senior-engineer review. Prioritize, in order: (1) Correctness/logic bugs — trace control flow, off-by-one, inverted conditions, wrong operator, state/race conditions, resource leaks, missing error/exception handling paths (including async rejections and promises whose catch does not cover synchronous throws in arguments). (2) Contract/intent mismatches — where the code's behavior contradicts its comments, names, or documented intent. (3) Edge cases & boundary conditions — empty/null/undefined, negative numbers, very large inputs, concurrent/early-init scenarios. (4) Type safety — avoid erasing discriminated unions to Record<string,unknown> or any; prefer narrowing. (5) Security — injection, unvalidated input, secrets. (6) Maintainability — dead/unreachable code, duplication, non-idiomatic patterns. For test files specifically: scrutinize whether assertions test behavior vs. implementation details (mock/spy call-counts are weak), coverage of edge/error cases, and missing scenarios. Always report each finding with the exact file path and line range, a concrete root-cause explanation, and a minimal fix. Do not speculate without grounding in the shown code. Additionally, enforce lint/complexity policy invariance and treat any weakening of static-analysis guardrails as High priority: (a) new suppression directives anywhere — eslint-disable / eslint-disable-next-line / eslint-disable-line / eslint-enable, file-level /* eslint-disable */, or TypeScript @ts-ignore / @ts-expect-error / @ts-nocheck; (b) any ESLint rule severity downgrade (error->warn or error->off) or a new 'off' entry; (c) any INCREASE to a complexity/size threshold (complexity, max-lines, max-lines-per-function, max-statements, max-params, max-depth, sonarjs/cognitive-complexity, or a 'max:' object option); (d) additions to .eslintignore or a config 'ignores:' block that excludes source from linting. For each, require that the underlying issue be fixed rather than silenced or loosened.\n\nSeverity and noise calibration: Do NOT report JSDoc/comment/documentation-only issues unless the comment actively contradicts the code, is an API/user-facing contract likely to mislead future maintainers/agents, or hides a real behavior mismatch. Do not nitpick missing/extra blank lines, comment completeness, wording, or whether a helper is called pure unless that wording materially misleads a future implementer into unsafe changes. Prefer code-behavior findings over comment/style findings. Reserve 'high' severity for correctness/security defects that cause wrong behavior, data loss, or vulnerabilities. Use 'medium' for behavioral concerns with real impact (error handling gaps, resource leaks, race conditions). Use 'low' only for minor style/maintainability items that do not affect behavior.\n\nDo NOT create exhaustive test-wishlist churn. Report missing tests only when the missing scenario protects issue-critical behavior, a plausible regression, cleanup/retry/error paths, security/isolation boundaries, concurrency/race behavior, or previously observed failures. Avoid requesting tests for trivial implementation details when equivalent behavior is already covered.\n\nDo treat resource leaks, async/sync cleanup gaps, swallowed cleanup failures, orphaned processes/sockets/tempdirs, race windows, unhandled promise/synchronous-throw paths, and state reset after failed cleanup as real code-quality findings. Do not down-rank these as mere edge-case nits when they can leak resources, orphan processes, mask failures, or break recoverability. Classify plausible leaks/recoverability bugs at least Medium, High when they can corrupt state, lose access to resources, or affect unrelated sessions.\n\nMaintainability-nit suppression (issue #2678): Do NOT report the following low-value maintainability patterns: (1) Hardcoded constants that are build-time, configuration, or test-fixture values — these are intentional and not a code smell; do not flag a constant in a build script, config, or test fixture as something that should be extracted or parameterized. (2) Error/diagnostic verbosity — do not suggest adding more arguments or context to error messages or spawn/process diagnostics unless the current diagnostics are actively misleading or missing actionable information needed to diagnose a real failure. (3) Naming style — do not suggest that a variable, function, or parameter name 'could be more descriptive' unless the name is actively misleading about the value or behavior it represents. (4) Modularity refactors — do not suggest extracting code to a shared file or helper 'for future reuse' unless there is active duplication (three or more copies of the same logic) that hurts maintainability today. These are style preferences, not defects.\n\nTest-suggestion suppression (issue #2678): Do NOT suggest adding a test unless a specific untested code path has a plausible defect (not merely 'untested'). Do not suggest refactoring existing test structure or adding tests that would change behavior. The codebase has established test patterns (contract, behavioral, structural); respect them and do not propose test reorganization.\n\nSignal preservation: Do NOT suppress bug, correctness, or security findings at any severity. These categories are the primary signal and must always be reported regardless of the suppression guidance above. Only low-value maintainability style-nits and non-actionable test suggestions are being suppressed.\n\nBefore returning findings, deduplicate by factual root cause or invariant. When one root cause affects multiple locations, emit one representative finding at the best current-source location and explicitly list every additional affected path or symbol as members; do not emit semantically equivalent rephrasings. Keep identical prose about different symbols or distinct invariants separate. Immediately before emitting each finding, re-read the current source and verify the path, symbol, line range, and quoted existing code. Correct mismatches and omit claims not supported by current source, tests, or contracts. Treat every finding as a hypothesis, not authority."
                }
              ],
              "include": [
                "**/*.test.{js,jsx,mjs,cjs,ts,tsx}",
                "**/*.spec.{js,jsx,mjs,cjs,ts,tsx}",
                "**/__tests__/**",
                "**/tests/**",
                "**/test/**"
              ],
              "exclude": [
                "**/node_modules/**",
                "**/dist/**",
                "**/build/**",
                "**/*.min.js",
                "**/generated/**",
                "**/vendor/**"
              ]
            }
        run: |
          mkdir -p "${HOME}/.opencodereview"
          printf '%s' "$OCR_RULES_JSON" > "${HOME}/.opencodereview/rule.json"

      - name: Configure OCR LLM settings
        shell: bash
        # Feature 2 & 7 (issue #2670): disable LLM "thinking" by default via
        # llm.extra_body, and set the review language. Both are overridable
        # through repository variables. Fork-safe: only trusted `ocr config
        # set` commands run here; no PR-supplied config is loaded.
        env:
          OCR_LLM_EXTRA_BODY: ${{ vars.OCR_LLM_EXTRA_BODY }}
          OCR_REVIEW_LANGUAGE: ${{ vars.OCR_REVIEW_LANGUAGE }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR LLM settings configuration because an earlier OCR setup failure was recorded."
            exit 0
          fi
          echo "config" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=config; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before LLM settings configuration."
            echo "OpenCodeReview command is unavailable before LLM settings configuration." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OpenCodeReview command is unavailable before LLM settings configuration"
            exit 0
          fi
          mkdir -p "${HOME}/.opencodereview"
          # Feature 2: disable thinking by default; allow override via the
          # OCR_LLM_EXTRA_BODY repository variable.
          EXTRA_BODY="${OCR_LLM_EXTRA_BODY:-}"
          if [ -z "$EXTRA_BODY" ]; then
            EXTRA_BODY='{"thinking": {"type": "disabled"}}'
          fi
          if ! ocr config set llm.extra_body "$EXTRA_BODY" >> ocr-stderr.log 2>&1; then
            echo "::warning::Failed to set OCR llm.extra_body."
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OCR llm.extra_body configuration failed"
            exit 0
          fi
          # Feature 7: set review language, defaulting to English.
          LANGUAGE="${OCR_REVIEW_LANGUAGE:-}"
          if [ -z "$LANGUAGE" ]; then
            LANGUAGE="English"
          fi
          if ! ocr config set language "$LANGUAGE" >> ocr-stderr.log 2>&1; then
            echo "::warning::Failed to set OCR review language."
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "config" "OCR review language configuration failed"
            exit 0
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            export OCR_CONFIG_PATH="${HOME}/.opencodereview/config.json"
            if [ ! -s "$OCR_CONFIG_PATH" ]; then
              echo "::error::Fresh OCR configuration file is missing."
              exit 1
            fi
            cat > ocr-config-endpoint-preflight.cjs <<'PREFLIGHT'
          'use strict';

          const fs = require('fs');
          const configPath = process.env.OCR_CONFIG_PATH;
          const environmentUrl = process.env.OCR_LLM_URL;
          if (typeof environmentUrl !== 'string' || environmentUrl.length === 0) {
            throw new Error('environment endpoint is missing');
          }
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const llm = config && typeof config === 'object' && !Array.isArray(config)
            ? config.llm : null;
          const endpointKeys = ['url', 'base_url', 'baseURL', 'endpoint', 'api_base'];
          const configuredEndpoint = llm && typeof llm === 'object' && !Array.isArray(llm)
            ? endpointKeys.some((key) => typeof llm[key] === 'string' && llm[key].length > 0)
            : false;
          const configuredProvider = llm && typeof llm === 'object' && !Array.isArray(llm) &&
            typeof llm.provider === 'string' && llm.provider.length > 0;
          if (configuredEndpoint || configuredProvider) {
            throw new Error('OCR config contains an endpoint/provider that could override environment resolution');
          }
          PREFLIGHT
            node ocr-config-endpoint-preflight.cjs
            CONFIGURED_EXTRA_BODY="$EXTRA_BODY" CONFIGURED_LANGUAGE="$LANGUAGE" node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('ocr-configured-settings.json', JSON.stringify({
            extra_body: process.env.CONFIGURED_EXTRA_BODY,
            language: process.env.CONFIGURED_LANGUAGE,
          }));
          NODE
          fi

      - name: Validate OCR configuration
        shell: bash
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR configuration validation because an earlier OCR setup failure was recorded."
            exit 0
          fi
          echo "validate" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=validate; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          missing=0
          if [ -z "${OCR_LLM_URL:-}" ]; then
            echo "::warning::Required variable OCR_LLM_URL is not set"
            echo "Required variable OCR_LLM_URL is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ -z "${OCR_LLM_TOKEN:-}" ]; then
            echo "::warning::Required secret OCR_LLM_AUTH_TOKEN is not set"
            echo "Required secret OCR_LLM_AUTH_TOKEN is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ -z "${OCR_LLM_MODEL:-}" ]; then
            echo "::warning::Required variable OCR_LLM_MODEL is not set"
            echo "Required variable OCR_LLM_MODEL is not set" >> ocr-stderr.log
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "78" > ocr-exit-code.txt
            mark_infrastructure_failure "validate" "OCR configuration is missing required variables or secrets"
            exit 0
          fi

      - name: Validate OCR LLM connectivity
        shell: bash
        env:
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR LLM connectivity check because an earlier OCR setup/configuration failure was recorded."
            exit 0
          fi
          echo "llm-preflight" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=llm-preflight; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before LLM connectivity check."
            echo "OpenCodeReview command is unavailable before LLM connectivity check." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "llm-preflight" "OpenCodeReview command is unavailable before LLM connectivity check"
            exit 0
          fi
          {
            echo "model=${OCR_LLM_MODEL:-unknown}"
            echo "provider-url=${OCR_LLM_URL:+configured}"
          } > ocr-preflight.txt
          set +e
          timeout 120s ocr llm test >> ocr-preflight.txt 2>&1
          preflight_status=$?
          set -e
          cat ocr-preflight.txt >> ocr-stderr.log
          if [ "$preflight_status" -ne 0 ]; then
            if [ "$preflight_status" -eq 124 ]; then
              echo "::warning::OCR LLM connectivity check timed out after 120s for model ${OCR_LLM_MODEL:-unknown}. Verify provider availability and network latency."
              mark_infrastructure_failure "llm-preflight" "OCR LLM connectivity check timed out (model=${OCR_LLM_MODEL:-unknown})"
            else
              echo "::warning::OCR LLM connectivity check failed for model ${OCR_LLM_MODEL:-unknown}. Verify OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, OCR_LLM_MODEL, and provider availability."
              mark_infrastructure_failure "llm-preflight" "OCR LLM connectivity check failed (model=${OCR_LLM_MODEL:-unknown})"
            fi
            echo "$preflight_status" > ocr-exit-code.txt
            exit 0
          fi

      - name: Verify review scope includes changed tests
        shell: bash
        env:
          FROM_SHA: ${{ github.event_name == 'workflow_dispatch' && env.MERGE_BASE_SHA || steps.resolve-range.outputs.FROM_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          RANGE_MODE: ${{ steps.resolve-range.outputs.RANGE_MODE }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR preview because an earlier OCR setup/configuration failure was recorded."
            exit 0
          fi
          if [ "${RANGE_MODE:-}" = "noop" ]; then
            echo "No-op range (same head); skipping OCR preview."
            exit 0
          fi
          echo "preview" > ocr-phase.txt
          : > ocr-preview.txt
          : > ocr-preview-stderr.log
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=preview; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          changed_tests="$(
            git diff --name-only --diff-filter=d "${FROM_SHA}..${HEAD_SHA}" \
              | grep -Ei '(^|/)(__tests__|tests?)/.*\.(ts|tsx|js|jsx|mjs|cjs)$|\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$' \
              || true
          )"
          echo "true" > ocr-preview-attempted.txt
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before preview."
            echo "OpenCodeReview command is unavailable before preview." >> ocr-preview-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "preview" "OpenCodeReview command is unavailable before preview"
            exit 0
          fi
          set +e
          ocr review --preview --from "$FROM_SHA" --to "$HEAD_SHA" \
            > ocr-preview.txt 2> ocr-preview-stderr.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not verify OCR preview scope for changed test files."
            echo "$status" > ocr-exit-code.txt
            mark_infrastructure_failure "preview" "OCR preview command failed"
            exit 0
          fi
          if ! sed -i 's/\x1b\[[0-9;?<>=]*[A-Za-z]//g; s/\x1b\][^\x07\x1b]*\(\x07\|\x1b\\\)//g' ocr-preview.txt; then
            echo "::warning::Could not normalize OCR preview output."
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "preview" "OCR preview normalization failed"
            exit 0
          fi
          if ! node <<'NODE'
          const fs = require('fs');

          function previewSelectionFromOutput(output) {
            const lines = String(output).split(/\r?\n/);
            const headingIndexes = [];
            for (let index = 0; index < lines.length; index += 1) {
              if (/^Will review\s*\(/.test(lines[index])) {
                headingIndexes.push(index);
              }
            }
            if (headingIndexes.length > 1) {
              throw new Error('OCR preview must contain at most one Will review heading');
            }
            if (headingIndexes.length === 0) {
              // OCR omits the "Will review" section entirely only when every
              // changed file is excluded from review (e.g. a docs-only PR).
              // That is a legitimate empty selection ONLY when the excluded
              // count provably equals the changed-file count. Enforce that
              // cardinality invariant (N = files changed, M = excluded) so a
              // truncated render that flushed the banner but lost the
              // "Will review"/"Excluded" sections is classified as an
              // infrastructure failure instead of silently shipping a PR
              // with genuinely reviewable code UNREVIEWED. Verified against
              // all confirmed docs-only production runs:
              //   30725255161 -> N=26, M=26
              //   30725089201 -> N=26, M=26
              //   30554832360 -> N=1,  M=1
              let changedCount = null;
              let excludedCount = null;
              for (const previewLine of lines) {
                const banner = /^Preview:\s*(\d+)\s+file\(s\)\s+changed/.exec(previewLine);
                if (banner) {
                  changedCount = Number.parseInt(banner[1], 10);
                }
                const excluded = /^Excluded(?:\s+from\s+review)?\s*\((\d+)\)/.exec(previewLine);
                if (excluded) {
                  excludedCount = Number.parseInt(excluded[1], 10);
                }
              }
              if (changedCount === null) {
                throw new Error('OCR preview output was malformed');
              }
              if (changedCount === 0) {
                return Object.freeze([]);
              }
              if (excludedCount === null || excludedCount !== changedCount) {
                throw new Error('OCR preview output was malformed');
              }
              return Object.freeze([]);
            }
            const headingIndex = headingIndexes[0];
            const heading = /^Will review\s*\(([^)]*)\):\s*$/.exec(lines[headingIndex]);
            if (!heading || !/^\d+$/.test(heading[1])) {
              throw new Error('OCR preview Will review count is malformed');
            }
            const declaredCount = Number(heading[1]);
            if (!Number.isSafeInteger(declaredCount) || declaredCount < 0) {
              throw new Error('OCR preview Will review count is unsafe');
            }
            const selected = [];
            const seen = new Set();
            for (const rawLine of lines.slice(headingIndex + 1)) {
              if (/^[A-Za-z][A-Za-z ]*\s*\(\d+\):\s*$/.test(rawLine)) {
                break;
              }
              let path = rawLine.trim()
                .replace(/^[-*]\s*/, '')
                .replace(/^\[[^\]]*\]\s*/, '')
                .replace(/\s+[-+]\d+(?:\s+[-+]\d+)?\s*$/, '')
                .trim();
              if ((path.startsWith('"') && path.endsWith('"'))
                || (path.startsWith("'") && path.endsWith("'"))) {
                path = path.slice(1, -1).trim();
              }
              if (path && !seen.has(path)) {
                seen.add(path);
                selected.push(path);
              }
            }
            if (selected.length !== declaredCount) {
              throw new Error(`OCR preview declared ${declaredCount} files but yielded ${selected.length} unique paths`);
            }
            return Object.freeze(selected);
          }

          const selected = previewSelectionFromOutput(
            fs.readFileSync('ocr-preview.txt', 'utf8'),
          );
          fs.writeFileSync(
            'ocr-selected-files.txt',
            selected.length > 0 ? `${selected.join('\n')}\n` : '',
          );
          NODE
          then
            echo "1" > ocr-exit-code.txt
            mark_infrastructure_failure "preview" "OCR preview extraction or cardinality validation failed"
            exit 0
          fi
          echo "true" > ocr-preview-succeeded.txt
          if [ ! -s ocr-selected-files.txt ]; then
            echo "true" > ocr-no-reviewable-files.txt
          fi
          reviewed="$(cat ocr-selected-files.txt)"
          if [ -n "$changed_tests" ]; then
            echo "Changed test/spec files detected that must be reviewed:"
            echo "$changed_tests"
            excluded="$(awk '
              BEGIN { IGNORECASE = 1; in_section = 0 }
              /^Excluded([[:space:]]+from[[:space:]]+review)?[[:space:]]*\(/ { in_section = 1; next }
              /^[[:alpha:] ]+[[:space:]]*\([0-9]+\):/ { if (in_section) in_section = 0 }
              in_section { print }
            ' ocr-preview.txt || true)"
            missing=""
            excluded_tests=""
            path_in_section() {
              awk -v target="$1" '
                {
                  line = $0
                  sub(/^[[:space:]]*/, "", line)
                  sub(/^[-*][[:space:]]*/, "", line)
                  sub(/^\[[^]]+\][[:space:]]*/, "", line)
                  sub(/^[[:space:]]*/, "", line)
                  split(line, fields, /[[:space:]]+/)
                  candidate = fields[1]
                  quote = sprintf("%c", 39)
                  if ((substr(candidate, 1, 1) == "\"" && substr(candidate, length(candidate), 1) == "\"") ||
                      (substr(candidate, 1, 1) == quote && substr(candidate, length(candidate), 1) == quote)) {
                    candidate = substr(candidate, 2, length(candidate) - 2)
                  }
                  if (candidate == target) found = 1
                }
                END { exit found ? 0 : 1 }
              '
            }
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              if ! echo "$reviewed" | path_in_section "$t"; then
                missing="${missing}${t}"$'\n'
              fi
              if echo "$excluded" | path_in_section "$t"; then
                excluded_tests="${excluded_tests}${t}"$'\n'
              fi
            done <<< "$changed_tests"
            if [ -n "$missing" ]; then
              echo "::error::OCR preview did not list changed test files in the reviewed set:"
              echo "$missing"
              echo "changed-test-missing" > ocr-phase.txt
              echo "1" > ocr-exit-code.txt
              mark_policy_failure "changed test files were missing from OCR reviewed set"
              exit 1
            fi
            if [ -n "$excluded_tests" ]; then
              echo "::error::OCR would exclude changed test files that must be reviewed:"
              echo "$excluded_tests"
              echo "changed-test-excluded" > ocr-phase.txt
              echo "1" > ocr-exit-code.txt
              mark_policy_failure "changed test files were excluded from OCR reviewed set"
              exit 1
            fi
          fi

      - name: Start OCR transport monitor
        id: ocr-transport-monitor
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TARGET_URL: ${{ vars.OCR_LLM_URL }}
        run: |
          set -euo pipefail
          if [ -s ocr-exit-code.txt ]; then
            echo "::error::Cannot start OCR transport monitor after a failed preflight."
            exit 1
          fi
          cat > ocr-transport-monitor.cjs <<'MONITOR'
          'use strict';

          const fs = require('fs');
          const http = require('http');
          const https = require('https');

          const telemetryPath = process.env.TELEMETRY_PATH;
          const readyPath = process.env.READY_PATH;
          const monitorSha256 = process.env.MONITOR_SHA256;
          const hopByHopHeaders = new Set([
            'connection', 'keep-alive', 'proxy-authenticate',
            'proxy-authorization', 'te', 'trailer',
            'transfer-encoding', 'upgrade',
          ]);
          const sockets = new Set();
          const responsesByStatus = {};
          const telemetry = {
            schema_version: 1,
            monitor_sha256: monitorSha256,
            bind_address: '127.0.0.1',
            target_protocol: '',
            shutdown_signal: null,
            shutdown_complete: false,
            total_requests: 0,
            upstream_errors: 0,
            responses_by_status: responsesByStatus,
            http_429_responses: 0,
            retry_events: 0,
            retry_count_header_missing: 0,
            retry_count_header_malformed: 0,
          };

          function atomicWriteJson(filePath, value) {
            if (typeof filePath !== 'string' || filePath.length === 0) {
              throw new Error('output path is required');
            }
            const temporaryPath = `${filePath}.${process.pid}.tmp`;
            fs.writeFileSync(temporaryPath, `${JSON.stringify(value)}\n`, { mode: 0o600 });
            fs.renameSync(temporaryPath, filePath);
          }

          function connectionNamedHeaders(headers) {
            const raw = headers.connection;
            const values = Array.isArray(raw) ? raw : [raw];
            const names = new Set();
            for (const value of values) {
              if (typeof value !== 'string') {
                continue;
              }
              for (const name of value.split(',')) {
                const normalized = name.trim().toLowerCase();
                if (normalized.length > 0) {
                  names.add(normalized);
                }
              }
            }
            return names;
          }

          function filteredHeaders(headers, additionalExcluded = []) {
            const excluded = new Set([
              ...hopByHopHeaders,
              ...connectionNamedHeaders(headers),
              ...additionalExcluded,
            ]);
            return Object.fromEntries(Object.entries(headers).filter(
              ([name]) => !excluded.has(name.toLowerCase()),
            ));
          }

          function forwardedHeaders(headers, target) {
            return {
              ...filteredHeaders(headers, ['host']),
              host: target.host,
            };
          }

          function observeRetryHeader(headers) {
            const raw = headers['x-stainless-retry-count'];
            if (raw === undefined) {
              telemetry.retry_count_header_missing += 1;
              return;
            }
            if (typeof raw !== 'string' || !/^(?:0|[1-9][0-9]*)$/.test(raw)) {
              telemetry.retry_count_header_malformed += 1;
              return;
            }
            if (raw !== '0') {
              telemetry.retry_events += 1;
            }
          }

          function observeResponse(statusCode) {
            const status = String(statusCode);
            responsesByStatus[status] = (responsesByStatus[status] || 0) + 1;
            if (statusCode === 429) {
              telemetry.http_429_responses += 1;
            }
          }

          function validatedTarget(rawTarget) {
            if (typeof rawTarget !== 'string' || rawTarget.trim() !== rawTarget || rawTarget.length === 0) {
              throw new Error('target URL is required');
            }
            const target = new URL(rawTarget);
            if ((target.protocol !== 'http:' && target.protocol !== 'https:') ||
                target.username || target.password || target.hash || !target.hostname) {
              throw new Error('target URL is invalid');
            }
            return target;
          }

          let target;
          try {
            target = validatedTarget(process.env.TARGET_URL);
            if (!/^[a-f0-9]{64}$/.test(monitorSha256 || '')) {
              throw new Error('monitor hash is invalid');
            }
            telemetry.target_protocol = target.protocol;
          } catch (_) {
            process.stderr.write('transport monitor startup failed\n');
            process.exit(1);
          }

          const server = http.createServer((request, response) => {
            telemetry.total_requests += 1;
            observeRetryHeader(request.headers);
            const transport = target.protocol === 'https:' ? https : http;
            const upstream = transport.request({
              protocol: target.protocol,
              hostname: target.hostname,
              port: target.port || undefined,
              method: request.method,
              path: request.url,
              headers: forwardedHeaders(request.headers, target),
            });
            let settled = false;
            upstream.on('response', (upstreamResponse) => {
              settled = true;
              observeResponse(upstreamResponse.statusCode || 0);
              response.writeHead(
                upstreamResponse.statusCode || 502,
                filteredHeaders(upstreamResponse.headers),
              );
              upstreamResponse.on('error', () => {
                response.destroy();
              });
              upstreamResponse.pipe(response);
            });
            upstream.once('error', () => {
              if (!settled) {
                settled = true;
                telemetry.upstream_errors += 1;
              }
              if (!response.headersSent) {
                response.writeHead(502, { 'content-type': 'text/plain' });
                response.end('upstream transport error');
              } else {
                response.destroy();
              }
              upstream.destroy();
            });
            request.once('aborted', () => {
              if (!settled) {
                settled = true;
              }
              upstream.destroy();
              response.destroy();
            });
            request.pipe(upstream);
          });

          server.on('connection', (socket) => {
            sockets.add(socket);
            socket.once('close', () => sockets.delete(socket));
          });
          server.once('error', () => {
            process.stderr.write('transport monitor server failed\n');
            process.exit(1);
          });

          let stopping = false;
          process.on('SIGTERM', () => {
            if (stopping) {
              return;
            }
            stopping = true;
            telemetry.shutdown_signal = 'SIGTERM';
            server.close(() => {
              telemetry.shutdown_complete = true;
              atomicWriteJson(telemetryPath, telemetry);
              process.exit(0);
            });
            if (typeof server.closeIdleConnections === 'function') {
              server.closeIdleConnections();
            }
            for (const socket of sockets) {
              socket.destroy();
            }
            setTimeout(() => {
              atomicWriteJson(telemetryPath, telemetry);
              process.exit(1);
            }, 5000).unref();
          });

          server.listen(0, '127.0.0.1', () => {
            const address = server.address();
            if (!address || typeof address === 'string') {
              process.exit(1);
            }
            const proxyUrl = new URL(target.pathname + target.search, `http://127.0.0.1:${address.port}`);
            atomicWriteJson(readyPath, {
              schema_version: 1,
              bind_address: '127.0.0.1',
              monitor_sha256: monitorSha256,
              proxy_url: proxyUrl.toString(),
            });
          });
          MONITOR
          monitor_sha256="$(shasum -a 256 ocr-transport-monitor.cjs | awk '{print $1}')"
          export READY_PATH="$PWD/ocr-transport-monitor-ready.json"
          export TELEMETRY_PATH="$PWD/ocr-transport-telemetry.json"
          export MONITOR_SHA256="$monitor_sha256"
          nohup node ocr-transport-monitor.cjs >/dev/null 2>&1 &
          monitor_pid=$!
          printf '%s\n' "$monitor_pid" > ocr-transport-monitor.pid
          for _ in $(seq 1 300); do
            if [ -s "$READY_PATH" ]; then
              break
            fi
            if ! kill -0 "$monitor_pid" 2>/dev/null; then
              echo "::error::OCR transport monitor exited during startup."
              exit 1
            fi
            sleep 0.1
          done
          PROXY_URL="$(node -e "const r=require(process.env.READY_PATH); if(r.bind_address!=='127.0.0.1'||r.monitor_sha256!==process.env.MONITOR_SHA256||!String(r.proxy_url||'').startsWith('http://127.0.0.1:'))process.exit(1); process.stdout.write(r.proxy_url)")"
          if [ -z "$PROXY_URL" ]; then
            echo "::error::OCR transport monitor did not publish valid readiness."
            exit 1
          fi
          echo "proxy_url=$PROXY_URL" >> "$GITHUB_OUTPUT"

      - name: Run OpenCodeReview
        shell: bash
        # Parse failures are handled distinctly in the posting step
        # (OCR failed vs. no findings).
        env:
          FROM_SHA: ${{ github.event_name == 'workflow_dispatch' && env.MERGE_BASE_SHA || steps.resolve-range.outputs.FROM_SHA }}
          RANGE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || steps.resolve-range.outputs.RANGE_MODE }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          OCR_LLM_URL: ${{ github.event_name == 'workflow_dispatch' && steps.ocr-transport-monitor.outputs.proxy_url || vars.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          EVENT_NAME: ${{ github.event_name }}
          # Feature 1 (issue #2670): business context for the LLM.
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          PR_TITLE: ${{ steps.pr-context.outputs.pr_title }}
          PR_BODY: ${{ steps.pr-context.outputs.pr_body }}
          OCR_BACKGROUND: ${{ vars.OCR_BACKGROUND }}
          # Feature 4 (issue #2670): configurable LLM review timeout.
          OCR_REVIEW_TIMEOUT: ${{ vars.OCR_REVIEW_TIMEOUT }}
        run: |
          set +e
          if [ -s ocr-exit-code.txt ]; then
            echo "::warning::Skipping OCR review because an earlier OCR setup/configuration/preview failure was recorded."
            exit 0
          fi
          # Issue #2676: capture the authoritative wall-clock start for the OCR
          # invocation under both success and failure paths. Written as epoch
          # seconds so the Capture OCR wall-clock step can compute a finite,
          # nonnegative duration.
          node -e 'process.stdout.write(String(Date.now()))' > ocr_wall_clock_start.txt
          if [ "$RANGE_MODE" = "noop" ]; then
            cat > ocr-result.json <<'EOF'
          {
            "status": "skipped",
            "message": "Same head; no new changes to review.",
            "summary": {
              "files_reviewed": 0,
              "comments": 0,
              "total_tokens": 0,
              "input_tokens": 0,
              "output_tokens": 0,
              "cache_read_tokens": 0,
              "cache_write_tokens": 0,
              "elapsed": "0s"
            },
            "comments": [],
            "warnings": []
          }
          EOF
            cp ocr-result.json ocr-stdout.raw
            echo "0" > ocr-exit-code.txt
            echo "noop" > ocr-phase.txt
            exit 0
          fi
          if [ "$(cat ocr-no-reviewable-files.txt 2>/dev/null || true)" = "true" ]; then
            cat > ocr-result.json <<'EOF'
          {
            "status": "skipped",
            "message": "No reviewable files in range; all changed files were excluded from review.",
            "summary": {
              "files_reviewed": 0,
              "comments": 0,
              "total_tokens": 0,
              "input_tokens": 0,
              "output_tokens": 0,
              "cache_read_tokens": 0,
              "cache_write_tokens": 0,
              "elapsed": "0s"
            },
            "comments": [],
            "warnings": []
          }
          EOF
            cp ocr-result.json ocr-stdout.raw
            echo "0" > ocr-exit-code.txt
            echo "no-reviewable-files" > ocr-phase.txt
            exit 0
          fi
          echo "review" > ocr-phase.txt
          if ! . ./ocr-workflow-helpers.sh; then
            echo "::warning::Could not load OCR workflow helper script."
            echo "127" > ocr-exit-code.txt
            echo "phase=review; reason=OCR workflow helper script could not be loaded" >> ocr-infrastructure-failure.txt
            exit 0
          fi
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::warning::OpenCodeReview command is unavailable before review."
            echo "OpenCodeReview command is unavailable before review." >> ocr-stderr.log
            echo "127" > ocr-exit-code.txt
            mark_infrastructure_failure "review" "OpenCodeReview command is unavailable before review"
            exit 0
          fi
          REVIEW_TIMEOUT="${OCR_REVIEW_TIMEOUT:-30}"
          case "$REVIEW_TIMEOUT" in
              ''|*[!0-9]*|0)
              echo "::warning::OCR_REVIEW_TIMEOUT is not a positive integer; falling back to 30."
              REVIEW_TIMEOUT=30
              ;;
          esac
          # Feature 1 (issue #2670): conditionally append business context
          # for the LLM. Gated behind OCR_BACKGROUND so existing behavior is
          # unchanged unless the repository variable opts in.
          REVIEW_ARGS=()
          if [ "${OCR_BACKGROUND:-}" = 'true' ]; then
            BACKGROUND_TEXT=$(printf -- '---BEGIN BUSINESS CONTEXT---\nPR %s: %s\n\n%s\n---END BUSINESS CONTEXT---' "${PR_NUMBER}" "${PR_TITLE}" "${PR_BODY}")
            if [ -n "${PR_TITLE}" ] || [ -n "${PR_BODY}" ]; then
              REVIEW_ARGS+=(--background "$BACKGROUND_TEXT")
            fi
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            export RESOLVED_REVIEW_TIMEOUT="$REVIEW_TIMEOUT"
            if [ "${#REVIEW_ARGS[@]}" -gt 0 ]; then
              export RESOLVED_BACKGROUND_ENABLED=true
              export RESOLVED_BACKGROUND_CONTEXT="$BACKGROUND_TEXT"
            else
              export RESOLVED_BACKGROUND_ENABLED=false
              unset RESOLVED_BACKGROUND_CONTEXT
            fi
            node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const enabled = process.env.RESOLVED_BACKGROUND_ENABLED === 'true';
          fs.writeFileSync('ocr-review-runtime.json', JSON.stringify({
            review_timeout_minutes: process.env.RESOLVED_REVIEW_TIMEOUT,
            background_enabled: enabled,
            background_context_sha256: enabled
              ? crypto.createHash('sha256').update(process.env.RESOLVED_BACKGROUND_CONTEXT).digest('hex')
              : null,
          }));
          NODE
          fi
          cat > ocr-command-timer.cjs <<'TIMER'
          'use strict';

          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const [command, ...args] = process.argv.slice(2);
          const timingPath = process.env.OCR_TIMING_PATH;
          const stdoutPath = process.env.OCR_STDOUT_PATH;
          const stderrPath = process.env.OCR_STDERR_PATH;
          if (!command || !timingPath || !stdoutPath || !stderrPath) {
            process.exit(125);
          }
          const stdoutFd = fs.openSync(stdoutPath, 'w', 0o600);
          const stderrFd = fs.openSync(stderrPath, 'w', 0o600);
          const startedAt = process.hrtime.bigint();
          const result = spawnSync(command, args, {
            env: process.env,
            stdio: ['ignore', stdoutFd, stderrFd],
          });
          const elapsedNanoseconds = process.hrtime.bigint() - startedAt;
          fs.closeSync(stdoutFd);
          fs.closeSync(stderrFd);
          const exitCode = Number.isInteger(result.status) ? result.status : 125;
          if (result.error) {
            fs.appendFileSync(stderrPath, `OCR command launch failed: ${result.error.message}\n`);
          } else if (result.signal) {
            fs.appendFileSync(stderrPath, `OCR command terminated by signal ${result.signal}\n`);
          }
          const timing = {
            schema_version: 1,
            command_wall_seconds: Number(elapsedNanoseconds) / 1e9,
            exit_code: exitCode,
          };
          const temporaryPath = `${timingPath}.${process.pid}.tmp`;
          fs.writeFileSync(temporaryPath, `${JSON.stringify(timing)}\n`, { mode: 0o600 });
          fs.renameSync(temporaryPath, timingPath);
          process.exit(exitCode);
          TIMER
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            export OCR_TIMING_PATH="$PWD/ocr-command-timing.json"
            export OCR_STDOUT_PATH="$PWD/ocr-stdout.raw"
            export OCR_STDERR_PATH="$PWD/ocr-stderr.log"
            node ocr-command-timer.cjs ocr review \
              --from "$FROM_SHA" \
              --to "$HEAD_SHA" \
              --format json \
              --audience agent \
              --timeout "$REVIEW_TIMEOUT" \
              --concurrency "$OCR_CONCURRENCY" \
              "${REVIEW_ARGS[@]}"
            status=$?
          else
            ocr review \
              --from "$FROM_SHA" \
              --to "$HEAD_SHA" \
              --format json \
              --audience agent \
              --timeout "$REVIEW_TIMEOUT" \
              --concurrency "$OCR_CONCURRENCY" \
              "${REVIEW_ARGS[@]}" \
              > ocr-stdout.raw 2> ocr-stderr.log
            status=$?
          fi
          if ! cp ocr-stdout.raw ocr-result.json; then
            : > ocr-result.json
          fi
          # Issue #2575: capture the upstream OCR JSON status field (e.g.
          # "success" vs "completed_with_errors") so the manifest can
          # classify partial coverage correctly.
          ocr_status=""
          if [ -s ocr-result.json ]; then
            ocr_status="$(node -e '
              try {
                const data = JSON.parse(require("fs").readFileSync("ocr-result.json", "utf8"));
                if (data && typeof data === "object" && typeof data.status === "string") {
                  process.stdout.write(data.status);
                }
              } catch (_) { /* best-effort; empty status means unknown */ }
            ' 2>/dev/null || true)"
          fi
          printf '%s' "$ocr_status" > ocr-status.txt
          echo "$status" > ocr-exit-code.txt
          if [ "$status" -ne 0 ]; then
            # OCR >= 1.8.0 writes a structured usage record (emitFailureUsage)
            # to stderr whenever a --format json review fails: a pretty-printed
            # top-level JSON object whose braces sit alone at column 0, holding
            # token counters, tool-call tallies and a session id. Those numbers
            # are accounting, not diagnostics, so drop the record before
            # classifying — otherwise a counter that happens to equal 429, 529,
            # 401 or 403 is read as an HTTP status.
            #
            # Only an object carrying the record's own signature (both the
            # "summary" and "tool_calls" members at the encoder's two-space
            # indent) is dropped; every other column-0 JSON object is buffered
            # and replayed, so a pretty-printed provider error payload keeps
            # its status code. The status-code patterns below are additionally
            # matched at token boundaries so a long counter or a hex session id
            # outside the record cannot match either.
            ocr_diagnostics="$(awk '
              /^\{$/ { buffered = $0; in_object = 1; summary_seen = 0; tools_seen = 0; next }
              in_object == 1 {
                buffered = buffered "\n" $0
                if ($0 ~ /^  "summary":/) { summary_seen = 1 }
                if ($0 ~ /^  "tool_calls":/) { tools_seen = 1 }
                if ($0 ~ /^\}$/) {
                  if (summary_seen == 0 || tools_seen == 0) { print buffered }
                  in_object = 0
                }
                next
              }
              { print }
              END { if (in_object == 1 && (summary_seen == 0 || tools_seen == 0)) { print buffered } }
            ' ocr-stderr.log)"
            if printf '%s\n' "$ocr_diagnostics" | grep -Eqi "(^|[^0-9A-Za-z_-])429([^0-9A-Za-z_-]|$)|rate limit"; then
              mark_infrastructure_failure "review" "OCR review failed: HTTP 429 rate limit"
            elif printf '%s\n' "$ocr_diagnostics" | grep -Eqi "(^|[^0-9A-Za-z_-])529([^0-9A-Za-z_-]|$)|overloaded"; then
              mark_infrastructure_failure "review" "OCR review failed: HTTP 529 provider overloaded"
            elif printf '%s\n' "$ocr_diagnostics" | grep -Eqi "(^|[^0-9A-Za-z_-])(401|403)([^0-9A-Za-z_-]|$)|auth|unauthorized|forbidden|invalid api key|invalid_api_key|api key"; then
              mark_infrastructure_failure "review" "OCR review failed: authentication or configuration error"
            elif printf '%s\n' "$ocr_diagnostics" | grep -Eqi "timeout|timed out"; then
              mark_infrastructure_failure "review" "OCR review failed: timeout"
            elif printf '%s\n' "$ocr_diagnostics" | grep -Eqi "all [0-9]+ file review(\(s\)|s)? failed"; then
              mark_infrastructure_failure "review" "all OCR per-file reviews failed; likely LLM provider/config/auth failure"
            else
              mark_infrastructure_failure "review" "OCR review command failed"
            fi
          fi
          exit 0

      - name: Stop OCR transport monitor
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s ocr-transport-monitor.pid ]; then
            echo "::error::OCR transport monitor PID is missing."
            exit 1
          fi
          monitor_pid="$(cat ocr-transport-monitor.pid)"
          case "$monitor_pid" in
            ''|*[!0-9]*)
              echo "::error::OCR transport monitor PID is invalid."
              exit 1
              ;;
          esac
          if ! kill -0 "$monitor_pid" 2>/dev/null; then
            echo "::error::OCR transport monitor was not running at teardown."
            exit 1
          fi
          kill -TERM "$monitor_pid"
          for _ in $(seq 1 100); do
            if ! kill -0 "$monitor_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$monitor_pid" 2>/dev/null; then
            echo "::error::OCR transport monitor did not stop cleanly."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const telemetry = JSON.parse(fs.readFileSync('ocr-transport-telemetry.json', 'utf8'));
          const responseCount = telemetry.responses_by_status &&
            typeof telemetry.responses_by_status === 'object' &&
            !Array.isArray(telemetry.responses_by_status)
            ? Object.values(telemetry.responses_by_status).reduce((sum, count) => sum + count, 0)
            : -1;
          if (telemetry.schema_version !== 1 ||
              telemetry.bind_address !== '127.0.0.1' ||
              telemetry.shutdown_signal !== 'SIGTERM' ||
              telemetry.shutdown_complete !== true ||
              !/^[a-f0-9]{64}$/.test(telemetry.monitor_sha256 || '') ||
              !Number.isInteger(telemetry.total_requests) || telemetry.total_requests <= 0 ||
              !Number.isInteger(telemetry.upstream_errors) || telemetry.upstream_errors < 0 ||
              responseCount + telemetry.upstream_errors !== telemetry.total_requests ||
              telemetry.retry_count_header_missing !== 0 ||
              telemetry.retry_count_header_malformed !== 0) {
            throw new Error('OCR transport monitor telemetry is invalid');
          }
          NODE

      - name: Capture OCR wall-clock
        # Issue #2676: compute the authoritative wall-clock duration of the
        # OCR invocation from the start marker captured in the Run
        # OpenCodeReview step. Runs under always() so a nonzero-exit OCR run
        # that started still yields a finite, nonnegative wall_clock_seconds.
        id: ocr-wall-clock
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          wall_clock_seconds=""
          if [ -s ocr_wall_clock_start.txt ]; then
            start="$(cat ocr_wall_clock_start.txt)"
            if [[ "$start" =~ ^[0-9]+$ ]]; then
              wall_clock_seconds="$(node -e '
                const start = Number(process.argv[1]);
                const elapsed = (Date.now() - start) / 1000;
                if (Number.isSafeInteger(start) && Number.isFinite(elapsed) && elapsed >= 0) {
                  process.stdout.write(String(elapsed));
                }
              ' "$start")"
            fi
          fi
          echo "wall_clock_seconds=${wall_clock_seconds}" >> "$GITHUB_OUTPUT"

      - name: Extract OCR files_reviewed
        # Issue #2676: extract the validated summary.files_reviewed count from
        # the OCR result envelope so the telemetry files_reviewed reflects the
        # OCR result (including completed_with_warnings) rather than the
        # conservative reviewed-range manifest completed set.
        id: ocr-files-reviewed
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          files_reviewed=""
          if [ -s ocr-result.json ]; then
            files_reviewed="$(node -e '
              try {
                const data = JSON.parse(require("fs").readFileSync("ocr-result.json", "utf8"));
                const n = data && typeof data === "object" ? data.summary?.files_reviewed : undefined;
                if (Number.isInteger(n) && n >= 0) {
                  process.stdout.write(String(n));
                }
              } catch (_) { /* unavailable */ }
            ' 2>/dev/null || true)"
          fi
          echo "files_reviewed=${files_reviewed}" >> "$GITHUB_OUTPUT"

      - name: Post OCR results
        id: post-ocr-results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          BASE_SHA: ${{ env.MERGE_BASE_SHA }}
          MERGE_BASE_SHA: ${{ env.MERGE_BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          API_BASE_SHA: ${{ steps.pr-context.outputs.trusted_base_sha }}
          API_HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          FROM_SHA: ${{ github.event_name == 'workflow_dispatch' && env.MERGE_BASE_SHA || steps.resolve-range.outputs.FROM_SHA }}
          RANGE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || steps.resolve-range.outputs.RANGE_MODE }}
          FALLBACK_REASON: ${{ steps.resolve-range.outputs.FALLBACK_REASON }}
          CHECKPOINT_BEFORE: ${{ steps.read-checkpoint.outputs.CHECKPOINT_ENCODED }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          OCR_VERSION: ${{ env.OCR_VERSION }}
          OCR_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_RULES_HASH: ${{ vars.OCR_RULES_HASH }}
          OCR_POLICY_HASH: ${{ vars.OCR_POLICY_HASH }}
          OCR_WORKFLOW_SCHEMA_HASH: ${{ vars.OCR_WORKFLOW_SCHEMA_HASH }}
          OCR_CONCURRENCY: ${{ env.OCR_CONCURRENCY }}
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          # Whether this run is an automatic (pull_request_target) trigger.
          # Automatic runs increment the auto-review counter; manual runs do not.
          IS_AUTOMATIC: ${{ needs.auto-review-gate.outputs.is-manual == 'false' }}
          # Exact OCR endpoint/credential values are provided only for redaction;
          # do not log process.env from this step.
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          # Feature 3 (issue #2670): incremental IoU overlap dedup mode.
          OCR_INCREMENTAL: ${{ vars.OCR_INCREMENTAL }}
          OCR_INCREMENTAL_OVERLAP_THRESHOLD: ${{ vars.OCR_INCREMENTAL_OVERLAP_THRESHOLD }}
          # Issue #2672: severity-based publication routing.
          # Shadow mode (default 'true') posts all findings inline but logs
          # routing decisions. Set to 'false' to go live (route low-severity
          # findings to the sticky summary).
          OCR_ROUTING_SHADOW_MODE: ${{ vars.OCR_ROUTING_SHADOW_MODE }}
          # Phase 2 (issue #2649): proactive inline comment cap. Comments in
          # excess of this number are routed to the sticky summary rather than
          # waiting for a large batch to fail. Default 50.
          OCR_INLINE_COMMENT_CAP: ${{ vars.OCR_INLINE_COMMENT_CAP }}
          # Additional trust source for comment dedup when OCR_BOT_LOGIN is set.
          OCR_BOT_LOGIN: ${{ vars.OCR_BOT_LOGIN }}
          # Issue #2675: configurable coverage threshold (0..100, default 90).
          OCR_COVERAGE_THRESHOLD: ${{ vars.OCR_COVERAGE_THRESHOLD }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- llxprt-code-ocr-review -->';
            const INLINE_MARKER = '<!-- llxprt-code-ocr-inline -->';
            const INFRA_FAILURE_FILE = 'ocr-infrastructure-failure.txt';
            const POLICY_FAILURE_FILE = 'ocr-policy-failure.txt';
            const REDACTION = '[REDACTED]';
            const KNOWN_CATEGORIES = new Set(['bug', 'maintainability', 'test', 'security', 'style']);
            const KNOWN_SEVERITIES = new Set(['high', 'medium', 'low']);
            const ocrTokenForRedaction = process.env.OCR_LLM_TOKEN;
            const ocrUrlForRedaction = process.env.OCR_LLM_URL;
            delete process.env.OCR_LLM_TOKEN;
            delete process.env.OCR_LLM_URL;
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed('No valid PR number resolved from pr-context step.');
              return;
            }
            const headSha = process.env.HEAD_SHA;
            if (!headSha) {
              core.setFailed('No valid HEAD_SHA resolved from environment.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // --- BEGIN OCR TRUSTED MARKER SNIPPET ---
            const OCR_DEFAULT_TRUSTED_MARKER_LOGINS = ['github-actions[bot]'];
            function normalizeTrustedMarkerLogin(value) {
              return typeof value === 'string' ? value.trim().toLowerCase() : '';
            }
            function resolveTrustedMarkerLogins(...sources) {
              const logins = new Set();
              for (const login of OCR_DEFAULT_TRUSTED_MARKER_LOGINS) {
                logins.add(login);
              }
              for (const source of sources) {
                if (typeof source === 'string') {
                  const tokens = source.split(/[\s,;]+/);
                  for (const token of tokens) {
                    const normalized = normalizeTrustedMarkerLogin(token);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                } else if (Array.isArray(source)) {
                  for (const element of source) {
                    const normalized = normalizeTrustedMarkerLogin(element);
                    if (normalized) {
                      logins.add(normalized);
                    }
                  }
                }
              }
              return logins;
            }
            function isTrustedMarkerAuthor(user, trustedLogins) {
              if (user === null || typeof user !== 'object' || Array.isArray(user)) {
                return false;
              }
              if (user.type !== 'Bot') {
                return false;
              }
              const login = normalizeTrustedMarkerLogin(user.login);
              if (!login) {
                return false;
              }
              if (!(trustedLogins instanceof Set)) {
                return false;
              }
              return trustedLogins.has(login);
            }
            function isTrustedMarkerComment(comment, trustedLogins, marker) {
              if (
                comment === null ||
                typeof comment !== 'object' ||
                Array.isArray(comment)
              ) {
                return false;
              }
              if (typeof comment.body !== 'string') {
                return false;
              }
              if (typeof marker !== 'string' || marker.length === 0) {
                return false;
              }
              if (!comment.body.includes(marker)) {
                return false;
              }
              return isTrustedMarkerAuthor(comment.user, trustedLogins);
            }
            // Duplicate-id deduplication rule: if two trusted markers share the same
            // id (concurrent/reattempted API payloads), only the first encountered is
            // retained. This guarantees deleteDuplicateMarkerComments never receives an
            // id list containing the canonical comment's own id.
            function trustedMarkerComments(comments, trustedLogins, marker) {
              if (!Array.isArray(comments)) {
                return [];
              }
              const trusted = comments.filter(function (c) {
                return isTrustedMarkerComment(c, trustedLogins, marker);
              });
              const seenIds = new Set();
              const deduped = [];
              for (const comment of trusted) {
                if (!Number.isSafeInteger(comment.id) || comment.id <= 0) {
                  continue;
                }
                if (!seenIds.has(comment.id)) {
                  seenIds.add(comment.id);
                  deduped.push(comment);
                }
              }
              return deduped.sort(function (a, b) {
                return a.id - b.id;
              });
            }
            function canonicalMarkerComment(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              return trusted.length > 0 ? trusted[0] : null;
            }
            function newestTrustedMarkerMatching(
              comments,
              trustedLogins,
              marker,
              predicate,
            ) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              const pred =
                typeof predicate === 'function'
                  ? predicate
                  : function () {
                      return true;
                    };
              let result = null;
              for (const comment of trusted) {
                if (pred(comment)) {
                  result = comment;
                }
              }
              return result;
            }
            function parseHiddenAutoCount(body) {
              const match = /<!--\s*ocr-auto-count:\s*(\d+)\s*-->/.exec(
                String(body === null || body === undefined ? '' : body),
              );
              if (!match) {
                return 0;
              }
              const parsed = Number(match[1]);
              return Number.isSafeInteger(parsed) && parsed >= 0 ? parsed : 0;
            }
            function resolveHiddenAutoCount(comments, trustedLogins, marker) {
              const trusted = trustedMarkerComments(comments, trustedLogins, marker);
              let max = 0;
              for (const comment of trusted) {
                const count = parseHiddenAutoCount(comment.body);
                if (count > max) {
                  max = count;
                }
              }
              return max;
            }
            // --- END OCR TRUSTED MARKER SNIPPET ---

            // Issue 1 (#2670): scope historical review-comment dedup to this
            // bot so a fork contributor cannot post an inline review comment
            // containing the INLINE_MARKER and suppress real findings.
            // Issue #2860: the authenticated-user endpoint is only an
            // ADDITIONAL trust source. It returns 403 for the production
            // workflow token, so failure must never narrow trust below the
            // built-in github-actions[bot] default.
            let apiLogin = '';
            try {
              const { data: botUser } = await github.rest.users.getAuthenticated();
              apiLogin = botUser.login || '';
            } catch (e) {
              core.warning(`Could not resolve authenticated bot login: ${e.message || e}`);
            }
            const trustedLogins = resolveTrustedMarkerLogins(apiLogin, process.env.OCR_BOT_LOGIN);

            function readTrimmed(fileName, fallback = '') {
              try {
                return fs.readFileSync(fileName, 'utf8').trim();
              } catch (_) {
                return fallback;
              }
            }

            function serializeCheckpoint(data) {
              return Buffer.from(
                JSON.stringify({ ...data, schema: 1 }),
                'utf8',
              ).toString('base64');
            }

            function deserializeCheckpoint(base64) {
              const normalized = typeof base64 === 'string' ? base64.trim() : '';
              if (!normalized || normalized.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) {
                return null;
              }
              try {
                const decoded = Buffer.from(normalized, 'base64').toString('utf8');
                if (Buffer.from(decoded, 'utf8').toString('base64') !== normalized) {
                  return null;
                }
                const checkpoint = JSON.parse(decoded);
                return checkpoint && typeof checkpoint === 'object' && !Array.isArray(checkpoint)
                  ? checkpoint
                  : null;
              } catch (_) {
                return null;
              }
            }

            function extractCheckpointFromComment(commentBody) {
              const match = /<!--\s*ocr-checkpoint:\s*([A-Za-z0-9+/=]+)\s*-->/.exec(String(commentBody || ''));
              return match ? deserializeCheckpoint(match[1]) : null;
            }

            function embedCheckpointInBody(body, checkpointData) {
              const checkpointComment = `<!-- ocr-checkpoint:${serializeCheckpoint(checkpointData)} -->`;
              const withoutCheckpoint = String(body || '')
                .replace(/<!--\s*ocr-checkpoint:[\s\S]*?-->/g, '')
                .trimEnd();
              return withoutCheckpoint
                ? `${withoutCheckpoint}\n${checkpointComment}`
                : checkpointComment;
            }

            function isAncestralCheckpoint(checkpoint, currentHeadSha, baseSha) {
              return Boolean(
                checkpoint
                  && typeof checkpoint === 'object'
                  && checkpoint.schema === 1
                  && checkpoint.completion_state === 'complete'
                  && typeof checkpoint.head_sha === 'string'
                  && checkpoint.head_sha.length > 0
                  && typeof currentHeadSha === 'string'
                  && currentHeadSha.length > 0
                  && checkpoint.base_sha === baseSha,
              );
            }

            function shouldAdvanceCheckpoint(decision) {
              if (!decision.ran
                || decision.exitCode !== 0
                || decision.infrastructureFailure
                || decision.policyFailure
                || decision.failedFindings !== 0
                || decision.completionState !== 'complete'
                || decision.manifestCompleteness !== 'complete'
                || decision.publicationState !== 'complete'
                || decision.previewValidated !== true
                || decision.completedFilesValid !== true
                || decision.resultSource === 'synthesized') {
                return false;
              }
              const selected = decision.selectedFiles;
              const completed = decision.completedFiles;
              const ocrCompleted = decision.ocrCompletedFiles;
              if (!Number.isSafeInteger(selected) || selected <= 0
                || !Number.isSafeInteger(completed) || completed < 0
                || !Number.isSafeInteger(ocrCompleted) || ocrCompleted < 0) {
                return false;
              }
              return completed === selected && ocrCompleted === selected;
            }

            function buildCheckpoint(data) {
              const eligibleFiles = Object.freeze([...data.eligibleFiles]);
              return Object.freeze({
                schema: 1,
                pr_number: data.prNumber,
                head_sha: data.headSha,
                base_sha: data.baseSha,
                merge_base: data.mergeBase,
                reviewed_at: data.reviewedAt,
                run_url: data.runUrl,
                ocr_version: data.ocrVersion,
                ocr_model: data.ocrModel,
                rules_hash: data.rulesHash,
                policy_hash: data.policyHash,
                workflow_schema_hash: data.workflowSchemaHash,
                completion_state: 'complete',
                range_mode: data.rangeMode,
                selected_files: eligibleFiles.length,
                completed_files: data.completedFiles,
                eligible_files: eligibleFiles,
                publication_state: data.publicationState,
              });
            }

            function completionStateForResult(status, resultSource) {
              if (resultSource === 'synthesized') {
                return 'partial';
              }
              return ['success', 'completed_with_warnings', 'skipped'].includes(status)
                ? 'complete'
                : 'partial';
            }

            function ocrObservabilityFromResult(result) {
              const summary = result && typeof result.summary === 'object' && result.summary
                ? result.summary
                : {};
              const cacheRead = Number(summary.cache_read_tokens || 0);
              const cacheWrite = Number(summary.cache_write_tokens || 0);
              const rawCompletedFiles = summary.files_reviewed;
              const completedFilesValid = typeof rawCompletedFiles === 'number'
                && Number.isSafeInteger(rawCompletedFiles)
                && rawCompletedFiles >= 0;
              const resultSource = result && typeof result === 'object'
                ? (result.resultSource || 'parsed')
                : 'parsed';
              return {
                completed_files: completedFilesValid ? rawCompletedFiles : 0,
                completed_files_valid: completedFilesValid,
                elapsed: String(summary.elapsed || 'unknown'),
                tokens: {
                  input: Number(summary.input_tokens || 0),
                  output: Number(summary.output_tokens || 0),
                  cache_read: cacheRead,
                  cache_write: cacheWrite,
                  cache: cacheRead + cacheWrite,
                  total: Number(summary.total_tokens || 0),
                },
                warnings: Array.isArray(result?.warnings) ? result.warnings : [],
                completion_state: completionStateForResult(result?.status, resultSource),
                result_source: resultSource,
              };
            }

            function findingDistribution(findings, fieldName) {
              const distribution = {};
              for (const finding of findings) {
                const rawValue = finding && typeof finding === 'object'
                  ? finding[fieldName]
                  : null;
                const value = typeof rawValue === 'string' && rawValue.length > 0
                  ? rawValue
                  : 'unknown';
                distribution[value] = (distribution[value] || 0) + 1;
              }
              return distribution;
            }

            function buildOcrMetadata(data) {
              return {
                schema: 1,
                event: {
                  name: data.eventName,
                  action: data.eventAction,
                  before: data.eventBefore,
                  after: data.eventAfter,
                },
                api_resolved: {
                  base_sha: data.apiBaseSha,
                  head_sha: data.apiHeadSha,
                },
                checkpoint: {
                  before: data.checkpointBefore,
                  after: data.checkpointAfter,
                },
                range: {
                  mode: data.rangeMode,
                  fallback_reason: data.fallbackReason,
                  cumulative: data.cumulative,
                  selected: data.selected,
                },
                ocr: {
                  version: data.ocrVersion,
                  model: data.model,
                  concurrency: data.concurrency,
                  elapsed: data.elapsed,
                  tokens: data.tokens,
                },
                findings: data.findings,
                warnings: data.warnings,
                terminal: {
                  completeness_state: data.completenessState,
                  publication_state: data.publicationState,
                },
                source_run_url: data.sourceRunUrl,
              };
            }

            function escapeRegExp(value) {
              return String(value).replace(/[\\^$.*+?()[\]{}|]/g, '\\$&');
            }

            function redactSecretDiagnostics(value) {
              let sanitized = String(value ?? '');
              const exactSecrets = [ocrTokenForRedaction, ocrUrlForRedaction]
                .filter((secret) => typeof secret === 'string' && secret.length > 0);
              for (const secret of exactSecrets) {
                try {
                  sanitized = sanitized.replace(new RegExp(escapeRegExp(secret), 'g'), REDACTION);
                } catch (_) {
                  sanitized = sanitized.split(secret).join(REDACTION);
                }
              }
              sanitized = sanitized
                .replace(/\b(Authorization\s*:\s*(?:(?:Bearer|Basic|token|ApiKey)\s+)?)([^\s,;]+)/gi, '$1[REDACTED]')
                .replace(/\b(x-api-key\s*:\s*)([^\s,;]+)/gi, '$1[REDACTED]')
                .replace(/\b(api[_-]?key\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/([?&](?:key|api[_-]?key|token)=)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(access[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(refresh[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(id[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, '$1[REDACTED]')
                .replace(/\b(token\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, '$1[REDACTED]')
                .replace(/\b(secret\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, '$1[REDACTED]');
              return sanitized;
            }

            function sanitizeExcerpt(value) {
              return redactSecretDiagnostics(value)
                .split('\n')
                .slice(0, 40)
                .join('\n') || '(empty)';
            }

            let ocrVersion = readTrimmed('ocr-version.txt', 'unknown');
            if (!ocrVersion) {
              ocrVersion = 'unknown';
            }
            const phase = readTrimmed('ocr-phase.txt', 'unknown') || 'unknown';
            let diagnosticPhase = phase;

            function markInfrastructureFailure(markerPhase, reason) {
              const message = redactSecretDiagnostics(`phase=${markerPhase}; reason=${reason}`);
              fs.writeFileSync(INFRA_FAILURE_FILE, `${message}\n`);
              diagnosticPhase = markerPhase;
              fs.writeFileSync('ocr-phase.txt', `${markerPhase}\n`);
              core.warning(`OCR infrastructure diagnostic recorded: ${message}`);
            }

            function stderrSection(title, fileName) {
              const excerpt = sanitizeExcerpt(readTrimmed(fileName, ''));
              return [
                `### ${title}`,
                '',
                '```text',
                excerpt.slice(0, 4000),
                '```',
              ];
            }

            function readExitCode(fileName) {
              const raw = readTrimmed(fileName, '');
              if (!raw) {
                return 1;
              }
              const parsed = Number(raw);
              return Number.isInteger(parsed) ? parsed : 1;
            }

            let ran = true;
            let findings = [];
            let parsedOcrResult = null;
            let rawFindingCount = 0;
            let schemaInvalidCount = 0;
            const overflowRouted = [];
            const policyFailure = readTrimmed(POLICY_FAILURE_FILE, '');
            const exitCode = readExitCode('ocr-exit-code.txt');
            if (exitCode !== 0) {
              ran = false;
            }
            function findingsFromParsed(parsed) {
              if (Array.isArray(parsed)) return parsed;
              // ocr --format json emits an object envelope with a comments
              // array (e.g. { "status": "success", "comments": [...] }).
              if (parsed && typeof parsed === 'object' && Array.isArray(parsed.comments)) {
                return parsed.comments;
              }
              return null;
            }

            function parseFindings(raw) {
              const ansiStripped = String(raw || '').replace(/\x1b\[[0-9;?<>=]*[A-Za-z]/g, '');
              const trimmed = ansiStripped.trim();
              if (!trimmed) {
                markInfrastructureFailure('parse', 'OCR output was empty or unusable');
                return null;
              }
              try {
                const result = JSON.parse(trimmed);
                const parsed = findingsFromParsed(result);
                if (!parsed) {
                  markInfrastructureFailure('parse', 'OCR output did not contain a supported findings array');
                } else {
                  parsedOcrResult = Array.isArray(result)
                    ? { status: 'success', comments: result, warnings: [], resultSource: 'synthesized' }
                    : { ...result, resultSource: result.resultSource || 'parsed' };
                }
                return parsed;
              } catch (parseErr) {
                const start = trimmed.indexOf('[');
                const end = trimmed.lastIndexOf(']');
                if (start < 0 || end <= start) {
                  markInfrastructureFailure('parse', `OCR output could not be parsed: ${parseErr.message || parseErr}`);
                  core.warning(redactSecretDiagnostics(`OCR result was not valid JSON and no JSON array could be extracted: ${parseErr.message || parseErr}`));
                  return null;
                }
                try {
                  const result = JSON.parse(trimmed.slice(start, end + 1));
                  const parsed = findingsFromParsed(result);
                  if (!parsed) {
                    markInfrastructureFailure('parse', 'OCR output did not contain a supported findings array');
                  } else {
                    parsedOcrResult = {
                      status: 'success',
                      comments: parsed,
                      warnings: [],
                      resultSource: 'synthesized',
                    };
                  }
                  return parsed;
                } catch (innerErr) {
                  markInfrastructureFailure('parse', `OCR output could not be parsed: ${innerErr.message || innerErr}`);
                  core.warning(redactSecretDiagnostics(`OCR result was not valid JSON and extracted array substring could not be parsed: ${innerErr.message || innerErr}`));
                  return null;
                }
              }
            }

            function validateFindingMetadata(finding) {
              // Non-object findings (e.g. a bare string) cannot carry metadata;
              // pass them through untouched so downstream rendering handles
              // them. Arrays report typeof 'object', so guard explicitly to
              // avoid silently spreading an array into a plain object.
              if (!finding || typeof finding !== 'object' || Array.isArray(finding)) {
                return finding;
              }
              const warnings = [];
              const normalized = { ...finding };

              const rawCategory = finding.category;
              if (!('originalCategory' in finding)) {
                normalized.originalCategory = rawCategory;
              }
              if (typeof rawCategory !== 'string' || !KNOWN_CATEGORIES.has(rawCategory)) {
                if (rawCategory !== undefined) {
                  warnings.push(`undocumented category '${redactSecretDiagnostics(String(rawCategory))}'`);
                }
                normalized.category = 'unknown';
              } else {
                normalized.category = rawCategory;
              }

              const rawSeverity = finding.severity;
              if (!('originalSeverity' in finding)) {
                normalized.originalSeverity = rawSeverity;
              }
              if (typeof rawSeverity !== 'string' || !KNOWN_SEVERITIES.has(rawSeverity)) {
                if (rawSeverity !== undefined) {
                  warnings.push(`undocumented severity '${redactSecretDiagnostics(String(rawSeverity))}'`);
                }
                normalized.severity = 'unknown';
              } else {
                normalized.severity = rawSeverity;
              }

              if (warnings.length > 0) {
                // Diagnostic emission is best-effort: a redaction or I/O
                // failure must never abort validation and suppress findings.
                try {
                  const location = finding.path
                    ? ` in ${finding.path}${Number.isInteger(finding.start_line) && finding.start_line > 0 ? `:${finding.start_line}` : ''}`
                    : '';
                  // Compose the full message before redacting so the path and
                  // any credential-like substrings spanning fields are sanitized.
                  const driftMessage = redactSecretDiagnostics(
                    `OCR schema drift${location}: ${warnings.join(', ')}.`,
                  );
                  core.warning(driftMessage);
                  // Mirror to stderr so schema drift is visible in the raw
                  // step log stream (ocr-stderr.log captures the OCR CLI
                  // process only; workflow warnings land in the step log).
                  process.stderr.write(driftMessage + String.fromCharCode(10));
                } catch (diagnosticErr) {
                  // The diagnostic channel itself may have failed, so avoid
                  // re-invoking it. Emit a minimal marker to stderr instead;
                  // if even that fails, swallow — findings must still flow.
                  try {
                    const NEWLINE = String.fromCharCode(10);
                    process.stderr.write('OCR schema-drift diagnostic emission failed.' + NEWLINE);
                  } catch (_) { /* best-effort; never suppress findings */ }
                }
              }

              return normalized;
            }

            function effectiveCategory(finding) {
              if (!finding || typeof finding !== 'object') return 'unknown';
              if (typeof finding.category === 'string' && finding.category && finding.category !== 'unknown') {
                return finding.category;
              }
              if (typeof finding.originalCategory === 'string' && finding.originalCategory && finding.originalCategory !== 'unknown') {
                return finding.originalCategory;
              }
              return 'unknown';
            }

            function effectiveSeverity(finding) {
              if (!finding || typeof finding !== 'object') return 'unknown';
              if (typeof finding.severity === 'string' && finding.severity && finding.severity !== 'unknown') {
                return finding.severity;
              }
              if (typeof finding.originalSeverity === 'string' && finding.originalSeverity && finding.originalSeverity !== 'unknown') {
                return finding.originalSeverity;
              }
              return 'unknown';
            }

            function routeFinding(finding) {
              if (!finding || typeof finding !== 'object' || Array.isArray(finding)) {
                return { destination: 'inline', reason: 'non-object finding: fail-safe inline' };
              }
              const category = effectiveCategory(finding);
              const severity = effectiveSeverity(finding);

              // Protected categories are always inline regardless of severity.
              if (category === 'bug' || category === 'security' || category === 'correctness') {
                return { destination: 'inline', reason: `category '${category}': always inline` };
              }

              // High/medium severity is always inline regardless of category.
              if (severity === 'high' || severity === 'medium') {
                return { destination: 'inline', reason: `severity '${severity}': inline` };
              }

              // Unknown category defaults to inline (fail-safe).
              const isKnownCategory = category === 'maintainability' || category === 'test' || category === 'style';
              if (!isKnownCategory && category !== 'other') {
                return { destination: 'inline', reason: `category '${category}': fail-safe inline` };
              }

              // Info severity is routed to summary.
              if (severity === 'info') {
                return { destination: 'summary', reason: `severity 'info': routed to summary` };
              }

              // Known or 'other' category with low severity → summary.
              if (severity === 'low') {
                return { destination: 'summary', reason: `category '${category}' severity 'low': routed to summary` };
              }

              // Remaining unknown severities default to inline (fail-safe).
              return { destination: 'inline', reason: `category '${category}' severity '${severity}': fail-safe inline` };
            }

            function categorySeverityLabel(finding) {
              if (!finding || typeof finding !== 'object') {
                return '';
              }
              const category = effectiveCategory(finding);
              const severity = effectiveSeverity(finding);
              return `**[${category}/${severity}]** `;
            }

            // Phase 2 (issue #2649): deterministic severity ranking for inline
            // comment sorting. Lower rank = higher priority = posted first.
            // Critical and unknown severities rank above low so protected
            // findings are never displaced by low-severity overflow.
            function severityRank(severity) {
              switch (severity) {
                case 'critical': return 0;
                case 'high': return 1;
                case 'medium': return 2;
                case 'unknown': return 3; // fail-safe: unknown ranks above low
                case 'low': return 4;
                case 'info': return 5;
                default: return 3; // undocumented → fail-safe above low
              }
            }

            // Phase 2 (issue #2649): deterministic inline comment sort.
            // Sorts an array of { comment, finding } pairs by severity
            // priority (critical/high first), then path (lexicographic), then
            // start_line (ascending), then end_line. Returns a new array; does
            // not mutate the input.
            function sortInlineComments(pairs) {
              return [...pairs].sort((a, b) => {
                const sevA = severityRank(a.comment._severity || 'unknown');
                const sevB = severityRank(b.comment._severity || 'unknown');
                if (sevA !== sevB) return sevA - sevB;
                const pathA = String(a.comment.path || '');
                const pathB = String(b.comment.path || '');
                if (pathA !== pathB) return pathA < pathB ? -1 : 1;
                const lineA = Number(a.comment.start_line || a.comment.line || 0);
                const lineB = Number(b.comment.start_line || b.comment.line || 0);
                if (lineA !== lineB) return lineA - lineB;
                const endA = Number(a.comment.line || 0);
                const endB = Number(b.comment.line || 0);
                return endA - endB;
              });
            }

            // Phase 2 (issue #2649): run-scoped finding fingerprint for
            // publication reconciliation within a single OCR run. Uses
            // Math.imul for correct 32-bit FNV-1a arithmetic. The fingerprint
            // is a per-run marker only (not a cross-push stable identity — that
            // is Phase 4 / upstream #369). Only a hex identifier is embedded in
            // the HTML comment; raw paths are never placed inside the marker
            // to prevent HTML-comment termination attacks.
            function findingFingerprint(finding, runId, index) {
              const startLine = Number((finding && finding.start_line) || 0);
              const endLine = Number((finding && finding.end_line) || 0);
              const lo = Math.min(startLine, endLine);
              const hi = Math.max(startLine, endLine);
              const category = effectiveCategory(finding);
              const severity = effectiveSeverity(finding);
              const body = String(
                (finding && (finding.content || finding.comment || finding.message || finding.body)) || '',
              );
              const hashInput = `${category}\u0000${severity}\u0000${lo}\u0000${hi}\u0000${body}`;
              let hash = 0x811c9dc5;
              for (let i = 0; i < hashInput.length; i++) {
                hash ^= hashInput.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193) >>> 0;
              }
              const hex = hash.toString(16).padStart(8, '0');
              return `ocr-${runId}-${index}-${hex}`;
            }

            function escapeMarkdownHtml(value) {
              return value
                .replace(new RegExp('&', 'g'), '&amp;')
                .replace(new RegExp('<', 'g'), '&lt;')
                .replace(new RegExp('>', 'g'), '&gt;');
            }

            function renderFindingText(value) {
              const sanitized = redactSecretDiagnostics(typeof value === 'string' && value ? value : 'OCR finding');
              const text = escapeMarkdownHtml(sanitized
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1'))
                .replace(/@/g, '@\u200b')
                .replace(/^(\s*[-*]\s*)\[[ xX]\]/gm, '$1\\[ \\]');
              return `> ${text.replace(/\n/g, '\n> ')}`;
            }

            function unrenderFindingText(value) {
              return redactSecretDiagnostics(String(value || 'OCR finding')
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/^> ?/gm, '')
                .trim());
            }

            function inlineCommentKey(comment) {
              const startLine = comment.start_line || '';
              return `${comment.path}\u0000${comment.line}\u0000${startLine}\u0000${unrenderFindingText(comment.body)}`;
            }

            function deduplicationKey(finding) {
              if (!finding || typeof finding !== 'object') return String(finding || '');
              const path = finding.path || '';
              const startLine = finding.start_line || '';
              const endLine = finding.end_line || '';
              const body = finding.content || finding.comment || finding.message || finding.body || '';
              return `${path}\u0000${startLine}\u0000${endLine}\u0000${redactSecretDiagnostics(String(body))}`;
            }

            function deduplicateFindings(findings) {
              const seen = new Map();
              const deduped = [];
              let suppressed = 0;
              for (const finding of findings) {
                const key = deduplicationKey(finding);
                if (seen.has(key)) {
                  suppressed += 1;
                } else {
                  seen.set(key, true);
                  deduped.push(finding);
                }
              }
              return { deduped, suppressed };
            }

            // Feature 3 (issue #2670): IoU (intersection-over-union) overlap
            // dedup for incremental comment posting. Ported from the upstream
            // post-review-comments.js module. These complement — and do not
            // replace — the content-based dedup above (deduplicateFindings).

            function resolveThreshold(raw) {
              const parsed = Number(raw);
              if (!Number.isFinite(parsed) || parsed <= 0 || parsed > 1) {
                return 0.6;
              }
              return parsed;
            }

            function lineSpan(c) {
              const start = Number(c.start_line || c.line || 0);
              const end = Number(c.line || c.start_line || 0);
              if (start <= 0 || end <= 0) {
                return { start: -1, end: -1, multiline: false, lineless: true };
              }
              const lo = Math.min(start, end);
              const hi = Math.max(start, end);
              return { start: lo, end: hi, multiline: lo !== hi, lineless: false };
            }

            function sameCommentSpan(cur, other, threshold) {
              // Lineless comments (no resolvable line numbers) never match.
              if (cur.lineless || other.lineless) {
                return false;
              }
              // Single-line vs single-line: match on the same line.
              // Multi-line vs multi-line: IoU > threshold.
              // Single vs multi: never match.
              if (cur.multiline !== other.multiline) {
                return false;
              }
              if (!cur.multiline) {
                return cur.start === other.start;
              }
              const overlap = Math.max(0, Math.min(cur.end, other.end) - Math.max(cur.start, other.start) + 1);
              const union = Math.max(cur.end, other.end) - Math.min(cur.start, other.start) + 1;
              return overlap / union > threshold;
            }

            async function existingReviewCommentSpans() {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return comments
                .filter((comment) => isTrustedMarkerComment(comment, trustedLogins, INLINE_MARKER)
                  && (comment.side === undefined || comment.side === 'RIGHT'))
                .map((comment) => ({
                  path: comment.path,
                  span: lineSpan({
                    line: comment.line || comment.original_line,
                    start_line: comment.start_line || comment.original_start_line,
                  }),
                }));
            }

            function overlapsHistory(reviewComment, history, threshold) {
              for (const existing of history) {
                if (reviewComment.path !== existing.path) {
                  continue;
                }
                if (sameCommentSpan(reviewComment.span, existing.span, threshold)) {
                  return true;
                }
              }
              return false;
            }

            async function existingInlineCommentKeys() {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              });
              return new Set(comments
                .filter((comment) => isTrustedMarkerComment(comment, trustedLogins, INLINE_MARKER)
                  && (comment.side === undefined || comment.side === 'RIGHT'))
                .map((comment) => inlineCommentKey({
                  path: comment.path,
                  line: comment.line || comment.original_line,
                  start_line: comment.start_line || comment.original_start_line,
                  body: comment.body,
                })));
            }

            // Issue #2575: reviewed-range manifest for completeness tracking.
            // A partial OCR run must never be mistaken for complete coverage.

            function resolveCompleteness(params) {
              const skipped = params.skipped === true;
              if (skipped) {
                return 'skipped';
              }
              // C1: exitCode must be a valid non-negative integer. NaN/missing
              // or negative values mean we cannot trust the OCR result, so
              // treat them as failures rather than silently coercing to 0.
              const rawExitCode = params.ocrExitCode;
              if (!Number.isInteger(rawExitCode) || rawExitCode < 0) {
                return 'failed';
              }
              if (rawExitCode !== 0) {
                return 'failed';
              }
              // C1: fail-closed. Only recognized success statuses ("success"
              // or "completed") can ever yield "complete". Every other value
              // (including empty/null/unknown) yields "partial" because we
              // lack positive proof of completeness.
              const status = typeof params.ocrStatus === 'string' ? params.ocrStatus : '';
              if (status !== 'success' && status !== 'completed') {
                return 'partial';
              }
              // C3: set-based completeness. Normalize (trim), deduplicate,
              // then verify that every selected file is covered.
              const normalize = (arr) =>
                Array.isArray(arr)
                  ? [...new Set(arr.map((p) => String(p || '').trim()).filter((p) => p.length > 0))]
                  : [];
              const selectedSet = normalize(params.selectedFiles);
              const completedSet = normalize(params.completedFiles);
              const failedSet = normalize(params.failedFiles);
              const reusedSet = normalize(params.reusedFiles);
              // C10: a waiver only counts if it has a non-empty trimmed
              // reason AND its path is in the failed set (C3: a waiver for
              // a file that didn't fail is irrelevant).
              const rawWaived = Array.isArray(params.waivedFiles) ? params.waivedFiles : [];
              const failedLookup = new Set(failedSet);
              const validWaiverPaths = new Set();
              for (const entry of rawWaived) {
                let pathStr = '';
                let reasonStr = '';
                if (typeof entry === 'string') {
                  pathStr = entry.trim();
                } else if (entry && typeof entry === 'object') {
                  pathStr = String(entry.path || '').trim();
                  reasonStr = String(entry.reason || '').trim();
                } else {
                  pathStr = String(entry || '').trim();
                }
                if (pathStr.length > 0 && reasonStr.length > 0 && failedLookup.has(pathStr)) {
                  validWaiverPaths.add(pathStr);
                }
              }
              const resolvedSet = new Set([
                ...completedSet,
                ...reusedSet,
                ...validWaiverPaths,
              ]);
              // Every selected file must be resolved.
              for (const sel of selectedSet) {
                if (!resolvedSet.has(sel)) {
                  return 'partial';
                }
              }
              // C3: no unresolved failed files (a failed file not covered by
              // a valid waiver). A file in both completed and failed is
              // considered resolved (completed wins).
              for (const failedPath of failedSet) {
                if (!resolvedSet.has(failedPath) && !validWaiverPaths.has(failedPath)) {
                  return 'partial';
                }
              }
              // C3: no completed files outside the selected set (prevents
              // an inflated completed set from masking a missing selected
              // file).
              const selectedLookup = new Set(selectedSet);
              for (const completedPath of completedSet) {
                if (!selectedLookup.has(completedPath)) {
                  return 'partial';
                }
              }
              return 'complete';
            }

            function computeCoverage(params) {
              const selected = Number(params.selected) || 0;
              const completed = Number(params.completed) || 0;
              const ratio = selected === 0 ? 1 : completed / selected;
              return { completed, selected, ratio: String(ratio) };
            }

            // Issue #2575: computeArtifactHashes is retained for testability
            // and local CLI parity. The production hash computation runs in
            // the dedicated "Compute reviewed-range manifest hashes" step
            // (post-redaction), but this function is exercised by tests and
            // serves as the canonical implementation.
            function computeArtifactHashes(fileNames) {
              const hashModule = typeof require === 'function' ? require('crypto') : crypto;
              const fileSystem = typeof require === 'function' ? require('fs') : fs;
              const hashes = {};
              for (const fileName of fileNames) {
                try {
                  const content = fileSystem.readFileSync(fileName, 'utf8');
                  const hash = hashModule.createHash('sha256').update(content).digest('hex');
                  hashes[fileName] = `sha256:${hash}`;
                } catch (_) {
                  hashes[fileName] = null;
                }
              }
              return hashes;
            }

            function buildReviewedRangeManifest(params) {
              const selectedFiles = Array.isArray(params.selectedFiles) ? params.selectedFiles : [];
              const rawCompletedFiles = Array.isArray(params.completedFiles) ? params.completedFiles : [];
              const failedFiles = Array.isArray(params.failedFiles) ? params.failedFiles : [];
              const reusedFiles = Array.isArray(params.reusedFiles) ? params.reusedFiles : [];
              const rawWaivedFiles = Array.isArray(params.waivedFiles) ? params.waivedFiles : [];
              const waivedFiles = rawWaivedFiles.map((entry) => {
                if (typeof entry === 'string') {
                  return { path: entry, reason: '' };
                }
                if (entry && typeof entry === 'object') {
                  return { path: String(entry.path || ''), reason: String(entry.reason || '') };
                }
                return { path: String(entry), reason: '' };
              });
              const validWaivers = waivedFiles.filter((w) => w.path && w.reason.trim().length > 0);
              // C2: completed_with_errors must not mark all selected files as
              // completed. When the upstream OCR status indicates partial
              // failure, we cannot trust that any specific file completed.
              const ocrStatus = params.ocrStatus || '';
              const isPartialStatus = ocrStatus === 'completed_with_errors';
              const completedFiles = isPartialStatus ? [] : rawCompletedFiles;
              const completeness = resolveCompleteness({
                ocrExitCode: Number(params.ocrExitCode) || 0,
                ocrStatus: params.ocrStatus || null,
                selectedFiles,
                completedFiles,
                failedFiles,
                reusedFiles,
                waivedFiles,
                skipped: params.skipped === true,
              });
              const coverage = computeCoverage({
                completed: completedFiles.length,
                selected: selectedFiles.length,
              });
              return {
                schema_version: '1.0.0',
                repository: params.repository || '',
                pr_number: Number(params.prNumber) || 0,
                head_sha: params.headSha || '',
                merge_base_sha: params.mergeBaseSha || '',
                trigger: params.trigger || '',
                run_id: params.runId || '',
                run_attempt: params.runAttempt || '',
                ocr_version: params.ocrVersion || 'unknown',
                ocr_session_id: params.ocrSessionId || '',
                ocr_parent_session_id: params.ocrParentSessionId || '',
                provider_model: params.providerModel || '',
                concurrency: Number(params.concurrency) || 0,
                rule_config_hash: params.ruleConfigHash || '',
                selected_files: selectedFiles,
                completed_files: completedFiles,
                failed_files: failedFiles,
                reused_files: reusedFiles,
                waived_files: waivedFiles,
                completeness,
                coverage,
                ocr_status: params.ocrStatus || '',
                artifact_hashes: params.artifactHashes || {},
              };
            }

            function serializeManifest(manifest) {
              const json = JSON.stringify(manifest, null, 2);
              return redactSecretDiagnostics(json);
            }

            function resultEnvelopeFromRaw(raw) {
              try {
                const parsed = JSON.parse(String(raw || '').trim());
                return parsed && typeof parsed === 'object' && !Array.isArray(parsed)
                  ? parsed
                  : null;
              } catch (_) {
                return null;
              }
            }

            function failedFilesFromResult(envelope) {
              const warnings = envelope && Array.isArray(envelope.warnings)
                ? envelope.warnings
                : [];
              const failedFiles = [];
              const seen = new Set();
              for (const warning of warnings) {
                if (!warning || warning.type !== 'subtask_error') {
                  continue;
                }
                const filePath = typeof warning.file === 'string'
                  ? warning.file.trim()
                  : '';
                if (filePath && !seen.has(filePath)) {
                  seen.add(filePath);
                  failedFiles.push(filePath);
                }
              }
              return failedFiles;
            }

            // Issue #2675: changed-file coverage verification. The preview
            // produces the "Will review" file list (ocr-selected-files.txt);
            // the review JSON provides evidence (finding paths). These pure
            // functions cross-reference the two sets to detect silent review
            // gaps. They are robust to malformed external OCR JSON and stderr
            // because OCR output is external input. OCR 1.7.16 tool_calls is
            // aggregate { total, by_tool } with no file paths, so it cannot
            // identify individual files for coverage.

            function normalizeFilePaths(paths) {
              if (!Array.isArray(paths)) {
                return [];
              }
              const seen = new Set();
              const result = [];
              for (const raw of paths) {
                const trimmed = String(raw ?? '').trim();
                if (trimmed.length === 0) {
                  continue;
                }
                if (!seen.has(trimmed)) {
                  seen.add(trimmed);
                  result.push(trimmed);
                }
              }
              return result;
            }

            function eligibleCompletedFilesForReview(params) {
              const eligibleFiles = Array.isArray(params.eligibleFiles)
                ? params.eligibleFiles
                : [];
              const validStatus = params.ocrStatus === 'success'
                || params.ocrStatus === 'completed';
              const exactCount = params.completedFilesValid === true
                && Number.isSafeInteger(params.completedFiles)
                && params.completedFiles === eligibleFiles.length;
              return params.ran === true
                && params.exitCode === 0
                && params.previewValidated === true
                && validStatus
                && exactCount
                ? Object.freeze([...eligibleFiles])
                : Object.freeze([]);
            }

            function evidencedPathsFromResult(result) {
              if (!result) {
                return [];
              }
              let findings;
              if (Array.isArray(result)) {
                findings = result;
              } else if (typeof result === 'string') {
                return [];
              } else if (typeof result === 'object' && Array.isArray(result.comments)) {
                findings = result.comments;
              } else if (typeof result === 'object' && Array.isArray(result.findings)) {
                findings = result.findings;
              } else {
                return [];
              }
              const acc = [];
              const seen = new Set();
              for (const finding of findings) {
                if (!finding || typeof finding !== 'object') {
                  continue;
                }
                const path = typeof finding.path === 'string'
                  ? finding.path.trim()
                  : (typeof finding.file === 'string' ? finding.file.trim() : '');
                if (path && !seen.has(path)) {
                  seen.add(path);
                  acc.push(path);
                }
              }
              return acc;
            }

            function readFailuresFromStderr(stderr) {
              const text = String(stderr ?? '');
              if (!text) {
                return [];
              }
              const acc = [];
              const seen = new Set();
              const lines = text.split(String.fromCharCode(10));
              const pattern = /file_read\s+failed:\s+file\s+"([^"]+)"\s+not\s+found/i;
              for (const line of lines) {
                const match = pattern.exec(line);
                if (match) {
                  const filePath = match[1].trim();
                  if (filePath && !seen.has(filePath)) {
                    seen.add(filePath);
                    acc.push(filePath);
                  }
                }
              }
              return acc;
            }

            function resolveCoverageThreshold(raw) {
              if (raw === null || raw === undefined || String(raw).trim() === '') {
                return 90;
              }
              const num = Number(raw);
              if (Number.isFinite(num) && num >= 0 && num <= 100) {
                return num;
              }
              return 90;
            }

            function computeFileCoverage(params) {
              const previewFiles = normalizeFilePaths(params.previewFiles);
              const evidencedFiles = normalizeFilePaths(params.evidencedFiles);
              const readFailureFiles = normalizeFilePaths(params.readFailureFiles);
              const previewSet = new Set(previewFiles);
              const evidencedSet = new Set(evidencedFiles);
              const readFailureSet = new Set(readFailureFiles);
              const unexpectedFiles = evidencedFiles.filter((f) => !previewSet.has(f));
              const coveredFiles = previewFiles.filter(
                (f) => evidencedSet.has(f) && !readFailureSet.has(f),
              );
              const failedPreviewFiles = previewFiles.filter((f) => readFailureSet.has(f));
              const previewOnlyFiles = previewFiles.filter(
                (f) => !evidencedSet.has(f) && !readFailureSet.has(f),
              );
              const ratio = previewFiles.length === 0
                ? 1
                : coveredFiles.length / previewFiles.length;
              const percentage = Math.min(100, Math.round(ratio * 100));
              return {
                counts: {
                  preview: previewFiles.length,
                  evidenced: evidencedFiles.length,
                  covered: coveredFiles.length,
                  preview_only: previewOnlyFiles.length,
                  unexpected: unexpectedFiles.length,
                  read_failures: readFailureFiles.length,
                  failed_preview: failedPreviewFiles.length,
                },
                coverage: {
                  ratio,
                  percentage,
                },
                previewFiles,
                evidencedFiles,
                coveredFiles,
                previewOnlyFiles,
                unexpectedFiles,
                failedPreviewFiles,
                readFailureFiles,
              };
            }

            function buildCoverageReport(params) {
              const thresholdPercentage = resolveCoverageThreshold(params.thresholdPercentage);
              const coverage = computeFileCoverage({
                previewFiles: params.previewFiles,
                evidencedFiles: params.evidencedFiles,
                readFailureFiles: params.readFailureFiles,
              });
              const ratioBelowThreshold = coverage.coverage.ratio < thresholdPercentage / 100;
              const hasReviewFailures = coverage.counts.read_failures > 0;
              const belowThreshold = ratioBelowThreshold || hasReviewFailures;
              const evidenceAvailable = params.evidenceAvailable !== false;
              return {
                schema_version: '1.0.0',
                counts: coverage.counts,
                coverage: coverage.coverage,
                preview_files: coverage.previewFiles,
                evidenced_files: coverage.evidencedFiles,
                covered_files: coverage.coveredFiles,
                preview_only_files: coverage.previewOnlyFiles,
                unexpected_files: coverage.unexpectedFiles,
                failed_preview_files: coverage.failedPreviewFiles,
                read_failure_files: coverage.readFailureFiles,
                threshold_percentage: thresholdPercentage,
                ratio_below_threshold: ratioBelowThreshold,
                has_review_failures: hasReviewFailures,
                below_threshold: belowThreshold,
                evidence_available: evidenceAvailable,
              };
            }

            function coverageWarningText(report) {
              if (!report || !report.below_threshold) {
                return '';
              }
              const counts = report.counts || {};
              const preview = Number.isFinite(counts.preview) ? counts.preview : 0;
              const covered = Number.isFinite(counts.covered) ? counts.covered : 0;
              const readFailures = Number.isFinite(counts.read_failures) ? counts.read_failures : 0;
              const threshold = Number.isFinite(report.threshold_percentage)
                ? report.threshold_percentage
                : 90;
              const parts = [];
              if (report.ratio_below_threshold) {
                parts.push(`WARNING: Changed-file coverage ${covered}/${preview} preview files covered is below the ${threshold}% threshold.`);
              }
              if (report.has_review_failures) {
                parts.push(`WARNING: ${readFailures} file read/review failure(s) detected.`);
              }
              return parts.join(' ');
            }

            function serializeCoverageReport(report) {
              // Redact structured JSON string values BEFORE serializing so a
              // credential-like filename (e.g. "Authorization: Bearer ...ts")
              // never corrupts the JSON structure. Redacting the serialized
              // string with raw regex can consume structural characters and
              // produce invalid JSON.
              const redactJsonValue = (value) => {
                if (typeof value === 'string') {
                  return redactSecretDiagnostics(value);
                }
                if (Array.isArray(value)) {
                  return value.map(redactJsonValue);
                }
                if (value && typeof value === 'object') {
                  const result = {};
                  for (const [key, val] of Object.entries(value)) {
                    result[key] = redactJsonValue(val);
                  }
                  return result;
                }
                return value;
              };
              try {
                const redacted = redactJsonValue(report);
                return JSON.stringify(redacted, null, 2);
              } catch (_) {
                return JSON.stringify({ error: 'coverage report serialization failed' }, null, 2);
              }
            }

            function buildStatusLine(params) {
              if (!params.ran) {
                if (params.policyFailure) {
                  return `OCR policy failure: ${params.policyFailure}`;
                }
                return 'OCR failed to run or parse output.';
              }
              if (params.completeness !== 'complete') {
                const coverage = params.coverage || { completed: 0, selected: 0 };
                const failedCount = Array.isArray(params.failedFiles)
                  ? params.failedFiles.length
                  : 0;
                const findingNote = params.findingsCount > 0
                  ? `; ${params.findingsCount} finding(s) (${params.postedInline} posted inline).`
                  : '.';
                return `Partial review: ${coverage.completed} of ${coverage.selected} files completed (${failedCount} failed)${findingNote}`;
              }
              if (params.findingsCount === 0) {
                return 'No findings.';
              }
              return `${params.findingsCount} finding(s) (${params.postedInline} posted inline).`;
            }
            if (policyFailure) {
              ran = false;
              core.warning('Skipping OCR output parsing because OCR policy failure was recorded.');
            } else if (exitCode === 0) {
              try {
                const raw = fs.readFileSync('ocr-result.json', 'utf8');
                const parsed = parseFindings(raw);
                if (parsed) {
                  findings = parsed;
                } else {
                  ran = false;
                }
              } catch (parseErr) {
                markInfrastructureFailure('parse', `OCR output could not be parsed: ${parseErr.message || parseErr}`);
                core.warning(redactSecretDiagnostics(`Failed to parse OCR JSON output: ${parseErr.message || parseErr}`));
                ran = false;
              }
            } else {
              core.warning(`Skipping OCR output parsing because phase ${phase} already recorded exit code ${exitCode}.`);
            }

            // Validate category/severity metadata (fail-open) before dedup so
            // schema drift on findings that share a dedup key (path/lines/body)
            // is still observed. Undocumented or missing values map to 'unknown'
            // with a stderr warning, without suppressing any finding.
            rawFindingCount = findings.length;
            schemaInvalidCount = findings.filter((finding) =>
              finding && typeof finding === 'object' && !Array.isArray(finding)
                && ((finding.category !== undefined && !KNOWN_CATEGORIES.has(finding.category))
                  || (finding.severity !== undefined && !KNOWN_SEVERITIES.has(finding.severity)))).length;
            findings = findings.map(validateFindingMetadata);
            const severityDistribution = findingDistribution(findings, 'severity');
            const categoryDistribution = findingDistribution(findings, 'category');

            // Issue #2672: compute routing decisions for EVERY finding before
            // dedup so suppressed duplicates still get artifact records, and a
            // protected finding (e.g. security/high) that shares a dedup key
            // with a low-severity finding is still accounted for.
            const routingShadowMode = process.env.OCR_ROUTING_SHADOW_MODE !== 'false';
            const allRoutingDecisions = findings.map((f) => {
              const decision = routeFinding(f);
              const meta = (f && typeof f === 'object') ? f : {};
              return {
                path: typeof meta.path === 'string' ? meta.path : '',
                start_line: Number.isInteger(meta.start_line) ? meta.start_line : null,
                end_line: Number.isInteger(meta.end_line) ? meta.end_line : null,
                category: effectiveCategory(meta),
                severity: effectiveSeverity(meta),
                destination: decision.destination,
                reason: decision.reason,
              };
            });

            const dedupedFindings = deduplicateFindings(findings);
            let suppressedDuplicateCount = 0;
            suppressedDuplicateCount = dedupedFindings.suppressed;
            findings = dedupedFindings.deduped;

            // Issue #2672: routing decisions for the deduped set. Recomputed
            // (not sliced from allRoutingDecisions) because dedup may remove
            // findings from anywhere in the array.
            const routingDecisions = findings.map((f, i) => {
              const decision = routeFinding(f);
              const meta = (f && typeof f === 'object') ? f : {};
              const hasPosition = meta.path && Number.isInteger(meta.start_line) &&
                Number.isInteger(meta.end_line) && meta.start_line > 0 && meta.end_line > 0;
              return {
                category: effectiveCategory(meta),
                severity: effectiveSeverity(meta),
                destination: decision.destination,
                reason: decision.reason,
                hasPosition,
              };
            });
            // Only count findings that would actually be held back from
            // inline posting (line-addressable). Lineless findings always
            // go to the summary regardless of routing, so including them
            // would inflate the shadow-mode preview count.
            const wouldRouteToSummary = routingDecisions.filter(
              (d) => d.hasPosition && d.destination === 'summary',
            ).length;

            // Split findings into inline (resolvable file/line), summary-routed,
            // and lineless. In shadow mode all line-addressable findings go
            // inline (issue #2672). In go-live mode, findings routed to
            // 'summary' are held back from inline posting.
            const inline = [];
            const summaryRouted = [];
            const lineless = [];
            // Phase 2: carries the original finding alongside each generated
            // comment so overflow entries preserve full structured metadata.
            const inlineFindings = [];
            const runId = String(context.runId);
            let inlineIndex = 0;
            for (const f of findings) {
              const decision = routeFinding(f);
              if (f && f.path && Number.isInteger(f.start_line) &&
                  Number.isInteger(f.end_line) && f.start_line > 0 && f.end_line > 0) {
                if (!routingShadowMode && decision.destination === 'summary') {
                  summaryRouted.push(f);
                } else {
                  let startLine = Number(f.start_line);
                  let endLine = Number(f.end_line);
                  if (startLine > endLine) {
                    [startLine, endLine] = [endLine, startLine];
                  }
                  const rawText = f.content || f.comment || f.message || f.body;
                  const label = categorySeverityLabel(f);
                  const rendered = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                  // Insert the label inside the blockquote (after the first
                  // '> ' prefix) so the first line stays '> **[cat/sev]** text'.
                  const labeledText = label ? rendered.replace(/^> /, `> ${label}`) : rendered;
                  // Phase 2 (issue #2649): embed a per-run finding fingerprint
                  // in the comment body as an HTML comment marker for
                  // deterministic publication reconciliation within this run.
                  const fingerprint = findingFingerprint(f, runId, inlineIndex);
                  inlineIndex += 1;
                  const comment = {
                    path: String(f.path),
                    line: endLine,
                    side: 'RIGHT',
                    body: `${INLINE_MARKER}\n<!-- ocr-fp:${fingerprint} -->\n${labeledText}`,
                    _severity: effectiveSeverity(f),
                  };
                  if (startLine < endLine) {
                    comment.start_line = startLine;
                    comment.start_side = 'RIGHT';
                  }
                  inline.push(comment);
                  inlineFindings.push(f);
                }
              } else {
                lineless.push(f && typeof f === 'object' ? f : { body: f || 'Malformed OCR finding' });
              }
            }

            // Phase 2 (issue #2649): sort inline comments by severity priority
            // (critical/high first), then path, then line. This ensures the
            // most important findings are posted first and overflow (capped)
            // comments are the lowest-priority ones. sortInlineComments returns
            // a new array; the inlineFindingRefs parallel array is reordered
            // to match so overflow entries can preserve full structured
            // metadata.
            const sortedPairs = sortInlineComments(
              inline.map((c, i) => ({ comment: c, finding: inlineFindings[i] })),
            );
            // Rebuild inline and inlineFindings from sorted pairs so both
            // arrays remain in lockstep after sorting.
            for (let i = 0; i < inline.length; i++) {
              inline[i] = sortedPairs[i].comment;
              inlineFindings[i] = sortedPairs[i].finding;
            }

            // Post inline comments via a COMMENT review on the head SHA.
            let postedInline = 0;
            let failedInline = 0;
            let skippedOverlapCount = 0;
            let batchPublicationAmbiguous = false;
            let skippedExactHistoryCount = 0;
            // Feature 3 (issue #2670): incremental IoU overlap dedup mode.
            const incrementalEnabled = process.env.OCR_INCREMENTAL === 'true';
            const overlapThreshold = resolveThreshold(process.env.OCR_INCREMENTAL_OVERLAP_THRESHOLD);
            if (ran && inline.length > 0) {
              let existingInlineKeys = new Set();
              try {
                existingInlineKeys = await existingInlineCommentKeys();
              } catch (listErr) {
                core.warning(redactSecretDiagnostics(`Could not list existing OCR inline comments before posting: ${listErr.message || listErr}`));
              }
              const beforeExactFilter = inline.length;
              // Carry finding references through filtering so overflow can
              // preserve full structured metadata.
              let pairsToPost = inline
                .map((c, i) => ({ comment: c, finding: inlineFindings[i] }))
                .filter((p) => !existingInlineKeys.has(inlineCommentKey(p.comment)));
              skippedExactHistoryCount = beforeExactFilter - pairsToPost.length;
              // Feature 3: when incremental mode is enabled, additionally
              // filter out comments whose (path, line range) overlaps an
              // existing bot review comment (IoU > threshold).
              if (incrementalEnabled && pairsToPost.length > 0) {
                let historySpans = [];
                try {
                  historySpans = await existingReviewCommentSpans();
                } catch (listErr) {
                  core.warning(redactSecretDiagnostics(`Could not list existing OCR review comments for incremental dedup: ${listErr.message || listErr}`));
                }
                if (historySpans.length > 0) {
                  const kept = [];
                  for (const p of pairsToPost) {
                    if (overlapsHistory(
                      { path: p.comment.path, span: lineSpan(p.comment) },
                      historySpans,
                      overlapThreshold,
                    )) {
                      skippedOverlapCount += 1;
                    } else {
                      kept.push(p);
                    }
                  }
                  pairsToPost = kept;
                }
              }
              if (pairsToPost.length === 0) {
                core.info('All OCR inline comments already exist on this head SHA; skipping inline posting.');
              } else {
                // Phase 2 (issue #2649): proactive inline comment cap. The
                // inline array is already sorted by severity priority so the
                // highest-priority findings are posted first, and overflow
                // goes to the sticky summary instead of waiting for a large
                // batch to fail.
                const INLINE_COMMENT_CAP = Number(process.env.OCR_INLINE_COMMENT_CAP || 50);
                const effectiveCap = Number.isInteger(INLINE_COMMENT_CAP) && INLINE_COMMENT_CAP > 0
                  ? INLINE_COMMENT_CAP
                  : 50;
                if (pairsToPost.length > effectiveCap) {
                  // Phase 2: overflow preserves the original finding object so
                  // structured metadata (category, severity, path, line range)
                  // is not lost when a finding is moved from inline to summary.
                  const overflowPairs = pairsToPost.slice(effectiveCap);
                  pairsToPost = pairsToPost.slice(0, effectiveCap);
                  for (const pair of overflowPairs) {
                    overflowRouted.push(pair.finding);
                  }
                }
                const inlineToPost = pairsToPost.map((p) => p.comment);
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: number,
                  event: 'COMMENT', commit_id: headSha, comments: inlineToPost,
                });
                postedInline = inlineToPost.length;
              } catch (batchErr) {
                core.warning(redactSecretDiagnostics(`Batch review post failed (${inlineToPost.length} comments), falling back to individual posting: ${batchErr.message || batchErr}`));
                batchPublicationAmbiguous = true;
                // Fallback: post each inline comment individually, with a cap to avoid secondary rate limits.
                try {
                  existingInlineKeys = await existingInlineCommentKeys();
                } catch (listErr) {
                  core.warning(redactSecretDiagnostics(`Could not list existing OCR inline comments before fallback posting: ${listErr.message || listErr}`));
                }
                // pairsToPost was already capped to effectiveCap before the
                // batch attempt, so the fallback loop does not need a second
                // overflow check — every remaining pair is within the cap.
                for (const p of pairsToPost) {
                  const c = p.comment;
                  if (existingInlineKeys.has(inlineCommentKey(c))) {
                    core.warning(`Skipping duplicate OCR inline comment on ${c.path}:${c.line} after batch post uncertainty.`);
                    skippedExactHistoryCount += 1;
                    continue;
                  }
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner,
                      repo,
                      pull_number: number,
                      commit_id: headSha,
                      path: c.path,
                      line: c.line,
                      side: c.side,
                      body: c.body,
                      ...(c.start_line ? { start_line: c.start_line, start_side: c.start_side } : {}),
                    });
                    postedInline += 1;
                    await new Promise((resolve) => setTimeout(resolve, 1000));
                  } catch (commentErr) {
                    core.warning(redactSecretDiagnostics(`Failed to post inline comment on ${c.path}:${c.line}: ${commentErr.message || commentErr}`));
                    failedInline += 1;
                    // Failed individual posts also preserve metadata.
                    overflowRouted.push(p.finding);
                  }
                }
                // All individual fallback posts completed without errors,
                // so the batch failure was fully recovered. Perform a final
                // re-list to confirm GitHub's observed state matches the
                // intended posts before clearing the ambiguity flag.
                // GitHub's API may have eventual consistency for newly
                // created review comments, so retry once after a delay.
                async function reconcileWithRetry() {
                  for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                      const finalKeys = await existingInlineCommentKeys();
                      const allAccountedFor = inlineToPost.every(
                        (c) => finalKeys.has(inlineCommentKey(c)),
                      );
                      if (failedInline === 0 && allAccountedFor) {
                        return true;
                      }
                      // If not all accounted for on first attempt, wait and
                      // retry to allow eventual consistency to settle.
                      if (attempt === 0) {
                        await new Promise((r) => setTimeout(r, 3000));
                      }
                    } catch (finalListErr) {
                      core.warning(redactSecretDiagnostics(
                        `Reconciliation attempt ${attempt + 1} failed: ${finalListErr.message || finalListErr}`,
                      ));
                      if (attempt === 0) {
                        await new Promise((r) => setTimeout(r, 3000));
                      }
                    }
                  }
                  return false;
                }
                if (!(await reconcileWithRetry())) {
                  core.warning(redactSecretDiagnostics(
                    'Could not confirm all inline comments are present after fallback; leaving publication ambiguous.',
                  ));
                } else {
                  batchPublicationAmbiguous = false;
                }
              }
              }
            }

            // Build the sticky summary, including lineless findings.
            const artifactLine =
              'Artifacts: `ocr-review-output` contains raw JSON, stdout, stderr, preview, phase, and exit-code diagnostics.';
            // Issue #2575: build the reviewed-range manifest for completeness
            // tracking. The manifest records selected/completed/failed/waived
            // file sets and a terminal completeness state.
            const ocrStatusValue = readTrimmed('ocr-status.txt', '') || '';
            const previewValidated = readTrimmed('ocr-preview-succeeded.txt', '') === 'true';
            const selectedFilesContent = readTrimmed('ocr-selected-files.txt', '');
            const eligibleFiles = Object.freeze(normalizeFilePaths(
              selectedFilesContent.split(String.fromCharCode(10)),
            ));
            const ocrObservation = ocrObservabilityFromResult(parsedOcrResult);
            const eligibleCompletedFiles = eligibleCompletedFilesForReview({
              ran,
              exitCode,
              ocrStatus: ocrStatusValue,
              previewValidated,
              eligibleFiles,
              completedFiles: ocrObservation.completed_files,
              completedFilesValid: ocrObservation.completed_files_valid,
            });
            const manifestFailedFiles = failedFilesFromResult(parsedOcrResult);
            const readFailureFiles = manifestFailedFiles.filter((filePath) => {
              const warnings = Array.isArray(parsedOcrResult?.warnings)
                ? parsedOcrResult.warnings
                : [];
              return warnings.some((warning) => {
                if (!warning || warning.file !== filePath) return false;
                const evidence = String(warning.message || warning.error || warning.reason || '');
                return /\b(?:read|reading|readFile|ENOENT|EACCES)\b/i.test(evidence);
              });
            });
            // C7: isSkipped heuristic removed. When the post step runs, the
            // review was NOT skipped (the gate let it through). Missing
            // evidence is "failed"/"partial", never inferred as "skipped".
            const manifestCompleteness = resolveCompleteness({
              ocrExitCode: exitCode,
              ocrStatus: ocrStatusValue || null,
              selectedFiles: eligibleFiles,
              completedFiles: eligibleCompletedFiles,
              failedFiles: manifestFailedFiles,
              reusedFiles: [],
              waivedFiles: [],
              skipped: false,
            });
            const manifestCoverage = computeCoverage({
              completed: eligibleCompletedFiles.length,
              selected: eligibleFiles.length,
            });
            const statusLine = process.env.RANGE_MODE === 'noop'
              ? 'Same head; no new changes to review.'
              : buildStatusLine({
                  ran,
                  findingsCount: findings.length,
                  postedInline,
                  completeness: manifestCompleteness,
                  coverage: manifestCoverage,
                  failedFiles: manifestFailedFiles,
                  policyFailure,
                });
            const infrastructureFailure = readTrimmed(INFRA_FAILURE_FILE, '');
            const rangeMetadataRaw = readTrimmed('ocr-range-metadata.json', '');
            const rangeMetadata = rangeMetadataRaw
              ? JSON.parse(rangeMetadataRaw)
              : {
                  cumulative: {
                    base_sha: process.env.BASE_SHA || '',
                    head_sha: headSha,
                    files: 0,
                    lines: { additions: 0, deletions: 0, total: 0 },
                  },
                  selected: {
                    base_sha: process.env.FROM_SHA || '',
                    head_sha: headSha,
                    files: 0,
                    lines: { additions: 0, deletions: 0, total: 0 },
                  },
                };
            let body = [
              MARKER,
              `## OpenCodeReview — PR #${number}`,
              '',
              `- Reviewed head SHA: \`${headSha}\``,
              `- Merge base: \`${process.env.MERGE_BASE_SHA}\``,
              `- Range: \`${process.env.RANGE_MODE || 'full'}\` from \`${process.env.FROM_SHA || process.env.MERGE_BASE_SHA}\``,
              `- Range fallback: \`${process.env.FALLBACK_REASON || 'none'}\``,
              `- Scope: selected ${rangeMetadata.selected.files} file(s), +${rangeMetadata.selected.lines.additions}/-${rangeMetadata.selected.lines.deletions}; cumulative ${rangeMetadata.cumulative.files} file(s), +${rangeMetadata.cumulative.lines.additions}/-${rangeMetadata.cumulative.lines.deletions}`,
              `- Tokens: ${ocrObservation.tokens.total} total (${ocrObservation.tokens.input} input, ${ocrObservation.tokens.output} output, ${ocrObservation.tokens.cache} cache)`,
              `- OCR version: \`${ocrVersion}\``,
              `- Phase: \`${diagnosticPhase}\``,
              `- Exit code: \`${exitCode}\``,
              `- Run: ${runUrl}`,
              `- ${statusLine}`,
              `- ${artifactLine}`,
            ];
            if (suppressedDuplicateCount > 0) {
              body.push(`- Suppressed ${suppressedDuplicateCount} exact duplicate finding(s).`);
            }
            if (!ran || infrastructureFailure) {
              body.push(
                '',
                ...stderrSection('OCR stderr excerpt', 'ocr-stderr.log'),
                '',
                ...stderrSection('OCR preflight excerpt', 'ocr-preflight.txt'),
                '',
                ...stderrSection('OCR preview stderr excerpt', 'ocr-preview-stderr.log'),
              );
            }
            if (infrastructureFailure) {
              const sanitizedInfrastructureFailure = redactSecretDiagnostics(infrastructureFailure);
              const infrastructureDiagnosticLine = `- Infrastructure diagnostic: \`${sanitizedInfrastructureFailure.replace(/`/g, "\\`")}\``;
              const artifactLineIndex = body.indexOf(`- ${artifactLine}`);
              if (artifactLineIndex >= 0) {
                body.splice(artifactLineIndex + 1, 0, infrastructureDiagnosticLine);
              } else {
                body.push(infrastructureDiagnosticLine);
              }
            }
            if (overflowRouted.length > 0) {
              body.push('', '### Inline overflow (exceeds inline comment cap)', '');
              for (const f of overflowRouted) {
                const where = f && f.path ? `\`${f.path}\`: ` : '';
                const label = categorySeverityLabel(f);
                const rawText = f.content || f.comment || f.message || f.body;
                const text = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                body.push(`- ${where}${label}${text}`);
              }
            }
            if (lineless.length > 0) {
              body.push('', '### Findings without a resolvable position', '');
              for (const f of lineless) {
                const item = f && typeof f === 'object' ? f : {};
                const where = item.path ? `\`${item.path}\`: ` : '';
                const label = categorySeverityLabel(f);
                const rawText = item.content || item.comment || item.message || item.body;
                const text = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                body.push(`- ${where}${label}${text}`);
              }
            }
            if (summaryRouted.length > 0) {
              body.push('', '### Findings routed to summary', '');
              for (const f of summaryRouted) {
                const where = f.path ? `\`${f.path}\`: ` : '';
                const label = categorySeverityLabel(f);
                const rawText = f.content || f.comment || f.message || f.body;
                const text = renderFindingText(typeof rawText === 'string' ? rawText : 'OCR finding');
                body.push(`- ${where}${label}${text}`);
              }
            }
            if (routingShadowMode && wouldRouteToSummary > 0) {
              body.push('', '### Shadow-mode routing preview (issue #2672)', '');
              body.push(`- ${wouldRouteToSummary} finding(s) would be routed to this summary instead of inline comments.`);
              const summaryByCategory = {};
              for (const d of routingDecisions) {
                if (d.destination === 'summary') {
                  const key = `${d.category}/${d.severity}`;
                  summaryByCategory[key] = (summaryByCategory[key] || 0) + 1;
                }
              }
              for (const [key, count] of Object.entries(summaryByCategory)) {
                body.push(`  - \`${key}\`: ${count}`);
              }
              body.push('- Set repository variable `OCR_ROUTING_SHADOW_MODE=false` to enable live routing.');
            }
            // Issue #2672: persist ALL routing decisions (pre-dedup) so every
            // finding gets an artifact record with its routing reason, even
            // duplicates that dedup later suppresses.
            try {
              const routingJson = JSON.stringify(allRoutingDecisions, null, 2);
              fs.writeFileSync('ocr-routing-decisions.json', routingJson);
            } catch (routingWriteErr) {
              core.warning(`Failed to write ocr-routing-decisions.json: ${routingWriteErr.message || routingWriteErr}`);
            }
            const isAutomatic = process.env.IS_AUTOMATIC === 'true';

            // Read the current auto-review count from the existing sticky
            // comment so it can be incremented (issue #2666). Manual triggers
            // do not increment the counter.
            let preFetchAllComments = [];
            try {
              preFetchAllComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
            } catch (preFetchErr) {
              core.warning(redactSecretDiagnostics(`Could not list OCR comments for auto-review count: ${preFetchErr.message || preFetchErr}`));
            }
            let autoReviewCount = resolveHiddenAutoCount(preFetchAllComments, trustedLogins, MARKER);
            if (isAutomatic) {
              autoReviewCount += 1;
            }

            // Issue #2675: changed-file coverage verification. Cross-reference
            // the preview file list with evidence from the OCR result JSON
            // (finding paths) and file_read failures from stderr (and structured
            // subtask_error warnings). Compute a coverage report, emit it to
            // the artifact, log it, and add a warning to the sticky summary when
            // coverage is below the configurable threshold (default 90%) or
            // read failures exist. This never fails the workflow.
            const coverageThreshold = resolveCoverageThreshold(process.env.OCR_COVERAGE_THRESHOLD);
            let coverageReport;
            const isNoop = process.env.RANGE_MODE === 'noop';
            if (isNoop) {
              // No-op: same head, nothing to review. Do not claim any
              // meaningful coverage. Evidence is unavailable and the review
              // did not run.
              coverageReport = buildCoverageReport({
                previewFiles: [],
                evidencedFiles: [],
                readFailureFiles: [],
                thresholdPercentage: coverageThreshold,
                evidenceAvailable: false,
              });
              coverageReport.review_ran = false;
              coverageReport.review_skipped = true;
              coverageReport.range_mode = process.env.RANGE_MODE || '';
            } else {
              const ocrStderrRaw = readTrimmed('ocr-stderr.log', '');
              const evidencedFiles = evidencedPathsFromResult(parsedOcrResult);
              const stderrReadFailures = readFailuresFromStderr(ocrStderrRaw);
              const structuredFailures = parsedOcrResult ? failedFilesFromResult(parsedOcrResult) : [];
              const readFailureFiles = normalizeFilePaths([
                ...stderrReadFailures,
                ...structuredFailures,
              ]);
              coverageReport = buildCoverageReport({
                previewFiles: eligibleFiles,
                evidencedFiles,
                readFailureFiles,
                thresholdPercentage: coverageThreshold,
                evidenceAvailable: ran,
              });
              coverageReport.review_ran = ran;
              coverageReport.range_mode = process.env.RANGE_MODE || '';
            }
            try {
              const serializedCoverage = serializeCoverageReport(coverageReport);
              fs.writeFileSync('ocr-coverage-report.json', serializedCoverage);
              core.info(`OCR coverage: ${coverageReport.coverage.percentage}% (${coverageReport.counts.covered}/${coverageReport.counts.preview} preview files covered)`);
              // Gate the threshold warning on ratio_below_threshold so a
              // read/review failure at 100% coverage does not state
              // "100% is below 90%".
              if (coverageReport.ratio_below_threshold) {
                core.warning(`Changed-file coverage ${coverageReport.coverage.percentage}% is below the ${coverageReport.threshold_percentage}% threshold.`);
              }
              // Emit a separate truthful warning for read/review failures,
              // independent of whether the ratio is below threshold.
              if (coverageReport.has_review_failures) {
                core.warning(`${coverageReport.counts.read_failures} file read/review failure(s) detected.`);
              }
            } catch (coverageWriteErr) {
              core.warning(`Failed to write ocr-coverage-report.json: ${coverageWriteErr.message || coverageWriteErr}`);
              // A coverage report write failure is an infrastructure issue
              // so the downstream classification records it.
              markInfrastructureFailure('coverage', `coverage report persistence failed: ${coverageWriteErr.message || coverageWriteErr}`);
            }
            const coverageWarning = coverageWarningText(coverageReport);
            if (coverageWarning) {
              body.push(`- ${coverageWarning}`);
            }
            body.push(`\n<!-- ocr-auto-count:${autoReviewCount} -->`);
            const summary = body.join('\n');

            async function fetchMarkerComments() {
              const allComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              return trustedMarkerComments(allComments, trustedLogins, MARKER);
            }

            function selectCanonicalMarker(comments) {
              return comments.length > 0 ? comments[0] : null;
            }

            function resolveNonRegressingCount(existingBody, candidateCount, isAutomatic) {
              const existingCount = parseHiddenAutoCount(existingBody);
              const minRequired = existingCount + (isAutomatic ? 1 : 0);
              return candidateCount >= minRequired ? candidateCount : minRequired;
            }

            function applyNonRegressingCount(summary, existingBody, isAutomatic) {
              const summaryCount = parseHiddenAutoCount(summary);
              const minRequired = resolveNonRegressingCount(existingBody, summaryCount, isAutomatic);
              if (summaryCount >= minRequired) {
                return summary;
              }
              const NEWLINE = String.fromCharCode(10);
              const withoutCount = String(summary).replace(
                /<!--\s*ocr-auto-count:\s*\d+\s*-->/g,
                '',
              );
              return withoutCount + NEWLINE + '<!-- ocr-auto-count:' + minRequired + ' -->';
            }

            async function deleteDuplicateMarkerComments(comments, keepId) {
              for (const duplicate of comments) {
                if (duplicate.id === keepId) {
                  continue;
                }
                try {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: duplicate.id,
                  });
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                } catch (duplicateError) {
                  core.warning(redactSecretDiagnostics(`Failed to delete duplicate OCR marker comment ${duplicate.id}: ${duplicateError.message || duplicateError}`));
                }
              }
            }

            async function createOrUpdateMarkerComment(summary, isAutomatic) {
              let existing = null;
              let reconciledComments = [];
              try {
                reconciledComments = await fetchMarkerComments();
              } catch (fetchErr) {
                core.warning(redactSecretDiagnostics(`Could not re-fetch OCR marker comments: ${fetchErr.message || fetchErr}`));
              }
              existing = selectCanonicalMarker(reconciledComments);
              const nonRegressingSummary = existing
                ? applyNonRegressingCount(summary, existing.body, isAutomatic)
                : summary;
              if (existing) {
                const updated = await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body: nonRegressingSummary,
                });
                await deleteDuplicateMarkerComments(reconciledComments, existing.id);
                return updated?.data || existing;
              }
              try {
                const created = await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body: nonRegressingSummary,
                });
                // Re-fetch to reconcile any concurrent duplicate marker
                // comments that may have been posted between the initial
                // pre-fetch and this create. If the just-created comment is
                // not the canonical one (a concurrent lower-id marker exists),
                // update the surviving canonical and return IT — never return
                // a comment that was deleted, because the checkpoint-advancement
                // step updates the returned comment's id.
                try {
                  const postCreateComments = await fetchMarkerComments();
                  const surviving = selectCanonicalMarker(postCreateComments);
                  if (surviving && surviving.id !== (created?.data?.id ?? null)) {
                    // Recompute against the surviving comment's own body: a
                    // concurrent marker may carry a higher count than the one
                    // used before the create attempt.
                    await github.rest.issues.updateComment({
                      owner, repo, comment_id: surviving.id,
                      body: applyNonRegressingCount(summary, surviving.body, isAutomatic),
                    });
                    await deleteDuplicateMarkerComments(postCreateComments, surviving.id);
                    return surviving;
                  }
                  // The created comment IS canonical here. A concurrently
                  // posted duplicate may still carry a HIGHER count, and
                  // deleting it would silently regress the counter — so merge
                  // the maximum across the snapshot into the survivor first.
                  const createdId = created?.data?.id ?? null;
                  const highestCount = resolveHiddenAutoCount(postCreateComments, trustedLogins, MARKER);
                  if (createdId !== null && highestCount > parseHiddenAutoCount(created?.data?.body)) {
                    const mergedBody = applyNonRegressingCount(
                      summary,
                      '<!-- ocr-auto-count:' + highestCount + ' -->',
                      false,
                    );
                    await github.rest.issues.updateComment({
                      owner, repo, comment_id: createdId, body: mergedBody,
                    });
                  }
                  await deleteDuplicateMarkerComments(postCreateComments, createdId);
                } catch (reconcileErr) {
                  core.warning(redactSecretDiagnostics(`Post-create reconciliation failed; duplicate marker comments may remain: ${reconcileErr.message || reconcileErr}`));
                }
                return created?.data || null;
              } catch (createErr) {
                // After a failed create (e.g. a race where a marker was just
                // posted), re-list comments fresh to reconcile, since the
                // pre-fetched list is stale at this point.
                let retryComments = [];
                try {
                  retryComments = await fetchMarkerComments();
                } catch (retryErr) {
                  core.warning(redactSecretDiagnostics(`Post-failure re-fetch failed: ${retryErr.message || retryErr}`));
                }
                const reconciled = selectCanonicalMarker(retryComments);
                if (reconciled) {
                  // Recompute against the re-fetched comment's own body so a
                  // concurrently posted higher count is not overwritten.
                  const updated = await github.rest.issues.updateComment({
                    owner, repo, comment_id: reconciled.id,
                    body: applyNonRegressingCount(summary, reconciled.body, isAutomatic),
                  });
                  await deleteDuplicateMarkerComments(retryComments, reconciled.id);
                  return updated?.data || reconciled;
                } else {
                  throw createErr;
                }
              }
            }

            const checkpointBefore = deserializeCheckpoint(process.env.CHECKPOINT_BEFORE || '');
            const summaryWithExistingCheckpoint = process.env.CHECKPOINT_BEFORE
              ? `${summary}\n<!-- ocr-checkpoint:${process.env.CHECKPOINT_BEFORE} -->`
              : summary;
            let checkpointAfter = checkpointBefore;
            let publicationState = 'ambiguous';
            let summaryComment = null;
            let summaryCommentUrl = '';
            try {
              summaryComment = await createOrUpdateMarkerComment(summaryWithExistingCheckpoint, isAutomatic);
              summaryCommentUrl = (summaryComment && summaryComment.html_url) || '';
              if (batchPublicationAmbiguous) {
                publicationState = 'ambiguous';
              } else {
                publicationState = failedInline === 0 ? 'complete' : 'partial';
              }
            } catch (summaryError) {
              core.warning(redactSecretDiagnostics(`Failed to post OCR sticky summary; continuing without failing the workflow: ${summaryError.message || summaryError}`));
            }

            // Issue #2575: persist the reviewed-range manifest.
            // Artifact hashes are computed AFTER redaction in the dedicated
            // "Compute reviewed-range manifest hashes" step; here we just
            // write the manifest with placeholder empty hashes.
            const manifest = buildReviewedRangeManifest({
              repository: `${owner}/${repo}`,
              prNumber: number,
              headSha,
              mergeBaseSha: process.env.BASE_SHA || '',
              trigger: process.env.GITHUB_EVENT_NAME || '',
              runId: String(context.runId || ''),
              runAttempt: String(process.env.GITHUB_RUN_ATTEMPT || '1'),
              ocrVersion,
              ocrSessionId: process.env.OCR_SESSION_ID || '',
              ocrParentSessionId: process.env.OCR_PARENT_SESSION_ID || '',
              providerModel: readTrimmed('ocr-preflight.txt', '').split(String.fromCharCode(10))[0] || '',
              concurrency: Number(process.env.OCR_CONCURRENCY) || 0,
              ruleConfigHash: process.env.OCR_RULE_CONFIG_HASH || '',
              selectedFiles: eligibleFiles,
              completedFiles: eligibleCompletedFiles,
              failedFiles: manifestFailedFiles,
              reusedFiles: [],
              waivedFiles: [],
              ocrExitCode: exitCode,
              ocrStatus: ocrStatusValue,
              skipped: false,
              artifactHashes: {},
            });
            try {
              const serialized = serializeManifest(manifest);
              fs.writeFileSync('ocr-reviewed-range-manifest.json', serialized);
            } catch (manifestErr) {
              // C9: a manifest persistence failure must not be silently
              // swallowed. Record it as an infrastructure failure so the
              // downstream classification and notifier pick it up.
              core.warning(redactSecretDiagnostics(`Failed to write reviewed-range manifest: ${manifestErr.message || manifestErr}`));
              const infraMessage = 'phase=manifest; reason=reviewed-range manifest persistence failed: '
                + redactSecretDiagnostics(String(manifestErr.message || manifestErr))
                + String.fromCharCode(10);
              fs.writeFileSync(INFRA_FAILURE_FILE, infraMessage);
              fs.writeFileSync('ocr-phase.txt', 'manifest\n');
            }
            const checkpointInfrastructureFailure = readTrimmed(INFRA_FAILURE_FILE, '');
            const checkpointDecision = {
              ran,
              exitCode,
              infrastructureFailure: checkpointInfrastructureFailure,
              policyFailure,
              failedFindings: failedInline,
              completionState: ocrObservation.completion_state,
              manifestCompleteness,
              publicationState,
              previewValidated,
              selectedFiles: eligibleFiles.length,
              completedFiles: eligibleCompletedFiles.length,
              ocrCompletedFiles: ocrObservation.completed_files,
              completedFilesValid: ocrObservation.completed_files_valid,
              resultSource: ocrObservation.result_source,
            };

            // Feature 5 (issue #2670): structured step outputs.
            const commentsTotal = findings.length + suppressedDuplicateCount;
            // comments_skipped counts ONLY inline comments skipped by
            // incremental overlap dedup and exact-key history dedup. Exact
            // duplicate suppression (suppressedDuplicateCount) is reported
            // separately in the summary text since it covers all findings,
            // including lineless ones.
            const commentsSkipped = skippedOverlapCount + skippedExactHistoryCount;
            core.setOutput('comments_total', String(commentsTotal));
            core.setOutput('comments_inline', String(postedInline));
            core.setOutput('already_resolved', String(skippedOverlapCount));
            core.setOutput('comments_skipped', String(commentsSkipped));
            core.setOutput('comments_failed', String(failedInline));
            core.setOutput('comments_routed_summary', String(routingShadowMode ? wouldRouteToSummary : summaryRouted.length));
            core.setOutput('per_file_review_failures', manifestFailedFiles.join('\n'));
            core.setOutput('file_read_failures', readFailureFiles.length > 0 ? readFailureFiles.join('\n') : '');
            core.setOutput('summary_comment_url', summaryCommentUrl);
            // Issue #2676: expose the Post OCR results lifecycle state so the
            // telemetry record can truthfully distinguish posted/noop/failed
            // post outcomes. Derived from ran + range mode, not invented.
            let postState = 'posted';
            if (process.env.RANGE_MODE === 'noop') {
              postState = 'noop';
            } else if (!ran) {
              postState = policyFailure ? 'policy-failed' : 'failed';
            } else if (failedInline > 0) {
              postState = 'partial';
            }
            core.setOutput('post_state', postState);

            if (!ran) {
              if (policyFailure) {
                core.setFailed(`OCR policy failure: ${policyFailure}`);
              } else {
                core.warning(`OpenCodeReview failed or produced unparsable output (exit code ${exitCode}).`);
              }
            }
            // Checkpoint advancement is intentionally the LAST state-changing
            // operation in the posting step. Metadata write, artifact upload,
            // and summary posting all happen before the checkpoint is advanced.
            // If any of those fail, checkpointAfter remains checkpointBefore
            // and the durable checkpoint is not corrupted.
            if (shouldAdvanceCheckpoint(checkpointDecision) && summaryComment && summaryComment.id) {
              checkpointAfter = buildCheckpoint({
                prNumber: number,
                headSha,
                baseSha: process.env.API_BASE_SHA,
                mergeBase: process.env.BASE_SHA,
                reviewedAt: new Date().toISOString(),
                runUrl,
                ocrVersion: process.env.OCR_VERSION,
                ocrModel: process.env.OCR_MODEL || 'unknown',
                rulesHash: process.env.OCR_RULES_HASH || '',
                policyHash: process.env.OCR_POLICY_HASH || '',
                workflowSchemaHash: process.env.OCR_WORKFLOW_SCHEMA_HASH || '',
                rangeMode: process.env.RANGE_MODE,
                eligibleFiles,
                completedFiles: eligibleCompletedFiles.length,
                publicationState,
              });
              const checkpointSummary = embedCheckpointInBody(summary, checkpointAfter);
              try {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: summaryComment.id,
                  body: checkpointSummary,
                });
              } catch (checkpointError) {
                checkpointAfter = checkpointBefore;
                publicationState = 'ambiguous';
                core.warning(redactSecretDiagnostics(`Failed to advance OCR checkpoint: ${checkpointError.message || checkpointError}`));
              }
            }

            // Metadata is serialized AFTER checkpoint advancement so the
            // artifact reflects the final checkpointAfter and publicationState
            // values, not a stale pre-advancement snapshot.
            const metadata = buildOcrMetadata({
              eventName: process.env.EVENT_NAME,
              eventAction: process.env.EVENT_ACTION,
              eventBefore: process.env.EVENT_BEFORE || '',
              eventAfter: process.env.EVENT_AFTER || '',
              apiBaseSha: process.env.API_BASE_SHA,
              apiHeadSha: process.env.API_HEAD_SHA,
              checkpointBefore,
              checkpointAfter,
              rangeMode: process.env.RANGE_MODE,
              fallbackReason: process.env.FALLBACK_REASON || '',
              cumulative: rangeMetadata.cumulative,
              selected: rangeMetadata.selected,
              ocrVersion: process.env.OCR_VERSION,
              model: process.env.OCR_MODEL || 'unknown',
              concurrency: Number(process.env.OCR_CONCURRENCY || 0),
              elapsed: ocrObservation.elapsed,
              tokens: ocrObservation.tokens,
              findings: {
                raw: rawFindingCount,
                duplicate: suppressedDuplicateCount,
                schema_invalid: schemaInvalidCount,
                policy_tiered: summaryRouted.length + overflowRouted.length,
                inline_overflow: overflowRouted.length,
                inline: postedInline,
                summary: lineless.length + summaryRouted.length + overflowRouted.length,
                overflow: overflowRouted.length,
                failed: failedInline,
                severity_distribution: severityDistribution,
                category_distribution: categoryDistribution,
              },
              warnings: ocrObservation.warnings,
              completenessState: ocrObservation.completion_state,
              publicationState,
              sourceRunUrl: runUrl,
            });
            fs.writeFileSync('ocr-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`);
            await core.summary
              .addHeading('OpenCodeReview observability')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Range', `${metadata.range.mode}: ${metadata.range.selected.base_sha}..${metadata.range.selected.head_sha}`],
                ['Selected scope', `${metadata.range.selected.files} files / ${metadata.range.selected.lines.total} changed lines`],
                ['Cumulative scope', `${metadata.range.cumulative.files} files / ${metadata.range.cumulative.lines.total} changed lines`],
                ['Tokens', String(metadata.ocr.tokens.total)],
                ['Terminal state', `${metadata.terminal.completeness_state} / ${metadata.terminal.publication_state}`],
              ])
              .write();

      - name: Build OCR canary metrics
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          TRUSTED_BASE_SHA: ${{ env.TRUSTED_BASE_SHA }}
          MERGE_BASE_SHA: ${{ env.MERGE_BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          OCR_CONCURRENCY: ${{ env.OCR_CONCURRENCY }}
          EXPECTED_OCR_VERSION: ${{ env.OCR_VERSION }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');

            function buildCanaryMetrics(input) {
              const errors = [];
              const meta = input && input.metadata && typeof input.metadata === 'object' &&
                !Array.isArray(input.metadata) ? input.metadata : {};
              const requiredStrings = [
                'runUrl', 'runId', 'prNumber', 'trustedBaseSha', 'mergeBaseSha',
                'headSha', 'expectedOcrVersion', 'actualOcrVersion', 'workflowSha',
                'endpointResolutionSource', 'normalizedModel', 'protocol', 'language',
                'ruleJsonSha256', 'providerUrlSha256', 'configuredOcrSettingsSha256',
                'ocrConfigFileSha256', 'monitorSha256', 'audience', 'format',
                'canonicalConfigFingerprint',
              ];
              for (const key of requiredStrings) {
                if (typeof meta[key] !== 'string' || meta[key].length === 0) {
                  errors.push(`metadata ${key} is required`);
                }
              }
              for (const key of ['trustedBaseSha', 'mergeBaseSha', 'headSha', 'workflowSha']) {
                if (typeof meta[key] === 'string' && !/^[a-fA-F0-9]{40}$/.test(meta[key])) {
                  errors.push(`metadata ${key} must be an exact 40-character Git SHA`);
                }
              }
              if (meta.trustedBaseSha !== meta.mergeBaseSha) {
                errors.push('trusted checkout base SHA must equal merge-base SHA for comparable canaries');
              }
              for (const key of [
                'ruleJsonSha256', 'providerUrlSha256', 'configuredOcrSettingsSha256',
                'ocrConfigFileSha256', 'monitorSha256', 'canonicalConfigFingerprint',
              ]) {
                if (typeof meta[key] === 'string' && !/^[a-f0-9]{64}$/.test(meta[key])) {
                  errors.push(`metadata ${key} must be a SHA-256 value`);
                }
              }
              if (meta.actualOcrVersion !== meta.expectedOcrVersion) {
                errors.push('actual OCR version does not match the expected OCR pin');
              }
              if (meta.endpointResolutionSource !== 'environment') {
                errors.push('effective endpoint resolution source must be environment');
              }
              if (meta.protocol !== 'openai' && meta.protocol !== 'anthropic') {
                errors.push('effective endpoint protocol is invalid');
              }
              const concurrency = Number(meta.concurrency);
              if (![2, 3, 4].includes(concurrency)) {
                errors.push('concurrency must be 2, 3, or 4');
              }
              const reviewTimeoutMinutes = Number(meta.reviewTimeoutMinutes);
              if (!Number.isInteger(reviewTimeoutMinutes) || reviewTimeoutMinutes <= 0) {
                errors.push('resolved review timeout must be a positive integer');
              }
              if (typeof meta.useAnthropic !== 'boolean') {
                errors.push('useAnthropic must be boolean');
              }
              if (typeof meta.backgroundEnabled !== 'boolean') {
                errors.push('backgroundEnabled must be boolean');
              } else if (meta.backgroundEnabled) {
                if (!/^[a-f0-9]{64}$/.test(meta.backgroundContextSha256 || '')) {
                  errors.push('enabled background context requires a SHA-256 value');
                }
              } else if (meta.backgroundContextSha256 !== null) {
                errors.push('disabled background context hash must be null');
              }

              const exitCodeText = input && typeof input.exitCodeText === 'string'
                ? input.exitCodeText : '';
              const parsedExitCode = /^-?[0-9]+$/.test(exitCodeText.trim())
                ? Number(exitCodeText.trim()) : null;
              const exactZeroExit = /^0\n?$/.test(exitCodeText);
              if (!exactZeroExit) {
                errors.push('OCR exit code must be exactly zero');
              }

              const timingInput = input && input.commandTiming;
              let commandWallSeconds = null;
              if (timingInput && typeof timingInput === 'object' && !Array.isArray(timingInput)) {
                commandWallSeconds = timingInput.command_wall_seconds;
                if (timingInput.schema_version !== 1 ||
                    typeof commandWallSeconds !== 'number' ||
                    !Number.isFinite(commandWallSeconds) || commandWallSeconds < 0) {
                  errors.push('OCR command wall timing is invalid');
                }
                if (!Number.isInteger(timingInput.exit_code) || timingInput.exit_code !== parsedExitCode) {
                  errors.push('OCR command timing exit code disagrees with review exit code');
                }
              } else {
                errors.push('OCR command timing is missing');
              }

              const transportInput = input && input.transportTelemetry;
              let transport = null;
              if (transportInput && typeof transportInput === 'object' && !Array.isArray(transportInput)) {
                const distribution = {};
                if (transportInput.responses_by_status &&
                    typeof transportInput.responses_by_status === 'object' &&
                    !Array.isArray(transportInput.responses_by_status)) {
                  for (const [status, count] of Object.entries(transportInput.responses_by_status)) {
                    if (/^[1-5][0-9]{2}$/.test(status) && Number.isInteger(count) && count >= 0) {
                      distribution[status] = count;
                    } else {
                      errors.push('transport status distribution is invalid');
                    }
                  }
                } else {
                  errors.push('transport status distribution is missing');
                }
                transport = {
                  schema_version: transportInput.schema_version,
                  monitor_sha256: transportInput.monitor_sha256,
                  bind_address: transportInput.bind_address,
                  target_protocol: transportInput.target_protocol,
                  shutdown_signal: transportInput.shutdown_signal,
                  shutdown_complete: transportInput.shutdown_complete,
                  total_requests: transportInput.total_requests,
                  upstream_errors: transportInput.upstream_errors,
                  responses_by_status: distribution,
                  http_429_responses: transportInput.http_429_responses,
                  retry_events: transportInput.retry_events,
                  retry_count_header_missing: transportInput.retry_count_header_missing,
                  retry_count_header_malformed: transportInput.retry_count_header_malformed,
                };
                const counters = [
                  transport.total_requests, transport.upstream_errors,
                  transport.http_429_responses, transport.retry_events,
                  transport.retry_count_header_missing,
                  transport.retry_count_header_malformed,
                ];
                if (counters.some((value) => !Number.isInteger(value) || value < 0)) {
                  errors.push('transport counters are invalid');
                }
                if (transport.schema_version !== 1 ||
                    transport.bind_address !== '127.0.0.1' ||
                    (transport.target_protocol !== 'http:' && transport.target_protocol !== 'https:') ||
                    transport.shutdown_signal !== 'SIGTERM' ||
                    transport.shutdown_complete !== true ||
                    transport.monitor_sha256 !== meta.monitorSha256) {
                  errors.push('transport monitor startup, shutdown, or provenance is invalid');
                }
                if (transport.total_requests === 0) {
                  errors.push('transport must observe positive monitored traffic');
                }
                if (transport.retry_count_header_missing !== 0 ||
                    transport.retry_count_header_malformed !== 0) {
                  errors.push('transport retry-count headers are missing or malformed');
                }
                if ((distribution['429'] || 0) !== transport.http_429_responses) {
                  errors.push('transport 429 count disagrees with status distribution');
                }
                const responseCount = Object.values(distribution).reduce(
                  (total, count) => total + count,
                  0,
                );
                if (Number.isInteger(transport.total_requests) &&
                    Number.isInteger(transport.upstream_errors) &&
                    responseCount + transport.upstream_errors !== transport.total_requests) {
                  errors.push('transport request count disagrees with response and error aggregates');
                }
              } else {
                errors.push('transport telemetry is missing');
              }

              const trimmedResult = input && typeof input.resultText === 'string'
                ? input.resultText.trim() : '';
              let parsed = null;
              if (trimmedResult.length === 0) {
                errors.push('OCR result is empty');
              } else {
                try {
                  parsed = JSON.parse(trimmedResult);
                } catch (_) {
                  errors.push('OCR result is not valid JSON');
                }
              }
              if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                if (trimmedResult.length > 0 && errors.every((error) => error !== 'OCR result is not valid JSON')) {
                  errors.push('OCR result must be an object');
                }
                parsed = null;
              }
              const status = parsed && typeof parsed.status === 'string' ? parsed.status : null;
              if (status !== 'success') {
                errors.push('OCR result status must be success');
              }
              let warningCount = null;
              if (parsed) {
                if (parsed.warnings === undefined) {
                  warningCount = 0;
                } else if (Array.isArray(parsed.warnings)) {
                  warningCount = parsed.warnings.length;
                } else {
                  errors.push('OCR result warnings must be an array when present');
                }
              }
              if (warningCount !== null && warningCount !== 0) {
                errors.push('OCR result contains warnings');
              }

              let summaryOutput = null;
              let findingsOutput = null;
              let internalElapsed = null;
              let internalElapsedSeconds = null;
              if (parsed) {
                const summary = parsed.summary;
                const comments = parsed.comments;
                if (!summary || typeof summary !== 'object' || Array.isArray(summary)) {
                  errors.push('OCR result summary is missing');
                }
                if (!Array.isArray(comments)) {
                  errors.push('OCR result comments array is missing');
                }
                if (summary && typeof summary === 'object' && Array.isArray(comments)) {
                  if (!Number.isInteger(summary.comments) || summary.comments !== comments.length) {
                    errors.push('OCR summary comment count does not match comments length');
                  }
                  const numericValues = [
                    summary.files_reviewed, summary.total_tokens,
                    summary.input_tokens, summary.output_tokens,
                    summary.cache_read_tokens ?? 0, summary.cache_write_tokens ?? 0,
                  ];
                  if (numericValues.some((value) => !Number.isInteger(value) || value < 0)) {
                    errors.push('OCR summary counters are invalid');
                  }
                  const elapsedMatch = typeof summary.elapsed === 'string'
                    ? /^(?:(\d+(?:\.\d+)?)h)?(?:(\d+(?:\.\d+)?)m)?(?:(\d+(?:\.\d+)?)s)?$/i.exec(summary.elapsed)
                    : null;
                  if (!elapsedMatch || !elapsedMatch.slice(1).some((part) => part !== undefined)) {
                    errors.push('OCR summary elapsed is invalid');
                  } else {
                    internalElapsed = summary.elapsed;
                    internalElapsedSeconds = Number(elapsedMatch[1] || 0) * 3600 +
                      Number(elapsedMatch[2] || 0) * 60 + Number(elapsedMatch[3] || 0);
                  }
                  if (numericValues.every((value) => Number.isInteger(value) && value >= 0)) {
                    summaryOutput = {
                      files_reviewed: summary.files_reviewed,
                      tokens: {
                        total: summary.total_tokens,
                        input: summary.input_tokens,
                        output: summary.output_tokens,
                        cache_read: summary.cache_read_tokens ?? 0,
                        cache_write: summary.cache_write_tokens ?? 0,
                      },
                    };
                  }
                  if (comments.every((comment) => comment && typeof comment === 'object' && !Array.isArray(comment))) {
                    const tally = (field) => {
                      const counts = new Map();
                      for (const comment of comments) {
                        const raw = comment[field];
                        const bucket = typeof raw === 'string' && raw.length > 0 ? raw : 'unknown';
                        counts.set(bucket, (counts.get(bucket) || 0) + 1);
                      }
                      return Object.fromEntries(counts);
                    };
                    findingsOutput = {
                      total: comments.length,
                      by_category: tally('category'),
                      by_severity: tally('severity'),
                    };
                  } else {
                    errors.push('OCR comments must contain objects');
                  }
                }
              }

              return {
                schema_version: 1,
                valid: errors.length === 0,
                validation_errors: errors,
                run: { url: meta.runUrl || null, id: meta.runId || null },
                pull_request: meta.prNumber || null,
                trusted_checkout_base_sha: meta.trustedBaseSha || null,
                merge_base_sha: meta.mergeBaseSha || null,
                head_sha: meta.headSha || null,
                concurrency: Number.isInteger(concurrency) ? concurrency : null,
                result: {
                  status,
                  warning_count: warningCount,
                  exit_code: parsedExitCode,
                },
                timing: {
                  command_wall_seconds: commandWallSeconds,
                  ocr_internal_elapsed: internalElapsed,
                  ocr_internal_elapsed_seconds: internalElapsedSeconds,
                },
                provenance: {
                  expected_ocr_version: meta.expectedOcrVersion || null,
                  actual_ocr_version: meta.actualOcrVersion || null,
                  workflow_sha: meta.workflowSha || null,
                  effective_endpoint: {
                    resolution_source: meta.endpointResolutionSource || null,
                    normalized_model: meta.normalizedModel || null,
                    protocol: meta.protocol || null,
                    provider_url_sha256: meta.providerUrlSha256 || null,
                    language: meta.language || null,
                  },
                  configured_ocr_settings_sha256: meta.configuredOcrSettingsSha256 || null,
                  ocr_config_file_sha256: meta.ocrConfigFileSha256 || null,
                  use_anthropic: typeof meta.useAnthropic === 'boolean' ? meta.useAnthropic : null,
                  review_timeout_minutes: Number.isInteger(reviewTimeoutMinutes) ? reviewTimeoutMinutes : null,
                  rule_json_sha256: meta.ruleJsonSha256 || null,
                  background_enabled: typeof meta.backgroundEnabled === 'boolean' ? meta.backgroundEnabled : null,
                  background_context_sha256: meta.backgroundContextSha256 ?? null,
                  monitor_sha256: meta.monitorSha256 || null,
                  audience: meta.audience || null,
                  format: meta.format || null,
                  canonical_config_fingerprint: meta.canonicalConfigFingerprint || null,
                },
                summary: summaryOutput,
                findings: findingsOutput,
                transport,
              };
            }

            const safeRead = (fileName) => {
              try {
                return fs.readFileSync(fileName, 'utf8');
              } catch (_) {
                return '';
              }
            };
            const safeJson = (fileName) => {
              try {
                return JSON.parse(fs.readFileSync(fileName, 'utf8'));
              } catch (_) {
                return null;
              }
            };
            const parseOcrVersionOutput = (output) => {
              const lines = output.split('\n');
              const firstLine = lines[0].endsWith('\r') ? lines[0].slice(0, -1) : lines[0];
              const match = /^open-code-review v([0-9]+[.][0-9]+[.][0-9]+)(?: [(][a-fA-F0-9]+[)] [A-Za-z0-9._-]+[/][A-Za-z0-9._-]+)?$/.exec(firstLine);
              const hasAdditionalVersionHeader = lines.slice(1).some((line) =>
                line.startsWith('open-code-review v')
              );
              if (!match || hasAdditionalVersionHeader) {
                throw new Error(
                  'OCR version output must begin with exactly one valid open-code-review vX.Y.Z first line'
                );
              }
              return match[1];
            };
            const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
            let versionParseError = null;
            let actualOcrVersion = null;
            try {
              actualOcrVersion = parseOcrVersionOutput(safeRead('ocr-version.txt'));
            } catch (error) {
              versionParseError = (error && error.message) ||
                'OCR version output could not be parsed';
            }
            const runtime = safeJson('ocr-review-runtime.json') || {};
            const configuredSettings = safeJson('ocr-configured-settings.json') || {};
            const commandTiming = safeJson('ocr-command-timing.json');
            const transportTelemetry = safeJson('ocr-transport-telemetry.json');
            const ready = safeJson('ocr-transport-monitor-ready.json') || {};
            const useAnthropic = String(process.env.OCR_USE_ANTHROPIC || '').toLowerCase() === 'true';
            const normalizedModel = String(process.env.OCR_LLM_MODEL || '').trim();
            const configuredOcrSettingsSha256 = sha256(JSON.stringify({
              extra_body: configuredSettings.extra_body,
              language: configuredSettings.language,
            }));
            const hashFile = (fileName) => {
              try {
                return sha256(fs.readFileSync(fileName));
              } catch (_) {
                return '';
              }
            };
            const ruleJsonSha256 = hashFile(`${process.env.HOME}/.opencodereview/rule.json`);
            const ocrConfigFileSha256 = hashFile(`${process.env.HOME}/.opencodereview/config.json`);
            const canonicalConfiguration = {
              expected_ocr_version: process.env.EXPECTED_OCR_VERSION || '',
              actual_ocr_version: actualOcrVersion,
              workflow_sha: process.env.WORKFLOW_SHA || '',
              trusted_checkout_base_sha: process.env.TRUSTED_BASE_SHA || '',
              merge_base_sha: process.env.MERGE_BASE_SHA || '',
              effective_endpoint: {
                resolution_source: 'environment',
                normalized_model: normalizedModel,
                protocol: useAnthropic ? 'anthropic' : 'openai',
                provider_url_sha256: sha256(process.env.OCR_LLM_URL || ''),
                language: configuredSettings.language,
              },
              configured_ocr_settings_sha256: configuredOcrSettingsSha256,
              ocr_config_file_sha256: ocrConfigFileSha256,
              use_anthropic: useAnthropic,
              review_timeout_minutes: runtime.review_timeout_minutes,
              rule_json_sha256: ruleJsonSha256,
              background_enabled: runtime.background_enabled,
              background_context_sha256: runtime.background_context_sha256 ?? null,
              monitor_sha256: transportTelemetry?.monitor_sha256 || ready.monitor_sha256 || '',
              audience: 'agent',
              format: 'json',
            };
            const metrics = buildCanaryMetrics({
              resultText: safeRead('ocr-result.json'),
              exitCodeText: safeRead('ocr-exit-code.txt'),
              commandTiming,
              transportTelemetry,
              metadata: {
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                runId: String(context.runId),
                prNumber: process.env.PR_NUMBER || '',
                trustedBaseSha: canonicalConfiguration.trusted_checkout_base_sha,
                mergeBaseSha: canonicalConfiguration.merge_base_sha,
                headSha: process.env.HEAD_SHA || '',
                concurrency: process.env.OCR_CONCURRENCY || '',
                expectedOcrVersion: canonicalConfiguration.expected_ocr_version,
                actualOcrVersion: canonicalConfiguration.actual_ocr_version,
                workflowSha: canonicalConfiguration.workflow_sha,
                endpointResolutionSource: canonicalConfiguration.effective_endpoint.resolution_source,
                normalizedModel: canonicalConfiguration.effective_endpoint.normalized_model,
                protocol: canonicalConfiguration.effective_endpoint.protocol,
                language: canonicalConfiguration.effective_endpoint.language,
                useAnthropic: canonicalConfiguration.use_anthropic,
                reviewTimeoutMinutes: canonicalConfiguration.review_timeout_minutes,
                ruleJsonSha256: canonicalConfiguration.rule_json_sha256,
                providerUrlSha256: canonicalConfiguration.effective_endpoint.provider_url_sha256,
                configuredOcrSettingsSha256: canonicalConfiguration.configured_ocr_settings_sha256,
                ocrConfigFileSha256: canonicalConfiguration.ocr_config_file_sha256,
                backgroundEnabled: canonicalConfiguration.background_enabled,
                backgroundContextSha256: canonicalConfiguration.background_context_sha256,
                monitorSha256: canonicalConfiguration.monitor_sha256,
                audience: canonicalConfiguration.audience,
                format: canonicalConfiguration.format,
                canonicalConfigFingerprint: sha256(JSON.stringify(canonicalConfiguration)),
              },
            });
            if (versionParseError) {
              metrics.validation_errors = [
                versionParseError,
                ...metrics.validation_errors,
              ];
              metrics.valid = false;
            }
            fs.writeFileSync('ocr-canary-metrics.json', JSON.stringify(metrics, null, 2) + '\n');
            if (!metrics.valid) {
              core.setFailed(`OCR canary evidence is invalid: ${metrics.validation_errors.join('; ')}`);
            }

      - name: Ensure valid OCR coverage report
        # Runs before classification so a missing/invalid/placeholder
        # report records an infrastructure diagnostic that the
        # classification step can see. A placeholder upload after a green
        # classification must not be possible.
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          . ./ocr-workflow-helpers.sh
          if [ ! -s ocr-coverage-report.json ]; then
            write_unavailable_coverage_report
            echo "::warning::ocr-coverage-report.json was missing or empty; wrote unavailable-evidence placeholder before redaction."
            echo "phase=coverage; reason=ocr-coverage-report.json was missing or empty before classification" >> ocr-infrastructure-failure.txt
          else
            if ! node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("ocr-coverage-report.json", "utf8");
              try {
                const data = JSON.parse(raw);
                if (!data || typeof data !== "object" || Array.isArray(data)) {
                  process.exit(1);
                }
              } catch (_) {
                process.exit(1);
              }
            '; then
              write_unavailable_coverage_report
              echo "::warning::ocr-coverage-report.json was invalid JSON; wrote unavailable-evidence placeholder before redaction."
              echo "phase=coverage; reason=ocr-coverage-report.json was invalid JSON before classification" >> ocr-infrastructure-failure.txt
            fi
          fi

      - name: Resolve OCR failure classification
        shell: bash
        id: ocr-classification
        if: always()
        run: |
          set -euo pipefail
          if [ -s ocr-policy-failure.txt ]; then
            echo "policy_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "policy_failure=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -s ocr-infrastructure-failure.txt ]; then
            echo "infrastructure_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure_failure=false" >> "$GITHUB_OUTPUT"
          fi
          # C8: extract completeness from the reviewed-range manifest so the
          # record-ocr-outcome job can distinguish partial/failed reviews
          # from complete successes.
          completeness="unknown"
          if [ -s ocr-reviewed-range-manifest.json ]; then
            completeness="$(node -e '
              try {
                const data = JSON.parse(require("fs").readFileSync("ocr-reviewed-range-manifest.json", "utf8"));
                if (data && typeof data === "object" && typeof data.completeness === "string") {
                  process.stdout.write(data.completeness);
                }
              } catch (_) { /* best-effort */ }
            ' 2>/dev/null || true)"
          fi
          echo "completeness=${completeness}" >> "$GITHUB_OUTPUT"
      - name: Capture OCR telemetry timestamp
        id: ocr-generated-at
        shell: bash
        if: always()
        run: |
          echo "generated_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"

      - name: Ensure OCR artifact placeholders exist
        id: ocr-artifact-state
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          missing=""
          for file_name in \
            ocr-result.json \
            ocr-metadata.json \
            ocr-stdout.raw \
            ocr-stderr.log \
            ocr-preflight.txt \
            ocr-version.txt \
            ocr-preview.txt \
            ocr-preview-stderr.log \
            ocr-exit-code.txt \
            ocr-phase.txt \
            ocr-infrastructure-failure.txt \
            ocr-policy-failure.txt \
            ocr-selected-files.txt \
            ocr-status.txt \
            ocr-preview-attempted.txt \
            ocr-preview-succeeded.txt \
            ocr-no-reviewable-files.txt \
            ocr-coverage-report.json \
            ocr-reviewed-range-manifest.json \
            ocr-manifest-hashes.json \
            ocr-manifest-sha256.txt \
            ocr-routing-decisions.json; do
            if [ ! -e "$file_name" ]; then
              : > "$file_name"
              missing="${missing}${file_name}"$'\n'
            fi
          done
          artifact_state="prepared"
          if [ -n "$missing" ]; then
            artifact_state="failed"
            echo "phase=artifact; reason=OCR artifact placeholders were missing before telemetry" >> ocr-infrastructure-failure.txt
          fi
          echo "artifact_state=${artifact_state}" >> "$GITHUB_OUTPUT"

      - name: Resolve OCR production evidence
        id: ocr-evidence
        shell: bash
        if: always()
        env:
          RANGE_MODE: ${{ steps.resolve-range.outputs.RANGE_MODE }}
        run: |
          set -euo pipefail
          preview_attempted="false"
          preview_succeeded="false"
          [ "$(cat ocr-preview-attempted.txt 2>/dev/null || true)" = "true" ] && preview_attempted="true"
          [ "$(cat ocr-preview-succeeded.txt 2>/dev/null || true)" = "true" ] && preview_succeeded="true"
          if [ "${RANGE_MODE:-}" != "noop" ] && { [ "$preview_attempted" != "true" ] || [ "$preview_succeeded" != "true" ]; }; then
            echo "phase=preview; reason=OCR preview evidence was unavailable or unsuccessful" >> ocr-infrastructure-failure.txt
          fi
          echo "preview_attempted=${preview_attempted}" >> "$GITHUB_OUTPUT"
          echo "preview_succeeded=${preview_succeeded}" >> "$GITHUB_OUTPUT"

      - name: Redact OCR diagnostic artifacts
        id: redact-ocr-artifacts
        shell: bash
        if: always()
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const REDACTION = '[REDACTED]';
          const escapeRegExp = (value) => String(value).replace(/[\\^$.*+?()[\]{}|]/g, '\\$&');
          const redact = (value) => {
            let sanitized = String(value ?? '');
            for (const secret of [process.env.OCR_LLM_TOKEN, process.env.OCR_LLM_URL]) {
              if (typeof secret === 'string' && secret.length > 0) {
                sanitized = sanitized.replace(new RegExp(escapeRegExp(secret), 'g'), REDACTION);
              }
            }
            return sanitized
              .replace(/\b(Authorization\s*:\s*(?:(?:Bearer|Basic|token|ApiKey)\s+)?)([^\s,;]+)/gi, `$1${REDACTION}`)
              .replace(/\b(x-api-key\s*:\s*)([^\s,;]+)/gi, `$1${REDACTION}`)
              .replace(/\b(api[_-]?key\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/([?&](?:key|api[_-]?key|token)=)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(access[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(refresh[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(id[_-]?token\s*[=:]\s*)([^\s,;&]+)/gi, `$1${REDACTION}`)
              .replace(/\b(token\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, `$1${REDACTION}`)
              .replace(/\b(secret\s*[=:]\s*)([A-Za-z0-9_./+=:@-]{16,})/gi, `$1${REDACTION}`);
          };
          const artifacts = [
            'ocr-result.json', 'ocr-metadata.json', 'ocr-stdout.raw',
            'ocr-stderr.log', 'ocr-preflight.txt', 'ocr-version.txt',
            'ocr-preview.txt', 'ocr-preview-stderr.log', 'ocr-exit-code.txt',
            'ocr-phase.txt', 'ocr-infrastructure-failure.txt',
            'ocr-policy-failure.txt', 'ocr-selected-files.txt', 'ocr-status.txt',
            'ocr-preview-attempted.txt', 'ocr-preview-succeeded.txt',
            'ocr-no-reviewable-files.txt',
            'ocr-reviewed-range-manifest.json', 'ocr-manifest-hashes.json',
            'ocr-manifest-sha256.txt', 'ocr-routing-decisions.json',
            'ocr-coverage-report.json',
          ];
          if (fs.existsSync('ocr-canary-metrics.json')) {
            artifacts.push('ocr-canary-metrics.json');
          }
          function replaceWithRedactionFailure(fileName, error) {
            const code = error && error.code ? error.code : 'unknown';
            const diagnostic = `redaction failed for ${fileName}: ${code}\n`;
            try {
              if (fileName === 'ocr-canary-metrics.json') {
                fs.writeFileSync(fileName, JSON.stringify({
                  schema_version: 1,
                  valid: false,
                  validation_errors: [`artifact redaction failed: ${code}`],
                  transport: null,
                }, null, 2) + '\n');
              } else if (fileName.endsWith('.json')) {
                fs.writeFileSync(fileName, JSON.stringify({ error: diagnostic.trim() }) + '\n');
              } else {
                fs.writeFileSync(fileName, diagnostic);
              }
            } catch (_) {
              try { fs.rmSync(fileName, { force: true }); } catch (_) { /* upload is gated */ }
            }
            process.exitCode = 1;
          }
          const redactJsonValue = (value) => {
            if (typeof value === 'string') return redact(value);
            if (Array.isArray(value)) return value.map(redactJsonValue);
            if (value && typeof value === 'object') {
              const result = {};
              for (const [key, val] of Object.entries(value)) result[key] = redactJsonValue(val);
              return result;
            }
            return value;
          };
          for (const fileName of artifacts) {
            try {
              const original = fs.readFileSync(fileName, 'utf8');
              fs.writeFileSync(fileName, '[REDACTION-PENDING]\n');
              let structuredRedaction = null;
              if (fileName.endsWith('.json')) {
                try {
                  structuredRedaction = JSON.stringify(redactJsonValue(JSON.parse(original)), null, 2);
                } catch (_) {
                  structuredRedaction = null;
                }
              }
              const temporary = `${fileName}.redacting`;
              if (structuredRedaction === null) {
                fs.writeFileSync(temporary, redact(original));
              } else {
                fs.writeFileSync(temporary, structuredRedaction);
              }
              fs.renameSync(temporary, fileName);
            } catch (error) {
              if (error?.code !== 'ENOENT') replaceWithRedactionFailure(fileName, error);
            }
          }
          NODE

      - name: Resolve OCR telemetry classification
        id: ocr-telemetry-classification
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          policy_failure="false"
          infrastructure_failure="false"
          [ -s ocr-policy-failure.txt ] && policy_failure="true"
          [ -s ocr-infrastructure-failure.txt ] && infrastructure_failure="true"
          post_state="${{ steps.post-ocr-results.outputs.post_state }}"
          post_outcome="${{ steps.post-ocr-results.outcome }}"
          artifact_state="${{ steps.ocr-artifact-state.outputs.artifact_state }}"
          source_redaction_state="prepared"
          if [ "$post_outcome" != "success" ] || [ -z "$post_state" ] || [ "$post_state" = "failed" ]; then
            post_state="failed"
            infrastructure_failure="true"
          fi
          if [ "$post_state" = "policy-failed" ]; then policy_failure="true"; infrastructure_failure="true"; fi
          if [ "${{ steps.redact-ocr-artifacts.outcome }}" != "success" ]; then
            source_redaction_state="failed"
            artifact_state="failed"
            infrastructure_failure="true"
            echo "phase=artifact; reason=OCR artifact redaction failed" >> ocr-infrastructure-failure.txt
          fi
          {
            echo "policy_failure=${policy_failure}"
            echo "infrastructure_failure=${infrastructure_failure}"
            echo "post_state=${post_state:-missing}"
            echo "post_outcome=${post_outcome:-missing}"
            echo "source_redaction_state=${source_redaction_state}"
            echo "artifact_state=${artifact_state:-failed}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Emit OCR telemetry (issue #2676)'
        id: emit-ocr-telemetry
        shell: bash
        if: always()
        env:
          OCR_RUN_ID: ${{ github.run_id }}
          OCR_RUN_ATTEMPT: ${{ github.run_attempt }}
          OCR_PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          OCR_SHA: ${{ env.HEAD_SHA }}
          OCR_GENERATED_AT: ${{ steps.ocr-generated-at.outputs.generated_at }}
          OCR_WALL_CLOCK_SECONDS: ${{ steps.ocr-wall-clock.outputs.wall_clock_seconds }}
          OCR_FILES_REVIEWED: ${{ steps.ocr-files-reviewed.outputs.files_reviewed }}
          OCR_POST_STATE: ${{ steps.ocr-telemetry-classification.outputs.post_state }}
          OCR_POST_OUTCOME: ${{ steps.ocr-telemetry-classification.outputs.post_outcome }}
          OCR_SOURCE_REDACTION_STATE: ${{ steps.ocr-telemetry-classification.outputs.source_redaction_state }}
          OCR_ARTIFACT_STATE: ${{ steps.ocr-telemetry-classification.outputs.artifact_state }}
          OCR_HASH_STATE: prepared
          OCR_INFRASTRUCTURE_FAILURE: ${{ steps.ocr-telemetry-classification.outputs.infrastructure_failure }}
          OCR_POLICY_FAILURE: ${{ steps.ocr-telemetry-classification.outputs.policy_failure }}
          OCR_PREVIEW_ATTEMPTED: ${{ steps.ocr-evidence.outputs.preview_attempted }}
          OCR_PREVIEW_SUCCEEDED: ${{ steps.ocr-evidence.outputs.preview_succeeded }}
          OCR_FILE_READ_FAILURES: ${{ steps.post-ocr-results.outputs.file_read_failures }}
          OCR_PER_FILE_REVIEW_FAILURES: ${{ steps.post-ocr-results.outputs.per_file_review_failures }}
          OCR_INLINE_POSTED: ${{ steps.post-ocr-results.outputs.comments_inline }}
          OCR_ALREADY_RESOLVED: ${{ steps.post-ocr-results.outputs.already_resolved }}
          OCR_ALREADY_POSTED_OR_SKIPPED_DEDUP: ${{ steps.post-ocr-results.outputs.comments_skipped }}
          OCR_COMMENTS_SKIPPED: ${{ steps.post-ocr-results.outputs.comments_skipped }}
          OCR_COMMENTS_FAILED: ${{ steps.post-ocr-results.outputs.comments_failed }}
          OCR_COMMENTS_ROUTED_SUMMARY: ${{ steps.post-ocr-results.outputs.comments_routed_summary }}
          OCR_COMMENTS_TOTAL: ${{ steps.post-ocr-results.outputs.comments_total }}
        run: |
          set -euo pipefail
          export GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-$RUNNER_TEMP/ocr-step-summary.md}"
          if bun scripts/ocr-telemetry.ts; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "phase=telemetry; reason=OCR telemetry producer failed" >> ocr-infrastructure-failure.txt
          if bun scripts/ocr-telemetry.ts --failure "OCR telemetry producer failed"; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const count = (value) => /^\d+$/.test(value || '') && Number.isSafeInteger(Number(value))
            ? Number(value)
            : null;
          const record = {
            schema: 1, schema_name: 'ocr-telemetry',
            run_id: process.env.OCR_RUN_ID || null,
            run_attempt: process.env.OCR_RUN_ATTEMPT || null,
            pr_number: count(process.env.OCR_PR_NUMBER),
            sha: /^[0-9a-f]{40}$/.test(process.env.OCR_SHA || '') ? process.env.OCR_SHA : null,
            generated_at: process.env.OCR_GENERATED_AT || new Date().toISOString(),
            ocr: { version: null, model: null, concurrency: null },
            wall_clock_seconds: null, cli_elapsed_seconds: null,
            files_previewed: null, files_reviewed: null,
            file_read_failures: null, file_read_failure_count: null,
            per_file_review_failures: null, per_file_review_failure_count: null,
            total_findings: null, findings: null, inline_posted: null,
            already_resolved: null, already_posted_or_skipped_dedup: null,
            comments_skipped: null, comments_failed: null,
            comments_routed_summary: null, comments_total: null,
            infrastructure_failure: true,
            policy_failure: process.env.OCR_POLICY_FAILURE === 'true',
            completeness: null, publication_state: null,
            reviewed_range_manifest: null, tokens: null,
            telemetry_state: 'failed',
            post_state: ['posted', 'partial', 'noop', 'failed', 'policy-failed', 'missing'].includes(process.env.OCR_POST_STATE)
              ? process.env.OCR_POST_STATE : 'missing',
            artifact_state: 'failed', hash_state: 'unavailable',
            marker_state: {
              infrastructure_failure: true,
              policy_failure: process.env.OCR_POLICY_FAILURE === 'true',
            },
            errors: ['OCR telemetry producer unavailable'],
          };
          const required = ['schema', 'schema_name', 'generated_at', 'telemetry_state', 'errors'];
          if (!required.every((key) => Object.prototype.hasOwnProperty.call(record, key)) ||
              record.schema_name !== 'ocr-telemetry' || !Array.isArray(record.errors)) {
            throw new Error('independent fallback telemetry self-validation failed');
          }
          const target = 'ocr-telemetry.json';
          const temporary = `${target}.fallback-${process.pid}`;
          fs.writeFileSync(temporary, `${JSON.stringify(record, null, 2)}\n`);
          fs.renameSync(temporary, target);
          NODE
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Validate redacted OCR telemetry
        id: ocr-telemetry-validation
        shell: bash
        if: always()
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
          OCR_RUN_ID: ${{ github.run_id }}
          OCR_RUN_ATTEMPT: ${{ github.run_attempt }}
          OCR_PR_NUMBER: ${{ steps.pr-context.outputs.number }}
          OCR_SHA: ${{ env.HEAD_SHA }}
          OCR_GENERATED_AT: ${{ steps.ocr-generated-at.outputs.generated_at }}
          OCR_WALL_CLOCK_SECONDS: ${{ steps.ocr-wall-clock.outputs.wall_clock_seconds }}
          OCR_FILES_REVIEWED: ${{ steps.ocr-files-reviewed.outputs.files_reviewed }}
          OCR_POST_STATE: ${{ steps.ocr-telemetry-classification.outputs.post_state }}
          OCR_ARTIFACT_STATE: ${{ steps.ocr-telemetry-classification.outputs.artifact_state }}
          OCR_INFRASTRUCTURE_FAILURE: 'true'
          OCR_POLICY_FAILURE: ${{ steps.ocr-telemetry-classification.outputs.policy_failure }}
          OCR_TELEMETRY_STATE: failed
        run: |
          set -euo pipefail
          if ! bun scripts/ocr-telemetry.ts --redact ocr-telemetry.json || \
             ! bun scripts/ocr-telemetry.ts --validate ocr-telemetry.json; then
            echo "phase=telemetry; reason=post-redaction telemetry validation failed" >> ocr-infrastructure-failure.txt
            bun scripts/ocr-telemetry.ts --failure "post-redaction telemetry validation failed"
            bun scripts/ocr-telemetry.ts --redact ocr-telemetry.json
            bun scripts/ocr-telemetry.ts --validate ocr-telemetry.json
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Compute reviewed-range manifest hashes
        id: ocr-manifest-hashes
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          echo "valid=false" >> "$GITHUB_OUTPUT"
          if ! node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const hashableArtifacts = [
            'ocr-result.json', 'ocr-stdout.raw', 'ocr-stderr.log',
            'ocr-preflight.txt', 'ocr-version.txt', 'ocr-preview.txt',
            'ocr-preview-stderr.log', 'ocr-exit-code.txt', 'ocr-phase.txt',
            'ocr-selected-files.txt', 'ocr-status.txt',
            'ocr-infrastructure-failure.txt', 'ocr-policy-failure.txt',
            'ocr-telemetry.json', 'ocr-coverage-report.json',
          ];
          const hashes = {};
          for (const name of hashableArtifacts) {
            const content = fs.readFileSync(name);
            hashes[name] = `sha256:${crypto.createHash('sha256').update(content).digest('hex')}`;
          }
          const hashesTemporary = `ocr-manifest-hashes.json.tmp-${process.pid}`;
          fs.writeFileSync(hashesTemporary, `${JSON.stringify(hashes, null, 2)}\n`);
          fs.renameSync(hashesTemporary, 'ocr-manifest-hashes.json');
          const manifest = JSON.parse(fs.readFileSync('ocr-reviewed-range-manifest.json', 'utf8'));
          manifest.artifact_hashes = hashes;
          const manifestTemporary = `ocr-reviewed-range-manifest.json.tmp-${process.pid}`;
          fs.writeFileSync(manifestTemporary, `${JSON.stringify(manifest, null, 2)}\n`);
          fs.renameSync(manifestTemporary, 'ocr-reviewed-range-manifest.json');
          // Hash the manifest LAST (after its artifact hashes are final). The
          // detached hash is intentionally not included in its own input set.
          const manifestContent = fs.readFileSync('ocr-reviewed-range-manifest.json');
          const hash = crypto.createHash('sha256').update(manifestContent).digest('hex');
          const detachedTemporary = `ocr-manifest-sha256.txt.tmp-${process.pid}`;
          fs.writeFileSync(detachedTemporary, `sha256:${hash}\n`);
          fs.renameSync(detachedTemporary, 'ocr-manifest-sha256.txt');
          NODE
          then
            echo "phase=manifest; reason=manifest hash preparation failed" >> ocr-infrastructure-failure.txt
            node -e '
              const fs = require("fs");
              try {
                const record = JSON.parse(fs.readFileSync("ocr-telemetry.json", "utf8"));
                record.infrastructure_failure = true;
                record.telemetry_state = "failed";
                record.artifact_state = "failed";
                record.hash_state = "failed";
                record.marker_state = {
                  infrastructure_failure: true,
                  policy_failure: record.policy_failure === true,
                };
                record.errors = [...new Set([
                  ...(Array.isArray(record.errors) ? record.errors : []),
                  "OCR manifest hash preparation failed",
                ])];
                const temporary = "ocr-telemetry.json.hash-failure-" + process.pid;
                fs.writeFileSync(temporary, JSON.stringify(record, null, 2) + "\n");
                fs.renameSync(temporary, "ocr-telemetry.json");
              } catch (_) {
                // Upload remains gated off even if the local telemetry repair fails.
              }
            '
            exit 1
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Upload OCR telemetry
        id: upload-ocr-telemetry
        if: ${{ always() && steps.ocr-telemetry-validation.outputs.valid == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: ocr-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ocr-telemetry.json
          if-no-files-found: error

      - name: Upload OCR artifacts
        id: upload-ocr-artifacts
        if: ${{ always() && steps.redact-ocr-artifacts.outcome == 'success' && steps.ocr-telemetry-validation.outputs.valid == 'true' && steps.ocr-manifest-hashes.outputs.valid == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: ocr-review-output
          path: |
            ocr-result.json
            ocr-metadata.json
            ocr-stdout.raw
            ocr-stderr.log
            ocr-preflight.txt
            ocr-version.txt
            ocr-preview.txt
            ocr-preview-stderr.log
            ocr-exit-code.txt
            ocr-phase.txt
            ocr-infrastructure-failure.txt
            ocr-policy-failure.txt
            ocr-selected-files.txt
            ocr-status.txt
            ocr-reviewed-range-manifest.json
            ocr-manifest-hashes.json
            ocr-manifest-sha256.txt
            ocr-routing-decisions.json
            ocr-coverage-report.json
          if-no-files-found: error

      - name: Resolve final OCR classification
        id: ocr-final-classification
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          policy_failure="false"
          infrastructure_failure="false"
          [ -s ocr-policy-failure.txt ] && policy_failure="true"
          [ -s ocr-infrastructure-failure.txt ] && infrastructure_failure="true"
          post_outcome="${{ steps.post-ocr-results.outcome }}"
          post_state="${{ steps.post-ocr-results.outputs.post_state }}"
          source_redaction_outcome="${{ steps.redact-ocr-artifacts.outcome }}"
          telemetry_valid="${{ steps.ocr-telemetry-validation.outputs.valid }}"
          hash_valid="${{ steps.ocr-manifest-hashes.outputs.valid }}"
          upload_outcome="${{ steps.upload-ocr-artifacts.outcome }}"
          telemetry_state="complete"
          hash_state="prepared"
          upload_state="uploaded"
          if [ "$post_outcome" != "success" ] || [ -z "$post_state" ] || [ "$post_state" = "failed" ]; then
            post_state="failed"
            infrastructure_failure="true"
          fi
          if [ "$post_state" = "policy-failed" ]; then policy_failure="true"; infrastructure_failure="true"; fi
          if [ "$source_redaction_outcome" != "success" ]; then infrastructure_failure="true"; fi
          if [ "$telemetry_valid" != "true" ]; then telemetry_state="failed"; infrastructure_failure="true"; fi
          if [ "$hash_valid" != "true" ]; then hash_state="failed"; infrastructure_failure="true"; fi
          if [ "$upload_outcome" != "success" ]; then upload_state="failed"; infrastructure_failure="true"; fi
          completeness="${{ steps.ocr-classification.outputs.completeness }}"
          # Upload outcome is only knowable after upload and therefore belongs
          # in final job outputs, not the already-serialized artifact telemetry.
          {
            echo "policy_failure=${policy_failure}"
            echo "infrastructure_failure=${infrastructure_failure}"
            echo "completeness=${completeness:-unknown}"
            echo "post_state=${post_state:-missing}"
            echo "telemetry_state=${telemetry_state}"
            echo "hash_state=${hash_state}"
            echo "upload_state=${upload_state}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate final OCR canary artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fileName = 'ocr-canary-metrics.json';
          if (!fs.existsSync(fileName)) {
            throw new Error('OCR canary artifact is missing');
          }
          const content = fs.readFileSync(fileName, 'utf8');
          if (content.includes('[REDACTED')) {
            throw new Error('OCR canary artifact contains redaction replacement text');
          }
          let parsed;
          try {
            parsed = JSON.parse(content);
          } catch (_) {
            throw new Error('OCR canary artifact is corrupted');
          }
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || parsed.valid !== true) {
            throw new Error('OCR canary artifact is not valid evidence');
          }
          NODE

      - name: Upload OCR canary artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: ocr-concurrency-canary
          path: ocr-canary-metrics.json
          if-no-files-found: error

      - name: Clean up scoped safe.directory
        shell: bash
        if: always()
        run: |
          set +e
          git config --file "${HOME}/.gitconfig" --unset-all safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

  record-ocr-outcome:
    name: Record OCR outcome
    needs:
      - mergeability-gate
      - code-review
    if: >-
      ${{ !cancelled() &&
          needs.mergeability-gate.result == 'success' &&
          needs.mergeability-gate.outputs.should-run == 'true' &&
          (needs.code-review.result == 'success' ||
           needs.code-review.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 'Record OCR outcome: policy-failure'
        if: ${{ needs.code-review.outputs.policy_failure == 'true' }}
        shell: bash
        run: echo 'OCR policy failure recorded.'

      - name: 'Record OCR outcome: infrastructure-failure'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure == 'true' }}
        shell: bash
        run: echo 'Non-blocking OCR infrastructure failure recorded.'

      - name: 'Record OCR outcome: partial'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure != 'true' &&
              (needs.code-review.outputs.completeness == 'partial' ||
               needs.code-review.outputs.completeness == 'failed') }}
        shell: bash
        run: echo 'Partial/incomplete OCR review recorded — not all selected files completed.'

      - name: 'Record OCR outcome: success'
        if: >-
          ${{ needs.code-review.result == 'success' &&
              needs.code-review.outputs.policy_failure != 'true' &&
              needs.code-review.outputs.infrastructure_failure != 'true' &&
              needs.code-review.outputs.completeness != 'partial' &&
              needs.code-review.outputs.completeness != 'failed' }}
        shell: bash
        run: echo 'Successful OCR review recorded.'

      - name: 'Record OCR outcome: unexpected-failure'
        if: >-
          ${{ needs.code-review.result == 'failure' &&
              needs.code-review.outputs.policy_failure != 'true' }}
        shell: bash
        run: echo 'Unexpected OCR job failure recorded.'

  record-skipped-ocr-outcome:
    name: Record skipped OCR outcome
    needs:
      - mergeability-gate
      - auto-review-gate
    if: >-
      ${{ !cancelled() &&
          needs.mergeability-gate.result == 'success' &&
          needs.auto-review-gate.result == 'success' &&
          (needs.mergeability-gate.outputs.should-run != 'true' ||
           needs.auto-review-gate.outputs.auto-should-run != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 'Record OCR outcome: review-skipped'
        if: ${{ needs.mergeability-gate.outputs.should-run != 'true' }}
        shell: bash
        run: echo 'OCR review skipped by the mergeability gate.'

      - name: 'Record OCR outcome: auto-review-suspended'
        if: ${{ needs.mergeability-gate.outputs.should-run == 'true' && needs.auto-review-gate.outputs.auto-should-run != 'true' }}
        shell: bash
        run: echo 'OCR review skipped — automatic review limit reached.'
